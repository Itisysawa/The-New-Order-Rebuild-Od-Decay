 POL_Warn: "§R波兰人民最终将摆脱压迫者，但面对复兴的德国巨无霸，生存的前景确实非常渺茫。§!"
 POLITICS_HANS_FRANK_DESC: "律师、士兵、纳粹忠臣——现在，或许还是一名国王。汉斯·弗兰克将一生奉献给了民族社会主义党，曾与他的领袖一起发动了失败的啤酒馆暴动。二战期间，第三帝国以摧枯拉朽之势击溃了波兰，弗兰克随即被任命为管理此地的总督。他与党卫军通力合作，折断了波兰人民的脊梁，对学者、神职人员以及任何可能对德国新秩序构成威胁的波兰人进行了大肆屠杀。在弗兰克和党卫军的统治下，无数平民百姓的鲜血被炼化为燃料，点燃了名为死亡的焚炉。\n\n进入1942年后，希特勒不再像之前那般青睐弗兰克，总督发现自己在领地内正逐渐陷入孤立。西俄战争期间党卫军的背叛点燃了元首的怒火，导致希姆莱分子被彻底逐出波兰。这下，弗兰克真正成了孤家寡人，集中营内的“劣等种族”已被屠杀殆尽，他只能充当向日耳曼尼亚运送奴隶的批发商。前方等待着他的没有荣耀，也没有新的胜利能让他东山再起。除非，弗兰克能为自己创造赢得荣耀的机会。\n\n当日耳曼尼亚暗流涌动，希特勒的精神状态每况愈下之时，弗兰克对波兰的掌控却在不断增强。总督整天畅想着如何建造更多的摩天大楼、纪念碑和美术博物馆，梦想着将华沙改造为雅利安文化的天堂。人们私下嘲讽他为“斯塔利斯劳国王”，但这讥讽之言背后却暗藏着真相——汉斯·弗兰克也许真的能成为国王。"
 #POLITICS_HANS_FRANK_DESC: "big胆！补药随意视奸组长哇！"
 POLITICS_INTERIMREGIERUNG_DESC: "总督府再度跪服于德国人的铁蹄之下，依照马丁·鲍曼的命令，一个临时的过渡政府已经建立以稳定该地区的局势。这一政府由办事效率最高的德国官僚组成，假若元首愿意，它便可以立刻把权力交接给由其任命的新任专员。"
 POLITICS_EDUARD_WAGNER_DESC: "The land that was once Poland lies at the center of the Reich, forming an essential connection between West and East. Now that Poland is won once and for good, a man who can make the trains run on time is required. A man with drive, with quiet dedication, and without scruples. This man is Eduard Wagner.\n\nIt is rare for a logistician to make a name for themselves, but as quartermaster-general Wagner rubbed noses with the likes of Himmler and Heydrich in 1939, yet avoided falling into their parasitic sway. The enthusiasm with which he enforced security behind the front lines is admirable, coordinating Wehrmacht and Einsatzgruppen into a well oiled machine of pacification. As the Reich pushed yet further east his job became more and more difficult, but Wagner was no yes-man to kowtow to demands from on high. Expressing his concerns over the fuel situation to Hitler may have earned him temporary ire, but gained him a reputation as a man who would never sugar-coat a situation. His opinion became highly sought after in the Wehrmacht, and while he remained sidelined his influence grew.\n\nWagner's time out of the limelight makes him all the more eager to remain in it, and he will do whatever it takes to ensure there are no delays when passing through the heart of the Reich."
 POLITICS_THEODOR_KOCH_DESC: "德意志国是一台机械——而有什么人能比工程师更胜任于运作它最重要的部件呢？尽管总督府对德国十分重要，它依旧相当落后，与它将要融入的德国核心地带相去甚远——这就是为什么特奥多尔·科赫在这里。\n\n步枪是一种美丽的东西。它是一种只具有单一目的的机械，其必须适应各种环境和条件。科赫在毛瑟公司工作的经历让他为枪支的纯粹性所倾倒。但商业中没有忠诚一词，科赫很快就把他在毛瑟公司之所学应用到政府赞助的国家工厂的产品上。那令人印象深刻的科技与商业智慧的结合让他在集团内部开辟了自己的天地。他不仅支配了集团内的轻武器部门，还像巨龙守护财宝一样保守着他的技术机密。而总督府的重建让他又找到了一个机会。\n\n回转的齿轮与纠缠的传送带，配合着在无穷的工厂中工作的无尽双手，这就是科赫对总督府的设想。它们只为一个目的存在——武装德意志国。而出产的步枪，手枪，头盔，子弹上面只印着一个生产商——总督府。"
 POLITICS_WERNER_DOLLINGER_DESC: "Werner Dollinger is a rare sort - a reformist that is actually liked by the establishment. While his past studying economics and social studies might be suspicious to the more reactionary elements of the party, he did his duty in the Wehrmacht fighting in the fields of Russia like a true patriot. Since his duty ended, Dollinger has dutifully worked away in the realm of economic planning, serving his home state of Bayern with a skilled hand. Recently however, his own unique and quiet form of reformism has gained attention.\n\nDollinger found himself championed by the big fish of Bavarian industry in the bid for Governor-General. His high quality analyses and advanced fiscal predictions make him the ideal candidate for the consolidation of their interests in the underdeveloped backwater of what was once Poland, and his affable manner and views that stand on the more acceptable side of reformist earned him the support of the Party apparatus. If he does his job right, a balance might just be struck between German interests and Polish needs. Might."
