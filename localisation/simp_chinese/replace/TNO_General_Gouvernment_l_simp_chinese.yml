 GGN_unstable_government_desc: "卫戍部队稍微冷静了下来，真的开始巡逻波兰全境了。"
 GGN_underground_government: "波兰地下国"
 GGN_underground_government_desc: "我们不知道他们在哪儿，也不知道他们是谁，但我们可不是傻瓜！我们知道卑鄙的波兰佬和他们的秘密政府多年来一直在幕后率领着他们邪恶的游击部队！虽然我们不会承认这一点，但事实渐渐明晰起来了：要想真的控制住这个国家，就要消灭波兰地下国！不过，虽说叛乱活动水涨船高，祖国父亲肯定会来替我们修补的，我们只要不让船漏个大洞就好了！"
 GGN_tooltip_1: "波兰地下国势必要针对你发起行动……"
 GGN_not_fine: "暂时渡过难关了……"
 GGN_end_of_the_line: "波兰佬可能不像我们想的那样软弱……"
 GGN_its_time: "时机成熟的时候，秘密政府会向卫戍部队发动突然袭击！"
