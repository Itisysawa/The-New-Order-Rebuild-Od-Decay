 esoteric_nazism_esoteric_fundamentalism_subtype: "修正撒旦教条"
 esoteric_nazism_esoteric_fundamentalism_subtype_desc: "愚蠢的阿巴顿大错特错！该隐兄弟会的大多数成员早已清楚，阿巴顿不过也只是个可恨的斯拉夫下等族裔罢了，他根本不配作为撒旦的嚮导者引领着永恒堕天使之国！阿巴顿所谓的\"圣战\"与\"审判\"毫无意义，不过是为了稳定住自己的政权专制罢了，他实际上压根就无心引领堕天使降临人间，他真正想做的不过是借撒旦之名到处屠戮罢了！随着阿巴顿统一俄罗斯，俄罗斯的尸骨愈发寒冷了，他自认为人间的救赎者，甚至还妄想着以他那肮脏的斯拉夫血统将撒旦本尊请到人间，最终他遭到了自己的报应，就这样在自己的疯狂之中死去了。\n\n阿巴顿已死，却不代表原教旨主义与撒旦教就此逝去。他的手下，安德烈·齐卡提洛，也就是先前的\"塔纳托斯\"已然厌倦了阿巴顿那出无聊的戏剧，在阿巴顿死后，他带领着自己的亲信首当其冲地控制了秋明一带的地区，准备建立起新的秩序，新的撒旦之国，而一群阿巴顿拥护者则是控制下了斯维尔德洛夫斯克一带的地区，他们不同派系之间还是决裂了。在如此的派系决裂下，齐卡提洛决定发掘一些更新的理论，这也就是为何\"秘传原教旨主义\"会崛起了。\n\n在这套理论之下，齐卡提洛将原教旨主义与一切恐怖主义绑定在一起，在如此的国度下各种犯罪与吃人的行为已然见怪不怪了，国境线内成为了彻底封闭的炼狱，再无与外界联系的方式，而俄罗斯人再一次迎来了他们的梦魇，虽然§I都是这群斯拉夫贱种们自找的...§!\n\n§I一切的一切都是俄罗斯人们的选择，怨不得别人§!\n\n§I阿巴顿已死，现在，齐卡提洛将宣称为撒旦身边的亲信§x\"塔纳托斯\"§!，准备将地狱之火带到人间，对这群斯拉夫蛮子们进行审判...\n\n撒旦终将降临人间！§!"
 TCB_Antikchrist: "§I\"敌基督\"§!"
 TCB_Antikchrist_desc: "也许有些人认为所谓的\"敌基督\"只是个野心勃勃，而又狂热的撒旦教徒，但实际上他所做的事情可比阿巴顿恶心多了！相较于阿巴顿的军人出身，安德烈·奇卡提洛甚至称不上一号人物；§I但很快，俄罗斯人就知道他是谁了§!\n\n原出生于乌克兰苏维埃社会主义共和国的他，自幼便饱受饥荒与战乱的折磨；他的童年并不阔绰，由于乌克兰大饥荒，一家人经常需要挨饿，住所也并不大，然而一切的一切却都要从那场战争说起。\n\n1941年，德国人发动了巴巴罗萨行动，在战争中乌克兰迅速沦陷；他见证着自己的住所变成废墟，此后自己的母亲更是惨遭德军的士兵强奸，一切的一切都让他的心理愈发扭曲...\n\n随着时间推移，战争结束了。奇卡提洛与家人最终流落到了革命阵线，奇卡提洛以良好的成绩在学校毕业了。尽管如此，他还是因成绩不如人被拒进一步进修，于是他在西俄战事结束后在科米共和国成为了通信工程师，度过了相对平和的一段时间，直到塔博里茨基的势力崛起。\n\n不知是否因为报复，亦或是以前收到太多打击，他的心理状态愈发扭曲，致使他加入了帝国突击队，并且作为莫茨尼的手下。但比起忠于塔博里茨基，他更多的只是利用这个职位行使犯罪行为。他不但屠杀平民，更是经常对着一些少女性犯罪，甚至是将她们奸杀。这使他变得臭名昭著。但在此期间，他见证了神圣俄罗斯帝国的兴衰，见识到东正教与犹太人勾结后，他对于东正教失去了信心，最终跟随莫茨尼组建了该隐兄弟会。\n\n经历了漫长的时刻，他逐渐意识到了所谓的\"阿巴顿\"只不过是莫茨尼紧握自己权利的藉口罢了，他明白了。阿巴顿从来没真心想过将撒旦带回人间，他只是想独揽大权罢了。于是趁着阿巴顿逐渐因酗酒而精神萎靡，他壮大了势力，修订了新教条。最终，他趁着阿巴顿之死带来的动乱迅速控制住了局况，现在...\n\n§I该完成我们的使命了§!"
 TCI_long_night: "长夜漫漫..."
 TCI_long_night_desc: "长夜漫漫..."
 TCL_Vladimir_Kryuchkov: "弗拉基米尔·克留奇科夫"
 TCL_Vladimir_Kryuchkov_desc: "在那两次灾厄对俄罗斯人造成灭顶之灾后，兴许布尔什维克的大多数党员已然被剿灭，但也有着些许星火仍然在俄罗斯大地上维持着余温：弗拉基米尔·克留奇科夫便是末世之中全联盟最后的希望。\n\n在1942年，正值苏德战争失败的前夕，克留奇科夫才加入了全联盟共产党，然而此时的苏联早已无力回天。他见证了布哈林的无能，也见证了不同的军阀为了一己私利而大动干戈。他跟随布哈林的队伍前往了伊尔库茨克，在这里他完成了法律课程，并在亚戈达的赏识下加入了内务部。\n\n在这数十年间，他见到的糟心事实在太多太多，无论是布里亚特兵变、抑或是远东的繁荣在塔博里茨基的摧残下变为静默...\n\n在子夜之后，他加入了\"阿列克谢二世\"的麾下，成为了国家安全部门的首脑。他很清楚，阿列克谢二世早就死了，这兴许也只是一个抱有救国之心的救赎者罢了。好景不长的是，该隐兄弟会还是在近乎不可能的情况下以大军横扫了远东，最终，\"阿列克谢二世\"也没能幸免于难。\n\n绝境之下，联合成了唯一选项。此后的克留奇科夫退居于布拉茨克，默默地联络着前党员与昔日的敌人——全联盟共产党的理想派。他们组成了一个脆弱的联盟，守卫在布拉茨克的边疆......\n\n最终，机会来了，阿巴顿之死给了他们一个机会，他们趁机夺下了博古恰内附近的地区。即使他们衣衫褴褛、他们未必能饱腹，布尔什维克的星星之火仍然在西伯利亚燃烧着，也许有一天，他们会回来的......"
 TCD_Evgeny_Savintsev: "叶夫根尼·萨温采夫"
 TCD_Evgeny_Savintsev_desc: "何等的打击与绝望，才能让一个人放下民族仇恨与信仰？\n\n当卡尔贝舍夫将军还在时，叶夫根尼·萨温采夫便已是黑色联盟使命的忠实追随者，他在将军的赏识下成为了\"信号旗\"特种部队的副司令，并在随后跟随亚佐夫进行一次又一次的作战，可谓任劳任怨。在西伯利亚黑色联盟的构成当中，他早已成为了核心成员之一，有着举足轻重的地位，直到那一天到来。\n\n那个疯子塔博里茨基，在1969年踏平了西西伯利亚与哈萨克人的土地。即使九头蛇计划保全了黑色联盟部分高级军官的命与实力，黑色联盟的崩溃也已然变得不可逆。他并不是什么抱有野心的人，只是一直肩负着二把手的责任，他坚信有人能够比他做得更好，他也不想就此宣称为总司令。于是在子夜到来后，他推举了亚历山大·拉扎连科作为大审判的总司令。\n\n然而，接下来所发生的事情让他意识到他是错的：拉扎连科急于夺回鄂木斯克与实力错判导致战略出错，救赎黑色联盟的军队在鄂木斯克城外因贸然进攻导致被大量的要塞拦截，导致死伤惨重。亚佐夫早前所建设起的堡垒，如今却成了敌人的庇护所，然而拉扎连科的贸然进攻也致使黑色联盟军队元气大伤，更在其后被该隐兄弟会的\"大罪司教\"所击溃。\n\n唯有死亡是责任的尾声，感觉自己愧对于卡尔贝舍夫的拉扎连科就这样饮弹自尽，去见亚佐夫和卡尔贝舍夫将军了。\n\n然而，萨温采夫却成为了联盟最终的余焰。他化名德米特里·伊万诺夫，带着\"信号旗\"部队残余的弟兄们潜伏在该隐兄弟会之中，卧薪尝胆地等待着机会到来的一天。\n\n终于，那天到来了。在阿巴顿死后，他与手下的弟兄们趁着局势失控迅速控制了鄂木斯克，组建起了黑色联盟重建旅。他发现，民族的仇恨与审判的怒火是不能填饱人民与弟兄们的肚子的，于是被迫转向了实用主义，而他也在等待着时机，消灭掉那群祸害俄罗斯的匪徒；他知道只有这样，俄罗斯才会真正变得安全，永远不再受到威胁......"
 TCC_Alexander_Zaitsev: "亚历山大·扎伊采夫"
 TCC_Alexander_Zaitsev_desc: ""
 TCC_Vladimir_Komarov: "弗拉基米尔·科马洛夫"
 TCC_Vladimir_Komarov_desc: "虽胸怀大志，但航天之梦却早已随梦魇降临而泯灭。\n\n弗拉基米尔·科马洛夫1927年出生于莫斯科，然而由于布哈林所领导的联盟溃败，他只得跟随着苏军的步伐撤退至西俄罗斯革命阵线。此后，他在奥伦堡高等飞行员航空学校完成了课程，并在1952年加入了全联盟共产党。然而不久后，革命阵线的崩溃让科马洛夫被迫流落于科米共和国。在这里，他归附到了日丹诺夫麾下，他相信\"超视社会主义\"能扭转此一窘况。\n\n然而，塔博里茨基的夺权宣告了航天梦想的破灭，他见证了塔博里茨基的疯狂：日丹诺夫被他派人刺杀，左派被大规模清洗......\n他跟随卡尔达舍夫逃到了西西伯利亚人民共和国的车里雅宾斯克地区，想着这样就能逃过被塔博里茨基追杀的命运，然而事实真的如此吗？\n\n西西伯利亚人民共和国投降后，他与卡尔达舍夫一同被抓到了集中营之中。由于哈萨克战争与俄罗斯统一战争的原因，他们只是被当成了免费劳动力过着非人的生活，然而这并没有消沉他们的意志：不论是\"政治犯\"们，亦或是\"反动派\"，监狱内的囚犯们策划了一场史无前例的大规模越狱。巧合的是，塔博里茨基在统一俄罗斯的不久就死掉了，因此在执行清洗命令的前夕，他们成功越狱了。\n\n子夜之后，卡尔达舍夫在车里雅宾斯克组建了他们的研究所，为航天事业与远视主义的最后一点星火所奋斗着，但他们的邻居救赎黑色联盟的溃败便注定了他们不能成功：该隐兄弟会趁此机会壮大起来了，他们在占领区进行着各种惨无人道的屠杀与抢掠.....\n\n卡尔达舍夫深知研究所毫无胜算，因此他找借口调走了科马洛夫，而卡尔达舍夫毅然决然地决定赴死。最后，他与研究所的战士们战至了最后的一兵一卒，只留下一部分士兵与NKVD掩护科马洛夫，一同躲进了乌拉尔山脉。强烈的心理负担让科马洛夫几近崩溃，他认为自己害死了卡尔达舍夫而深深陷入了自责之中......这让他意识到，他有义务完成日丹诺夫和卡尔达舍夫未竟的夙愿。\n\n幸运的是，阿巴顿在一次事故中意外身亡了。科马洛夫意识到机会来了。他同NKVD余党与研究所卫兵，以及乌拉尔卫队一同控制下了部分南乌拉尔地区。现在，他将会尽他的全力以守护卡尔达舍夫、以及每个远视主义者的梦想......\n\n§e\"卡尔达舍夫，如若我失败的话，我就可以来见你了...\"§!"
