 TCA_ultranationalism_party: "\"党\""
 ultranationalism_INGSOC_subtype: "欧亚社会主义"
 ultranationalism_INGSOC_subtype_desc: "谁曾想，原本只出现在小说中的情节，小说中的意识形态，如今出现在了俄罗斯那广袤的大地之上？\n\n1949年，乔治·奥威尔这名作家在流亡美国后出版了书籍《1984》，以此藉书中的极权社会讽刺德、日、美三方鼎立，德日极权林立的现况。在奥威尔笔下，这种意识形态对公民们都有着极端的控制，对每个人时不时进行监控，推行新语将任何贬义词抹除，借此消除异见分子......\n\n可这种本应只出现在书中的极端意识形态，却在此后的1985真正地出现在了世界之上。当阿巴顿归西去见他心心念念的撒旦时，前联盟的控制论学者阿纳托利·基托夫从芬兰归来了。在芬兰期间，他一心研究控制论与极权体制，自然地，也就找上了这本书。在阅读这本书后，他对于专制的重要性产生了一些不同的见解：在他看来，书中大多数的体制对俄罗斯都有参考价值，但仍需要作出一定修改：由于人口数量问题，战争即和平已经难以做到。因此，他对于三项原则作出了修订：劳动即存在，自由即奴役，无知即力量...以及新加入的一条，独属于俄罗斯的：欧亚即新生。\n\n劳动即存在，如若你把它倒过来看便会很容易理解：欧亚国内人们的存在皆是为了劳动。自由即奴役，在基托夫看来，自由是堕落的根源，会导致所有的不确定性和不稳定，所以只有绝对的操控才能获得真正的\"自由\"。无知即力量，人们的\"无知\"能够带来\"力量\"，因为当人民无法思考、质疑或掌握真正的知识时，他们就不会反抗，也不会挑战现有制度。而最后，欧亚即新生，指的是俄罗斯在数次的灾厄以来已然不再存于世间，所有的一切只是新生的欧亚国。\n\n§x以及我们自己的老大哥——基托夫。§!"
 TCA_Anatoly_Kitov: "\"老大哥\""
 TCA_Anatoly_Kitov_desc: "本名阿纳托利·基托夫的他§x是个伟人§!，他出生于萨马拉，并且曾在红军服役，在卫国战争期间随后加入了伏罗希洛夫的麾下。\n\n然而可惜的是，伟大的卫国战争失败了。他与西俄罗斯革命阵线的军队一起被赶到了那极北之地——阿尔汉格尔斯克。在这里，他完成了他的控制论文章《控制论的主要特征》。好景不长，科米共和国右翼势力的崛起使他与其他军官的处境愈加危险。他在此后被迫转进地下，进行游击作战。经过§x老大哥§!的伟大斗争后，人民§x的老大哥§!从塔博里茨基的手上解放了。他加入了北俄罗斯解放阵线，成为了其中的一员。\n\n兴许上天从未眷顾俄罗斯，尽管欧亚防务委员会在该隐兄弟会的狂野征途启程时成立了，却未能阻挡他们疯狂的脚步。§x伟大领袖老大哥§!在此战役中因§x其他废物§!而被迫地暂时撤退。\n\n在北俄罗斯解放阵线战败后，他§x暂时撤退§!到了芬兰，在此地他接触了《1984》这本书，他发现他对于书中的英社很感兴趣，同时也觉得§x这才是俄罗斯人应有的醒悟§!，于是在阿巴顿死后将这种§x伟大的§!意识形态带回了萨列哈尔德。这里作为最后的§x欧亚革命§!星火，人们§x欣然接受§!了§x老大哥§!的统治。\n\n§x现在，老大哥将带领人民走向胜利。§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!\n§x永远§!"
 Annihilationism: "湮灭主义"
 Annihilationism_posadas_thought_subtype: "波萨达斯主义"
 Annihilationism_posadas_thought_subtype_desc: "在列宁与世长辞后，苏联陷入了长久的政治斗争中。尽管布哈林取得了最终的胜利，流亡的托洛茨基也为国际共运带来了不小的影响力。在此前提之下，世界各地响应这场国际运动也就不足为奇。\n\n波萨达斯是阿根廷的一名托洛茨基主义理论家，在第四国际的波萨达斯主义者创始会议中他们确立了中心思想：\"原子战争必将到来，它将摧毁一半的人类；它将摧毁巨大的人类财富。这是很有可能的。核战争将在地球上引发一场真正的地狱。但它不会妨碍共产主义...\"\n\n他们认为核战争对于人类而言必定是一场革命战争，这将对人类社会造成巨大破坏，但并不会因此降低人类的意识水平。相反；人类将通过原子战迅速进入拥抱意识形态——社会主义。\n\n因此，对他们而言一场世界规模的核战争是必须的——这也是革命的起源。同时，托洛茨基否定一国建成社会主义论，也让他们否定\"一球建成社会主义\"，他们认为必须拥抱外星文明，并且提出假设：外星人如果能够进行星际旅行的话，必然处于更高级的社会状态，不会像人类的社会那样充满各种各样的问题。当人类与外星人接触时，也应当尽力团结外星人，以便他们支援、解决地球的问题。\n\n这种意识形态固然看起来是疯狂的。\n\n§x但为了革命，这难道不值得吗？§!"
 TPD_Ryszard_Kuklinski: "理夏德·库克林斯基"
 TPD_Ryszard_Kuklinski_desc: "兴许有些人会认为，塔博里茨基与阿巴顿对于波兰族的迫害能彻底将这个民族从俄罗斯大地上抹除。\n\n§W不，他们都错了。§!\n§W他们天真地以为我们会就此灭亡§!\n§V却已然忘记，当他们凝视深渊时...§!\n§V深渊也在看着他们。§!\n\n理夏德·库克林斯基本来只是新波兰手下的一名波兰低级将领，然而，塔博里茨基的征途未能彻底将其打到。自祖国沦陷的一天以来，他一直盼望着回家那一刻(尽管这已经基本不可能了)。然而，老天不公，对他开了个巨大的笑话：一个邪教势力领导的邪恶同盟攻破了新波兰的防线。\n\n但波兰绝不因此灭亡,这个团结而正义，不懈而坚毅的战士漫步前进着，兴许革命与复国路上遍布障碍，但库克林斯基绝未放弃哪怕一丝所存的公理与希望。他与人民同甘共苦，与将士们共进退...在阿巴顿这位客人到来之时，他们试着掀翻桌子。他们以为这样就能彻底击败库克林斯基，与苏维埃自治解放军，殊不知战士们早已利用该隐军那里夺走的\"军服\"战略转进了。\n\n流亡途中，库克林斯基善用了计谋，将\"新波兰\"地区的波兰人口包装为\"战俘\"，随后骗过敌军，战略转进到了南哈萨克地区，待阿巴顿死后迅速控制了此地区。尽管末世下，库克林斯基仍然在尽力保护好他的人民，哪怕这意味着可能会祸及自己。\n\n一切未曾改变，理夏德·库克林斯基将军仍领导着苏维埃自治解放军，虽然战友与亲信们在长征中牺牲，但在库克林斯基的领导下，他们的精神将永垂不朽。"