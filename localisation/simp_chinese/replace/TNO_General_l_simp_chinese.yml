 SE_TCF_unified_D: "\"你们的飞机不是武器，而是翅膀——祖国将她的天空托付给翅膀，不是为了复仇，而是为了永远终结黑暗。\"\n——伊万·阔日杜布"
 SE_TCF_unified_A: "空中的守卫将永夜终结..."
 SE_TCH_unified: "俄罗斯再统一"
 SE_TCH_unified_D: "\"若国防的剑刃被铸成犁头前就丢弃剑柄，\n那犁头只会成为敌人的战利品——但若紧握剑柄不放，\n双手也将失去播种的能力。\"\n——伊万·科涅夫"
 SE_TCH_unified_A: "为全欧亚的解放"
 SE_TCK_unified: "俄罗斯再统一"
 SE_TCK_unified_D: "\"今天，法西斯是更大的敌人。若需要暂时放下黑旗，举起共和国的三色旗，那就举吧——但别忘了，我们的颜色在旗帜背面！\"\n——布埃纳文图拉·杜鲁蒂"
 SE_TCK_unified_A: "安那其妈妈仍爱她的孩子"
 SE_TCK_unified_despo: "俄罗斯再统一"
 SE_TCK_unified_despo_D: "\"若将\"人人为己\"的谎言替换为\"人人为众\"，你会发现无需法律与监狱，互助的本能就足以维系社会。\"\n——彼得·克鲁泡特金"
 SE_TCK_unified_despo_A: "马赫诺将为我们感到骄傲"
 SE_TCL_unified_comm: "俄罗斯再统一"
 SE_TCL_unified_comm_D: "\"若我们放任历史被重写、英雄被玷污，那么苏维埃联盟的灵魂将在虚无主义中消亡。\"\n——弗拉基米尔·克留奇科夫"
 SE_TCL_unified_comm_A: "联盟归来"
 SE_TCL_unified_socio: "俄罗斯再统一"
 SE_TCL_unified_socio_D: "\"国家安全机关的首要使命，是捍卫社会主义制度的根基，任何动摇这一原则的行为都等同于背叛祖国。\"\n——弗拉基米尔·克留奇科夫"
 SE_TCL_unified_socio_A: "联盟归来"
 SE_TCL_unified_prog: "俄罗斯再统一"
 SE_TCL_unified_prog_D: "\"历史从不为怯懦者改写篇章，它只铭记那些点燃火柴试图照亮黑夜的人——即使火焰转瞬即逝。\"\n——瓦列里·萨布林"
 SE_TCL_unified_prog_A: "理想主义的光芒亮起了..."
 SE_TMB_unified: "俄罗斯再统一"
 SE_TMB_unified_D: "\"我们的仪式不是血祭，而是用智慧之火锻造灵魂的剑\"\n——撒旦教，路西法教派"
 SE_TMB_unified_A: "灾厄再临..."
 SE_TPA_unified: "俄罗斯再统一"
 SE_TPA_unified_D: "\"有些时候，我们也要有勇气去做点非凡的事情——像从清水寺的平台上往下跳一样，两眼一闭就行了。\"\n——东条英机"
 SE_TPA_unified_A: "日本的西伯利亚？"
 SE_TPC_unified: "美国干涉俄罗斯"
 SE_TPC_unified_D: "\"和平不是靠胜利的旗帜，而是靠彼此妥协的勇气。即便仇恨深如红海，也必须找到共同饮水的岸边。\"\n——吉米·卡特"
 SE_TPC_unified_A: "救赎之役..."
