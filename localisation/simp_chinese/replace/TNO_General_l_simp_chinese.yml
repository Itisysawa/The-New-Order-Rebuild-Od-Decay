 national_socialism_national_bolshevism_subtype: "民族布尔什维主义"
 national_socialism_national_bolshevism_subtype_desc: "民族布尔什维主义最早期出现于1920年，当时的魏玛共和国面临着未来道路选择的困局，他们对于选择社会主义或是资本主义而感到迷茫；另一方面，共产国际采纳了国际主义的战略以抗衡德国的社会民主主义，这也造就了一部分极端主义派系的加入：一些法西斯分子与极端民族主义势力进行了临时的合作，也就造成了一系列的僵局与事故。\n\n在这样的背景下，恩斯特·尼基什等人试着将民族主义与社会主义融合在一起，这也是民族布尔什维主义的原型。这种意识形态与传统马克思主义截然不同，在马克思主义主张国际无产阶级联合的同时，民族布尔什维主义却将民族利益视作首位，但与纳粹主义不同的是，他们更推崇左翼的经济模式。即便如此，在传入俄罗斯后这种意识形态却变得截然不同。\n\n一些俄罗斯知识分子在俄罗斯的解体后开始研究这些意识形态，而后来重新诠释了这种意识形态。他们将民族布尔什维主义与俄罗斯民族复兴结合，造就了一种畸形的民族主义。他们反对传统的布哈林主义，也反对美式自由主义，试着开辟出\"第三条道路\"，但同时他们也主张民族主义与社会主义的调和...\n\n在1975年，子夜降临了。亚历山大·杜金流落于伊尔库茨克一带，由于先前神圣俄罗斯帝国的教育，民族主义与帝国国教的概念在他的心中影响力日益巨大。他在此后加入了神圣俄罗斯帝国摄政府的摄政府青年团(实际上就是进行一些洗脑教育)，并最终在18岁时加入了帝国突击队。经历了一些劫掠和阿巴顿的洗劫后，他意识到民族社会主义下的经济模式行不通，于是将自己所学的民族主义与一定程度上的社会主义经济捏合在一起。通常杜金与他的支持者都自认为\"左翼主义者\"，同时将欧亚主义与俄罗斯民族复兴结合在一起，这也就是阿巴顿死后，那民族布尔什维主义的雏形，以及它的\"起源\"。"
