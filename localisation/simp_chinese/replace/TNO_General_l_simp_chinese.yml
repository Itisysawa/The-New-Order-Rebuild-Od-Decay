 TCF_Ivan_Kozhedub: "伊万·阔日杜布"
 TCF_Ivan_Kozhedub_desc: "要说到空战中的皇牌，那么除了新西伯利亚这片土地原有的主人波克雷什金以外，倒也有另一号堪称枭雄的人物——那便是阔日杜布。\n\n在卫国战争爆发之初，尽管布哈林苏联兵败如山倒，精通空战的他也仍在战争中一次又一次重创敌方空军，尽管这似乎无穷无尽。他从未被击落过，他的救国之心也是如此。\n\n在祖国分裂后，他前往了涅涅茨，成为了自由飞行员组织的一员。在阔日杜布与暗夜女巫们的打击下，德国人的鞭子总算无法再延展到祖国的远方，这样的日子就这样持续到西西伯利亚内战。在那大动乱时期之中，自由飞行员组织并入了秋明的卡冈诺维奇政权之中。然而，空军的骁勇善战却未能阻止塔博里茨基的脚步。随着秋明陷落，他被赶到了中西伯利亚共和国的保护伞之下，紧急迫降后他不得不躲在昔日老战友波克雷什金的保护下。\n\n片刻的和平随着边界落下的炮弹而结束，塔博里茨基的狂野征途继续了，最终，就连新西伯利亚也陷落了。阔日杜布被抓到了集中营之中，正当他打算从容赴死时，巴加诺夫将军打响起义的第一枪拯救了他。尽管子夜摧残了每个人的意志，但他仍然抱着乐观的心态，以残余的战斗机戍卫于欧亚中部共和国的边界。这条复兴之路本应顺畅才对，但阿巴顿的崛起却彻底断送了俄罗斯的命运：他们将俄罗斯母亲的最后一口气也打散了...\n\n他不得不暂时伪装起来，利用缴获的敌军衣物伪装成了兄弟会的一员，将那套军服暂藏于地下...他凭借\"缴获\"了欧亚中部共和国的战斗机这个功劳(当然，这是他自己的座驾)，顺理成章地成为了该隐空军第一旅。在此期间，尽管随军执行任务，他也未曾伤害平民...\n\n在阿巴顿归西后，他解开了那神秘学的面具。他清楚共产主义在如此的废墟之中已然不再现实了，于是毅然决然地，暂时接受了实用主义。怀抱着复国的理想，将共产主义的星火深藏于心中。他身上仍是那套早已积灰的空军制服、仍是那几枚勋章，但不同的是：\n\n这一次，他不会再退缩了。祖国的人民没有退路了，不自由毋宁死。"
