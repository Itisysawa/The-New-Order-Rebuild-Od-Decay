 TCA_Yuri_Gastev: "尤里·加斯捷夫"
 TCA_Yuri_Gastev_desc: "尤里·加斯捷夫于1928年出生于莫斯科一革命家的家庭，在1939年他的父亲因政治迫害遇刺，而他们一家亦未能逃免于难，被逮捕并送到了科米苏维埃共和国进行劳动改造。当五年的劳动改造结束时，苏联早就在第二次世界大战中大败了。他开始踌躇不前，对于人生感到迷茫，直到西俄罗斯战争结束...\n\n在国防军的推进中，革命阵线节节败退。反动主义者们趁乱夺过了领土，于是加斯捷夫在此期间流落于科米共和国，研究了相当一段时间的数学理论，以及父亲遗留下来的\"控制论\"。在此期间，塔博里茨基的势力逐渐开始壮大，但出乎意料的是，塔博里茨基并没有为难加斯捷夫；相反，塔博里茨基开始重用他，试图利用加斯捷夫派系的控制学说控制国内情况，加斯捷夫首次实际应用到了归一化理论的力量。虽说他并不认同塔博里茨基的帝国国教，但他也度过了一段相对安稳的日子。\n\n好景不长，塔博里茨基死后，神圣俄罗斯帝国陷入了一团糟。也许是出于对拉里奥诺夫行为所感到的失望，也可能是担心会被当做塔博里茨基派的残党铲除掉，他回到了北俄罗斯解放阵线，成为了阿尔图宁麾下的一名理论家。尽管他的理论经常被认为过于激进，但这也不妨碍他这种过激的理论发展下去。\n\n该隐兄弟会在不久后如浪潮一般席卷了俄罗斯，将灾厄带给了每一个俄罗斯人，加斯捷夫亦是如此。在连年的躲避和求存下，也可能处于生存的本能，他心中的社会主义理想逐渐变得扭曲了，到最后，发展成了这般模样...\n\n但加斯捷夫清楚，他的任务尚未结束，他必须在欧亚建立起一个§e归一化§!的政府，让它§I永世安定§!..."
 TCA_Sergey_Akhromeyev: "谢尔盖·阿赫罗梅耶夫"
 TCA_Sergey_Akhromeyev_desc: "尽然人的意志再强大也好，但一个人又如何能承受住三次见证自己国家覆灭的痛苦呢？\n\n谢尔盖·阿赫罗梅耶夫本是一名服役于西俄罗斯革命阵线的将领，早在第二次世界大战中便见证了苏联的崩塌。虽然如此，但他仍未放弃对生活所持的希望。那时，他幻想着某一天革命阵线能够成功，重建起苏联甚至是战胜德国...\n\n然而，残酷的现实狠狠给了他一巴掌；随着塔博里茨基展开他的疯狂征途，西俄罗斯革命阵线沦陷了，阿赫罗梅耶夫和其他将领一样被迫流亡于北俄罗斯的极寒之地，进行着艰难的游击作战，他见证着一个又一个的战士兄弟们倒下，被塔博里茨基手下的部队用毒气残害，而他却无能为力...\n\n然而幸运的是，他总算熬到了塔博里茨基去世的一天，在各地陆续独立于神圣俄罗斯帝国后阿赫罗梅耶夫加入了北俄罗斯解放阵线，与亚历山大·阿尔图宁共事即使日子再艰难也好，但付出总是有回报的，对吧？\n\n阿巴顿的胜利告诉了他这个问题的答案，事实证明，现实总是残酷的。阿巴顿在吞并了西俄罗斯地区后，以净化之名大规模屠戮先前北俄罗斯解放阵线地区的人们，阿赫罗梅耶夫带着一批幸存者们转进了乌拉尔山脉，但他也彻底陷入了绝望；现在的他没有食物，身上也只有薄衣和那身军服，连个正规一点的住地都没有...\n\n在阿巴顿死后，事情还是迎来了一丝转机，阿赫罗梅耶夫怀着绝望之心还是暂时控制下了萨列哈尔德附近地区，并且试着与新加入阵线的尤里·加斯捷夫妥协。现在，即便再无助也好，绝望之人也会试着拯救绝望之国..."
