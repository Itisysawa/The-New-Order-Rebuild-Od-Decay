 Surrealism: "超现实主义"
 Surrealism_subtype: "超现实主义"
 Surrealism_subtype_desc: "当子夜灾厄降临时，有一群人自称为\"救赎者\"。他们经常被世人认为是精神病人，甚至被丢到了精神病院，但他们似乎却在试图告诫世人些什么。你最常能够从他们那边听到的一句话便是:\n\n\"你你该如何确保你所见，所闻之事是真实的呢？\"\n\n假若以他们的角度而言仔细想想，他们所言并不完全是疯言疯语。在短短几十年间，俄罗斯却经历了数次几近于灭顶一般的灾难，一切实在是太过于魔幻了。一次又一次的毁灭都来得如此顺利，不论是那布哈林击败斯大林成为领导人后而落败于德国，亦或是俄罗斯再次分裂，再或者塔博里茨基在如此渺茫的胜算下统一俄罗斯，亦或是阿巴顿在如此缺乏人力下统一俄罗斯...\n\n一切来得太过于虚幻和虚伪了，仿佛他们的命运早已注定一般，于是他们开始怀疑，是否真有无形之力在操控者什么呢？如果\"救赎者\"的设想是对的，那么也就是说，世界上有一种力量在背后操控着什么，他们想要俄罗斯人受苦，于是创造出了一系列的巧合。最终让他们深陷于炼狱，永世不能翻身...那么是否有那么一个时间线中一切都安安稳稳？哪怕是有一个转折点？\n\n他们本应无法寻到答案，即使世人也是如此，但他们却在意外如此渺茫的概率之中寻得了问题的答案。\n\n在他们顿悟后，\"救赎者\"们也就寻到了逃离这个炼狱的方法。他们认为，只有逃入那个\"虚假现实\"才能够拯救他们。这个世界一切皆为虚假，一切事物都只是由认知所构成，而虚假的也是现实的，一切的一切都是虚假而又真实的，真真假假，假假而又真真...\n\n§z兴许人们会觉得他们疯了，但说不定真正§W清醒§!的只有他们...§!\n\n§i而那\"第四面墙\"，又将由谁打破呢？§!"
 SE_ANTIREALISM_FISRT_REUNIFIED: "俄罗斯再统一"
 SE_ANTIREALISM_FISRT_REUNIFIED_D: "矛盾就在此，人拒绝现实世界，但又不愿意脱离它。事实上，人们依恋这个世界，他们中的绝大多数都不愿意离开这个世界。他们远非要忘记这个世界，相反，他们为不能足够地拥有这个世界而痛苦。\n——阿尔贝·加缪"
 SE_ANTIREALISM_FISRT_REUNIFIED_A: "跨越现实界限..."
 TCI_Erik_Bulatov: "埃里克·布拉托夫"
 TCI_Erik_Bulatov_desc: "埃里克·布拉托夫于1933年出生，原籍萨拉托夫，在那次将俄罗斯击溃的战争前，他移居到了莫斯科，并在父亲的鼓励下踏上了艺术的道路。\n\n然而，好景不长：不久后卫国战争打响，布哈林的无能导致苏联的工业无力抵抗德国的冲击。随着俄罗斯在战争中被碾碎，他的父亲于战争中牺牲，只留下了他和他的母亲，两母子接下来的这段时间中流亡到了斯维尔德洛夫斯克。\n\n在原先的卡冈诺维奇政府与巴托夫元帅的守护之下，也算是渡过了一段较为平和的日子；他在乌拉尔联邦大学艺术系毕业，直到那天到来...\n\n西边的塔博里茨基政权在内战之中重创了乌拉尔军区，随后更是将其兼并。他与母亲不得不逃离他们原先的容身之地，越过边境逃到了阿勒泰地区。他母亲在逃亡途中被帝国突击队的人用枪命中，倒在了逃亡路上...\n最终，还是留下了布拉托夫一人，甚至母亲来不及说出最后一句话。\n\n布拉托夫感到极度的失意，开始依赖于酒精带来的微醺感，想法与意识也逐渐趋于扭曲。即便如此，当他得知塔博里茨基去世后，还是返回了克麦罗沃；在这里，他再一次地开始其艺术创作，即使经常被人认为过于天马行空，以至于后面被抓进了一所精神病院。\n\n然而，当阿巴顿统一时，由于无人打理，导致这所称得上半个废墟的精神病院无人理会。布拉托夫潜藏于此，倾听着外面偶尔传来的枪声，思考着一切的巧合...最终，他醒悟了。\n\n§i假若，这一切的一切或许不是巧合呢？如果有什么人在背后操控着一切的走向...§!\n当外面不再有枪声出现。他的物资也消耗得差不多了，只得壮胆走出了废弃的精神病院。此时的俄罗斯已然尸横遍野，一副死寂的样子...\n\n怀着复杂的情绪，他还是试着寻找活人，随后幸运地遇到了正在巡逻的人们。那是一众来自克拉斯诺亚尔斯克的知识分子，幸存者与阿尔泰王国军队的残党组成的队伍。得知阿巴顿的死讯后，他和这群人们于这片混沌之地、克麦罗沃的废墟之上组建起了一个新的势力——那便是超验救赎区。\n\n经过一次又一次的灾难后，他对于一切已经麻木了，他坚信只有那个更高位面者...或者只是命运什么的东西，会拯救自己和俄罗斯人的吧...但在那到来之前，一切谜底似乎更需要探索...\n\n§i超验委员会的人们一定会找到答案的，以超现实之外的力量才能拯救祖国。§!"
 Anarchy: "无序"
