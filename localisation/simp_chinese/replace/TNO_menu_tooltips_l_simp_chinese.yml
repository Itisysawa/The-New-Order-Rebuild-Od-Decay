 TNO_menupic_tooltip_1: "§F\"§W波§!§V兰§!是一片迦南地，是全体§W波§!§V兰§!人民心中长明不灭的星火\"§!"
 TNO_menupic_tooltip_2: "§F许多人认为，§W波§!§V兰§!已然在§b德国§!人的铁靴下灭亡，从地图上§x消失§!；他们却没能意识到，§W波§!§V兰§!人民的§x怒火§!无法抹去§!"
 TNO_menupic_tooltip_3: "§F我们§W波§!§V兰§!人，当国家遭到奴役的时候，是无权离开自己的祖国的§!"
 TNO_ugly_american_icon_tt: "§<长夜§!§i难明§!"
 TNO_ugly_american_icon_tt_delayed: "§F第二次世界大战结束后，斯拉夫三兄弟之子嗣们在日耳曼长剑之下被撕碎化作奴仆。提着长靴的党卫军咄咄逼人地看着“低等人种”的故土。莱赫之子在曾经流淌着奶和蜜的维斯瓦河畔苟然长喘。\n\n来自德国的“斯坦尼斯瓦夫国王”的汉斯佛朗克无情的开动着他的德国机器，试图要在莱赫之子身上榨干最后一点属于波兰的价值，血液工厂不听的运作着，德意志民族的面包下，却是无数机器碾压下的波兰的骨头和血。\n\n自从1795年联邦灭亡以来，波兰民族经历了多少苦痛？面对着暴君的统治，波兰的抵抗组织在地下组建了一个新的波兰。--满怀毕苏斯基理想的国家军，满怀仇恨的民族武装，还有带着列宁主义余晖的人民军，在一点点打击暴君的统治。\n\n柏林的幕后帐幕即将划下帷幕，不可一世的日耳曼帝国陷入了自我的血液和战斗之中，汉斯佛朗克惊奇的发现，从前被认为是德意志化最为成功的“模范殖民地”，除了自己的老巢克拉考以外，其他地区已经完全失去了联系。\n\n来自维斯瓦河畔的白红旗帜和激烈短散的枪声沉默了这位斯坦尼斯瓦夫国王的迷梦，白红旗帜重新飘扬在华沙之上，倒下的是丑恶不堪的万字旗和汉斯于他的同僚们。\n\n新生的波兰，有很多事情需要做，是如同秉持26年的毕苏斯基精神，还是让18年列宁思想重返革命之地？在豁然，为于德国决一死战，重拾德莫夫斯基的旗帜？\n\n是日耳曼铁蹄再一次踏碎波兰大地，还是坦能堡战役胜利的再一次重现？或是，东布罗夫斯基的旗帜，“为了你我的自由”的歌声能够再次飘扬于维斯瓦河畔？§!"