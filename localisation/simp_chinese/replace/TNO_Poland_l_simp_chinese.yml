 POL_Freedom_desc: ""
 POL_the_country_of_socialist: "社会主义者的国度"
 POL_the_country_of_socialist_desc: ""
 POL_the_revolution_is_still_going_on: "革命仍在继续"
 POL_the_revolution_is_still_going_on_desc: "自从雅盖布东布罗夫斯基战死于1871年的巴黎城下，我们波兰的共产主义战士在堡垒战斗，付出了多少牺牲！面对帝国的蚕食和万恶的叛徒的欺压，我们共产主义者依然站立。\n让那些人看看吧！就算如此，我们依然做好了准备，波兰的革命依然继续！\n\n我们都是列宁！我们是如此年轻！"
 POL_german_in_poland: "波兰德裔问题"
 POL_german_in_poland_desc: "在波兰，历史原因导致德裔一直难以解决的问题，第二共和国的做法是强行同化政策，我们不能这样像帝国主义者那样退步迷茫\n只是，纳粹对波兰大地造成了多少苦难！部队里复仇情绪极其严重，也许我们能够仁慈，蜥蜴同盟和波兰人民能原谅他们吗？\n\n是接受他们，还是驱逐他们？一个致命的问题摆在哥穆尔卡面前"
 POL_still_hope_for_them: "为改过自新而劳动改造"
 POL_still_hope_for_them_desc: "国家军的科莫罗夫斯基提出了一个方案，我们波兰人不能像德国纳粹如此野蛮，但是他们的确是\"有罪\"之人，他们必须为他们邪恶的帝国复出一点代价，我们仁慈的可以考虑，让他们改过自新，立即投入劳动。\n\n依然德国人怎么对付我们的同胞，我们就怎么对付他们的子嗣。"
 POL_execute_german: "驱逐祖国的敌人"
 POL_execute_german_desc: "\"还用想吗？要么杀光他们！要么把他们全部赶走！别脏了波兰的土地！\"蜥蜴同盟的萨尔斯基拍着桌子，怒吼着。\n为免那些德国人里应外合，和1939年那样，我们必须驱逐他们，而且要快。\n\n顺便，不要让他们带走任何东西。"
 POL_german_troop: "组建德意志红军旅"
 POL_german_troop_desc: "德国是共产主义萌芽的地方，但随着历史长河的流逝，如今德国的共产主义者却寥寥无几，但这并不代表他们已然放弃。在纳粹的暴政下，德国共产党依然在战斗，他们是我们的兄弟。\n\n哥穆尔卡提出建议，组织起德国无产阶级兄弟们，一起走向社会主义，必须放下矛盾！"
 POL_forge_ahead_as_communist: "作为共产主义的壁垒..."
 POL_forge_ahead_as_communist_desc: "在会议上，哥穆尔卡的提议被得到广泛的赞同，我们必须团结同志。\n我们已经在悄悄和德国共产党联系，并且在修筑下堡垒，我们不会像巴黎公社一样让人宰割 \n\n§V社会主义永存！§!" 
