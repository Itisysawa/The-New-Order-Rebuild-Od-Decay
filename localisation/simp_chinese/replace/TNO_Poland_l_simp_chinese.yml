 SE_POLISH_UKRAINIAN_WAR:  "东欧罗巴进军"
 SE_POLISH_UKRAINIAN_WAR_D:  "\"现在只有剑才能掌握国家的命运\"\n—约瑟夫·毕苏斯基"
 SE_POLISH_UKRAINIAN_WAR_A:  "欧罗巴再次陷于战火..."
 SE_POLISH_GERMAN_WAR:  "德波战争"
 SE_POLISH_GERMAN_WAR_D:  "他一向相信那曾经征服世界的剑和拳头的力量将永远支配着世界，如今生平第一次看见了在这种力量之外还有别的东西。 \n——亨利克·显克微支"
 SE_POLISH_GERMAN_WAR_A:  "正义的战斗，流血的战斗！"
 SE_POLISH_WIN_PGW:  "波兰光复"
 SE_POLISH_WIN_PGW_D: "谁能从道德败坏的地方脱出来，还保持洁白\n便是有了最伟大的功德 \n—亨利克·亚当·亚历山大·皮乌斯·显克微支"
 SE_POLISH_WIN_PGW_A: "白鹰不再掩埋于阴影之下"
 SE_DEFRATED_GERMAN: "第二次德国内战"
 SE_DEFRATED_GERMAN_D: "我们对于真理必须经常反复地说\n因为错误也有人在反复地宣传\n并且不是有个别的人而是有大批的人宣传\n—约翰·沃尔夫冈·冯·歌德"
 SE_DEFRATED_GERMAN_A: "德意志刺破了阴云"
 SE_PWA_reunification: "德意志统一"
 SE_PWA_reunification_D: "\"政治的本质是区分敌我。今日的敌人，明日或成同胞——只要血仍未冷，斗争永无终局\"\n——卡尔·施米特"
 SE_PWA_reunification_A: "历史再次重演"
 SE_PWB_reunification: "德意志统一"
 SE_PWB_reunification_D: "\"你们在战斗中决不要低估自己的力量，也决不要高估敌人的实际力量，不仅以头脑，而且必须以坚定的意志来观察这些事物，如果光靠头脑计算，那是靠不住的。\"\n——卡尔·邓尼茨"
 SE_PWB_reunification_A: "历史的车轮前进着"
 SE_PWD_reunification: "德意志之春"
 SE_PWD_reunification_D: "“我从未放弃过德国——另一个德国。总有一天，战争中那似乎不可避免的仇恨会得到扼制。总有一天，全欧罗巴人共荣共存的欧洲必将成为现实。”\n——维利·勃兰特"
 SE_PWD_reunification_A: "民主回归德意志"
 SE_PWE_reunification: "德意志统一"
 SE_PWE_reunification_D: "\"我们将会失败，这几乎可以肯定。但如果连这几个人都不胆敢出来制止那罪犯，未来的历史将如何评判德国人民呢？\"\n——亨宁·冯·特雷斯寇"
 SE_PWE_reunification_A: "公理的胜利"
 SE_PWF_reunification: "德意志地区解放"
 SE_PWF_reunification_D: "\"当权力成为压迫的帮凶，我们要用枪炮诉说对自由的渴望。\"\n——内斯托尔·马赫诺"
 SE_PWF_reunification_A: "中欧自由了？"
 SE_PWG_reunification: "德意志统一"
 SE_PWG_reunification_D: "\"我知道，我死后有人会把一大堆垃圾扔到我的坟上。但是历史的风一定会毫不留情地把那些垃圾刮走。\"\n——约瑟夫·斯大林"
 SE_PWG_reunification_A: "共产主义回归故乡..."
 SE_PWH_reunification: "德意志统一"
 SE_PWH_reunification_D: "\"将来胜利之日，我们可能活着，可能已死去，但我们的纲领是永存的，它将使全人类获得解放。\"\n——卡尔·李卜克内西"
 SE_PWH_reunification_A: "从奴隶到人"
 SE_PWI_reunification: "党卫队统一德意志"
 SE_PWI_reunification_D: "\"党卫队军官面前没有困难，困难一出现，他的职责就是将其消灭。\"\n——海因里希·路易波德·希姆莱"
 SE_PWI_reunification_A: "乌云再次笼罩德意志"
 SE_PWJ_reunification: "德意志统一"
 SE_PWJ_reunification_D: "\"阶级斗争的发展将要贯彻游击队思想，一个社会主义战士的死重于泰山，一个资本家的死轻于鸿毛。\"\n——乌尔丽克·梅茵霍芙"
 SE_PWJ_reunification_A: "斗争到底"
 SE_PWK_reunification: "自由军团统一德国"
 SE_PWK_reunification_D: "\"普鲁士的陆军元帅绝不叛变。\"\n——埃里希·冯·曼施坦因"
 SE_PWK_reunification_A: "不详的征兆..."
 SE_PWL_reunification: "德意志再统一"
 SE_PWL_reunification_D: "\"只有对那些需要战争的人来说，战争才是正义的。\"\n——埃德蒙·伯克"
 SE_PWL_reunification_A: "和平的到来..."
 SE_PWM_reunification: "德意志再统一"
 SE_PWM_reunification_D: "\"我们要是得到权力，就绝对不会轻易放弃，除非把我们的尸体抬出办公室。\"\n——保罗·约瑟夫·戈培尔"
 SE_PWM_reunification_A: "一切变了，却也未变"
 
 #########世界新闻文本########




 POL_ROD.1.t: "第二次波乌战争"
 POL_ROD.1.d: "就在昨天早晨，埃米尔·菲尔多夫宣布对乌克兰发动第二次波乌战争，他以稳定东境为由进军乌克兰。这是自1919年以来第二次乌克兰与波兰爆发全面战争。1919年的我们取得了胜利，而如今，也是重拾波兰民族荣光的时候，昔日的我们只是为了夺回加利西亚；如今的我们，将会为了解放乌克兰的领土而战。 \n\n如今的乌克兰正深陷于专员辖区的内战当中，四方势力即使是面对波兰的进攻仍没有团结对外的意识。乌克兰国、共和国、专员辖区与苏维埃仍然在进行意识形态的斗争，乌克兰战乱不断，民众深陷于战争之苦。乌克兰先是被德国人奴役，再是分裂，这便也是为何他们需要解放。"
 POL_ROD.1.a: "乌克兰深陷战争泥潭..."
 POL_ROD.9999.t: "[Get_newspaper_header]第二次德国内战爆发"
 POL_ROD.9999.d: "德军于先前深陷了德波战役的泥潭之中，即使动用核武器进行斩首行动也未能撼动波军抗击德国人的士气。当这场战争变得持久而再无意义的时候，元首便注定已然失败；德国的无能世界一览无余，而这场失败的战争也让纳粹党内部的反动派开始躁动。在新任元首建立威信前，就已然遭到了国内反对派的刺杀，这又进而导致局势的不稳。随后，邓尼茨政权也没能压住这种力量，各派人士趁着德国的内乱控制了不同地区；不论是革命势力，民主派人士还是国防军的残部，甚至是党卫队的部队都想在德国内战中分一杯羹，德国在各派的斗争下再一次变得四分五裂。 \n\n目前德国的局势尚不明朗，但可以肯定的是：德国的第二次内战势必大幅削弱其势力，一些早已被并入德意志的地区那群游击队也开始了他们的行动，如若他们的运气足够好，他们将能够将纳粹分子彻底赶出其民族的国土。 \n\n现在，世界将拭目以待：是一个崭新的德国，亦或是重蹈覆辙？历史将会解释一切。"
 POL_ROD.9999.a: "德国内战，展开序幕..."
 POL_ROD.13.t: "[Get_newspaper_header]意大利承认波兰临时政府主权！"
 POL_ROD.13.d: "自德国的内乱爆发起，波兰这个不死的勇士再度崛起。随着意大利领袖齐亚诺和波兰外交部长亚当·科克的合影在欧洲大陆疯传之后，一个让柏林方面无法接受的事实显然已经出炉：意大利承认了波兰政府的独立。\n\n作为第一个承认波兰政府的欧洲大国，《意大利-波兰友好条约》的签订让波兰人有了稳定的后援，帝国将提供弹药，武器，技术以支援波兰，共同打击大日耳曼国黑恶势力。\n\n这对柏林方面而言不是什么好消息...柏林方面对对意大利政府予以强烈谴责，并且鲍曼德国试图增派部队至德意志-意大利边境，对意大利方面构成威胁，然而可悲的是，刚刚结束内战的柏林方面暂时没有能和意大利掰手腕的能力。"
 POL_ROD.13.a: "独立的新乐章？"
