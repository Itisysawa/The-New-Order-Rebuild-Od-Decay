 #######OWZJ国策树#######
 POL_Witold_Pilecki_leader_desc: "自18岁参军那年以来，漫步人生五十余载，维托尔德·皮莱茨基所见之人与事实在太多了。不论是1921年俄军的败退，亦或是后来德军的炮火，还有元帅的历史、祖国的毁灭......皮莱斯基一直战斗着，甚至不惜以身入局，潜入奥斯维辛...\n\n他的狱号4859被他视为德军所赠予他的荣誉，那名\"4859号囚犯\"在不停地行动着，执行着他的任务：为波兰，还有你我的自由。\n\n就在德军败退之际，波兰祖国重获自由，他本以为自己已然快能够退役了，但蜥蜴联盟的政变让打乱了一切。不论是家乡军，亦或是国家军的领袖接连遇刺，波兰祖国也开始重现乱象。如若祖国不再自由，我们也必然要让它付出代价。\n\n他眺望祖国，却发现现在仅有一人能带领这次的胜利：为了祖国，他不得不赌一把。\n事实证明，他的选择是正确的。他亲手逮捕了萨尔斯基，蜥蜴同盟亦随之没落...\n\n而至于祖国的未来，皮莱茨基并不愿做独裁者。他更想如那位他所敬仰的先总理，毕苏斯基那般维稳政局。等到尧趋舜步后，他便可以安心地看着自由的波兰祖国，做些自己喜欢的事情了。\n\n稍有不慎，他就会将祖国带入深渊。但他坚信自己能做到。此刻，他也站在历史的转折点上..."
 ultranationalism_great_pole_thought_subtype: "大波兰主义"
 ultranationalism_great_pole_thought_subtype_desc: "此意识形态兴起于1648年，联邦崩溃的“大洪水”时期，此时的波兰人们开始逐渐审视起与其共处的，那些其他东欧民族的合法性。他们不由得想：这些人真的是我们的朋友吗？在联邦1795年的破灭，与那糟糕的1863年民族起义失败后，波兰人们找到了这个问题的答案。此刻，东欧民族分道扬镳。在大波兰主义下，波兰人们意识到了，自己只是波兰人，就应做到独属于波兰人自己的义务。\n\n先总理德莫夫斯基在《一个现代波兰人的思考》这本书中批判了毕苏斯基多民族思潮的理念，代表着\"大波兰主义\"被正式确立为一套理论。在仇杀与波兰政府的崩溃之下，大波兰主义在现任领袖塔德乌什·萨尔斯基身上得到了完善：我们只需要最纯净的波兰人，因为波兰人才会为了波兰的事业而战斗，毕苏斯基大错特错！我们必须对此进行弥补。\n\n§q我身为波兰人，我天生有捍卫他的权利。§!"
 
 POL_OWZJs_victory: "民族的最终胜利"
 POL_OWZJs_victory_desc: "终于！经过一连串激烈而艰险的斗争，我们蜥蜴同盟的伟大领袖、波兰人民和民族真正的救星塔德乌什·萨尔斯基，已经赢得了他应得的权力！尽管家乡军和人民军的那些蠢货和叛徒因此怒火中烧，但他们除了无能狂怒还能干什么？欲戴王冠，必承其重，而萨尔斯基就是整个波兰唯一能承担起拯救祖国重任的伟人！\n\n不过，我们不应该就此随意松懈，因为我们只是向波兰民族的救赎之道迈出了第一步。为了真正实现波兰爱国者们的大团结，经过慎重的考量，我们决定重新建立起属于我们的政党，也就是ONR。在新生的党的旗帜下，萨尔斯基领袖将带领波兰母亲最光荣的孩子们勇往直前，扫尽国内外的一切害人虫，让全世界见识一下波兰浴火重生后真正的伟力！"
 POL_wolfs_around_tt: "§x是时候处理这群杂种了§!"
 POL_wolfs_around: "群狼肆绕"
 POL_wolfs_around_desc: "虽然我们如今已经成为了波兰的掌权者，但离高枕无忧的时候还是早得很。我们的敌人，也就是那帮家乡军和人民军，在遭受挫败后仍然对我们虎视眈眈。他们在各个阴暗的角落四处串联，进行着邪恶的谋划，而他们的最终目的很简单：通过公开政变推翻我们的统治，把波兰变成他们肆意狂欢的肮脏乐园！\n\n这种荒谬的妄想，我们怎么可能让它成真？既然这帮叛匪热爱权力胜过热爱祖国，那我们也没必要给他们好脸色了。ONR旗下的情报人员们将会开始24小时的全天候监视，而武装部队也被发动起来，随时准备发起清算行动。呵，与我们为敌的渣滓们，我们将会让你们所有人明白：与我们为敌就是与整个波兰民族为敌，而一切波兰民族的敌人，最终都会被我们碾压粉碎！"
 POL_EPJ_threat: "铲除东波兰萨纳齐亚"
 POL_EPJ_threat_desc: "亚当•科克，这个虚伪的懦夫在波兰沦陷之时，毫不犹豫地带着黄金跑路。而等到起义开始后，他又打着“支援起义”的幌子带着黄金跑回来。而到最后，他居然真的梦想成真，当上了东波兰军区的头头！可我们可是清楚得很，这家伙哪里是他自己标榜的“爱国者”？他只不过是个唯利是图的投机分子而已，哪里有资格和萨尔斯基领袖和追随他的我们相提并论！\n\n在我们对家乡军进行了彻底的清洗后，下一个也就该轮到这家伙了。世界上只能有一个波兰，一个团结、统一而强大的波兰，她不需要任何“山大王”来保护！我们已经将部队集结到了本土和军区的边界，接下来，我们就要主动出击，彻底终结科克的美梦——以及他的性命！任何一个吸食祖国血液的吸血鬼，都将被我们拖到阳光之下，然后钉死在十字架上！"
 POL_end_the_armia_krajowa: "终结家乡军之治"
 POL_end_the_armia_krajowa_desc: "在波兰还处于德国佬的压迫下的特殊时期，为了团结一致打倒侵略者，我们曾经勉强和家乡军保持着“友好关系”。但是在我们成为波兰之主后，这层虚伪的关系也该被终结了，毕竟我们可不愿意和一群豺狼虎豹同舟共济！事实上，家乡军的那群混蛋也是这么想的，他们早就撕破了脸皮，公然和我们作对。既然这样，那我们也没有留情面的必要了！\n\n在萨尔斯基领袖的指挥下，我们已经基本摸清了家乡军成员的据点，以及他们的兵员、军火等的分布情况。现在，只等领袖一声令下，我们就会全面出击，把那群家伙统统打死在他们的老巢里！可别怪我们啊，菲尔多夫先生，还有你的走狗们，谁让你们阻碍了波兰民族走向伟大复兴呢？我们也只是尽本分而已。"
 POL_use_monarchists_hand: "潜在的君主派叛徒"
 POL_use_monarchists_hand_desc: "尽管这听起来似乎难以置信，但在我们的队伍里，有这么一批食古不化、思想落后的白痴，他们居然始终怀念着他们口中“光荣而伟大”的波立联邦，并且对早已过时的腐朽君主制情有独钟！天啊，这些家伙难道人格还活在中世纪吗？那个缝合起来的怪胎国家除了给波兰民族带来一连串的耻辱以外，究竟还有什么作用？至于君主，新生的波兰才不需要这种被时代淘汰的存在，我们才不需要任何一位国王或者皇帝骑在我们头上作威作福！\n\n虽然这帮叛徒的诉求是开历史的倒车，但他们为了达到目的，可真是一直在不择手段地前进啊！不过，这么幼稚的想法，领袖怎么可能会认同呢？他早已安排好了一切，包括怎么抓捕他们、抓完怎么处理、处理后怎么对外解释.....现在，就是我们这些忠诚战士们的时间了！出发，把君主派的精神遗老遗少们一网打尽，让他们好好见识见识我们的厉害！"
