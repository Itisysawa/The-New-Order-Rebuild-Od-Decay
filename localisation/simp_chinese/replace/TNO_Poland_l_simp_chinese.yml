 ggn.1.t: "风暴袭来"
 ggn.1.d: "随着起义的第一枪在华沙响起，其周边暴动地区也纷纷响应着；维斯瓦河畔的孩子又回来了，他们发誓着要将任何德国人驱离。约瑟夫·布勒坐在克拉考的办公室内焦头烂额；如今地下运动的事情是瞒不住了，他的无能在此刻尽数展露，而他的位置也大概是坐不住了。\"快点集结部队镇压他们，还在等什么！\"他对手下吼道。此刻他的脸上是多么的狰狞，他对目前的状况可谓是手足无措，复仇的风暴依然在华沙卷起... \n\n而随着大量部队从华沙涌出，总督府的抵抗力量显得是如此的不堪一击而薄弱；早已崩溃的工业体制，难以召集起来的人力...败徵无时不在显露，胜利的天平仿若无限的偏向了红与白交织的国度，约瑟夫·布勒回想着过往，如若汉斯·弗兰克以前早早寻求德意志的协助，又怎会落得如此险境？现在已是多说无益，仿若沉入海底一般，是如此的无力... \n\n现在，他只得被迫收拾这个烂摊子，但当他试着采取行动的时候，却发现他先前所承诺的日耳曼化都让自己进一步陷入险境，现在库存中根本就没有那么多装备来镇压抵抗：他只能誓死抵抗到底，抑或是被解放力量所剿灭..."
 ggn.1.a: "\"永不向蛮子低头！\""
 ggn.1.b: "华沙之役将会使得波兰迎来解放！"
 GGN_warsaw_rise_as_pol_tt: "§x复仇的火焰已然燃起，波兰将会推翻暴君的统治！§!"
 GGN_warsaw_rise_as_ggn_tt: "§x叛徒的命运便是灭亡！§!"
 ggn.3.t: "华绍躁动"
 ggn.3.d: "随着德国内战的爆发，与德国相邻的华绍地区逐渐变得动荡；家乡军在当地发动的袭击与地下活动频率逐渐变得频密，而当地更是经常传来驻军受到袭击的报告。为此，约瑟夫·布勒抽派出更多部队来镇压当地的躁动，但似乎也只是杯水车薪罢了。事实就是，总督府已然失去了对此地的控制，而且这股烈焰还在蔓延到周边的省份，当下已然是燃眉之急... \n\n当下，德国自己也深陷内战的泥潭之中，即使这时候我们再互换援助似乎也是于事无补了。昨天，总督府拦截了来自波兰家乡军的一封电报:\"D+3,H+2，我们将会夺取华沙城\"，目前看来，家乡军似乎准备引爆一场规模巨大且前所未有的起义了。 \n\n约瑟夫·布勒不得不接受眼下残酷的事实，汉斯·弗兰克的无所作为导致了如今敌人的壮大，只是现在各专员辖区也陷入了混乱，再想求得援助如同枯木开花，当下他只能孤军奋战；但数日前他才将数名意见不合的高级将领铲除掉，如今又有谁会帮他去抵抗波兰人的起义呢？"
 ggn.3.a: "他的愚蠢将招致他的灭亡"
 ggn.4.t: "局势失控"
 ggn.4.d: "最终，约瑟夫·布勒仅余最后的希望还是破灭了。华沙的守军彻底撑不住了，就在夜里彻底被驱逐出华沙；同时菲尔多夫也宣告完全控制了华沙城；若不是这群反贼，自己怎会落得如此下场？华沙最终还是失守了，就如预料中一样。 \n\n然而，噩耗远远不止这一个，根据报告，华沙周边的区域也受到了复仇之风的席卷，家乡军的游击队、人民军的部队一同朝着华沙周边区域推进着，如此下去这些地区也会失守；谢德尔采、格鲁耶茨、拉多姆...一切手段在此刻都是如此无力，一切事实都指明了一件事：汉斯·弗兰克所做的只是屠戮着手无寸铁的平民，而非那些真正的反抗力量，他们在这些年间壮大，而又起义... \n\n可是，说这些又有什么用呢？现在，没有人能够救他了。一切都是总督的无所作为一手造成的，怨不得别人，他能做的便是带领总督府仅剩的少数部队，进行着受死前最后的反抗。但他也应该知道，一切都是徒劳；即使他赢了，德国政府肯定也会将他换走..."
 ggn.4.a: "将死之人临终前的无力反扑"
