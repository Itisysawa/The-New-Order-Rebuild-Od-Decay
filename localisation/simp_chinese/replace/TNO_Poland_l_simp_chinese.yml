 POL_a_pan_european_union_desc: ""
 POL_rebuild_relationship_to_lithuania: "与立陶宛重新结交"
 POL_rebuild_relationship_to_lithuania_desc: "如今，在彻底铲除了蜥蜴同盟的疯狗们之后，皮莱茨基终于有机会坐下来思考：如今，新生的波兰面临着孤立无援的尴尬处境，那么什么国家适合成为波兰的盟友呢？在地图上扫视良久后，他看向了东方领被粉碎之后，重获自由的立陶宛。\n\n对此，皮莱茨基也有自己的理由：历史上，我们的先祖曾经与立陶宛人携手缔造了无上的荣光。既然如此，那我们为何不学习他们的经验呢？毕竟，波兰和立陶宛，都是刚刚挣脱大日耳曼国的魔爪、如今百废待兴的新国家。相同的境遇，再加上历史上的友谊，足以让立陶宛认真考虑与我们联合的问题了。于是，他迅速安排了前往考纳斯的行程..."
 POL_rebuild_relationship_to_ukraine: "来自基辅的朋友" 
 POL_rebuild_relationship_to_ukraine_desc: "“欧洲粮仓”，这个美号令乌克兰闻名于世，却也成了这个国家日后惨遭沉重剥削的诱因。从乌克兰专员辖区建立的那一刻起，埃里希•科赫和他的爪牙奉德意志元首之命，开始丧心病狂地对乌克兰人民进行竭泽而渔式的搜刮和掠夺，试图榨干乌克兰民族的最后一点血汗。好在噩梦已然结束，英勇的波兰战士们秉持着国际主义精神，奔赴异乡与乌克兰人并肩作战，最终在剿灭了德寇和割据势力后成立了独立民主的新乌克兰国家。\n\n正是因为这份在战火中铸就的情谊，波乌两国在战后便开始了外交关系的“蜜月期”。而皮莱茨基自然不会放过如此天赐良机，毕竟进一步深化两国合作，毫无疑问是双赢的上策。基辅方面想必也明白这个道理，所以，面对我们抛出的橄榄枝，想必他们也不会拒绝吧？"
 POL_rebuild_relationship_to_belarus: "明斯克谈判"
 POL_rebuild_relationship_to_belarus_desc: ""
 POL_rebuild_relationship_to_latovia: "里加多方互助协议"
 POL_rebuild_relationship_to_latovia_Desc: ""
 POL_rebuild_relationship_to_slovakia: "将斯洛伐克纳入势力圈"
 POL_rebuild_relationship_to_slovakia_desc: "1939年3 月，纳粹的铁蹄踏入了被英法盟友抛弃的捷克斯洛伐克。最终，德国彻底吞并了捷克领土，在斯洛伐克，则成立了一个傀儡国。从此，这个毫无主权可言的“斯洛伐克共和国”，只能选择时刻跟随德国主子的步伐。一直到大日耳曼国建立欧陆新秩序为止，斯洛伐克人的命运，都由不得自己做主。\n\n然而如今，那个向全世界散播恐惧的罪恶国度，已经在遭遇波兰痛击后走向了崩溃。不仅斯洛伐克人，就连我们也确信，这是斯洛伐克走向自由的大好机会。有鉴于此，皮莱茨基已经决定派遣使者前往布拉迪斯拉法，向他们陈明利害。毕竟，一根筷子容易断，十根筷子抱成团。如果他们能和我们保持步调一致，如果日后再有变故，斯波两国也好互相照应不是吗？"
 POL_rebuild_relationship_to_estonia: "邀请爱沙尼亚"
 POL_rebuild_relationship_to_estonia_desc: "爱沙尼亚，一个名副其实的悲惨国度——在摆脱了俄罗斯帝国200年的统治后，又因为苏联策划的“公民投票”而再度被吞并。苏联崩溃后，德国人作为爱沙尼亚的新主人，又将它并入了新成立的东方领。似乎，爱沙尼亚注定只能就此沦为地理名词了。\n\n好在，如今无论是东方领，还是大日耳曼国，如今都掌握不了爱沙尼亚的命运了。不过，新生的爱沙尼亚国尚且势单力孤，仅靠自己的力量，他们还是很难保全自身。不过巧得很，波兰民族也是刚刚摆脱大日耳曼国的魔爪，为了在新形势下站稳脚跟，我们也需要多交几位朋友。所以说，塔林的朋友们，或许我们可以好好谈一谈合作的事情？"
