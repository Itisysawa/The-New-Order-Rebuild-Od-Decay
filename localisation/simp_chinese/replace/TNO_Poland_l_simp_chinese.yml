 POL_promise_of_reform: "五三宪法与君主？"
 POL_promise_of_reform_desc: "诚然，旧日联邦的君主制度早已随着强敌的血腥瓜分消逝于烟，而在第一次世界大战中浴火重生的波兰也并未建立一个君主国家。\n\n但我们怎能忘记波兰民族历史上的辉煌？斯特凡.巴托里，杨.索别斯基等伟大君主的丰功伟绩是波兰历史上不可磨灭的丰碑，而斯坦尼斯瓦夫二世时代的5月3日宪法更是在黑暗专制时代照亮欧洲的一抹民主光芒。在波兰再次挣脱奴役绝境重生的当下，我们不应该只是铭记联邦的辉煌历史，而是应当继承其精神与内涵。为我们即将起死回生的伟大国家，波兰，欢呼吧！"
 POL_christian_back: "召回卡尔-斯特凡"
 POL_christian_back_desc: "昔日确立5月3日宪法之时，斯坦尼斯瓦夫二世国王正面临着没有合法子嗣的危机，为了在自己逝后联邦不至于再一次因为自由选王制而陷入内乱的深渊，他选择在宪法内明确在自己之后，波兰的王位将回到奥古斯特二世与奥古斯特三世的韦廷王朝，也即萨克森王朝身上。拿破仑战争时期，建立起来的华沙大公国也同样选择了萨克森王冠作为波兰的当选君王。如今既然我们要恢复往日最尊贵共和国的辉煌，便应当拥立一位合法的真王。挑选了诸多继承人之后，我们最终选择了哈布斯堡王朝的卡尔-斯特凡·冯·阿尔滕堡，他将承继奥古斯特二世的王冠，成为200年来又一位在瓦维尔山加冕的波兰国王。"
 POL_explain_reformist_aristocratic_democratic: "诠释改革贵族民主制"
 POL_explain_reformist_aristocratic_democratic_desc: "贵族民主，乃是联邦的国家根基，没有贵族民主便不会有联邦的存在，但也正是贵族民主制，在大洪水时代将联邦拉入衰落的深渊，最终使波兰遭受了百余年的亡国之辱。正因如此，我们的同伴中有许多人担忧是否要恢复贵族民主制度。\n\n我们的抉择将令他们放心，我们决不会恢复毫无任何政治秩序的“波兰式无政府”状态，而是继承5月3日宪法的伟大遗产，我们将承认贵族与市民是国家的基石，而勤劳的农民则是国家的血脉，我们的新联邦，贵族将是辉煌与民族骄傲的称号，而不是踩在农民脖子上与外国勾连的血腥压迫者。"
 POL_attract_democrats: "民主色彩下的君主"
 POL_attract_democrats_desc: "旧日联邦与旧欧洲的黑暗专制国家有根本不同，在那些愚昧的专制国家，君主可以毫无顾虑的践踏人民的权利，人民也丝毫没有反抗君主的勇气。\n\n但在旧日联邦，君主乃是由选举产生，他要向他的人民负责，忠诚于宪法与国家的利益。我们恢复的君主制不是愚昧的专制，而是重生的黄金共和，更加人道，民主，并保卫全体人民的尊严。"
 POL_talk_with_pilecki: "与皮莱茨基谈谈"
 POL_talk_with_pilecki_desc: "维托尔德.皮莱斯基毫无疑问是一位伟大的爱国者，和无数名英勇的波兰士兵一样，有着坚韧不拔的毅力与超绝的勇气。为了恢复君主制度。我们首要的任务就是征服这位没有被纳粹恶魔征服的战士。\n\n用民族伟大历史向他诠释君主制的伟大！同时让他相信君主制绝不会侵犯波兰人民的利益与权利，而是波兰社会秩序与国家道德的卫道士。我们将把旧日的魔鬼赶走，清扫干净异端的祭坛，随后迎回护佑波兰已千年的圣母玛利亚与圣子耶稣。"
 POL_set_up_monarch: "加冕君主"
 POL_set_up_monarch_desc: "如今波兰国内大势已定，前家乡军士兵、有偏见的共和主义者、大多数亟待赋权的小精英群体与持观望态度的农民都越发认可我们，我们终于为君主立宪的施行铺平了道路。若想实现权力的平稳交接，我们应该延续波立联邦的光荣传统，调动各个阶层与团体，筹备一场盛大的加冕仪式，向全世界宣告波兰王国的浴火重生。"
