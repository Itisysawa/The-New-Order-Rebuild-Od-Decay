 #####波兰家乡军起义阶段国策树



 POL_home_defense:  "本土防御"
 POL_home_defense_desc:  "为了人民的解放、为了全国的解放、也为了波兰的复国，我们将竭尽全力，势要让后代们不再受难，我们将会发起一场大规模的进攻，让这群德国佬尝尝我们的厉害！"
 POL_the_final_uprising:  "出征"
 POL_the_final_uprising_desc:  "随着德国在内战中分崩离析，他们暂时无法抽派出兵力来干涉§V华沙§!§W起义§!。总督府多年以来对我们弟兄同胞的屠杀仍然历历在目，事到如今，我们终于又到了崛起的时刻。我们将会解放祖国，将那红与白的旗子再次插在华沙，再到整个波兰，势要让波兰人民不再受难... \n\n§V波兰永不灭亡，充满着血迹、红与白的旗帜将再次飘扬于华沙§! \n\n§W华沙§!\n§W终将§!\n§V迎来§!\n§V解放§!"
 POL_for_last_time:  "为公理与复兴"
 POL_for_last_time_desc:  "随着内战再次燃起，现在陷入了敌虚我盛之境，如若我们趁此机会发动一场总决战，总督府的走狗们势必招架不住。而我们世世代代将为解放的事业而竭尽全力。 \n\n如若我们能够攻下克拉科夫，对方的力量势必遭到重创，而如今波兰的命运走向何方，将由我们决定，为了波兰人民的解放，我们将会大步前进！"
 POL_emergent_manpower:  "应急征召"
 POL_emergent_manpower_desc:  "内战爆发时我们的占领区说不上特别大，因此固然会有一些人力上的问题。为补充游击队队员，我们将会从我们现有的领土招募救国志士，避免我们的军团出现人力匮乏问题；如若敌人提枪相见，那么我们也会以子弹迎接他们，华沙将会再度崛起！"
 POL_heritage_from_2nd_republic:  "永不灭亡"
 POL_heritage_from_2nd_republic_desc:  "起义从来都不是此刻才爆发，抵抗活动一直存在，华沙地下国的英雄们一直抵抗着这群纳粹走狗。 \n\n当起义爆发时，菲尔多夫注意到先前华沙的地下组织藏了大量的军火，而当现在正式爆发起义时，自然的这些装备便入了我们手中。有了这些装备的援助，我们在内战中必定能够更容易得胜。"
 
