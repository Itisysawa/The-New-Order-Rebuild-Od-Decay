 before_wsw.4.t: "成功偷窃摩托化装备"
 before_wsw.5.t: "扎莫希奇的电报"
 before_wsw.5.d: "\"扎莫希奇的同志们 能收到吗？\"\n随着电报发出，迎来的是一阵沉默。\n是啊，在那次灾难性的打击之下，想必这群同志也很难坚持下去了吧...\n\"这里是扎莫希奇方面军第一旅 是菲尔多夫阁下的部队吗\"\n\n出乎意料的是，过了不久后电报却传来了回应。菲尔多夫松了一口气，生怕这支军队早已被德国人剿灭。\n\"这里是第51步兵团 我们在华沙战区已建立一定情报网 待准备完成后若有合适时机将发动起义\"\n尚未传来回应，信号开始出现了异动，菲尔多夫的经验告诉他，他们所在的频率被德国人监听了，于是在发送暗号后切断了联系"
 before_wsw.5.a: "但愿他们能够知道吧"
 contacting_the_troops: "尝试联络扎莫希奇的地下军"
 contacting_the_troops_desc: "五年前，扎莫希奇起义的结局虽如华沙起义一般，被德国人残暴的铁靴残酷地镇压了。即便如此，相较于华沙的部队，扎莫希奇的家乡军损失较小，经过休养之后，扎莫希奇的部队仍然可以再次投入战斗。\n\n我们可以联系扎莫希奇的同胞们，给德国人痛苦的一击"
 before_wsw.6.t: "行动\"特里格拉夫\""
 before_wsw.6.d: "\"我们还剩多少军备？\"\n\"不多了，大概只有千余发弹药，数十到数百发炮弹和为数不多的武器...\"\n正当菲尔多夫与科莫罗夫斯基还在为军火数量发愁时，家乡军第27师却传来了一则喜讯：\n他们在卢布林发现了德军的军火库。\n\n在评估了风险与机会后，菲尔多夫决定发动\"特里格拉夫\"行动，对这个军火库实施劫掠。在准备完毕后，第27师趁着德军换岗时发动了袭击。这群守军被打了个措手不及，即使他们在这次行动中对家乡军造成了一定伤亡，也无济于事了。第27师英勇的将士们将卢布林军火库洗劫一空，仅以数十人的伤亡便完成了这个任务。"
 before_wsw.6.a: "\"赚大发了！\""
 before_wsw.7.t: "行动\"贝洛伯格\""
 before_wsw.7.d: "为了解放我们被抓进奥斯维辛的同胞们，以及为了扩增我们的抵抗力量，我们的老朋友——\"奥斯维辛中的4859号囚犯\"，维托尔德·皮莱茨基在奥斯维辛发动了一次劫狱行动。在这次行动中，他率领着奥斯维辛内的地下网络——武装组织联盟，趁着夜色对奥斯维辛进行了劫掠，由于能见度太低国防军们未能发现皮莱茨基的部队，当他们听到枪声时已经晚了。\n\n随着一声爆炸声传来，集中营内囚犯集中区的墙被炸开，\"囚犯\"们与外面的家乡军里应外合，从预先准备的通道逃离了。当德国的部队赶到这个地下隧道时，一切已经晚了。不过，波兰家乡军们也为他们留下了一点小礼物：随着赶来的追兵触发通道出口附近的诡雷，所埋下的炸弹亦被引爆，这些德国部队直接因为隧道坍塌而被活埋。汉斯·弗兰克对此感到不可置信，同时下令全力追杀这群波兰家乡军。\n\n即便如此，奥斯维辛守军仍然损失惨重，目前汉斯·弗兰克已然下令重防该区域。"
 before_wsw.7.a: "行动完美收场"
 before_wsw.8.t: "总督府行政大楼爆炸案"
