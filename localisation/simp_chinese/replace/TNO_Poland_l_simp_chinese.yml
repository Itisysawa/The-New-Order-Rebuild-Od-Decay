 ##########人民军夺权##################

 POL_revolutive_council: "波兰人民的革命"
 POL_revolutive_council_desc: "我们的同胞们已经作出了他们的选择：革命委员会，将指引波兰人民向新的胜利前进！波兰历史的新纪元开始了！\n\n这将给祖国带来翻天覆地的变革！作为社会主义的追随者，我们将在红旗的引领下，团结一心，带领波兰人民打破波兰母亲身上的枷锁，让她彻底得到自由！\n\n此刻，让我们齐声欢呼：人民革命必胜！社会主义的波兰万岁！"
 POL_the_start_of_confusion: "前路茫茫..."
 POL_the_start_of_confusion_desc: "如今执掌权柄后，我们才发现，我们似乎...高估了委员会的团结程度。我们想要的波兰是怎样的？我们该如何建设它？关于这两个问题，委员会内分化出了支持班奇克同志的温和派、支持哥穆尔卡同志的激进-马尔赫列夫斯基派和支持帕荣克同志的激进-瓦林斯基派。不同派系的同志已经开始彼此论战甚至攻讦了。\n\n这种局面决不能持续下去，我们不能亲手葬送我们为祖国母亲争取到的光明未来。到底怎样把波兰引入社会主义的正轨？也许分歧一时间难以弥合，但时间不等人，无论如何，我们必须尽快做出统一全局的决定了..."

 #共同目标
 POL_solve_moskowien_risk: "解放莫斯科维恩"
 POL_solve_moskowien_risk_desc: "我们已经从大日耳曼国的铁蹄下解放了数不清的邻国人民。高加索、乌克兰、东方领...德国佬设立的专员辖区被我们一个个粉碎。而现在，我们将把兵锋指向纳粹在欧洲殖民的最大据点——莫斯科专员辖区。\n\n自从德国赢得西俄战争、巩固了在A-A线以西的统治以来，无数沦为亡国奴的俄罗斯人便在纳粹渣滓惨无人道的暴政之下过着流血又流泪的凄惨生活。他们渴望挣脱被强加的枷锁、重新成为自己家园的主人。而现在，我们将帮助他们实现心愿！波兰的勇士们日夜厉兵秣马，只为向莫斯科维恩发动首战即终战式的胜利进军。等白红双色旗插上克里姆林宫的那一天到来，那里所有的压迫者们都将为他们的暴行付出代价！"
 POL_polish_rebirth: "最后一步..."
 POL_polish_rebirth_desc: "好极了！在波兰战士和各国人民的共同努力下，纳粹在整个欧陆的一系列殖民堡垒都被彻底粉碎了！被解放的各个国家都对我们表达了真挚的谢意，表示愿意与我们精诚合作！\n\n趁此机会，委员会提出了一个对我们和我们的朋友都有益处的提案：建立一个由波兰领导、各个民主国家参与并平等共处的组织——华沙公约组织。这个组织将更好的促进我们与各友好邻国在政治、经济和军事等方面的合作，建立起名副其实的\"人民阵线\"，以捍卫我们共同的、来之不易的自由。\n\n时不我待，我们将把这个消息传递给我们的外国兄弟们，相信他们不会拒绝的。毕竟，团结起来的人民，永远不会被击败！"
 POL_end_war_time_econ: "终结战时经济"
 POL_end_war_time_econ_desc: "尽管硝烟已经从波兰大地上空散去，但战火给祖国带来的伤痛仍然让人触目惊心。而且...不是所有的伤痛都是敌人带来的。在我们和大日耳曼国激战正酣的时期，为了持续为战火中的勇士们输血，我们曾经采取了一系列特别的经济措施，来对国家经济进行管控。事实证明，这些措施在当时是必要的，但现在...它们不能再被延续下去了，我们的人民已经不堪重负了。\n\n委员会就此已经召集了相关部门的负责人和一众经济专家，共同商讨波兰在新时期的经济政策。尽管目前还没有达成共识，但所有人都同意一件事：一个社会主义的波兰，决不能让人民在和平年代\"享受\"战争时期的待遇。"
 POL_liberal_market: "自由市场经济"
 POL_liberal_market_desc: "提到\"市场\"，我们的许多同志都会表现出极度的反感。在布哈林的一系列市场自由化改革宣告失败、为日后苏联的惨败埋下了祸根后，他们的刻板印象就更深了。但现在，经过细致的研究之后，我们得出了全新的结论：在社会主义国家推行自由化的市场经济是完全可行的，苏联人遭受的挫折并非来源于市场所谓的\"原罪\"。只要运用得当，它可以成为振兴波兰经济的一剂良药。\n\n为此，我们将对现有的经济体系进行大刀阔斧的改革：减少国家对市场的干预、对私人经济进行一定程度的扶持、加大劳动力市场的开放程度...也许会有同志质疑这些\"离经叛道\"的举措的可行性，但我们总要有迈出第一步的勇气。前人未曾设想的事业，将在我们手中完成！"
 POL_plan_economy: "中央计划经济"
 POL_plan_economy_desc: "苏联究竟为何会因为一场战争就土崩瓦解？尽管原因是多方面的，但有一点无论如何都不能忽视，那便是经济政策的失误。布哈林认为市场自由化能给苏联经济带来新的活力，但他错了，最后连累整个国家输得一败涂地...血腥的教训向我们证明了，社会主义国家的经济，靠自由手段是得不到发展的，必须依靠中央政府的管控才能有序进步。\n\n委员会的同志们深谙这一真理，因此他们自然不会交出政府对经济的管控权。在新的社会主义波兰，商品生产中的三个基本经济问题:生产什么、怎样生产和为谁生产，都将由政府来解决。政府制定的经济指令将引导市场经济朝我们需要的方向发展，一切生产、资源分配以及产品消费都必须遵循政府预定的计划。也许有些人会抱怨我们对经济的管束过于严格，但我们将向他们证明：这一切，都是为了波兰能有更美好的明天！"
 POL_worker_econ: "人民领导的经济"
 POL_worker_econ_desc: ""
 POL_market_reform: "社会主义化经济"
 POL_market_reform_desc: "\"经济基础决定上层建筑\"，这是马克思主义政治经济学中一条重要的理论.然而，波兰的现状却是：在革命委员会掌权后，建设社会主义的上层建筑理论上已经存在了；但我们的经济体系仍然是由资本市场式的\"无形大手\"推动运转的。如果我们对此视而不见，那么长此以往，社会主义在波兰终将失去生存的根基，我们的革命事业也将早夭。\n\n所以说，现在正是时候，政府\"有形的大手\"必须开始发力了。我们将会加紧发展波兰的国有经济，使其成为支持波兰经济发展的主导力量；集体经济也将是我们重点支持的经济领域，我们将加大它在经济力量中的比重，使劳动者的劳动联合与资本联合能够得到长足发展。当然，一定比例的混合经济也是必要的，这种股份制的资本组织方式有利于规范化企业制度的形成，从而提高企业运营的效益。\n\n不过，只靠纸上谈兵可改变不了事实。说一千道一万，再正确的经济理论也要得到推行才能发挥它应有的作用。委员会已经决定了：召集主管经济领域的各级官员们开展研讨会议，把指示精神传达给他们，让他们抓紧时间加油干。毕竟，在这个波谲云诡的世界，我们要建设社会主义，可没有时间可以浪费。"
 POL_expermental_reform: "实验性改革市场"
 POL_expermental_reform_desc: "尽管我们确立了建设自由市场经济的大方向，但这并不意味着我们要一步到位。过于超前的改革往往会事倍功半，甚至适得其反。因此...经过商讨，委员会的同志们一致决定：市场经济的改革，必须经过试点后才能推广。\n\n那么，试点的地方应该选在哪里呢？对此我们也有了统一意见：经济基础较好的大城市，比如格但斯克和柯尼斯堡，是绝佳的\"试验田\"。这里的经济系统即使在改变运作方式后也能良好运转，当地的相关官员也比其他城市的同僚更容易接受新兴理念，这一切可以很好地助推市场改革的进行。那么，事不宜迟，赶紧将我们的决策下传给当地的同志们执行吧！"
 POL_a_socialist_country: "永恒的社会主义国度"
 POL_a_socialist_country_desc: "终于，在历经千辛万苦之后，我们可以骄傲地向全世界宣告：一个革命的、社会主义的波兰，已经屹立于欧洲大陆之上了！\n\n曾几何时，在国内外，都没有几个人看好波兰的社会主义事业，觉得这注定只是幼稚的黄粱一梦。但革命委员会的掌权向质疑者们证明了，让波兰迈向社会主义，才是波兰人民的真正愿望！在此之后，尽管各类前所未有的风险挑战仍然层出不穷，但我们的同志们在革命理论的指引下，作出了一个个大胆却又正确的决策，把社会主义大道上的所有拦路石一一扫除了！放眼现在的祖国：人民在政治、经济和其他领域，都有了参与权、自治权，以及他们本来就应该拥有的其他权利。曾经这些东西对他们而言可望而不可即，但我们正如传说中为人类窃火的普罗米修斯一样，把这一切从曾经高高在上的官老爷们手中夺过来，送到了他们手中！这是人民的胜利，更是祖国母亲的胜利！\n\n祖国的红旗飘飘，人民的歌声嘹亮。社会主义永远不会辜负波兰，而波兰也永远不会辜负社会主义！我们将把社会主义革命，从高峰推向更高的高峰！"

 #民社
 POL_trust_progressivism: "民主与社会主义？"
 POL_trust_progressivism_desc: "许多坚持社会主义\"正统\"思想的同志认为，传统的民主制度与我们将要建设的社会主义国家，是水火不相容的，必须将其连根铲除。然而，事实真的如此吗？自1918年祖国重获独立以来所建成的政治体系真的已经毫无用处了吗？\n\n答案自然是否定的。在民主制度的框架内为波兰无产阶级、为广大波兰人民群众争取利益，寻求他们生活状况的改善，是完全可行的。为了最大程度团结一切进步的政治力量，我们必须大胆地进行尝试。或许会有人指责我们是社会主义者中的\"异端\"，但那又怎样呢？我们不会过河拆桥，相反，我们会把桥维护得更好，让我们的朋友们都能顺畅地通行。"
 POL_democratic_socialist: "与民主派工党合作"
 POL_democratic_socialist_desc: "在曾经的波兰瑟姆中，除了三大巨头——统一工人党、萨纳齐亚派和蜥蜴同盟——以外，还有一些游走于政坛中心之外的边缘小党派，隶属于民主派系的工党就是其中之一。\n\n就政治影响力而言，他们确实几乎无足轻重。但如果我们要在民主体系中发展社会主义，他们倒是值得关注甚至联络合作的对象。首先，他们活动的根本方向实质上与我们是一致的，都是为广大波兰无产阶级、全体波兰人民谋求福祉。此外，他们在现有体系内进行合法政治运动的经验也比我们丰富。既然如此，为什么我们不可以尝试成为并肩作战的革命盟友呢？\n\n团结一切可以团结的力量，是实现民主的社会主义不可缺少的环节。让我们现在就着手准备向工党的朋友们伸出橄榄枝吧。"
 POL_banzycks_faith: "提拔班奇克"
 POL_banzycks_faith_desc: "\"你了解民主社会主义么？\"如果你向委员会内部的同志们提这个问题，大多数人都会困惑地摇摇头。然而，总有那么些开明的同志会涉足这样的令\"正统思想\"信仰者避之不及的领域，并拥有独到的优秀见解——班奇克同志就是他们中的佼佼者。\n\n一直以来，由于他的\"异端\"主张，委员会内那些拥有精神洁癖的高层都将班奇克排挤在核心圈子之外。但随着时间的推移，以及我国政治生态的改变，越来越多的同志们认识到：班奇克的主张是最适用于新时代的理念。有鉴于此，我们决定把班奇克同志提拔到他所应有的高位，让他能够真正指导委员会的决策，带领我们向民主社会主义的康庄大道稳步向前。或许我们会听到部分顽固分子的抱怨甚至抗议，但我们和班奇克同志都不会在乎这些只会嗡嗡鸣响的蚊虫的。"
 POL_use_council_to_power: "利用部长会议"
 POL_use_council_to_power_desc: "虽然我们已经确立了新路线，但要实际推行下去，还是困难重重。至于困难的来源...正是我们在政府内任职的同志们，确切地说，是反对我们决策的同志们。我们今天传达的改革提议，明天就可能会被他们否决掉。这样一来，我们的事业自然只能原地踏步。\n\n但这一现状并非没有解决的办法，因为我们有一个上好的抓手——部长会议。它在政府官员的安排方面，起着举足轻重的作用。我们可以利用这个重要的平台，将真正支持民主社会主义的同志们安插进政府的关键部门。如此一来，我们旨意的推行将易如反掌。\n\n那么，行动起来吧。是时候踢开那些尸位素餐的饭桶，开始真正的民主社会主义革命了！"
 POL_reform_in_necessary: "削弱官僚主义"
 POL_reform_in_necessary_desc: "尽管是意料之中，但在委员会内部一部分同志中间，官僚主义习气还是十分危险地开始蔓延了！他们在掌握了梦寐以求的职位后，便渐渐放松了自我监督。官官相护、脱离实际、贪污腐败...种种恶习在他们中间屡见不鲜。我们必须意识到，这对我们的事业而言，是致命的危害！如果委员会内都无法落实民主，我们又如何能给整个波兰带来民主？\n\n如果我们不想让我们的民主社会主义之梦早早夭折，就必须对这种现象出重拳！我们将加强对官员恶行的整顿，在规范制度运行的同时加大正确政绩观的宣传。无论如何，每位同志，无论他们的地位、职位如何，都必须坚定最基本的信念：一个民主的、社会主义的波兰，不是为伺候官员，而是为造福人民存在的！"
 POL_say_no_to_radicalism: "对抗激进主义"
 POL_say_no_to_radicalism_desc: "尽管我们已经确立了建设民主社会主义的大方向，但反对分子们尚未彻底死心。哥穆尔卡和帕荣克手下的两班人马，虽然对于建设新波兰的愿景不尽相同，但对我们事业的抗拒态度却是如出一辙。他们不吝惜用最恶毒的语言攻击我们是\"社会主义事业的叛徒\"，鼓吹要进行更进一步的激烈斗争。这帮死脑筋，真是死性不改！\n\n既然他们如此顽固不化，我们也没必要和他们客气了。这些思想激进的所谓\"同志\"将被我们好好敲打一顿：警告、降职，甚至开除出委员会——什么办法我们都能用、都敢用！正如林肯所说，一个分裂的家庭是无法长期存在的。对于一切与委员会最高决策对抗的人，我们只会有两种处理方法：迫使他们服从，或者命令他们滚蛋！"
 POL_incriminate_gomulka: "栽赃哥穆尔卡"
 POL_incriminate_gomulka_desc: "尽管这难以置信，但现有的证据已经表明：瓦迪斯瓦夫·哥穆尔卡——这个向来以\"列宁主义者\"自居、口口声声说要在波兰\"实现列宁同志未竟的事业\"的家伙，其实是不折不扣的独裁者兼反动民族分子！他和他的党派早有预谋，在明里暗里耍花招，排挤、打压隶属于社会党和人民党的委员会成员。他们最终的目的，就是把委员会变成统一工人党的一言堂！\n\n不仅如此，就连统一工人党这个党派本身也不干净！早在总督府被推翻后的初期，哥穆尔卡便趁乱收编了他认为有能力的纳粹余孽，在洗白他们的身份后让他们为自己所用。而现如今，为了拉拢委员会里潜藏的民族主义分子，他甚至向他在蜥蜴同盟内的朋友\"取经\" ，打算通过让他的党改弦易辙来吸引这些败类，最后建成一个波兰式的民社党！\n\n尽管我们尚未完全核实这些这些信息，但有一点毫无疑问：必须把哥穆尔卡这条盘踞在我们身边的毒蛇，连同他所谓的\"统一工人党\"一并清洗掉！我们固然支持民主社会主义，但对待这些邪恶的伪君子，我们绝无民主可言！"
 POL_incriminate_pajak: "批斗帕荣克"
 POL_incriminate_pajak_desc: "安东尼•帕荣克，一个混进革命队伍的软弱派投机分子！当波兰母亲饱受纳粹渣滓蹂躏、众多同胞们齐心协力抵抗暴政时，他和他的社会党却无所作为！为了能苟延残喘，他们长久地向德寇献媚讨好，出卖同志和隶属其他派系但与我们齐心的战士们，就为了能\"合法的\"得到一息安寝！\n\n如今祖国解放了、新的革命开始了，他又带着麾下的无赖们摇身一变，作为\"进步分子\"混进了委员会，打算分走权力的蛋糕——这就是\"波兰社会党\"和他们的党首真正的野心！但我们也不是傻子，他们昭然若揭的心思我们知道的一清二楚！看着吧，我们马上就将在整个委员会内\"表彰\"他们的\"宏图伟业\"，再然后...帕荣克只会有两个选项可以选：要么自己体面，要么我们帮他\"体面\"！"
 POL_form_united_government: "成立联合政府"
 POL_form_united_government_desc: ""
 POL_use_council_to_power_tt: "§Y班奇克将能够利用议会获得更大的影响力§!"

 #激进
 POL_trust_radicalism: "更为正统的路线"
 POL_trust_radicalism_desc: "虽然我们已经建成了红色政权，但更深层次的路线之争却进入了所有人的讨论之中，在由统一工人党，社会党和人民党代表组成的临时革命委员会中，曾经亲密无间的同志似乎已经分成三派。\n\n统一工人党，他们继承了马尔赫列夫斯基和列宁的遗志，在瓦提斯瓦夫·哥穆尔卡的领导下，设想建立一个由工人阶级领导的波兰，作为正统的共产主义者，他们在委员会的支持率最高。\n\n社会党。他们是创始人瓦伦斯基的忠实拥趸，他们反对民族主义与无序的安那其自主主义，他们期望可以波兰的无产阶级做出更大的贡献，他们在委员会的支持率仅次于统工党\n\n人民党，由斯坦基瓦夫·班奇克领导，们的理念相比另外两派添加了不少的自由主义思想，他们希望未来的波兰向自由民主靠拢，他们在委员会拥有的支持者虽然最少，但仍然拥有不小的力量。"
 POL_iron_fist_of_gomulka: "马尔赫列夫斯基之魂"
 POL_iron_fist_of_gomulka_desc: "波兰统一工人党，简称pzpr,领导人为曾经波兰地下国红色政党界的领导者瓦提斯瓦夫·哥穆尔卡。早在德占总督府时期，哥穆尔卡就是波兰地下国三巨头之一了，他作为波兰独立斗争时期红色抵抗力量的领导人，支持率在革命委员会中最高也是不足为奇，当然他所领导的统工党也是最受波兰人民欢迎的政党。哥穆尔卡以列宁主义与共产主义为执政理念，同时也将波兰本土共产主义者的先驱马尔赫列夫斯基的一部分思想做为重要组成部分加入到执政理念中。统工党希望重新振兴波兰工业与农业，让波兰民族重登欧罗巴的舞台的舞台。波兰人民与波兰民族将在工人阶级与统工党的领导下重新崛起。让共产主义事业的轮船重新启航吧！"
 POL_pajak_will_care_this: "瓦伦斯基再世"
 POL_pajak_will_care_this_desc: "波兰的马克思主义在19世纪曾有过一段飞速发展的历史，而瓦伦斯基则其中最为重要的一环，作为波兰革命事业的先驱者，瓦伦斯基认为应当去除波兰革命阵营中的民族主义成分和无政府主义成份，他为波兰社会主义事业的发展做出了无以言表的贡献。他创立的波兰社会党，是现在委员会中支持率第二大的政党。现在的波兰社会党领导人安东尼·帕荣克继承了瓦伦斯基的遗志，将波兰无产阶级劳动人民放在工作的第一位。他的心里只有一个梦想，就是将属于无产阶级的社会主义火种种植在波兰人民的心中。在未来，波兰及其盟友的无产阶级人民将在社会主义思想和社会党的引领下奋勇前行，将革命火种进一步播撒在欧罗巴广阔的大地之上"
 POL_united_nation: "波兰民族的解放"
 POL_united_nation_desc: "在欧洲历史上，我们曾留下浓墨重彩的一笔，波兰翼骑兵曾在波德平原上自由驰骋，波立联邦曾是欧罗巴大地上不可忽视的力量，但这一切都在20年前的那场浩劫中化为泡影，尽管波兰人民为保卫祖国做出了可歌可泣的斗争，但我们仍然没能阻止德国嗜血的战争机器，波兰在短短一个月内便沦陷了，此后的岁月里，波兰人民坠入了万年不复的深渊之中，德国人为了消灭波兰文化，甚至在傀儡国的国名上都取消了波兰这个词，系统性的屠杀和文化灭绝更是随处可见，但即便如此，波兰人民的民族意识仍像点点星火般生生不息，我们在华沙的废墟中崛起，我们在克拉科夫工厂中战斗，波兰民族将像我们的波兰祖国一样永远不会灭亡。现在我们赶跑了德国侵略者，建立了人民政权，我们可以自豪的说:″波兰人民与波兰祖国已经迎来了彻底的解放，波兰劳动人民万岁！波兰祖国万岁！波兰民族万岁！"
 POL_united_and_equality: "公正平等的国度" 
 POL_united_and_equality_desc: "在过去的艰苦岁月里，面对德国纳粹和走狗，我们团结一心，拼死抵抗，取得了独立事业的成功。在此后，我们南征北战，推翻了德国人在东欧的残暴流治。取得了反插法西斯的伟大胜利。在这期间，军队建设长期处于第一位，人民权利的建设大部分时间处于停滞状态，现在我们该为一直支持我们的劳动人民去做点该的的事了。我们将落实人民的投票权力，基层工作人员将深入波兰的农村与工厂。让广大的劳动人民也享有投票的权利，让公平公正的理念在所有波兰人的心中生根发芽，我们将在通往社会主义乌托邦的路上更进一步。波兰劳动人民的地位将得到史无前例的提升"
 POL_victory_of_radicalism: "马克思的追随者"
 POL_victory_of_radicalism_desc: "在过去的岁月里，波兰人民曾深陷在总督府的残暴统治之下，波兰人民为了那一丝微弱的自由火种而苦苦支撑。在那黑暗的岁月里，是马克思主义给我们指明了方向，是共产主义给予了我们反抗的力量。因此我们才度过了二十多年的艰苦岁月，让我们的波兰祖国重获新生。事实证明，只有共产主义的红旗才能使我们重新振兴波兰，只有伟大的马克思主义的号角才能让波兰人民重新获得解放。我们应该在社会各界宣扬马克思主义的精神，让共产主义深入每个人的心中。尤其是在学校中，有些学生，特别是有十三四岁，刚进入中学的新生，因为年龄和阅历的关系，让他们对马克思主义在国家独立事业中发挥的贡献并不了解。有些学生因为听到了一些别有用心的宣传，甚至开始在学校里反对共产主义。这种问题不只在学校中，在社会各界中也有存在，我们应该加强宣传力度，让人民了解到到共产主义深层次的意义与对波兰的贡献。我们还可以趁此机会在学校内落实马克思主义的教育政策和提升教育水平的改进计划。"
 POL_bring_liberal_to_polish: "痛击社会主义的叛徒"
 POL_bring_liberal_to_polish_desc: "临时革命委员，会由统一工人党，社会党和人民党组成。统工党与社会党都是无产阶级领导的人民政党，至于为什么会让人民党这个向自由主义妥协的进步主义政党进入委员会中，是因为在与那些资本主义者和民族主义者作斗争时，我们的力量并不足以完全确保我们能取得胜利，需要去团结一切可以团结的力量，去对付共同的敌人。现在我们该和这个社会主义的叛徒说再见了，虽然这会导致我们在委员会损失一些支持者，但在这种关于国家政治路线的问题的重大问题上上，这种损失可以接受。"
 POL_polish_communism_route: "新生的人民共和国"
 POL_polish_communism_route_desc: "在波兰的历史上，人民的地位和权利从未如此之高，人民安居乐业，国家实力强盛。最为重要的是，我们波兰祖国摆脱了德国纳粹和资本主义的压迫，建成了真正属于波兰劳动人民的共产主义政权。波兰这片土地上曾有过无比辉煌的历史，虽然有过三次灭国的悲惨经历，但现在这些已经是过眼烟云了，我们应该带领波兰人民看向未来。波兰祖国需要一个与共产主义意识形态相符合的国名，或许以曾经给无产阶级带来一丝曙光的苏联的名称来命令我们的祖国是一个不错的选择"
 POL_polish_socialistic_republic: "人民为先"
 POL_polish_socialistic_republic_desc: "过去，波兰的广大无产阶级劳动人民时刻处于剥削者的压迫之下，他们有的是德国法西斯主义者，有的是波兰的资本家，有的是旧王朝的统治者，他们的区别只有对波兰劳动者压迫力度的轻重。经过我们艰苦的斗争，他们都已被波兰的社会主义者和无产阶级联合消灭。现在我们新生的社会主义共和国需要一个新的名字，一个对得起广大劳动人民对波兰革命的贡献的名字。波兰是属于劳动人民的波兰，而波兰人民共和国这个将人民放在重点的名字很适合我们现在的情况。"
 POL_criticize_democrats: "抨击自由派"
 POL_criticize_democrats_desc: "最近在波兰的大街小巷中，出现了一种人，他们手拿传单，宣传着一些所谓\"自由\"的思想。自由不是坏事，但如果是过度的不可控的自由就极有可能会对我们的波兰祖国造成不可逆的严重伤害。自由就像一直在大海中航行的船，有舵手掌控方向时，船可以在海上安稳的航行。但如果没有没有舵手的掌控，船就会像一只无头的苍蝇一般胡乱航行，航向未知的深渊。自由就像这只船，只有受控才能稳定。我们应该发动一切力量，去打击这种乱象。将自由掌握在人民的手中。"
 POL_criticize_mild_socialist: "拒绝软弱手段"
 POL_criticize_mild_socialist_desc: "革命不是请客吃饭，革命是不能妥协的，只有毫不留情的消灭一切危害波兰社会主义革命的敌人，才能使我们的社会主义祖国永远不会像二战时那沦为德国纳粹和资本主义国家绥靖政策的牺牲。只有雷厉风行了，强硬手段才能使我们某些意志不坚定的同志不受资本主义的影响，保证其对共产主义事业的忠证，能否确保共产主义与马克思主义在波兰处于领导地位便是关键。"
 POL_criticize_gomulka: "批评反动力量"
 POL_criticize_gomulka_desc: "虽然明面上的反动派已经被消灭干净，但在暗处的反动分子仍然存在，在临时革命委员会内外，反动力量暂时隐藏起来。力量较大的反动派已经被剿灭，剩下的只是一些臭鱼烂虾罢了，但是他们仍然可能会对波兰对国家安全造成威胁。当然也有一些反动力量隐藏在革委会和三党内部。我们应当发表一些文章去批判他们，让这些人民的敌人只能在阴沟里如同老鼠般瑟瑟发抖，不敢再对我们的波兰做祖国有什么造次。我们应该广而宣之，让所有人都知道反动分子有可能藏在任何地方，这些文章将会在群众和委员会内部引起巨大的反响。"
 POL_socialist_heaven_in_europe: "筑起社会主义乌托邦"
 POL_socialist_heaven_in_europe_desc: "曾几何时，波兰人民曾有一个梦幻一般的愿望，盼望将波兰建设成属于劳动人民的乌托邦，期望波兰祖国的孩子不论是在华沙的楼宇间还是在普瓦维的乡下农舍里都能受到平等，完善，充实的教育。梦想所有的劳动人民都可以在社会主义理念的指导下热情的建设祖国。梦想波兰的人民可以自由的生活在的会主义的红旗之下。现在我们可以自豪的宣布，波兰人民已经在社会主义理论指导下，实现了这个看似完不成的梦想，建成了独属于劳动人民的乌托邦。波兰人民将在波兰母亲的庇护下自由，和谐，平等的安然成长。波兰将会成为全世界所有无产阶级和革命人民的灯塔，照亮人民前进的道路！"
