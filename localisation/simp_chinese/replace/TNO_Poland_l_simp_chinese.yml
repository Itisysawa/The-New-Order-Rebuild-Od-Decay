 POL_lowest_salary: "确立最低工资"
 POL_lowest_salary_desc: "虽说企业和个人将重新开始掌管工厂的运营，但我们也断不能忽视工人的正当权益。我们是民主的社会主义政党，我们的背后是千千万万的工农百姓，若是他们在我们的时代中还活得不如从前了，那我们的政权，岂不是和先前统工党人的一样，沦为了彻头彻尾的谎言了吗？\n\n不能再有贫民窟了，不能再有无止境的压榨了，一个人工作一整天换来的报酬还不够他/她填满肚子，这种荒唐的事情不能再发生了。企业和民族资本家们，我们把波兰工业的复兴交给了你们，但有一个前提：绝对不能让我们的工人同胞们再挨饿了。我们将在财政报表上画上一条红线，不会有任何人的报酬低于这根代表着温饱的生命线了；只要一个人参与了他份内的工作，我们就不能让他饿死，这是天经地义，不证自明的公理。"
 POL_social_Welfares_for_best: "社会福利带动民生"
 POL_social_Welfares_for_best_desc: "有人说，市场经济的本质便是弱肉强食，你死我活。有多少人飞黄腾达，功成名就，就有多少人为之陪葬，如堕地狱。他们还会问道：这样残酷的情形，难道不正是与我们的社会主义理想背道而驰吗？\n\n他们只说对了一半。是的，传统意义上的市场经济的确如此，但他们忽视了来自政府的推动。为什么一定要有人成为个别人成功的垫脚石呢？我们政府可以让他们拿出点钱给大家兜底嘛。社会福利——就叫这个名字，它可以让他多数人都过上温饱的生活，让弱者不至于被抛弃，也不像计划经济、大锅饭那样打压个别领先者的前行的步伐。相比于统工党一刀切式的公有化政策，资本家们肯定更愿意接受我们的折中要求；同时，人民也能享受医疗教育住宿等诸多福利，自然也会为之而欣喜的。实现复兴的路上不需要一起踢正步，但也不能让人掉队——那么，就让我们的社会福利去润滑这贫富的差距，创造一个万众康乐的新波兰吧！"
