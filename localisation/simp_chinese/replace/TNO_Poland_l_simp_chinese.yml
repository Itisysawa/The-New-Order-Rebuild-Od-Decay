 PWJ_students_and_star_of_revolution_desc: "由于前\"大日耳曼国\"伪政权的打压，德意志街头巷尾的不同阶层难以接触到共产主义这种意识形态。因此，能够接触到共产主义思潮或是学说的，只有那些知识分子、那些学生。他们从不同的书籍中了解共产主义，最终成为一名又一名革命斗士。正如书记梅茵霍芙所言：\n\n§V\"阶级斗争的发展将要贯彻游击队思想，一个社会主义战士的死重于泰山，一个资本家的死轻于鸿毛。\"§!"
 PWJ_overheated_revolution: "过激的革命"
 PWJ_overheated_revolution_desc: "然而，也正是因为RAF的主要成员都是学生，因而导致了他们对革命的幼稚病，以及对实际情况缺乏认知。这也就是为什么，这场革命之中出现了一定程度的过激，如若它们不能及时刹住车的话，那么激进主义将会彻底摧毁这场革命。\n\n§V\"抗议是当人们说：这事我不喜欢；反抗是当人们说：这事我不允许；抵抗是当人们说：这事我要阻止。\"§!"
