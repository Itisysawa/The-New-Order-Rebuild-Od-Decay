 socialist_polish_socialism_subtype: "波式社会主义"
 socialist_polish_socialism_subtype_desc: "回望早在1892年就于巴黎成立的波兰社会党，波兰社会主义在半个世纪中经历了无数挫折和迷茫。在纳粹的暴政下延续至今，残存的波兰社会党和一部分波兰共产党温和派联合在一起，重组了波兰社会党。\n\n该政党强调波兰的自由为首要目标，在资本主义的社会构建下慢慢走向社会主义，相对于波兰共产党来说，波兰社会主义理念更为温和，他们拒绝更多的革命流血，也对社会的局面上更倾向于妥协。\n\n在对于旧时联邦，波兰社会主义者一直有一个丰满的\"普罗米修斯\"理念，让弱小的民族集体独立，只是在当今之下，普罗米修斯的火焰将在纳粹的毒手之下黯然无光，只求他们的一丝之薪......"
