 before_wsw.10.t: "基建遭到破坏"
 planning_for_uprising_warplan: "规划第二次华沙起义"
 planning_for_uprising_warplan_desc: "在1956年华沙起义中，波兰人民损失惨重：城市被铲平，人民被屠杀...然而这一些报复性的打击不能阻止我们，更不能阻止波兰人民对于自由与解放的向往，我们将会对未来进行规划，准备好迎来再一次的解放。"
 POL_prepared_army_in_zamosiki_tt: "§Y起义时，扎莫希奇的部队将会跟随卢布林部队行动§!"
 POL_distribute_supply: "分配起义物资"
 POL_distribute_supply_desc: "我们正义的斗争需要充足的粮食，饿着肚子是没法打仗的！1956年起义失败的原因就包括了对粮食的错误分配，准备充足的时间去收集粮食，稳定军心吧！"
 POL_contact_npl_army: "联系\"新波兰\"军队"
 POL_contact_npl_army_desc: "虽然曾经被认为是俄国的走狗，但他们一样是我们的同胞，我们需要他们的支援，于是，\"死亡赛车手\"可以承担这个任务\n新波兰的部队将陆续地支援我们，只要他们得到消息，且一切顺利..."
 POL_scare_them_hard: "打草惊蛇"
 POL_scare_them_hard_desc: "德国人对总督府不稳的惊恐已到达了一定期限，他们早已对我们充满了恐惧，我们可以通过抢夺，暗杀，粉刷起义标示来让他们处处设防，摧毁他们的心理防线！"
 POL_gun_production: "握住我们的步枪"
 POL_gun_production_desc: "\"诶，步枪啊，你是多么可爱啊，我愿与你同死相依，作为我爱你的标志，我会给你更多的呵护。\"\n一首歌唱步枪的歌曲在我们军中流传开来，而我们将会扩增地下枪械生产线，坚持战斗！"
 POL_tks_ready_tt: "§Y我们将会得到持有TKS的小队支援§!"
 POL_tks_troop: "波兰现代枪骑兵之梦"
 POL_tks_troop_desd: "说实话，以我们这些连手榴弹都难自我补给的秘密军工厂来说，造坦克简直痴人说梦，我们找到了一些战前的tks小坦克，其造价极其便宜。即使其装甲作战能力很差，但至少对付步兵我们有优势了。"

############波兰总督府开局介绍###########



 GGN_CountryInfo_Folder.101: "德意志的铁骑"
 GGN_CountryInfo_Content.1: "§d德属§!§b\"总督府\"§!"
 GGN_CountryInfo_Content_desc.1: "§o德国§!希望毁灭掉波兰文化，将波兰的土地并入自身，同化这里的波兰人；于是，德国在前波兰地区成立了总督府，由§o汉斯·弗兰克§!在此上演着其血腥统治。\n\n§o汉斯·弗兰克§!开始了其的雄心勃勃的计划，象征波兰文化的一切被焚烧，波兰人全部被赶入血腥工厂去工作，十四小时无薪资的强制劳动下，纳粹在贪婪地吞噬波兰人的生命...\n\n是可忍，孰不可忍。面对德国在§V西俄罗斯战争§!的节节败退，§s科莫罗夫斯基§!在§V华沙§!发动了起义：以华沙起义冠名的，一场极为惨烈的战争，即使§V起义军§!差点就打进了§q克拉考§!，但一切都于事无补。§V起义军§!的攻势迫使§o汉斯·弗兰克§!急电向柏林祈求支援，臭名昭著的迪勒万格旅和卡明斯基旅投入了战斗，三个月之后，起义随着国家军的彻底崩溃结束了。\n\n§o汉斯·弗兰克§!宣布§x毁灭§!华沙，至此，波兰人骄傲的§x华沙城§!只留下了几座血腥工厂和战争留下的瓦砾，还有潜藏于地下的波兰人们所落下的眼泪..."
 GGN_CountryInfo_Folder.102: "阴暗面之下"
 GGN_CountryInfo_Content.2: "腐败与地下国"
 GGN_CountryInfo_Content_desc.2: "虽然在汉斯·弗兰克的报告之中，§b总督府§!已经成了§o\"日耳曼化\"§!最为成功的殖民地，但纸面的数据真的能证明什么吗？只有确切相信表面工作的人才会相信这样的鬼话。纳粹当局的腐败行为，走私的情况早已是司空见惯；走私的商人们出售着蛋、奶、猪肉、香肠，甚至还有美国的可乐。那群德国军官却选择为那丝毫的利益而视若无睹，那面§x万字旗§!已经被油水沾污得毫无生气了。\n\n§V波兰§!灭亡了，但是幸存的波兰人们组建了一个庞大的地下组织，对此，无能的§q汉斯·弗兰克§!竟然全无所知。\n\n在战争中溃散的波兰家乡军以及国家军在日积月累下，逐渐恢复了些许元气；但通过这次惨烈的起义他们明白了一件事：仅凭他们根本不可能战胜德国人，于是他们又联同从事社会主义道路的，§V哥穆尔卡§!带领的§V人民军§!，甚至前§b民族激进阵营§!的反动武装——§b蜥蜴同盟§!的波兰民兵一道，将一枚巨大的炸药包埋在这位所谓\"国王\"高贵的城堡下，只等燃爆的时机...\n\n是§o汉斯·弗兰克§!的统治稳固如从？还是波兰地下国会踊跃而起？每人都在等着那微妙的转折点...\n\n§x前进，决定你的命运！§!"
 GGN_CountryInfo_Content.3: "灾难与过往"
 GGN_CountryInfo_Content_desc.3: "在那1939年，§V波兰§!遭受了再一次的§x灭顶之灾§!；§e苏联§!与§b德国§!的两面入侵导致了波兰继§a波兰-立陶宛联邦§!时期以来再一次的灭国，人事已尽，但天命却难违...但即便如此，兴许波兰已然不存在于地图之上，但其子民的故事尚未结束：§V波兰§!的人民们仍在进行着其抵抗，其坚不可摧的意志为§b总督府§!带来了各种麻烦。\n\n1956年，正值§e西俄战事§!持续，§b德国§!混乱的后方深陷战争泥潭，各种的指挥混乱，作战命令难以传达等情况披露，而§d家乡军§!趁此机会发动了一项规模浩大的军事行动—那便是所谓的§Y\"华沙起义\"§!，§d家乡军§!趁此机会于§V华沙§!以及周边区域发动了大规模攻势，由于一切来得太过于快以至于§b德国§!没反应过来，大量领土被§V波兰§!人们再次收复，但此时却有一噩耗传来：§e西俄罗斯革命阵线§!于战争之中开始崩溃。这导致本应疲弱的§o国防军§!得到了喘息的机会，而他们趁此机会镇压住了§V华沙§!的起义者们。在这场战事后，华沙被夷为平地，仅剩少数的§x波兰奴隶§!与§x血肉工厂§!伫立于此。\n\n时隔多年，如今已是1962年，总督府的局势看似愈发缓和，但殊不知：一场§Y猛烈的风暴§!正在袭来；§x那是复仇的旋风...§!"
 GGN_CountryInfo_Content.4: "§d波兰的国家军§!"
 GGN_CountryInfo_Content_desc.4: "§d波兰国家军§!从未停下其战斗的步伐，自从前任元帅爱德华·雷兹-希米格维不知去向起，瓦迪斯瓦夫·西科尔斯基宣布在伦敦组成流亡政府，继续率领波兰部队继续战斗着。\n\n在§a盟军§!于非洲战役被§U沙漠之狐隆美尔§!决定性地挫败后，§d西科尔斯基§!秘密前往了§e苏联§!，试图请求§X布哈林§!释放在苏联侵占波兰时所俘虏的军人以组建新部队。事与愿违，§X布哈林§!的部队在德意志的猛攻下兵败如山倒，有谣言传§X布哈林§!的政敌§e约瑟夫·斯大林§!枪毙了这些波兰战俘，§d西科尔斯基§!不愿接受这个事实，这间接导致了§a伦敦§!方面和§V华沙§!方面的§g家乡军§!的分裂。\n\n1943年，在§d西科尔斯基§!面见在巴勒斯坦战斗的§d波兰国家军§!之时，其座机的坠毁却致使§V波兰§!的§Y复国英雄§!§x停下了战斗的脚步。§!§a美国§!已经放弃了§d国家军§!，绝望的§d国家军§!要么加入§m法国解放力量§!的西非部队，要么在新任领袖§d科莫罗夫斯基§!的领导下重返东欧，开展其于德属殖民地的游击。\n\n即使面对如此困局，§d波兰国家军§!依然是§V波兰部队§!中最中坚的一股力量，面对屡次挫败，一股重返王国时代的风潮悄然酝酿着，不过，目前最重要的是，驱逐这群§x入侵者§!，重返§V波兰§!的§Y自由§!。"
 GGN_CountryInfo_Content.5: "§V人民的军队§!"
 GGN_CountryInfo_Content_desc.5: "§V波兰人民军§!在无数被§b德国§!奴役的§V波兰劳工群体§!中受到广泛支持，他们秉持着解放波兰人民、为波兰带来平等与自由的理念长期潜伏在§b克拉科夫§!的隐蔽角落:不管是街头巷尾，还是下水道，亦或者是在哨站，§V人民军的将士§!贴着一张又一张印有§V马克思§!，§V恩格斯§!和§V列宁§!的传单。§o汉斯·弗兰克§!当局对日渐躁动的局势很是头疼，§e共产主义§!思潮在§b克拉科夫§!的人民心中点燃斑斑§V星火§!，纳粹的末日仿佛即将到来。\n可是事情并没有如同设想中那样顺利。倒回到1956年，东方战火连天，德国无暇顾及§b总督府§!的事务，各类§V波兰抵抗组织§!纷纷举起义旗反抗奴役他们的§o纳粹分子§!。克拉科夫，利沃夫，华沙，卢布林等等城市几乎同时爆发§V抗议与暴动§!，轰轰烈烈的§Y华沙起义§!爆发了。然而，自由童话在绝望中§a书写§!，又在绝望中§X落下帷幕§!。§E西俄罗斯革命阵线§!的攻势逐渐§e减弱§!，§o德国国防军§!在镇压了§I党卫队§!夺权后又将视线瞄准§V波兰§!，国防军士兵的军靴踏碎了波兰的每一寸土地。也就是在这悲伤的1956年，波兰又一次化为血海，§V人民军§!也不得不再次转入地下，重新开始了他们的工作。在§V波兰§!的山林之间和城市废墟中，§V人民军§!的将士们四处袭击德国士兵，抢劫军火库，突袭工厂拆走器械，这令波兰总督——§b汉斯·弗兰克§!皱起了眉头，也带来了对波兰人民越发血腥的报复。\n兜兜转转，已是1962年，克拉科夫的局势越发黑暗，汉斯·弗兰克的统治越发松动。或许这是第二次机会，一个不会再现1956年华沙起义失败的机会。\n\n§x马克思列宁主义的星火，将点燃人民的愤怒。§!"
 GGN_CountryInfo_Content.6: "§b复仇的欲望§!"
 GGN_CountryInfo_Content_desc.6: "§x绝密§!"
 GGN_CountryInfo_Content.7: "§d思乡之情§!"
 GGN_CountryInfo_Content_desc.7: "虽然§V波兰§!又一次陨落了：§a盟军§!完了，甚至§b西科尔斯基§!将军也§x战死§!了，但§d家乡军§!仍在人间。即使§d国家军§!陷入了混乱，但§d菲尔多夫§!仍然率领着§d家乡军§!在战斗。\n怀旧空吟闻笛赋，到乡翻似烂柯人。迎接他们的只有§o总督府§!的棍棒与子弹。折翼的白尾雕不得不暂停飞翔，§d家乡军§!转入了地下，进行着敌后抗战，令德国驻军苦不堪言。\n\n然而哪怕是如此境地，§d抵抗军§!内部依然出现了内讧。§d西科尔斯基§!曾是§d家乡军§!与§d国家军§!之间的重要纽带，而在他于中东地区坠机身亡后，总部位于罗马的§d国家军§!和身处总督府的§d家乡军§!便大小摩擦不断，本就心生嫌隙的双方最终在1948年彻底决裂。\n\n在苦苦支撑到五十年代后，东方的§e苏军残部§!似乎带来了祖国涅槃重生的希望。§b德军§!在前线溃不成军，而后方也同样乱作一团。眼见时机似乎已经成熟的§d家乡军§!也同其他专员辖区的抵抗组织一样发起了起义。\n1956年，§d家乡军§!发起的§Y华沙起义§!§x失败§!了，受挫的§d家乡军§!实力大减，不得不寻求与其他势力的联合——§V人民军§!和§b蜥蜴同盟§!。§d国家军§!最终也放下成见，与§d家乡军§!携手共进，加入了§d波兰地下国§!的序列之中。\n即使身临如此困局，终有一日，§d波兰家乡军§!将在§d菲尔多夫§!将军的带领下击碎德国的枷锁，将自由带回祖国波兰。那时，§d白§!与§V红§!的旗帜将随风飘扬。"
 
