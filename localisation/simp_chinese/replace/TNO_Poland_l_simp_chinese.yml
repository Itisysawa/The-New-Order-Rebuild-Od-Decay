 POL_Wladyslaw_Gomulka:  "瓦迪斯瓦夫·哥穆尔卡"
 POL_Wladyslaw_Gomulka_desc: "瓦迪斯瓦夫·哥穆尔卡于1905年出生于加利西亚的一个无产阶级家庭，14岁便跻身于革命运动的行列当中。当时，即便是面对着萨纳齐亚的打压，他也不惜冒着坐牢的风险投身于革命事业。\n\n二战爆发后，波兰在德国的进攻下沦陷了，但抵抗却从未停息。他所领导的统一工人党下属的波兰人民军早在1940年便成为了最活跃的游击组织之一。随后的1943年，他更是凭借着个人能力大幅度扩张了波兰人民军的规模，领导着人民军成为波兰地区左翼抵抗运动的中坚。在他的带领下，人民军的力量愈发壮大，并在西俄战争期间达到了鼎盛；他估计怎么也想不到，自己长久以来的努力居然真的得到了如此的回报。最终，他凭借着自身才能，在部长议会中成为了影响力最高的人物，成为了波兰人民共和国的总书记。 \n\n然而，放眼当下，波兰却是问题重重：因为那场规模巨大的战争，波兰燃尽了所有力量。现在留下的却是一片千疮百孔的废墟：经济崩溃、物价暴涨、社会动荡，甚至西线德国的余孽还在对波兰虎视眈眈着。他明白，自己必须为祖国带来迅速而有力的改革，才能让灾厄不再二次降临于波兰......"
 POL_Antoni_Pajak:  "安东尼·帕荣克"
 POL_Antoni_Pajak_desc: "安东尼·帕荣克生于西里西亚的一个名为贝斯特维纳的小村庄，自幼便在矿山与工厂中历练自己。作为当地的社会民主党员，也曾投身于约瑟夫·毕苏斯基领导的波兰军团，又在奥地利军队中参与一战并负伤。自此他便明确了自己的志向——要为波兰人民谋求平等与幸福。\n\n波兰独立后，阅历丰富的他决定加入波兰社会党，出任报刊编辑，投身组织活动，在战争残疾人协会中表现活跃。波兰遭遇德国入侵后，他和家人被迫搬到了加利西亚地区的斯卡拉特。在该地被红军占领后不久后，他就被当局流放到西伯利亚，后被逮捕并逐出苏联。遭遇同志背叛又亲眼见证了祖国再度灭亡的他选择加入了波兰流亡政府，与奥古斯特·扎莱斯基的团队创立波兰社会主义者联盟。\n\n兵过如梳，1956年的宏大起义招来德国人的血腥报复再次割痛了伤痕累累的波兰祖国。但坚毅的波兰人民依旧在冥冥中寻求希望。如今，时代的接力棒交付到了帕荣克的手上。当问起“要往何处走”，他仿若能看见1863一月起义期间满志踌躇的红党领袖，听见振聋发聩的《告波兰人民宣言》。"
 POL_Stanislaw_Banczyk:  "斯坦尼斯瓦夫·班奇克"
 POL_Stanislaw_Banczyk_desc:  "若用一个词语概括斯坦尼斯瓦夫·班奇克，那“民间运动的积极分子”再不为过。1920年在他的家乡利比舒夫组织农村青年圈，参与了消费者合作社运动。接受了马克思主义教育的他又曾担任过罗兹省人民党的省委员会委员，为多篇杂志撰稿，后组织罗兹人民阵线，为罗兹省的农民罢工做了充足准备。\n\n波兰沦陷后，他又加入罗兹省人民运动领导组织，会见瓦迪斯瓦夫·哥穆尔卡，呼吁波兰人民党和波兰工人党进行会谈。总督府掌权期，他随其支持者在地下试图建立自己的农民政党，未果后进入波兰人民党，获得波兰流亡政府的联系，自身流居美国，加入波兰裔美国人大会为波兰运动谋求资金。在美经历丰富了他的思想内涵，不甘罢休的自己势要将自由与社会主义写在红旗的两面，而千百万人民要作这旗手，让独立与解放的光芒再度绽放于波兰、东欧、乃至全欧罗巴的大地上。\n\n1956年起义之际，这位革命运动的佼佼者启程返乡，组织党内工作。起义虽终以失败告终，可人头易落、仇怨难散。当受尽欺辱的波兰人民养兵蓄锐、厚积薄发之际，人民的怒火又将以何种形式喷涌而出？世界风起云涌，波兰境内愤语嚣暴。历史给了班奇克这样的机会，他会给出历史以自己的答卷。"
