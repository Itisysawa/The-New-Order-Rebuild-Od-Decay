 belarus_completed: "我们已然平定白罗斯"
 POL_belarus_militia_TT: "§Y我们将会解锁决议以在白罗斯招募民兵§!"
 POL_belarus_militia: "鲁塞尼亚民兵团"
 POL_belarus_militia_desc: "为了应对兵员数量问题，我们将会提供部分装备给东波兰军区，随后让他们在白罗斯一带招募民兵团，而这批民兵将会随着波兰军人一同奔赴前线对付波兰的宿敌。"
 belarus_militia: "鲁塞尼亚志愿军"
 civil_armes: "民兵团招募计划开始"
 POL_civil_armes: "民兵招募计划"
 POL_invit_belarus_militia: "招募鲁塞尼亚民兵"
 POL_invit_ukrainian_militia: "接纳乌克兰民兵团"
 POL_ukraine_militia_TT: "§Y我们将会获得决议在西乌克兰招募民兵§!"
 POL_ukraine_militia: "乌克兰民兵团"
 POL_ukraine_militia_desc: "随着乌克兰内战的爆发，乌克兰展出了强烈的反德情绪，而在内战中也有着不少的民兵团出现。虽然他们也许有不同的目的，但终究是为了反抗德国人的统治，我们可以利用这一情绪去对付德国人。"
 the_duty_of_us: "波兰已然控制住东欧局势"


 ###########派系转线国策树文本###########


 POL_strengthen_the_edge: "陷入分裂"
 POL_strengthen_the_edge_desc: "随着我们境界的逐渐稳定，家乡军与人民军却因为政治诉求不同而最终陷入了决裂，双方对于法案都有不同的看法；政府陷入了混乱之中 \n\n而在这样的前提下，一次特殊的临时政府选举开始了；波兰公民将会选出派系以确立下一名领导人是谁"
 POL_national_defensive_budget: "国防预算"
 POL_national_defensive_budget_desc: "为应对未来潜在的风险，我们将会加大对陆军预算的投入，在争取更高军费的同时确保军备能够充分得到保障，这样的军队才能够好好保护我们的国境。"
 POL_improve_military_production: "扩增军事生产计划"
 POL_improve_military_production_desc: "为应对接下来的战争，我们需要更多，更强大的军事物资生产体系。而我们会将目前所有的民用工业生产暂缓，等到一切平定下来后再进行合适的军事改革调整"
 POL_military_industrial: "华沙兵工厂"
 POL_military_industrial_desc: "德国的威胁尚且存在，我们并不能掉以轻心，眼下的军事生产能力实在太过薄弱，如若我们只以此羸弱的军工体系进行武器补给生产，那么抵挡德国简直是痴人说梦。 \n\n我们将会在华沙将更多的民用工业纳入军工生产范畴之中，以确保我们的武器产量，补给等..."
 POL_peoples_army: "前途未明..."
 POL_peoples_army_desc: "随着蜥蜴联盟，及其背后的民族激进阵营彻底脱离波兰政府的管辖，这个三方组建起的临时政府正式宣告了其崩溃。这个新生的，脆弱的联盟终究是没经受住考验。目前，波兰人民军为求自保亦脱离了波兰政府的管制，并且在国会之中对临时政府动议了不信任投票，波兰的命运又应该何去何从呢？现在，只有时间得以回答这个问题......"
 POL_ROD.4.t: "谁才是人民的领袖？"
 POL_ROD.4.d: "随着左翼在波兰的影响力不断扩增，左派在波兰取得了胜利，但如今由谁来领导波兰呢？不同的派系对于波兰的未来都有不同的看法，包括忠于马列主义，来自波兰统一工人党的瓦迪斯瓦夫·哥穆尔卡；力求民族解放的波兰社会党书记，安东尼·帕荣克；领导着人民阵线的精神领袖——斯坦尼斯瓦夫·班奇克；以及争取劳工自由的齐格蒙特·穆赫涅夫斯基。 \n\n他们各自有着不同的政治主张，也领导着不同的党派，相信接下来的选择将会影响到波兰的未来...以及波及到国防事务。"
 POL_ROD.4.a: "当然是瓦迪斯瓦夫·哥穆尔卡！"
 POL_ROD.4.b: "安东尼·帕荣克才是波兰人民的领袖(待完成)"
 POL_ROD.4.c: "斯坦尼斯瓦夫·班奇克将带领我们进步！(待完成)"
 POL_ROD.4.e: "齐格蒙特·穆赫涅夫斯基将为波兰带来解放！(待完成)"
 resister_of_polish: "不屈的抵抗者"
 POL_underground_handmade_guns: "地下枪械工坊"
 POL_underground_handmade_guns_desc: "由于德国人的占领，波兰大多军备都是由地下作坊制作而成；虽然这使得制作成本大打折扣，并且生产效率大大提升，但却使得我们的军备不太可靠...庞大的数量换来的却是较低的可靠性，但也别无他法，毕竟武器有总比没有好"
 general_secretary_of_polish: "改革派"
 POL_exhausted_arms: "疲惫之军"
 POL_exhausted_arms_desc: "常年的反德游击运动使得家乡军连饭都吃不上，疲惫不堪，老兵的损失也让士气大损，如若军中反战情绪持续高涨，那么这支军队将会难以抵御外敌的入侵"
 POL_disorganized_army: "无序之军"
 POL_disorganized_army_desc: "即使临时政府有着大量的救国志士充当军队，但即使不说军事素养参差不齐，军队之中也有着意识形态之争。各个派系之间经常发生正面冲突，如若我们不能调和军队之间的宗派主义，那么这对我们的反法西斯运动将会是一个威胁"
 POL_disorganized_army_2: "暂缓冲突"
 POL_disorganized_army_2_desc: "尽管心怀不满，但大敌当前也不得不低头。各派系的战士们将暂时放下宗派主义，统一对付我们当前的大敌——德意志人们。"

 POL_social_problem: "动荡与不安"
 POL_social_problem_desc: "自德国于1939的占领开始后，便试图将波兰民族的存在抹除，进行所谓的日耳曼化以同化我们；事实证明他们低估了波兰人民抵抗的决心，如今波兰焕然一新，而我们自然也需要在动荡不安的社会重新建立起人们对于民族的自豪感... \n\n§Y我们会将属于波兰的荣耀带回波兰！§!"
 PSPR_supports_rise_tt: "§V人民军§!§Y的影响力将会§!§K上升！§!"
 PSPR_supports_dec_tt: "§d家乡军§!§Y的影响力将会§!§K上升！§!"
 request_labour_freedom: "为劳工，争自由"
 request_labour_freedom_desc: "长期以来，波兰人一直被德国人当成奴隶奴役着，如今终得自由，左翼党派将会以此进行一系列的社会改革，为人民带来真正的解放。"
 POL_build_up_school: "建设国立学校"
 POL_build_up_school_desc: "自日耳曼人对波兰的净土展开的长达将近三十年之久的占领以来，他们便使用着由德国人，或是总督府所审查过的教材毒害新一代的波兰青年，妄图将波兰的概念模糊化。 \n\n但波兰可不会这么轻易的在历史的长河中被抹除，青年们应有更美好的前途，而这便是为何我们应当重新设立国有学校，强调民族的概念"
 POL_solve_economic_crisis: "税收难题"
 POL_solve_economic_crisis_desc: "毫无疑问的，在汉斯·弗兰克的高压统治下，波兰被摧残得极其不像样；而我们的经济也由于各种的重建工作而引致一定程度的倒退，为此我们将提高我们的税率，否则以如此的经济我们只会陷入赤字的难题之中"
 POL_slowly_regenerating_economy: "陷入停顿的经济"
 POL_slowly_regenerating_economy_desc: "自汉斯·弗兰克开始了他的统治后，总督府的状态每况愈下，波兰人民的生活苦不堪言；内战过后更是一团糟，如若临时政府不能解决经济问题，那么这势必导致局势动荡"
 POL_AK_solution: "菲尔多夫的方案"
 POL_AK_solution_desc: "为了避免财政危机，家乡军派系将会选择征收广泛群体的税项——那便是所得税，从工人的手上获得更多的资金，为此对抗争做好准备"
 POL_PA_solution: "左派阵营的计划"
 POL_PA_solution_desc: "对于财政危机的应对方案，人民军抱有和家乡军相反的意见；对于商人与企业进行更高的费用征收，让工人不至于在如此环境下被压得喘不过气"
 POL_WARSAW_city_at_war: "要塞城市—华沙"
 POL_WARSAW_city_at_war_desc: "作为波兰的首都，此城市却与德国相邻，只有建立起更坚固的防线才能将德国人彻底拦在华沙之外；但毕竟是缺乏物资，我们并没有如此强大的工业实力来使用大量防空炮，我们将会把华沙重新设计为巷战城市，以便日后抗德战争中的抵抗"
 POL_administry_usage: "任用官僚"
 POL_administry_usage_desc: "在如此境况下，单靠政府薄弱的力量完全不足以管理好波兰的土地，此时官僚便展示出了其价值；短期之内如果要解决地区治理问题，任用官僚将会是最佳的办法。"
 POL_researching_official: "研究设备革新"
 POL_researching_official_desc: "良久以来的地下运动致使我们大多数科技水平都远远落后于我们的敌人，对此，我们需要会加大投入科研的资金，在翻新我们科研设施的同时为科研家们提供更好的研究环境，同时对于军事工厂的投入加大以确保我们的生产能力"
 POL_rebirth_of_POLAND: "波兰的新生"
 POL_rebirth_of_POLAND_desc: "市场在一系列的改革下踏上了恢复的漫漫长路，如今一切消费品生产与经济总算恢复了活性，这意味着：波兰距离恢复繁荣与稳定的目的也越来越近了，终有一天波兰将会再次于国际上亮相"
 POL_reconstruction_plan: "加固维斯瓦河防线"
 POL_reconstruction_plan_desc: "如今初步的经济规划与社会重建已然完成，而我们亦将砥砺前行，加快重建波兰的进度，并且沿着维斯瓦河流域筑起一道坚固的防线，以确保面对德国人的入侵我们能够有足够的力量抵抗来敌 \n\n§x波兰曾两度灭亡，我们绝对不会让1939的灾厄重现§!"
 POL_Vistula_miracle: "维斯瓦河奇迹"
 POL_Vistula_miracle_desc: ""
 POL_reconstruction_planning: "要塞化城市"
 POL_reconstruction_planning_desc: "为了日后能够抵御德国的入侵，我们将会对全国的城市进行翻新并且重新设计，让不同的城市都能更适配巷战地形，以至于能够我们的游击队如鱼得水"
 POL_reconstruction_plan_tt: "§Y我们将沿着边境以及维瓦斯河畔修筑起堡垒§!"
 POL_harsh_enviroment: "我们的处境"
 POL_harsh_enviroment_desc: "由于我们的地理位置实在是太过尴尬，这导致仅凭单打独斗我们毫无胜算；如此的处境下，只有寻求接触周围的国家寻求和解和支持才是明智之举。 \n\n这也是我们解决外交难题的唯一解法，而在我们的南边是团结协定的前成员匈牙利与罗马尼亚，我们可以试试与他们和好，并在日后通过黑海接触地中海国度"
 POL_supporting_hun_tt: "§Y我们将会寻求改善与§!§U匈牙利§!§Y的外交关系§!"
 POL_supporting_ROM_tt: "§Y我们将会寻求改善与§!§L罗马尼亚§!§Y的外交关系§!"
 POL_cavalry_better: "翼骑兵传统"
 POL_motorized_troop: "机械化\"翼骑兵\""
 POL_Road_to_Mediterranean: "德国之敌，波兰之友"
 POL_Road_to_Mediterranean_desc: "在控制住乌克兰之后，我们便有了通往黑海的稳定道路，通过此契机我们可以试着与土耳其，意大利以及伊比利亚等前三头同盟成员交易，甚至可以试着让他们派出志愿部队支援 \n\n当然，前提是乌克兰这一战略要地在我们手上"
 POL_TUR_guns: "土耳其枪械购入协议"
 POL_TUR_guns_desc: "枪械乃是现代战争中不可或缺的一环，而离我们最近的地中海国度——土耳其便是一个有能力大规模生产的国家之一；我们可以利用如此的地理优势从土耳其购入更多的步兵装备 \n\n天赐良机，这也可以拉近我们和土耳其的距离"
 POL_ita_trucks: "意大利摩托化装备采购"
 POL_ita_trucks_desc: "摩托化装备亦是战争中的重要一环，强大的摩托化步兵与摩托化运输设备能够确保我们前线的战士有足够的机动性与补给；缺乏补给将使我们寸步难行，于是我们将会从意大利购入一些摩托化装备 \n\n反对德国人的皆是我们的盟友"
 POL_iberian_friends: "伊比利亚火炮购置"
 POL_iberian_friends_desc: "伊比利亚正是因对抗德国而将西班牙与葡萄牙合二为一，而如今经济陷入停滞，甚至有一定程度上的危机；通过火炮购置，这将刺激他们的重工业与经济发展，同时也可以为我们带来足够的重火力装备 \n\n这是一种双赢的交易，何乐而不为呢"
 POL_bulgarian_support_eq: "保加利亚支援装备"
 POL_concile_relations_of_rom_hun: "罗匈矛盾调解"
 POL_concile_relations_of_rom_hun_desc: "为了避免祸及日后的边境安全，我们应当避免罗马尼亚和匈牙利爆发正面冲突，否则他们的其中一方很可能加入团结协定；同时，我们也可以从中获利，从双方购买军备与资源 \n\n总比两败俱伤后为我们树立敌人要好"
 POL_ROM_HUN_war_supporting: "煽动罗匈战争"
 POL_hun_and_rom_guns: "匈牙利与罗马尼亚军备"
 POL_rom_side: "站在罗马尼亚一方"
 POL_hun_side: "站在匈牙利一方"
 POL_rebirth_of_sanaji: "萨纳齐亚的新生"
 POL_rebirth_of_sanaji_desc: "纳粹的铁蹄和苏联的背后一击撕碎了我们领袖留下来的宝贵遗产，萨纳齐亚，纵观二十年之来，错误并不在萨纳齐亚本身，而是站前我们对大战的粗心估计，为了维稳阵线，避免让亡国命运再次笼罩在波兰民族上空，我们必须重建萨纳齐亚统治，而菲尔多夫，务必成为波兰独立以来第二伟大的人。\n\n国家军和家乡军已经在白红旗帜下重新独立下来，只是人民军依然怒斥我们为\"法西斯主义\"，为了波兰，我们可以进行利用国父的社会主义倾向缓和一下他们的矛盾。\n\n§Y萨纳齐亚之鹰再次翱翔而起，这一次，他不会为此折翼§!"
 POL_belarusian_problem: "东方领问题"
 POL_belarusian_problem_desc: "东方领，这个德国人缔造的丑陋怪物，一直以来\"不知疲惫\"地榨取波罗的海人民的价值。而现在既然我们来了，就不会放任这个罪恶的\"血肉工厂\"继续运转下去。\n\n然而，关于东方领未来的命运，我们内部却出现了分歧：许多人坚持既定的方针，即攻占东方领全境，将纳粹渣滓的势力连根铲除。但同时，有人却提出了新的观点，即尽可能争取和平解决。他们指出，东方领有一位可以争取的潜在合作者——兰德鲁特。比起他的人渣\"同志\"们，他的态度相对更加温和。如果我们能说服他与我们合作，或许就可以用最小的牺牲换取最大的收益...\n\n最后的时刻即将到来，我们必须尽快决定我们的解决方案了。"
 POL_commissaire_politique: "勇猛的政委"
 POL_commissaire_politique_desc: ""
 POL_organize_p_idea: "团结人民"
 POL_organize_p_idea_desc: ""
 POL_set_up_council_tt: "§Y波兰将会设立瑟姆以应对接下来的难题...§!"

