 destroy_their_building: "策划行动\"贝洛伯格\""
 destroy_their_building_desc: "奥斯维辛之中还有着大量的波兰同胞，如果能够救出他们，那么对于我们的使命而言也就多出了一份力量。为此，皮莱茨基将军策划了一次劫掠行动，他亲自进入了奥斯维辛摸索其内部构造，囚犯位置等资讯，待皮莱茨基准备好后便会发动这次行动..."
 mot_weap_theft: "我们偷到了10套摩托化装备"
