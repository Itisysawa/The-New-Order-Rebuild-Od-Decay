 load_PZPR_focus_tree: "加载哥穆尔卡阶段国策(调试用,别点)"
 ###人民波兰(新)###
 POL_paternalism_1_party_GM: "波兰统一工人党 - 温和派"
 POL_paternalism_1_party_GM_long: "波兰统一工人党 - 温和派"
 POL_continue_agriculture_reform: "延续农业改革"
 POL_continue_agriculture_reform_desc: "在经过了德国人长达20余年的奴役之后，波兰终于再次挣脱枷锁，但战争的痕迹非一时就能抹去，德国人的残酷武器不止破坏了基础设施，更污染了土地与人民生存的根基，为了让我们的下一代不至饿死，我们必须做出行动。\n\n哥穆尔卡总书记对于国家的农业现状有深刻的认识，我们将做出土地分配计划，原先被德国人圈占的土地和那些卖国贼与合作者占据的土地将首先被收归国有并分配给无地农民。同时为了解决城市与全国不同地区的需求，我们还需要集体化来强化对农业的控制，尽一切可能提高我们的粮食产量。我们相信，在哥穆尔卡总书记的宏伟蓝图实现后，在每条街道上将不会再看见因断粮而死的饿殍"
 POL_industry_re_startup: "工业再起步"
 POL_industry_re_startup_desc: "众所周知，工业发展水平是衡量一个国家国力的重要标准。而如今波兰的工业...好吧，如果算上零零散散的小工坊，那我们倒还是有点微薄的工业底子。但既然现在波兰已经是个新生的独立国家了，那又怎么能依靠工坊式的“工业”来发展国家？尽管条件十分艰难，我们还是要把振兴工业提上日程。开办工厂、招收工人、培养工业人才——一切有助于工业复苏的项目，我们都要大胆地投资。这样，日后我们才能得到更大的收益"
 POL_strategic_resources_plan: "战略资源开采"
 POL_strategic_resources_plan_desc: "经历了激烈的民族起义和对德自卫反击战后，我们虽然捍卫了国家安全，但军队的消耗也让我国的战略资源储备几乎见底。好在，大地母亲给予了波兰数不清的馈赠：卢布林的煤矿、下西里西亚的铜矿、卡托维兹的铅锌矿...如果我们不好好利用这些“宝藏”，那我们一定会沦为全世界的笑柄的。如今，我们勤劳的工人们已经奔赴祖国各地，按照党的要求开始夜以继日地在矿洞里开采资源。希望他们能给我们带来好消息！"
 POL_new_nationalized_factories: "重建与重设国有工厂"
 POL_new_nationalized_factories_desc: "在第二共和国时期，波兰的国有工业在各个领域都得到了蓬勃的发展。然而，当这片土地被德国佬接管后，我们的建设成果要么被他们掠夺，要么索性被毁灭，这也给我们现在的重建带来了极大的困难。好在，党的领导让我们能够集中举国之力，在一片废墟之上把昔日服务于国家各行业的工厂重建起来。当然，这些工厂建成后还是要由国家来管理的。毕竟在现在的波兰，比起市场，政府更明白人民更需要什么。"
 POL_new_and_good_socialist_state: "初步工业重整规划"
 POL_new_and_good_socialist_state_desc: "在政府采取了一系列专门举措后，波兰的工业终于有了些许起色。不过，总书记指出了一个问题：针对工业未来总体的发展方向，我们还缺乏有效的规划方案。这可是真正的要事，毕竟一直走一步看一步可不是长久之计。只有制定放眼大局的指导方案，我们才能行稳致远。自然，这个方案是要包含许多东西的：新工业区的地区安排、新的工业生产方式和组织形式，以及企业在工业化中的角色安排...我们有太多的事情要考虑，而时间又是那么的紧张。所以，把工业部门的同志们都叫来吧，我们可有不少事要讨论呢.."
 POL_Jedrychowski_plan: "叶德里霍夫斯基方案"
 POL_Jedrychowski_plan_desc: "对于接下来的经济重建计划，我们的经济部长斯特凡·叶德利霍夫斯基颇有见解。\n在经济重整上，他打算采纳更深度集中化的经济体系，如国立农村，国有化工厂等经济政策。而为了进一步加快重整，他也将采纳更为激进的方案，即便这意味着可能会为我们带来一定程度的风险，但为了迅速的发展，一切都是值得的，不是吗？"
 POL_black_soil_exploit: "黑土壤开发"
 POL_black_soil_exploit_desc: "从维斯瓦河平原、波莫瑞和卢布林地区起，向东延伸至波利西亚与加利西亚的国家边界，波兰的国土上分布着广袤的黑土，这些富含有机质的土壤尤其适合种植小麦与马铃薯，如果得到充分开发，不仅足够养活全国的人口，还能够为我们创造一笔不小的外汇。在第二共和国时，萨纳齐亚政府就已经从外国引入机械设备与化肥来开发这些广袤的处女地，但德国人的入侵使得一切都化为灰烬。\n\n现在，哥穆尔卡总书记无比重视这些优质土壤的再次开发，认为这是能提高我们国家农业生产力的重要举措，我们将集中部分资源投资这些土地，并在这片土地上重点试验我们的集体农庄与机械化生产，同时面对黑土地低洼易涝的特点，我们将组织本地的灾民开建基础水利工程，将这片土地的水土条件进一步改善。很快，在波兰国家的广袤黑土上，将生长出一望无际的金黄麦田。"
 POL_reclamation_those_wastelands_idea: "开垦荒地"
 POL_reclamation_those_wastelands: "开垦荒地"
 POL_reclamation_those_wastelands_desc: "波兰有着肥沃的国土，但我们的前辈农民们并不知如何利用，他们似乎只要耕种早已开垦的那些土地便已满足。那些森林与沼泽、以及波罗的海畔的盐碱地，几百年来就这样一直可悲的荒凉着，只有野兽在其间出没。\n\n但今时不同往日，我们的旧日农田遭到了德国佬的严重破坏，甚至有的土地被他们的化学武器污染，面对着农业生产的危局，我们必须使用更加激进的策略。\n\n根据哥穆尔卡总书记的指导，我们将组织部分失去土地的难民以及我们的退役士兵进入荒地进行开垦，通过修建水库来改变沼泽地，通过施加石灰来改变盐碱地，而森林则更加简单，砍伐下来的木头将成为新定居者的房屋。通过这样的方式，我们将获得更多可耕作的土地。虽说长期内会造成环境问题，但为了波兰国家总体的福祉，我们现在必须做出一些对未来的牺牲。"
 POL_ask_for_agriculture_support: "农业求援"
 POL_ask_for_agriculture_support_desc: "虽然我们做了诸多的努力，但是短期内仍然无法改变我们粮食短缺的现实，为了确保我们的人民不至饿死，我们将向我们的各路盟国们寻求支持。\n\n乌克兰乃是欧洲的粮仓，在先前的战斗中他们与我们并肩作战，我们的特使已经前去基辅，通过双方协议从乌克兰的广袤平原上调集粮食过来。\n\n意大利政权虽与我们观念不合，但在独立战争时给予了我们支持，我们在罗马的代表已经在向他们的领导人寻求援助与专家支持，虽然价格不菲，但我们依然需要他们的支持与帮助。\n\n波兰红十字会在整个占领时期一直在维持着运行，并秘密帮助着我们的抵抗战士，通过他们我们将向国际红十字会请求援助，那些留在海外的波兰侨民们同样可以通过这个渠道帮助他们的国内同胞。\n\n其他的手段我们也要应用尽用，面对人民的生存危机，我们唯有倾已所能、无论影响。"
 POL_communist_interim: "共产主义过渡期"
 POL_communist_interim_desc: "眼见着祖国逐步从战后的衰败一步步走向复兴，党内的许多乐天派同志已经开始畅想波兰彻底建成社会主义，然后迈向全新的共产主义社会的明天了。不过，哥穆尔卡总书记站了出来，他指出：波兰从建设社会主义到建设共产主义，中间需要一个长久的过渡期。在这期间，经济、军事和文化等方面的变革仍然需要稳扎稳打地进行。开展工作时盲目的冒进倾向，对我们的事业是有百害而无一利的。比起在办公室里做白日梦，各位同志更应该到农场、工厂和集市去，自己去看看社会真实的现状，听听人民真正的呼声。"
 POL_nationalization_those_companies: "国有化企业"
 POL_nationalization_those_companies_desc: "如今在政府的鼓励下，许多大大小小的新生私企有如雨后春笋般在波兰接连开办。就结果而言，它们确实有力促进了波兰战后的经济复苏，为国家经济持续发展提供了有力支持。不过，并不是所有企业都适合由私人掌控。至少诸如交通、金融和国防等关系国家前途的关键领域，企业还是要置于国家的掌控下的。当然，比起习惯横征暴敛的德国人，我们的政策自然要温和得多：政府工作人员将与企业家会面，向他们普及建立社会主义经济制度的重要性，以及未来将给他们带来的利好。同时，诸如公私合营、金钱赎买等措施，也能减少企业由私有转向国有化的阻力。至于我们的最终目的，就是要让国家真正成为经济的掌舵人。"
 POL_agriculture_cooperative: "推动组建国营农场"
 POL_agriculture_cooperative_desc: "兴许有人会问:\"如何最大程度地提高农业生产效率？\"\n相较于个体农户的小规模生产，对于急需要迅速恢复的波兰农业而言，国营农场这种大规模的生产更能够促成农业的恢复。这也可以为我们提供稳定的粮食来源。先是设立一个生产额度需求，再通过政府部门去配合监管和进行管理......不论如何，国营农场的存在都是利大于弊，因此哥穆尔卡将会大规模推动组建起国营农场，以保障没人会再因农业问题饿肚子！"
 POL_polish_fiat_cars: "国有化波兰菲亚特汽车"
 POL_polish_fiat_cars_desc: "说到知名的汽车品牌，你会想到什么？是德国的大众，美国的福特还是日本的丰田？好吧，不得不说，在汽车制造领域，“阳光下的土地”终究还是由仅有的几个超级大国占据着。但是，难道不那么起眼的国家——比如现在的波兰——就没有自己的汽车代表作吗？不，同志，我们有的！菲亚特汽车就是我们在国际汽车界最亮眼的名片！\n\n是，我们承认，菲亚特比起其他老牌车型还有很大的差距。但至少对波兰人民而言，它无论是在质量方面，还是性价比方面，成绩都格外出色！如今，菲亚特已经不仅是一个汽车品牌，它更象征着波兰人迎难而上、艰苦奋斗的坚毅精神！同胞们，如果你或者你身边的人需要一辆代步车，请务必支持属于波兰的菲亚特！"
 POL_katowice_industrial_area: "放眼工业重心区域"
 POL_katowice_industrial_area_desc: "试看今日的波兰，工业化的浪潮已经席卷了整个国家。无论是在城市、市郊还是乡村，都可以看到正在热火朝天劳动的工人同志们。不过就像处理国家发展的其他问题一样，社会主义波兰要彻底实现工业化，还是要从重点入手——确切地说，是从具有工业发展优势的重点地域入手。尤其是在工业区的选址方面，那些具有区位优势的地区应该被重点关注。毕竟，只要出发点选好了，我们要实现目标将会事半功倍。"
 POL_specialized_production: "专门化生产"
 POL_specialized_production_desc: ""
 POL_mechanization_of_agriculture: "机械化生产"
 POL_mechanization_of_agriculture_desc: ""
 POL_solve_hyperinflation_problem: "物资短缺"
 POL_solve_hyperinflation_problem_desc: ""
 POL_adjust_the_price: "按需分配"
 POL_adjust_the_price_desc: ""
 POL_Communalization_progress: "公有化进程"
 POL_Communalization_progress_desc: ""
 POL_new_zloty_system: "发行新兹罗提"
 POL_new_zloty_system_desc: "让哥穆尔卡大为头痛的是，常年的纳粹搜刮和地下国接近崩溃的经济信用，兹罗提体系已经差不多算是不存在了，不过为了挽救经济，经济部长（叶德里霍夫斯基）想到一个绝好的决议，政府决定发行新兹罗提，1新兹罗提可以兑换旧兹罗提100，用来快速消除经济的影响。\n\n虽然这是一种勒紧皮带的行为，但是我们也只能指望这个国家市场的机器中润滑油足够用了..."
 POL_reform_and_opening_up_but_pol: "重建所须的开放"
 POL_reform_and_opening_up_but_pol_desc: "虽然我们很排斥我们周围不老实的邻居们，介于意识形态和我们逐渐在东欧的脚跟，那些资本主义国家们又开始了他们高贵的步伐。\n\n不过，革命是艰巨的，在发扬现代革命之前，我们必须进行一系列的开放市场......虽然这被认为是\"向资本主义低头\"，管他呢，抗德独立战争的时候，谁管这步枪是美利坚资本主义还是意大利法西斯的呢？"
 POL_field_in_central_poland: "改革农业生产合作社"
 POL_field_in_central_poland_desc: ""
 POL_import_italian_machine: "进口意大利机械"
 POL_import_italian_machine_desc: ""
 POL_ind_and_agriculture: "基础建设以旧换新"
 POL_ind_and_agriculture_desc: ""
