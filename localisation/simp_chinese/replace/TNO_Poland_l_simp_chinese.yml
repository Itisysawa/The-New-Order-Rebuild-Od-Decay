 PWJ_ulrike_meinhof: "乌尔丽克·梅茵霍芙"
 PWJ_ulrike_meinhof_desc: "乌尔丽克·梅茵霍芙于1934年之末出生于奥尔登堡，她的父亲在1940年因胰脏癌去世，而在1936到1940期间，他的父亲在加入了纳粹党后成为了耶拿市博物馆的馆长，并将数百件现代艺术作品以\"堕落艺术品\"的名义交给了纳粹政权，这让梅茵霍芙自幼便看不起他的父亲。在父亲去世后，她的母亲也紧随其后在1949离世。她母亲的朋友收养了她。\n\n时值1958年，梅茵霍芙接触到了德国共产党(KPD)，由于父亲的所作所为她本就对国家社会主义持反对态度，于是她毅然决然地加入了德国共产党。在这个地下组织的协助下，她熟读了《共产党宣言》，《资本论》，甚至是在黑市寻到的毛泽东选集。她意识到了德意志政权的腐败性，以及纳粹帝国那令人感到恶心的罪行，于是联同其他学生组织，如安德烈亚斯·巴德他们，共同组建了红军派——一个试图宣传反法西斯意识的群体。\n\n起初，她们只是到处发传单，以及贴海报与宣传共产主义。但长期以来的无用功，以及施佩尔和鲍曼对学生声音的无视，导致红军派的走向一度变得激进。他们开始进行武装斗争，在德意志南部省份进行城市游击战，最终一切在1965年迎来了转机。\n\n波兰的崛起摧毁了德意志的纳粹政权，德国逐渐陷入混乱，此刻的她也知道机会来了。红军派的众人控制了斯图加特，并准备将革命带到整个德意志..."
