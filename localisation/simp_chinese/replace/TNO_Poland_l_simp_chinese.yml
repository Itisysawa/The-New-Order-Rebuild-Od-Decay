 GGN_strange_place: "荒诞之地"
 GGN_strange_place_desc: "随着第二次世界大战中波兰的沦陷，德意志的铁靴践踏在本应该属于波兰民族的土地上，本应重获自由的民族就此锁上枷锁，新生的总督府奴役着这里的人、掠夺着这里的资源，仿佛要把这里变为日耳曼人的土地。 \n\n距离总督府的成立已有十余载，此处的局势却依旧动荡，波兰家乡军的反动势力依旧影响着我们政权的稳定，他们在全国各地发动着恐怖袭击，而汉斯·弗兰克下定决心要打击这股恐怖势力，于是他决定在总督府的首都——克拉考，进行一次阅兵，以展示总督府的力量，让那群反动分子为之一颤。"
 GGN_1962_parade: "克拉考的1962阅兵"
 GGN_1962_parade_desc: "随着阅兵的日子到来，阅兵的地点被选在了奥斯维辛集中营附近，这里曾是关押并且清剿我们敌人的地方，汉斯·弗兰克前往了奥斯维辛发表演讲。总督府军队排成队列，迈着整齐的步伐... \n\n与此同时，他还准备了一番特别的表演：以集中营里的波兰人为靶子进行了一次实弹射击演习，屠戮着此处的波兰人，以此让其他人感到恐惧..."
 GGN_repress_reactionary_power: "镇压反动力量"
 GGN_repress_reactionary_power_desc: "自从阅兵仪式后，波兰的局势稍稍稳定了下来，或许是波兰人已然受我们的力量所震慑，也可能是家乡军势力在筹谋着什么，但汉斯·弗兰克还是更愿意相信前者，目前一切安好又怎会出什么问题呢？不过保险起见，汉斯·弗兰克还是决定执行计划以铲除潜在反动派"

 GGN_polish_genocide: "肃清反动分子"
 GGN_polish_genocide_desc: "对于目前仍然生存于总督府的波兰人中，有着不少都还抱有复仇的想法，而我们要做的便是肃清这群反对派，在全国上下杜绝这种思想的蔓延；我们将会在总督府的控制范围内进行对波兰人的清洗，以确保此处的纯净。"
 GGN_strengthen_blue_police: "强化海军蓝警察"
 GGN_strengthen_blue_police_desc: "海军蓝警察为波兰总督府的辅警力量，早在第二次世界大战期间便已成立。而他们的强处不仅仅是执行保护公共安全的任务，他们也有着出奇强大的查抄走私力量。 \n\n对于打击波兰地下国的抵抗组织，这是一股不可多得的资源，我们可以好好利用一番，同时我们也会配给更精良的装备给予这群海军蓝警察。"
 GGN_whats_next: "前途未明"
 GGN_whats_next_desc: "当希特勒被刺杀而命不久矣的消息传到波兰之时，全波兰人民都震动了。底层的奴工为这个暴君遭受的报应而欢呼，而殖民而来的德国人则忧心忡忡，潜藏在地下的抵抗组织已经开始蠢蠢欲动，而克拉科夫总督府的高层官员则忙的焦头烂额。游击队的袭击开始变得频繁，维护治安的军警开始在大街小巷中巡查，一股压抑而焦躁的气息开始在全波兰蔓延，全波兰人都在等待着那一刻，所有人都在为之准备着。当命定之时到来，他们将共同决定波兰的命运。"


