 ##更多决议##
 POL_revo_council: "临时革命委员会"
 POL_revo_council_desc: "经过长久以来的斗争，人民军还是获得了最终的胜利。随之而来的却是：因失去共同敌人而导致的政局不稳；在其他派系被打倒后，各派系之间的裂痕逐渐扩大。\n其中，§X瓦迪斯瓦夫·哥穆尔卡§!所领导的§X波兰统一工人党§!\n§V安东尼·帕荣克§!为首的§V波兰社会党§!和\n§C斯坦尼斯瓦夫·班奇克§!所领导的§C波兰人民党§!为主要派系。\n他们的分裂势必导致互相抨击，到底会鹿死谁手呢？时间将揭露一切...\n\n目前，\n§X波兰统一工人党§!的影响力为[?PZPR_aff_leftist]\n§V波兰社会党§!的影响力为[?PPS_aff_leftist]\n§C波兰人民党§!的影响力为[?PSL_aff_leftist]"
 POL_social_liberal_market_idea: "自由市场与社会主义"
 POL_socialist_market_idea: "社会主义化改造"
 POL_socialist_market_idea_desc: "在战时经济终于得以终止后，我们迫切需要重组起一个新的经济架构。按如今波兰的局势来看，貌似如此的计划经济已经是最好的选择，我们会试着国有化德国企业或是别的市场，以确保能够迅速建立起社会主义经济架构。"


 ####哥穆尔卡阶段####
 POL_gomulka_start_focus: "新任总书记"
 POL_gomulka_start_focus_desc: "经过长久的斗争后，威胁到波兰正统共产主义路线的敌人们皆被哥穆尔卡的铁腕所扳倒。为了打倒这群共产主义的叛徒，新任总书记哥穆尔卡可谓用尽九牛二虎之力；在这次的斗争中，哥穆尔卡以他过人的才智成功获得了部长会议中各党派人士的认可，以他巧妙地手段获得了人民与各派人士的信任，最终登上了波兰第一总书记的位置。\n\n在这次斗争中，他成功击溃了反动的波兰人民党与波兰社会党。现在，波兰统一工人党大权在手，各界对于哥穆尔卡可谓万众瞩目；新的总书记能否让外界看到他的政治才能呢？时间将证明一切..."
 POL_start_first_four_y_plan: "推行首个四年计划"
 POL_start_first_four_y_plan_desc: "自波兰人民革命的成功以来，波兰的经济需要一场迫切的改革，战时经济与德国人入侵带来的损害无一不为我们的重建工作与经济留下隐患。波兰的工业早在50年代的华沙起义中便被夷平，仅有的是战时留下那点少得可怜的工厂，其余的不是在扫荡华沙时被毁坏，便是与德国人的战争中被摧毁。至于波兰的农业，那更是惨不忍睹，农业方面在第二共和国时期本就不容乐观，在战争与德国人的摧残下更是聊胜于无，使得我们需要重度依赖乌克兰的农产品，我们迫切需求一场改革。\n\n这也是为什么，我们的总书记，瓦迪斯瓦夫·哥穆尔卡会选择学习昔日的邻居，苏维埃社会主义共和国的五年计划。只有这样系统性且迅速的变革才能挽回这糟糕的经济，而我们坚信，在波兰人民的团结下，维斯瓦河的奇迹将会重现..."
