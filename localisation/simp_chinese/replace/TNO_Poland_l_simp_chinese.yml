 POL_pileski_government: "临时维稳"
 POL_pileski_government_desc: "在经历了与萨尔斯基的勾心斗角后，白鹰的最终守卫——皮莱茨基，也还是战胜了那群残杀自己人的疯子：萨尔斯基受到公审，蜥蜴同盟的高层被尽数处决，民族激进阵营再度非法化...\n\n一切都在再次步入正轨，皮莱茨基将军暂时登上了这权力的宝座。他不想成为独裁者，也不会成为一名独裁者，他只想维护好当前的局势，同时寻找一名适宜的领导人人选。待时机合适的时候，也就是如他所崇拜的先总理毕苏斯基一般治愈好祖国的伤口后，交权给那位顺位者。\n\n到那时候，老将军也算能够安享晚年了。"
 POL_consider_next_leader: "尚无交权之人？"
 POL_consider_next_leader_desc: "然而，这条路注定不会这么好走的。当初萨尔斯基掌权的时候，上位的第一件事却是狠狠地背刺那些在抗德战争中奋不顾身的家乡军，人民军亦未能避免于难。他的所作所为导致了一系列的权力真空：当他想要寻得一位适宜交权者的时候，却发现，自己所信得过之人都在萨尔斯基的清洗中牺牲了。\n\n尽管如此，过渡政府的状态也不可能长久。为此，皮莱茨基会试着接触新生的自由派，以及那群自我宣称为\"改革派\"的君主派。\n\n\"祖国的命运将会如何？\"而他现在也站在历史的交错点之上，稍有不慎便粉身碎骨。至于那个问题，就交给未来回答吧！"
 POL_armia_krajowa_remained: "自由的波兰"
 POL_armia_krajowa_remained_desc: ""
 POL_another_new_choice: "另一条道路"
 POL_another_new_choice_desc: "要如何才能团结起绝大多数的波兰同胞，而不是像蜥蜴同盟那样党同伐异？这是最令皮莱茨基头疼的问题。然而，在某一天翻阅波兰史籍的过程中，他突然找到了一个未曾设想的答案：恢复君主制。是啊，历史上的波立联邦，曾经创造过多么令人赞叹的宏图伟业，至今仍然令许多波兰人深感自豪。而联邦之所以能收获此等辉煌，难道不是和拥有英明的君主息息相关吗？\n\n当然，也许那些“进步”的自由派会抱怨这是开历史的倒车。但如果一种政治制度能够凝聚人心、唤醒波兰人的民族自豪感和自信心，那么又何必在意这种无伤大雅的小细节？更何况，君主制和君主专制从来不能画上等号，这一点对于波兰的君主派人士而言，是最明白不过的了。如果皮莱茨基给他们一个舞台，也许，他们真的有机会缔造一个自由、团结而强大的波兰君主国？"
 POL_old_general: "将军迟暮"
 POL_old_general_desc: "1918年，一名年轻的小伙子入伍了。他为了自由的波兰而战，痛击了布尔什维克的霸权，想必当初的他也不会想到，自己竟会成为拯救祖国的英雄。\n\n时间转眼过去，已是1940年，他孤身潜入奥斯维辛，再是建立地下情报网络，多年以来他未曾懈怠，再是参加了1955的华沙起义，还有接下来的德波战争，反萨尔斯基斗争......\n\n如今回想起这些，但他却早已年华老去。也许，他早已活成了心目中那位伟人的模样，为波兰的自由与独立而战。将军已然累了，为祖国兢兢业业奋斗四十余载，寻找继任者这桩事已然刻不容缓，谁知明天会不会出什么差错呢？"
 POL_dissolve_secret_police: "废除秘密警察"
 POL_dissolve_secret_police_desc: "在萨尔斯基夺权后，短短百来天的时间他竟杀了数以十万，甚至是百万计的波兰人。在此期间，他设立了秘密警察大规模搜捕并处决家乡军的成员或前成员。只要是与家乡军有关联的，甚至是曾接触过家乡军的人都会被\"清洗\"。利用着这种连坐法，他铲除了不少异见者。他所犯下的罪几乎无异于当初的德国人，唯一不同之处在于他自己也是波兰人，而他却对同胞痛下杀手。\n\n如今，这名历史的罪犯被公审，蜥蜴同盟也就随之垮掉了，但这群秘密警察却未解决。为此，皮莱茨基决定废除秘密警察，解散民族国的余孽。"
 POL_end_the_faith_crisis: "根治旧病"
 POL_end_the_faith_crisis_desc: "兴许有些人会认为，波兰在这次大战中也是赢家，实则不然。经过大战后，政局不稳的可不止德国一个。在如此短短不到十年间，波兰经历了一次又一次的政治斗争。先是两次的华沙起义，德意志霸权的破灭，再到萨纳齐亚的回归，最后再到萨尔斯基、还有现在的皮莱茨基......\n\n一次又一次的内讧与政权交替让波兰内部早已不再团结，经过萨尔斯基的清洗后更是雪上加霜。各派为了自己的些许利益不惜大打出手，在皮莱茨基将军掌权后才稍微改善。动荡的政局让波兰人民早已开始对政治体现出冷感，但我们将对他们保证，一场变革即将到来。"
