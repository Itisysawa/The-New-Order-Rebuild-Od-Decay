 POL_uprising_preparing: "起义准备度"
 POL_uprising_preparing_desc: "面对§o德国人§!的强权，波兰人从不畏惧，§Y波兰也从未灭亡。§!\n在我们准备好揭竿起义之前，工欲善其事，必先利其器；我们将会在总督府境内发动不同的行动以削弱其势力，壮大我们自身体量，以此达到最终的使命。\n而目前，同志们对于§W起§!§V义§!的准备度为§Y[?Preparing_for_uprise]%§!，当其达到§Y100%§!时，我们便可以伺机发动§V第二次华沙起义§!"
 Preparing_for_uprise: "抢掠军火"
