 POL_ROD.14.t: "人民军推翻家乡军政权！"
 POL_ROD.14.d: "随着德国战争以德国的落败而落下帷幕，波兰共和国内的派系之间关系也愈发紧张。在战争结束后十余天后，波兰人民军（Armia Ludowa）趁着与德国交战时积累了大量的威势，随后在战后推翻家乡军（Armia Krajowa）的治理。波兰共和国的其余派系就此宣告瓦解；共和国陨落，人民共和国成立。\n\n然而，新生的人民共和国也并不安稳。在统一工人党掌权后，这一阵线便迅速坍塌。统一工人党的民粹派与温和派宣告与统一工人党割裂，并组建了波兰人民党与波兰社会党。统一工人党就此事件强烈谴责，表示他们成为了革命的叛徒。即便如此，三党对峙的局面还是已成定局。\n\n为了应对此一局面，三党在谈判后成立了部长议会，以此调停党派之间的纠纷，同时在这段时间内决定出最后的总书记是谁。"
 POL_ROD.14.a: "为你的命运前进吧，人民共和国！"
