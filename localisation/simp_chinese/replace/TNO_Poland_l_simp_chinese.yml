 civilwar_of_ger: "德意志二次内战"
 civilwar_of_ger_desc: "德国国防军不可战胜的神话已经被打破，波兰人民团结起来阻止了铁流东进，而国防军也在华沙前线吃了大亏。停战协议的落实，让德国内部种种问题被无限放大，不满纳粹统治的人民纷纷起反旗，国防军陷入分裂，在血液的腥味与硝烟弥漫中，纳粹新秩序悄然落幕。等待德国人民的，是民主和秩序，还是屠戮或湮灭？"

 POL_sacred_war: "欧罗巴解放战争"
 POL_sacred_war_desc: "那流血与正义的斗争已然到来，他们想我们血流成河；他们想让这里尸横遍野；他们想玷污 £TNO_game_rule_flag_POL  §V波兰§!祖国的圣地...\n\n同志们，我们又如何能容忍这群德意志人再次踏上波兰的净土呢？现在，保家卫国的时候到了。我们还能容忍这群德国人再次掠劫波兰的一土一木吗？那么答案是肯定的，这个答案每个波兰人都心知肚明\n\n§x我们宁可玉碎，亦不选择瓦全。§!"
 war_time_supply_txt: "§Y战时补给§!"
 war_time_german_tension_txt: "§X德国厌战度§!"
 pol_war: "战争态势变动"
 POL_ROD.899.t: "波兰战胜"
 POL_ROD.899.d: "由于大日耳曼国对波兰久攻不下，国内开始出现骚动的情况；新一任元首[GER.GetLeader]的威望尚未建立的前提下，却久久无法战胜波兰及其盟友，元首[GER.GetLeader]因而在本次骚动中遭到刺杀。现在，德意志国内乱作一团，作为临时补救设施，卡尔·邓尼茨作为新任元首暂时顶替了[GER.GetLeader]的职位。为了维持稳定，他决定与[POL_ROD.GetLeader]进行停战协议，而停战协议内容如下：\n德国割让东南普鲁士行省给予波兰、并对波兰的战争损失进行补偿，同时进行裁军等措施...\n而在签署停战协议后，波兰于[Root.GetDateText]宣告了其胜利与波兰光复的消息。如今的波兰再一次踏上世界的舞台，在东欧设立起了防御阵线，以避免日后的潜在威胁。这次，白鹰翱翔，黑鹰坠落。流落多年的波兰总算再一次见到了光明的未来，继第二共和国以来再次光复。\n\n然而，波兰的故事尚未结束，若是等到一个合适的时机，说不定还能夺回一些本属于我们的东西..."
 POL_ROD.899.a: "\"波兰万岁！祖国万岁！\""

 POL_pitsuski_nvr_die: "毕苏斯基之魂"
 POL_pitsuski_nvr_die_desc: "波兰家乡军经历了无数艰难愤苦的战斗，但一直鼎力不倒，如同前波兰陆军元帅毕苏斯基的灵魂一般护佑着波兰母亲。\n\n毕苏斯基的游击和弹性防御战术在家乡军的无数次激烈战斗中不断发展并延续了下来，无数散兵游勇的士兵在这股精神下化作了新波兰军的\"第一旅\"\n\n§Y毕苏斯基虽然早已与世长辞，但他的精神与灵魂将会长存于波兰，永世不被遗忘...§!"

