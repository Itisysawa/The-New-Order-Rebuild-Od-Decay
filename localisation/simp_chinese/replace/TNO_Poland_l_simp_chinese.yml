l_simp_chinese:
 POL_underground_state_desc: "谈及波兰，兴许许多人的第一印象便是羸弱和伤痕累累，只能任由邻国日耳曼孽畜蚕食的待宰羔羊。日耳曼人想要把这里变成他们的天堂，然后就在此地建立了一个地狱；他们把波兰人当作奴隶，此地残存的波兰人成为了社会地位最低贱的人种。\n\n条顿病毒蔓延之处留不得一丝生机，多少波兰人因此而饿死，或是在街上被德国军官打死，被乱枪射死...\n\n然而哪里有压迫，哪里就有反抗。\n早在波兰沦陷之初，全国各地便已组建了大量的游击队与游击组织。他们建立了一个规模空前庞大的地下组织，在汉斯·弗兰克无能的治理下他们规模早已愈发巨大。\n\n现如今，日耳曼在此地的统治宛若风中残烛，波兰人们只是在寻求一个绝佳的机会，终有一天他们会回来的...\n\n§x而日耳曼压迫者也将为他的罪行付出代价；届时，贪官会为他们藏入囊中的哪怕一丝的财富的后悔。§!"
 POL_reforming_progress: "第一个四年计划"
 POL_reforming_progress_desc: "随着德波战争拉下帷幕，那以战争勉强支撑起的军工经济也如紧绷的琴弦一般断掉了。\n\n那也就意味着，我们最后的经济防线也被冲破了，随着战时经济不再适用于新生的波兰，哥穆尔卡必须迅速开始他的改革——目前波兰尚需要面对不少问题。不论是党内的反对派、一触即溃的经济，又或是大量的社会问题，哥穆尔卡承诺将在首个§V四年计划§!中解决这些问题。\n\n目前，我们的经济情况如下：\n§YGDP§!:§G[ROOT.Get_GDP]§!\n§Y通胀率§!:§e[?base_inflation_rate]%§!\n§Y贫困率§!:§W[?poverty_rate|2]%§!"

