 POL_ukrainian_consumer_good: "乌克兰农业互补协议"
 POL_ukrainian_consumer_good_desc: "乌克兰，东欧的粮仓，他们曾在布哈林的旗帜之下辛勤耕耘，却在二战之后被德国掌控，成为德意志的私人财产。曾经我们认为:乌克兰是我们的兄弟，但现在，我们需要把这位兄弟从地狱中救出，我们需要他们的小麦喂饱嗷嗷待哺的人民，因此我们需要与他们进行农业合作，他们提供小麦我们提供保护，只要团结一心，东欧终会自由"
 POL_hungarian_mine_idea: "罗马尼亚经济互补协议"
 POL_hungarian_mine_idea_desc: "罗马尼亚一直以来都称得上是波兰的友好国家：在一次又一次的抵抗中，罗马尼亚为波兰人民提供了不少庇护，不论是在总督府占领期间庇护波兰难民，亦或是在起义时暗中支持我们，甚至是为我们提供武器...\n\n为了两国人民的利益，罗马尼亚与波兰签订了一项进口协议，通过两国的长处进行互补：我们为他们提供基础设施建设，而他们将为我们提供石油与其他矿产，以此达到互利互赢。"
