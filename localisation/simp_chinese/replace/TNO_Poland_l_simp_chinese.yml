 ###权力斗争文本###
 POL_power_struggle: "瑟姆权力斗争"
 POL_power_struggle_desc: "为了解决波兰潜在的政治危机和调解派系之间的冲突，菲尔多夫还是设立了众议院，也就是瑟姆。现在波兰主要的抵抗力量有三大派系:\n§V波兰统一工人党§!，§W萨纳齐亚§!和§b蜥蜴同盟§!，他们在议会中占着相若的席位，并且影响力和各派相互之间的态度将随着国策与决议而改变，目前为：\n\n§V波兰统一工人党§!\n席位为§Y[?PWR_PZPR_affection]§!个，而他们对于改革的反对度为§Y[?PWR_PZPR_opposition]%§!\n§W萨纳齐亚派§!\n席位为§Y[?PWR_sanaji_affection]§!个，而他们对于改革的反对度为§Y[?PWR_sanaji_opposition]%§!\n§b蜥蜴同盟§!\n席位为§Y[?PWR_OWZJ_affection]§!个，而他们对于改革的反对度为§Y[?PWR_OWZJ_opposition]%§!"
