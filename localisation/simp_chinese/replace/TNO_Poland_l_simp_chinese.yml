 POL_resisting_underground_state: "地下游击队"
 POL_resisting_underground_state_desc: "自第二次世界大战中的波兰沦陷后，仍不甘心就此落败的波兰人转进了底下，长期以来在波兰的各地煽动着大大小小的躁动与破坏行动。\n\n但在最近这段时间，这股反叛力量却变得愈发强大，他们的行动也愈发频繁，明明理论上这里是一个完美的殖民地，但为何这群波兰人就是不安定下来呢？"
 POL_dominate_from_terror: "进发自恐惧"
 POL_dominate_from_terror_desc: "汉斯·弗兰克从来未能熄灭波兰人民的怒火，长期的奴役与暴政早已让人们抗拒这位暴君的统治；在汉斯·弗兰克的管治下，他容不得哪怕一点的反对之声，当任何疑似反动的人物出现时，他会派人将其带到一个秘密的角落，随后便再也没能见到那个人。 \n\n在高压的统治下，波兰人并没选择低声下气，他的如此举措只会让波兰人愈发团结。"
 POL_a_german_state: "德属\"总督府\""
 POL_a_german_state_desc: "德国人总是妄想着掠夺波兰的一切，于是便在这片迦南地上建立起了所谓的\"总督府\"，以此掠夺着维斯瓦河河畔上的一切：它的资源、它的劳动力... \n\n理论而言，这里应该是一个完美的日耳曼人天堂，这里有着用不尽的波兰裔奴隶，也最临近德国，更没有来自东线的威胁，理应是最稳定的辖区才是。 \n\n§x可为何就是做不到呢？§!"
