 ####波兰红线国策树




 POL_Gomulka_victory: "哥穆尔卡任期"
 POL_Gomulka_victory_desc: "通过这次的不信任投票动议，哥穆尔卡及其领导的波兰统一工人党成为了波兰的嚮导者；根据哥穆尔卡的主张，他将会对波兰进行一系列的改革，加快落实波兰无产阶级专政的速度并秉承列宁的主张向前进 \n\n同时，他也承诺他将带领波兰抵御一切来敌"
 POL_the_follower_of_lenin: "秉先人之志前行"
 POL_the_follower_of_lenin_desc: "对于共产主义的建设，哥穆尔卡的政治理念及思想深受布尔什维克的影响，他崇尚于列宁和布哈林主张的社会快速变革愿景，而他也将会紧跟先人的脚步，让波兰成为一个无产阶级专政的国家，让波兰人民得到解放"
 POL_three_years_plan: "三年计划"
 POL_three_years_plan_desc: "伴随着新生左翼政府上任，新的经济政策订制刻不容缓，但苏联那样的五年计划对我们而言过于长久，只有更激进的劳工法案改革才能让我们的工业实力足以对抗德国人 \n\n即使这会损毁到劳工的权益，但对于我们来说，抵抗德国人比这短暂的压迫更为重要"
 POL_economic_recovering_road: "经济复苏的漫长之路"
 POL_economic_recovering_road_desc: "随着经济政策的落实，经济复苏也成了现在面前最大的难题；哥穆尔卡深知，只有更强大的工业体制才能为接下来的工业复兴做出准备。为此，这名总书记颁布了生产线生产指标及标准，确保工业精度及质量，为接下来做好准备。"
 POL_wind_of_reform: "改革之风吹起"
 POL_wind_of_reform_desc: "现在哥穆尔卡已基本掌控国内权力，而为了祖国波兰的未来，他将会开始作出改革，将路线变得更为激进、或者说是更贴合其主张，即使这可能会稍微影响到我们的稳定，但哥穆尔卡将会把波兰建设为社会主义的坚硬壁垒。"
 POL_revolutive_wartime_assign: "战时革命指挥部"
 POL_revolutive_wartime_assign_desc: "德军即将大军压境，我们必须要全力殊死抵抗，然而，由于历史的特殊性，波兰军队早已习惯单兵作战的游击战术，上一次进行大规模战役还是在1956年，华沙那一次失败的起义。\n\n我们不能重蹈国家军的覆辙，面对战争局势，哥穆尔卡下定决心将重整波兰部队，将家乡军，蜥蜴同盟，人民军以及各路民兵进行整编，由一个统一的波兰军队总指挥部来指挥。\n\n虽然家乡军和民兵不会喜欢这样做的，但是大敌当前，他们应该也知道战时革命指挥部的重要性"
 POL_supply_life_line: "战争前方的生命线"
 POL_supply_life_line_desc: "面对战争，靠的是勇气，战术，最重要的就是后勤补给了，1921年的苏俄军队，就是因为后勤问题得不到保障导致全面在华沙城下溃败的。\n\n我们必须接受历史的教训，哪怕是敌人曾经犯下的错误，波兰必须殊死捍卫自己的后勤补给线，如果战端一开，完全依靠意大利对我们从里海运输的物资是完全不切实际的，我们必须自己把握自己的后勤........"
 POL_back_to_mine: "凯尔采矿工全面复工"
 POL_back_to_mine_desc: "面对战争，面对即将被威胁的自由，所有波兰的工人都动员起来了。\n\n幸亏汉斯弗兰克的鼠目寸光，德国人并没有对波兰的矿业进行太多处理，我们要掘地三尺，为祖国的自由打造出一块块战争之铁，让每一个来犯之敌吃尽苦头"
 POL_communist_officers: "人民的将领"
 POL_communist_officers_desc: "在第二共和国时期，波兰的将领选拔大多都是从毕苏斯基元帅的\"第一旅\"和后期华沙军官军事学校训练毕业出来的，自从波兰在大战中被击溃后，对波兰军人想成为将领的考试便是死亡和战争。\n\n德军即将大军压境，重建中央军事指挥部的我们必须在下层部队也进行有效的总理管理，快速提拔一些有经验的老兵补充中下层指挥力量是有必要的，我们是为了波兰人民而战斗，要依靠军事才能为准则，而不是意识形态。\n\n也许，还有像希米格维元帅那样的\"老亚当\"藏在我们之中呢？"
 POL_factory_for_people: "军工厂资源投放"
 POL_factory_for_people_desc: "唯一欣慰的是，因为长时间的斗争和德国腐败的市场走私，我们抵抗军并不缺少武器，加上军工厂不停的建造，波兰军队已经可以自己独立使用我们自己制造的大炮了，虽然可用性极其差。\n\n武器并不是决定战争的因素，策略和人力才是，我们必须把全体波兰人民团结起来，举国为兵，才有保卫我们独立的可能性"
 POL_economic_development: "国有化经济"
 POL_economic_development_desc: "波兰的经济自从1939年第二共和国政府灭亡之后，经济一直处于极其混乱的地位，兹罗提的可信度甚至不敌于我们敌人的金马克了。\n\n这样的货币经济还有混乱的独立经济也许是我们人民共和国政府最好的重整经济的最好时机，我们将国家这个大手用于管控经济，进行一定的反放任经济态度"
 POL_planned_economy: "波兰计划经济"
 POL_planned_economy_desc: "是的，我们已经做好了任何准备！我们武装了人民，我们打造了兵器，我们修建了堡垒，我们在每个地方隐藏着，等待着纳粹的到来。\n\n可是，直到其余国家支援之前，我们的战略物资稀缺可危，也许我们应该由国家来计划经济，度过这一段最艰难的时间？"
 POL_researching_department: "知识便是力量"
 POL_researching_department_desc: "德国人已经暂时离开，地下学校的设施已经不必隐藏起来了，我们必须短时间恢复大众教育，华沙，克拉科夫，卢布林大学学府都该进行开放，我们的电报技术也该继续发扬光大，毕竟，知识才是力量，一个有知识的民族是不会没有希望的"
 POL_interor_ministry: "处理内政"
 POL_interor_ministry_desc: "尽管德军大敌当前，每个抗德的阵营都有各自的看法，但是我们还是希望国家军还有蜥蜴同盟的人嘴巴老实点，如有必要，我们得管管他们的嘴巴了\n\n§V毕竟，1926年的仇还没有还§!"
 POL_paradise_of_worker: "工人的圣地"
 POL_paradise_of_worker_desc: "早在沙俄占领时期，波兰就完成了产业革命，拥有了自己的工业体系。纳粹入侵后，我们的工人们在国防军刺刀的威胁下成为了日耳曼种族的奴隶，那群来自日耳曼尼亚的法西斯杂碎们用尽了一切办法，去折磨他们的肉体，践踏他们的尊严，并榨干他们身上的最后一滴血汗。\n\n波兰的工人们从未为他们自己而活过。\n\n如今，随着波兰的正式解放，我们的工人们将有权决定自己的命运。我们将清除纳粹带给这片土地的苦难，将波兰变成一个真正的工人圣地。 \n\n§V勇敢地起来，骄傲地起来！§!"
 POL_Chika: "内部人民委员会"
 POL_Chika_desc: ""
