 ######君主波兰######
 POL_the_formation_of_kingdom_of_polish: "宣告王国成立"
 POL_the_formation_of_kingdom_of_polish_desc: "波兰立陶宛联邦，又名波兰第一共和国，是一个拥有独特选王制度的国家。而在今日，我们加冕了一位崭新的国王成为波兰的掌舵者，于是我们就此宣告波兰王国的重生。\n\n在无数民众的观看之下，国王陛下清晰的明白了自己的使命，自己的义务。他不会是斯坦尼斯瓦夫，他会一直站在祖国的最前线，而波兰也不会在他的手里再次灭亡。\n\n而在庆典之上，所有人双手合十，向国王陛下献上最为虔诚的祈祷，宣誓对国王的效忠。但这仅仅只是第一步，未来还会有无尽的磨难考验重生的波兰，而我们早已做好准备。"
 POL_the_peace_finally_arrived: "灾厄尽散，和平已归"
 POL_the_peace_finally_arrived_desc: "波兰的苦难自从三次瓜分波兰后就一直持续着，无数次的起义覆灭，西伯利亚的寒风与奥斯维辛的残酷考验着一位又一位波兰勇士。\n\n而现在，灾厄尽散，和平已归。波兰人终于亲手夺回了独立，让百年之灾厄宣告终结、让百年之屈辱不再复现、让百年之役终获胜利。\n\n长路漫漫、尤有尽时。科希丘什科，你的奋斗永远不会是史书的一脚；波兰的勇士们，你们的在天之灵终于可以安息的闭上双眼。"
 POL_reconstruction_work: "重建工作"
 POL_reconstruction_work_desc: "战争过后，尽是断壁残垣。我们的祖国遭受了难以想象的破坏，那些褐衣暴徒在逃亡的时候尽情破坏着他们目中的一切，因此重建工作迫在眉睫。\n\n幸好我们拥有对祖国怀有无限热情的家乡军的战士，长久的征战让他们的能力获得全面的发展。因此我们会动员家乡军的战士们，和万千劳苦大众一同投入到祖国的重建之中。\n\n这一次，不会再有任何上位者的逃避，所有人都将将自己的一切献给挚爱的祖国。"
 POL_starting_to_rebuild_commonwealth: "重拾联邦昔日光辉"
 POL_starting_to_rebuild_commonwealth_desc: "波兰立陶宛联邦是一个在卢布林联合后诞生的强大国度，曾经的我们驰骋在东欧大草原上，以宽容的态度面对多信仰的民众，作为天主之矛抵抗着奥斯曼土耳其的侵略，而在最波澜壮阔的大革命时代，无数先驱所谱写的《五三宪法》将波兰送上最为巅峰的时刻。\n\n但紧接着就是俄罗斯、奥地利、普鲁士的虎视眈眈，最终四分五裂，国家灭亡。无数的勇士随之奋起，为了波兰献出一代又一代生命、缔造永恒燃烧的希望之火。\n\n而在今日，波兰人摆脱褐色暴政，重新以独立的姿态回到世界之林。我们是第一共和国的继承者，我们是伟大光辉时代的复兴者，这一次，大洪水将彻底远离这个国度。"
 POL_szlachta_work: "新一代的施拉赫塔们..."
 POL_szlachta_work_desc: "自从联邦灭亡后，波兰的施拉赫塔经常被认为是波兰民族的复兴希望。然而，在遭到强势的打击下，施拉赫塔这个曾经占有联邦二十分之一的阶层，自波兰1918年独立之时几乎已然夭折了。\n\n我们的王国命运多厄，作为新施拉赫塔的身份辩证，我们很难鉴别其先祖是否是皮亚斯特或雅盖隆继承而来。至少我们的国王是愿意做出点妥协的：我们何必要注重对方血统呢？只要是愿意为了波兰而战的，而有爱、有力量、有权利的，那么就是新的施拉赫塔！\n\n当然，这种态度偏向一种对社会主义倾向，但那又如何呢？起码，一切都是为了波兰。"
 POL_invest_rebuilding_order: "投资基建"
 POL_invest_rebuilding_order_desc: "历经两次世界大战，外加德国人压根没打算把波兰建设为他们的乐园，波兰各地的基建已经烂到令人发指的地步，甚至连德国方面都暗自嘲笑我们的国王是\"管理监狱的无私监狱长\"。基建乃国家建设之首要任务，为此，让我们重建起那些让人赞叹的建筑吧！重新筑起那崭新而又繁华的街道；毕竟，在美术上面，波兰人从来不比任何人差！"
 POL_light_industry_rebuilding: "轻工业发展"
 POL_light_industry_rebuilding_desc: ""
 POL_heavy_industry_as_top_place: "重工业重整"
 POL_heavy_industry_as_top_place_desc: ""
 POL_silecia_mines: "西里西亚矿藏"
 POL_silecia_mines_desc: ""
 POL_conference_with_lithuan: "潜在的立陶宛君主制情绪"
 POL_conference_with_lithuan_desc: "在我们的带领下，立陶宛终于赶跑了日耳曼政权的暴政。遥想昔日雅盖隆与雅德维嘉的结盟，那时波兰与立陶宛如同手足：我们共步向辉煌，却又在凶残的敌人之下被迫分离......\n\n我们很清楚，立陶宛历史上最辉煌的时刻：立陶宛大公国，多么美妙的名字。在新秩序被击破后，波兰和立陶宛将共同一起走向光荣的未来，尝试让立陶宛套上王国色彩并不是什么难事，一切都会好起来的！"
 POL_no_intercept_to_other_countries_politic: "杜绝干涉他国内政"
 POL_no_intercept_to_other_countries_politic_desc: "还记得先前的教训吗 ？联邦在各国势力的争斗下逐步变得支离破碎，最后走向灭亡。自1918年波兰复国以来，对乌克兰、俄罗斯，还有波罗的海的征讨，最终换来的是什么？这些干涉似乎对我们而言毫无意义，我们的联邦王国，是民主的，也是平等的；我们骄傲地说出，我们自愿建立自己的天堂，而不愿重新奴役他人而让人垂危！"
 POL_friendship_from_past: "昔日之情"
 POL_friendship_from_past_desc: "虽然乌克兰人偏有其词，但我们坚信联邦的历史对于各民族而言都是奋进而美好的。在1831年的民族起义里，我们联合而又奋勇作战。\n\n可以说，白罗斯、立陶宛一直都是我们的朋友，我们必须时刻把握这一点。至于乌克兰，我们可以暂时放下之前的矛盾：新生的联邦不应变得如此野蛮..."
 POL_belarus_monarchy: "白罗斯君主派"
 POL_belarus_monarchy_desc: "白罗斯方面的君主情绪，就有点让人意外了，早早就覆灭的白罗斯共和国的遗体上，许多白罗斯人实际上已经对自己的身份认同较为薄弱，日耳曼尼亚方面的摧残早已将此地的民族认同踩在地上任意碾压，直至覆灭；当然，这于我们而言肯定是好的，我们有了重新建立他们国家身份认同的机会。"
 POL_for_lithuania_monarch: "加冕立陶宛王位"
 POL_for_lithuania_monarch_desc: "\"我，卡尔-斯特凡·冯·阿尔滕堡...波兰的王...尊崇上帝的意志和波兰、立陶宛人民的呵护，正式戴上属于立陶宛的王冠...远古的联邦会在我的铁剑下重新崛起；我呵护着来自维尔纽斯的诗集，那是密茨凯维奇为我们光荣的未来的高声歌唱！\""
 POL_belarus_duchy: "复兴波洛茨克大公国"
 POL_belarus_duchy_desc: "\"我，卡尔-斯特凡·冯·阿尔滕堡...波兰的王...立陶宛的王...尊崇上帝的遗志和波兰-立陶宛、白罗斯人民的呵护，正式附上属于波洛茨克的公冕。远古的联邦会在我的法令下重新铸造，我呵护着来自明斯克的宝剑，那是柯斯丘什科为我们光荣的未来的奋力挥舞！\""
 POL_Courland_duchy: "库尔兰公国"
 POL_Courland_duchy_desc: "\"我，卡尔-斯特凡·冯·阿尔滕堡...波兰的王...库尔兰公国的保护者尊崇上帝的遗志和波兰-立陶宛、白罗斯、波罗的海人民的呵护，正式附上属于库尔兰的公冕...远古的联邦会在我的铁剑下重新升起，我扶正着来自里加的船帆，那是莱尼斯为我们光荣未来铸造的的戒指之手！\""
 POL_Courland_federation: "库尔兰邦联"
 POL_Courland_federation_desc: "虽然很不想承认，波罗的海地区自古以来经常在别人的“呵护”下渡日，我们早该意识到，波罗的海地区的人们并不太欢迎我们。森林兄弟若是转头对付我们，这也是一个麻烦的事情。与其这样，倒不如放松对波罗的海三国的控制，建立一个新的邦联加入我们，自然，这些东西不需要他们同意。如果他们拒绝的话，我们只能让他们敬酒不吃吃罚酒了..."
 POL_polish_lithuanian_ukranian_commonwealth: "建立波兰-立陶宛-乌克兰共主联邦"
 POL_polish_lithuanian_ukranian_commonwealth_desc: "朋友们，德国人已经被赶跑了（我们暂时把国王看得客气点），所有东欧民族都应有一个属于自己的王，唯余乌克兰这一国度尚未加冕。我们高呼着：来吧，我们一刻都不愿意等待了。乌克兰的王位应当有所宣称了，各民族的火焰啊，你崛起吧！"
 POL_no_ukr: "让乌克兰脱离枷锁"
 POL_no_ukr_desc: "乌克兰——乌克兰是个难题；毕苏斯基曾说：如果乌克兰无法自由，波兰自然也无法自由。波兰的自由和乌克兰是一样的， 不过，民族的仇恨不是一朝一夕就可以解决的，也许我们应该换一个新思路——让乌克兰成为一个特殊的附属国度，组成一个同盟，日后再行其他打算。"
 POL_again_union_of_lublin: "第二次卢布林联合"
 POL_again_union_of_lublin_desc: "1569年，就是在这里，我们的联邦从此开始了王道征途。现在，我们依然站在先祖的故土，我们高呼我们的宣言，联邦永存，我们必然联合，波兰人民必然联合！"
 POL_our_ukrainian_friends: "我们的乌克兰朋友"
 POL_our_ukrainian_friends_desc: "乌克兰——他们是我们的朋友，哪怕我们曾经如此纷争多端，但我们仍能一起并肩作战，这是我们各自骄傲的历史，我们对乌克兰致敬。乌克兰终将自由，乌克兰与波兰联邦在一起，必然走向更美好的未来。"
 POL_a_day_break: "放一天假" 
 POL_a_day_break_desc: "等到那一天开始，华沙、基辅、明斯克、考纳斯、里加...到处都是人民高呼着联邦之名，挥舞着联邦旗帜的模样。向世界宣扬我们的声音吧，待这一切都忙完，放一天假吧。"
 POL_first_republic_still_alive: "第一共和国尚存！"
 POL_first_republic_still_alive_desc: "啊，波兰在干什么？波兰在复国！他要重建联邦！重建不了！啊！做到了！他们重建了第一共和国，他们做到了！他们出了一个天才的指挥家（指的是玩家您）"
