 ggn.5.t: "行动\"破晓\""
 ggn.5.d: "在[Root.GetDateText]清晨，波兰地下国收到了一个意外的作战报告：蜥蜴同盟(OWZJ)的民兵在克拉考郊外对汉斯·弗兰克进行了斩首行动。当汉斯·弗兰克接到郊外所谓\"波兰民兵被大规模清洗\"的消息时，他马不停蹄地赶了过去，殊不知中了萨尔斯基的计。他被骗到了克拉考郊外，远远地就看到了一排所谓\"波兰人\"的尸体，正当他为自己的杰作自豪时，从树林中飞出的几颗土制炸弹将他和随行保镖炸成了碎片。就此，这位\"斯坦尼斯劳国王\"罪恶的一生被终结了。"
 ggn.5.a: "暴君终被斩首..."
 ggn.6.t: "[Get_newspaper_header]总督府总督汉斯·弗兰克遇刺！"
 ggn.6.d: "总督府的总督，被称为\"斯坦尼斯劳国王\"的汉斯·弗兰克在克拉考郊外遭到了极端民族主义组织\"蜥蜴同盟\"民兵的刺杀。这群民兵先是设伏击溃了一个宪兵队的小分队，随后将那群德国部队扒光倒吊起来，随后以他们的军服伪装成了德国部队，并呼叫了该作战旅的旅长。其后，这几名急着邀功领赏的军官向总督汇报了作战成果。\n\n汉斯·弗兰克显然是轻敌了，他听信了报告，随后往克拉考的郊外赶来。他打算聚众在这里进行一次演讲，让波兰人得知叛徒的下场，结果正中了蜥蜴同盟民兵的下怀：早已埋伏附近的民兵用土制炸弹将汉斯·弗兰克，以及他身边的随从和保镖尽数炸飞，那名\"斯坦尼斯劳国王\"就此归了西。副专员约瑟夫·布勒接替了汉斯·弗兰克的位置，并且对波兰平民进行了报复性的打击。\n\n德国方面，外交部长瓦尔特·黑韦尔代为发言，德国方面对波兰地下国的行动予以强烈谴责，表示波兰地下国的存在严重威胁到德国领地的安全问题。"
 ggn.6.a: "可悲的独裁者，终将亡在自己的自大中"
 


 AGCDL_leader: "东欧反法西斯联合阵线领导国"
 AGCDL_leader_desc: "在那维斯瓦河畔上，有这样一个国家：它曾两度消失于世界地图之上，却又一次又一次地杀了出来——它便是波兰。\n\n坚韧，以及对自由和独立的嚮往，无一不让波兰民族为之自豪而为其奋斗，尽管希望渺茫，波兰也会试着担起反法西斯阵线领导者的重担，领导着东欧罗巴大陆上各个反法西斯势力击溃德国。\n\n因为这也是他们的使命，以及为自由必须做出的事。"
 AGCDL_member: "东欧反法西斯联合阵线成员国"
 AGCDL_member_desc: "兴许是厌倦了德意志残暴的压迫，亦或是早已受够了对他们民族的迫害，这些国家或许是出于自发的，也可能是受到了波兰军队的解放。如今，他们团结在波兰的旗帜下，他们知道如若不团结一致结局会是如何；他们不想1939年的灾厄重演，不想要成为德意志人的奴隶，为此他们也会奋力战斗，为自由的最后一役作出贡献！"
 warsaw_pact_member: "华沙公约组织成员国"
 warsaw_pact_member_desc: "或许听着很荒谬，但波兰人民军确实已然重组了波兰的秩序。在新生的左翼政权中，为保障每个前反法西斯阵线成员的安全与自由，各国在华沙签下了华沙公约，继而成立了华沙公约组织。\n\n尽然不是每个成员国都是社会主义国度，波兰也对其有一定程度的包容，而波兰也相信他们日后定会转化为社会主义国度......"

 ####家乡军国策

 POL_armia_krajowa_came_back: "萨纳齐亚之凯旋"
 POL_armia_krajowa_came_back_desc: "秉持着毕苏斯基元帅的遗志，波兰共和国再次挺立于欧罗巴大陆之上。即便德意志人们想将我们再次踩于铁靴之下，在东欧罗巴各民族统一的旗帜下，那雄鹰也被击落了。\n\n正如先总理毕苏斯基所言，现如今只有剑才能掌握国家的命运。除了外忧以外，我们自然也面对着内忧——\n反动的蜥蜴同盟与时刻想推翻我们整权的泛左派时刻对我们虎视眈眈，我们岂能容忍他们的所作为？在他们行动之前，我们便先行出手逮捕了所有潜在的反动派，如今，我们无论内忧或是内患都解决了，但问题又来了：\n\n仗打完了，现在我们该怎么做呢？"
 POL_restoring_order: "重整"
 POL_restoring_order_desc: "波兰共和国复国已有些日子，在街头巷尾，无一人不为胜利喜悦。这真的就意味着现况就此好起来了吗？事实恰恰相反。战争带来的烙印深深刻蚀在了波兰的土壤上，弹痕与炮击留下的弹坑随处可见，华沙城中、克拉科夫，甚至是离战斗区域更远的卢布林，英烈们的尸体就此随意地堆砌在街道上......\n\n我们没有多余的时间为他们悲伤与哀悼，我们必须认清一个事实：我们迫切需要重建，波兰人们还在挨着饿，一味地陷于悲伤之中不能解决任何问题。我们需要砥砺前行，站在他们创下的，全新的秩序之下，重建起华沙；重建起利沃夫；重建起波兰..."
 POL_expel_german: "遣返德意志人"
 POL_expel_german_desc: "在德意志所谓的\"东方总计划\"政策下，大量德意志人口强行移居到了波兰地区。他们杀害了数以千万计的波兰人，侵蚀着波兰的财富、波兰的土地、波兰人所提供的劳动力......他们占领了本应属于波兰人的土地，糟蹋着这一圣洁之地，如若他们如此咄咄逼人，我们又如何能袖手旁观呢？如若我们任由他们继续住在这片土地上，数十万乃至数千万逝去的亡灵们又该如何看待我们？\n\n为了避免潜在的间谍行为，以及告慰逝者的亡魂，我们将会驱逐所有在波兰领土上的德意志人，将他们遣返回到他们应待的地方——无论他们是否愿意，我们并不在意。我们能做的，仅有让我们逝去的弟兄们得以瞑目。"
 POL_opinion_poll: "重组瑟姆"
 POL_opinion_poll_desc: "继清理掉反动的蜥蜴同盟武装以及左翼的反对派后，我们已然重新组建了瑟姆，现在瑟姆中仅有三党，工党、农民党与萨纳齐亚政府。此两党本在战时加入了波兰地下国，但既然战争结束了，他们也就不再选择与我们合作了，在当今局势下，我们不得不开始进行一定程度的权力下放与改革，确保我们的政策不会造成太多的异议，同时也可以确保我们的政策不至于太过于专制独裁。\n\n但同时这也将引起一个问题，那就是这两党的自由派将会崛起，如若他们借此大作文章势必也会对我们造成一定程度的影响，所以现今我们陷入了一个困境：我们该如何抉择接下来的决策？"
