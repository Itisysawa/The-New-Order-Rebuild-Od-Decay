 POLITICAL_EPJ_Adam_Koc_desc:  "作为前民族团结营的领导者与先总理西科尔斯基的追随者，亚当.科克在战败后带着仅剩的黄金储备撤到了美国。人们本以为他将会私吞掉这笔财产然后逃之夭夭；但实际不然，在得知祖国波兰再次发动起义对抗她的敌人时，科克带着这笔黄金储备再次回到了波兰，并前往了新成立的\"东波兰军区\"。在德国的占领下，这片原属于波兰共和国的土地被乌克兰人整合，又被东方领瓜分，与祖国的隔阂越发之大... \n\n身为民族团结营创始人的亚当·科克，自然带着些许波兰民族主义色彩：他并不想看到这片地区彻底成为纳粹匪徒的土地，或是乌克兰化；于是他决定前往东波兰军区进行军事占领与整合本地区土地，也许在未来的某一天，祖国波兰能够再一次收回本应属于她的土地，踏上维列伊卡、踏上格但斯克、再踏上比亚韦斯托克...兴许有一天，新生的波兰政府能够光复第二共和国，痛击祖国的敌人。\n\n当下，他将会专注于稳固东部波兰领土，并不惜代价的确保波兰再次掌控这片区域，为日后波兰的总体战略不会再出现任何来自身后的麻烦。而至于那些黄金储备，他也上交给了新生的波兰政府，以确保波兰能够快马加鞭进行重建。\n\n§Y终有一天，东波兰将会重回祖国怀抱§!" 
