 POL_ROD.15.t: "最后通牒"
 POL_ROD.15.d: "随着德国一个又一个的城市被波兰人所攻陷，新任德国元首[GER.GetLeader]对于这场战争愈发没有耐心了。随着战争蔓延至日耳曼尼亚一带，[GER.GetLeader]最终还是决定对波兰共和国下了最后通牒。日耳曼尼亚方面表示，如若波兰人不立刻将部队撤出边界并且停止非法侵占大日耳曼国领土，日耳曼尼亚方面将考虑动用核武器。现在，摆在菲尔多夫面前的只有两个选项：与德国人签署停战协议，或是等待原子烈焰摧毁波兰..."
 POL_ROD.15.a: "我们该收手了"
 POL_ROD.15.b: "他们肯定是在吓唬我们！"
 by_kasimir_event.1.t: "地下学校（一）"
 by_kasimir_event.1.d: "作为大日耳曼国\"最伟大最成功的殖民地\"，帝国对新生波兰儿童的教育则是饥饿与奴役，一辈子生在工厂的流水之中，死在铁锤敲打的油污之下，这里不存在劳动法，只有主人和奴仆。\n\n流入大日耳曼尼亚灯光集市下的精美工业品和牛奶细面包从波兰奴工臃肿的双手中夺走产出，不过即使面对着粮食危机，波兰人依然没有忘记他们得以不灭亡生存的根本：教育。\n\n在一阵阵德国宪兵警察的军靴排场震声后，1962年波兰小学开学了，前华沙大学毕业生扬·格尔茨卡走进了一脸漆黑的旧教堂，借着月亮撒下的一些明亮，格尔茨卡小心翼翼的点燃了两个蜡烛，微弱的灯光闪烁着，映射着格尔茨卡苍白无力的身躯，但他依然勒直了身前的麻绳。面对着年龄相似，身上脏兮兮并刚从工厂下来那十三位满面春光的少年，开始了他的教课。\n\n\"今天，我们来学习波兰语，属于我们自己伟大祖国的语言，小亚当，你现在坐的位置是玛丽亚·斯克沃多夫斯卡，也就是居里夫人一个半世纪前坐着的位置，你要好好对得起她呢。\"格尔茨卡面带着微笑。\n\n小亚当的眼神突然闪过一道责任感，他努力想吐出些什么，却一下子无力径直倒了下去。\n\n\"快叫格拉索夫斯基！快！去拿面包！去拿面包！\"\n\n在亚当被大人抬起离开之时，他突然猛的下定了决心，\"po...po....\"\n\n\"我知道，老兄，是Polania，是啊，老哥，你教的，他都记得呢...\"\n\n格尔茨卡给一片小土堆插上了一束三色堇，亚当的父亲和亚当埋葬于此，亚当的父亲，亚当·东布罗夫斯基与无数东布罗夫斯基一般勇敢，却在一次战斗中牺牲。现在唯余生前不断所告诉自己儿子的，自己是Polski，自己的祖国是Polania。"
 by_kasimir_event.1.a: "波兰人死守波兰土"
 by_kasimir_event.2.t: "地下学校（二）"
 by_kasimir_event.2.d: "\"今天，我们来讲一个特殊的角色。\"格尔兹卡老师搬出一个巨大的画像。\n\n画像上的人一眼端庄像，却充满了仇思，还有少许忧愁。\n\n\"这是我们在1648-1668年在位的波兰国王，约翰卡齐米日大王，他处于我们波兰远古联邦最危机的\"大洪水时期\"，联邦几乎全部沦陷，但是我们为什么要歌颂他呢？要叫他勇士国王呢？\n\n原因很简单，他一直在战斗着，直到最后一位敌人离开联邦故土，他也一直在战斗着，虽然他丢掉了整个联邦，但是他又于是赢得了一个完整的新联.....\n\n一团急躁的声音拍打着房门，\"德国人来了！快走！\"\n\n格尔茨卡赶快招呼学生们赶快离开，尽管如此，他嘴里重复着一句话：\n\n\"我希望你们不要太过关注瓦迪斯瓦夫四世带领我们征服莫斯科时的强大，还要想想我们面临亡国的时候的伟大......\"\n\n待德军的宪兵队进入教堂时，他们已经逃掉了。"
 by_kasimir_event.2.a: "\"这群该死的波兰人跑得真快！\""
 by_kasimir_event.3.t: "地下学校（三）"
 by_kasimir_event.3.d: "\"从德国访问回来毕苏斯基爷爷全然不顾身体的疲惫，连夜找我们几个小标兵谈及过几天五三宪法日的安排。谈得晚了，便送我们出门，要司机送我们回家......\n\n毕苏斯基爷爷抬头看看天空说：\"如果世界真像这天空这么安静就好了，但是就有一些国家，像德国，要搞乱这个世界，他们是罪人。\"说着，毕苏斯基爷爷弯下腰，从花池里捡出一颗石子，然后看着天空说：\"该死的德国佬！\"说着他把石子奋力向上一掷。很快就见空中一颗星点突然爆发出耀眼的强光，然后就坠落下来。\"这是德国的间谍飞艇，他们一直在国土上空盘旋，侵犯我们的主权，我已经忍了很久了。\"毕苏斯基爷爷愤愤地说。我们都鼓起掌来，为祖国有这样的领导人感到自豪。 \"\n\n格拉索夫斯基稍微敲了敲门，\"格尔茨卡同志，我有些话想和你说说。\"\n\"好，同学们自习，我一会儿再来说毕苏斯基爷爷的故事\"\n等到格尔茨卡和格拉索夫斯基走出教室后，格拉索夫斯基脸上的微笑终于挂不住了。\n\"看看吧，看看这次地理考试吧！\"\n\"维斯瓦河是怎么形成的？毕苏斯基爷爷小时候想造泳池造的！\"\n\"为什么我国四季分明，夏季炎热多雨，冬季寒冷枯燥？因为毕苏斯基爷爷会掌控天气！\"\n\"最气愤的就是这一条了\"格拉索夫斯基怒吼着\n\"为什么月球有坑坑洼洼的情况在？因为毕苏斯基爷爷年轻时候对月球练枪，这些都是毕苏斯基爷爷练枪留下的弹坑，格尔茨卡先生，我还教孩子们物理，你不会说毕苏斯基会飞天入地吧？！\""
 by_kasimir_event.3.a: "\"别那么较真嘛，格拉索夫斯基同志\""
 by_kasimir_event.4.t: "地下学校（四）"
 by_kasimir_event.4.d: "随着三个月学期的结束，地下学校迎来了属于1962届学生的最后一课，令人感到奇怪的是，同学们一直期待的格尔茨卡一直没有到，转念间，格拉索夫斯基沉默的走进了课室。\n\"今天，这是我们这次学期的最后一课了。我知道你们为什么有所疑问，因为本来这一课应该是格尔茨卡老师上的。\"\n\n格拉索夫斯基顿了顿嗓子，\"那群该死的德国佬用枪打穿了他的脑袋。\"\n\n教室里传来一声声惊恐压抑之声，然后是一声声哭泣。\n\"没什么原因，就只因为那个德国士兵想要练枪。就这样，格尔茨卡永远地离开了我们。\"\n\n格拉索夫斯基强忍着自己的泪水不掉下来，他发怒般在黑板上宣泄着，最后割出几个大字出来。\n\"自由波兰万岁，为了波兰的自由而读书，为了格尔茨卡而报仇\"\n\"好了，德国人的巡视也快来了，我希望你们能记住这些，考试也不必考了，我骄傲的是你们都学的很认真，将来能用的上的，好了，同学们，毕业快乐。\"\n格拉索夫斯基缓缓的瘫倒在桌子旁，没了一点力气"
 by_kasimir_event.4.a: "那晚的教堂中响起了枪声，玷污了那三色堇"
 by_kasimir_event.5.t: "亚当之死"
 by_kasimir_event.5.d: "  1962年的寒冬对于波兰抵抗军没有什么区别，饥饿，缺衣保暖，一点又一点燃尽的希望。\n\n地下国的又一次苦难行军开始了，有些时候，在一个毫不起眼的篱笆地掏出几个土豆，或是草丛旁被遗忘的莓果，便是这些肩挂\"伞\"袖的士兵们的难得佳肴。\n德国人几乎搜刮了波兰的一切，在走投无路的情况下，为了一口面包冲进帝国银行再死都是一种奢侈的幸福。\n\n老兵亚当已经七十五岁了，他的眼神中就可以透露出许多故事出来∶人们都叫他亚当老叔叔，到头来，成了老头子，他是整个搜查队的父亲。\n听亚当说，他是传奇的第一旅的老兵，好像毕苏斯基元帅还曾经想要让他当将军呢。\n\n每次和新兵们说到这里，老亚当便不说了，到头来，快一个旅的人听完了这个老兵的故事。\n\"老亚当，那你是怎么指挥我们三个师的部队痛揍德国佬的呢？\"\n亚当很是惶恐，于是每次都慌慌张张搪塞过去。\n不过人们的确奇怪，三十年来，老亚当的军衔一直是上士，团长要给他上尉，他不要。菲尔多夫要让他当中将，他不去。\n\n\"我能当个排长就足够了。\"老亚当全部堵了回去。\n\n如今，老亚当重重的倒在了地上，不管队友如何呼唤他，他们的父亲再也不会慈祥的讲给他们故事了。\n回到营地，牧师给老亚当举行了隆重的洗礼，身上的五处枪伤在凹陷的皮肤下不得动弹，人们已经习惯了死亡，但是人们也习惯了老亚当。\n\n忽然间，后勤部长在整理亚当的衣服的时候，翻出一个古老的，集满尘土却厚重擦试过无数次的皮包，皮包里藏着一个小小的证件。\n后勤部长不敢相信自己的眼睛，他怀疑是自己没吃饭饿晕了，他连忙再看了一遍。\n\n是的，老亚当啊，是他！\n\n后勤部长默默摘下军帽，朝痛哭的波兰军人们一点点重复。\n\"元帅回来了，是他，希米格维元帅回来了......\"\n人群们先是愕然，他们看着两个证件卡，一个是他们熟悉的亚当·日梅米尔斯基\n一个是带有历史沉重感，但又很油华的。"
 by_kasimir_event.5.a: "\"波兰陆军总司令 爱德华·雷兹-希米格维 元帅\""
 by_kasimir_event.6.t: "奴工起义"
 by_kasimir_event.6.d: " 在宣称消灭了世界的\"蛀虫\"犹太人后，对于波兰，大日耳曼国改变了大战期间咄咄逼人、赶尽杀绝的态度。帝国需要奴工。于是每日食物所提供的热量也仁慈的从2000大卡达到了惊人3000大卡。显然，根据汉斯·弗兰克的幽默来看，摄入热量只比得上维持生命特征的波兰奴工们每日还要高强度工作十六小时，六个月存活率居然还能达到了35.8%！由此可见，斯拉夫人可能比日耳曼人更雅利安一点。\n\n大战后，如果把大日耳曼国比作贪得无厌的农场主，波兰（显然官方已经没有波兰这个概念了，好像这样就可以把两千四百万苦苦挣扎的波兰人抹杀掉一样）总督府成了她无限榨取的奶牛。希特勒的拥趸施佩尔的\"奴工计划\"很自然的解决了上百万波兰青年十几年来的失业问题，他们从未拥有，从未获取，死了还得去被拔下衣服，去给新日耳曼婴儿做尿布！\n\n即使一次又一次失败，总有些无名英雄挺身而出，一天夜里，某个电气工作室传来一阵玻璃瓦破碎的声音，还夹杂着几声慌乱的枪响，尘埃落定之后，德国警察丢下了五具尸体。当德国部队来的时候，只剩下了一片狼藉和一个\"伞\"的符号\n\n汉斯·弗兰克气炸了，在一次次搜查中，恐吓之中，奴工的行踪在森林里被发现了，当时他们在大谈波兰革命。\n\n德国军人举起了枪，奴工们纷纷站了起来。他们身上没有枪，只有饿着皮包骨的身躯，却自信且轻蔑的死死的盯着一群德国士兵们。\n双方陷入了短暂的沉默。\n\n在十五分钟后，随着带头的波兰奴工带头说了一句\"波兰万岁！\"朝德国人猛冲过来，然后，紧随者是一群人。\n\n可惜，并不会有奇迹出现，所有起义的波兰奴工倒在了血泊之中。\n在此之后，工厂的铁丝网横挂着几具波兰人的尸体，他们脸上还飘扬着自由，以及让人敬畏的笑容。"
 by_kasimir_event.6.a: "\"至少，他们都在自由中死去\""
 by_kasimir_event.7.t: "华绍之旅"
 by_kasimir_event.7.d: "古老的华绍早就忘却了她原本的名字，1956年起义遗留下的弹孔依然向人们倾诉着日耳曼雄鹰撕扯美人鱼身躯的血肉史。\n这里曾经喧闹，东方的巴黎早就只剩下几座巴洛克风的德国宫殿，还有隐约冒着黑烟的工厂，你最好不要去想象里面在干什么。还有一座空无生气的广场，波兰国父毕苏斯基曾经在这里检阅自由的波兰部队开赴战场，现在只留下了屠夫阿道夫希特勒的巨型雕像，几只乌鸦在他的右臂上嚎叫着，飞向右臂提起的地方。\n\n约翰·洛克显然无意按照德国人颁发的\"总督府旅游路线\"前行，这个年轻的美国小伙背着一个巨大的背包，路上受到不少肥头大耳的德国军官的刁难。\n\n\"cola！\"德国军官挤眉弄眼的暗示着。\n\"哦，好，给你可乐，长官！\"一瓶棕黑色液体被洛克递了过去。军官小心翼翼的尝了一口，于是\"嘿嘿\"的笑了几下，低着头暗示洛克可以走了。\n\"别去偏离我们士兵看不到的地方，遇到匪徒我们可能没办法帮你了\"\n洛克不理他，他大踏步一点点朝着小径走着。\n\n天很快就黑了，洛克甚至开始怀疑自己是不是走错路了。\n\"不许动！\"一杆手枪顶住了洛克的后背。\n\"为了波兰的自由！（英语）\"洛克双手举起，把背包扔在一旁。\n\"革命！（英语）\"\n\"为了你们和我们的自由！（波兰语）\"\n\n手枪放下了，静随着是一个巨大的拥抱，然后是满溢的欢乐。\n\"是你！洛克同志！您来了！\"\n\"马克思党团，约翰洛克已经完成任务，青霉素五支，绷带诺干，还有止痛药诺干！甚至还有两瓶可乐！\"\n\"正是我们所需要的！青霉素，绷带......等等，这个黑色的浓汤是啥？\"趁着月光下，齐哈罗夫斯基摸出一瓶可乐。\n\n\"可乐，没他们，我可到不了这里，德国人以为我就是一个走私犯没管我。\"洛克笑着说。\n\"我们两人一年没见了，就一起喝这两瓶吧\"洛克敲开可乐，朝齐哈罗夫斯基示意。\n\n\"你说这玩意儿真能喝？\"齐哈罗夫斯基轻轻尝了一口，作恶心状，\"原来你们美国人都爱喝这玩意儿\"\n\"所以还有吗？\"齐哈罗夫斯基又灌了一嘴。"
 by_kasimir_event.7.a: "\"cheers！\""
 by_kasimir_event.8.t: "独立之路长漫漫"
 by_kasimir_event.8.d: "1795年，令波兰人无比骄傲的§Y波兰立陶宛联邦§!被他的三个贪婪的邻居撕扯殆尽，波兰人开始了他们自己123年的苦难的斗争之路，在东布罗夫斯基将军的脚步下，在密茨科维奇的诗歌之中，在肖邦激昂的斗争曲之中...波兰人一次次揭竿为旗，却屡次遭受失败的苦果。\n\n浩浩荡荡的第二次工业革命开始了，波兰成为了沙皇帝国的最佳工业殖民地，在其中，两个灿烂的新星在闪闪发亮，§Y约瑟夫·毕苏斯基§!试图利用社会主义浪潮复兴波兰，§Y罗曼德莫夫斯基§!试图向沙皇施压慢慢获得自由，双方展开了不同的斗争，但他们都是为了波兰。\n\n大战爆发了，无数波兰人卷入了大战，德奥俄的大炮在波兰土地上怒吼，面对毕苏斯基所组建的波兰兵团的傲人战绩，德意志帝国重建了§Y波兰会议王国§!，但是毕苏斯基的公开拒绝效忠让帝国气愤地将毕苏斯基丢进了监狱，等到毕苏斯基被释放出狱后，一直效忠于奥地利军队的§Y西科尔斯基§!，在法国维持波兰政府的§Y德莫夫斯基§!，还有欢呼的波兰人民之中，毕苏斯基必须做出选择。\n\n\"尊崇所有波兰人的憧憬，波兰国家重新建立了。\"1918年11月11日，随着毕苏斯基的演讲结束，灭亡了123年的波兰民族，再次展现于地图之中。"
 by_kasimir_event.8.a: "长久复兴就在脚下"
 by_kasimir_event.9.t: "对苏战争"
 by_kasimir_event.9.d: "波兰独立了，但是波兰人惊奇的发现，自德意志帝国在东欧的秩序崩溃，东欧陷入了极大的中空期，面对可能立刻赢得俄国内战的§e苏维埃俄国§!的威胁，毕苏斯基决定支援他在乌克兰的盟友§Y西蒙·彼得留拉§!，并且为心中的§Y\"海间联邦\"§!奋斗，波兰人开始了他们的的军事冒险。\n\n红军被波军的突然参战打了一个措手不及，但是红军在天才指挥家§e图哈切夫斯基§!的指挥下，波军迅速败退，甚至被红军杀入了波兰境内，国内一片哗然。波兰的独立貌似又再次迷茫。\n\n毕苏斯基败而不馁，在面对图哈切夫斯基，托洛茨基，斯大林不合，斯大林掉头攻打利沃夫的时机，波军在§Y爱德华·希米格维§!，§Y西科尔斯基§!的殊死防守下，红军被切割来，面对毕苏斯基亲率的骑兵军，布琼尼只能落荒而逃，红军全面崩溃了。战线退回了波军刚刚交战的战线左右，人们称他为\"维斯瓦河上的奇迹\"。\n\n《里加条约》签订后，随着苏俄的世界革命论和海间联邦计划的同时破产，波兰走上了一条迷茫有趣的道路。"
 by_kasimir_event.9.a: "只有波兰自己才能保住自己的平安"
 by_kasimir_event.10.t: "元帅之死到战争"
 by_kasimir_event.10.d: "1935年5月12日，为波兰民族奋斗了一生的约瑟夫·莱门克斯·毕苏斯基在华沙安详去世，享年68岁。世界哗然，波兰举国悲痛，在其中纳粹德国的元首阿道夫·希特勒的表现更为特殊，他在柏林为毕苏斯基开了一个追悼仪式，在毕苏斯基生前，希特勒一直希望与毕苏斯基沟通，但却一直被毕苏斯基拒绝。\n\n元帅的继承者爱德华·雷兹-希米格维接过了航行的肩责，但他的自大和无能却没法让波兰的外交焕发光彩，拜波兰外交部长约瑟夫·贝克上校所赐，波法关系因为西里西亚问题和切欣问题而极度恶化，波军的改革也极其有限，直到大战开始，波军的坦克，飞机其实已经断代了。\n\n面对纳粹德国的蚕食，以及布哈林苏联值得称道的成就相比，波兰已经走上了一条不归之路，爱德华·希米格维站在台上，看着远方，还有毕苏斯基的身躯像，无力的倒在了一旁。\n\n1939年9月1日，纳粹的铁蹄踏上了波兰土地，波军的殊死抵抗却成了英法的牺牲品，随着希米格维的失踪，西科尔斯基的继续斗争，波兰又一次踏上了艰难的复国之路。" 
 by_kasimir_event.10.a: "希望渺茫的复兴..."
 by_kasimir_event.11.t: "从戎三十年（一）"
 by_kasimir_event.11.d: "\"我啊，没什么文化，这一辈子最骄傲的就是在军中打了三十多年仗了，挂了五次彩，有一次呢，那群不安分的犹太人同胞准备在华沙成造点动静，我于是凑了凑热闹，结果被一个该死的德国狙击手一枪打掉了右耳，当时我想，啊，我是不是要去见元帅了？\"\n\n中校卡西米尔·波尼亚托夫斯基率领着一支一百多人的队伍，在小径上前进着，确认没危险，他开始了自己的故事，见到自己的随从漫不经心，他狠狠的踹了一脚随从的屁股。\"臭小子！听到元帅的时候严肃点！那个只有一个蛋的希特勒都得躲着他！我呢，就是在他老人家的微笑下参军的，后来的希米格维，现在的菲尔多夫，对我来说都是个屁！\"\n\n波尼亚托夫斯基清了清嗓子，让人感觉更威严了。\"大战开始那年，许多兄弟跑去了法国英国，我想着我就狗命一条，大不了死在可爱的波兰土地上也是对得起元帅了，于是我跟着尤里乌什将军干了，看吧，我们波兰缺弹药，大炮，飞机，坦克，就是不缺将军！\"\n\"然后到后来呢？国家军完蛋了，法国完蛋了，西科尔斯基那个外交部长也坠机了，法国的一帮人跑去非洲打游击，安德斯的部队也随着布哈林的崩溃一哄而散了，等等，他们好像跑去哈萨克了？亚洲可不是好地方！他们在那里还好吗？\"\n\"老爹是在元帅带领下进攻乌克兰的时候阵亡的，等他被部队的人拉回家后，他就一口气了。\"\n\n\"他说，他辱没了家族的名声，我们的祖辈都是死在对抗外敌侵略死去的，就他开了一个先头。\"\n\"然后，家父给我了一个本子，说是家族的骄傲，让我一直传下去，可是我又没有妻子，也没有子嗣，我该怎么对得起他呢？\""
 by_kasimir_event.11.a: "\"中校忍着自己不流下几滴眼泪，很厚重的拿出一本有着年代感的羊皮书。\""
 Wait_for_next_version_tt: "§Y有关站边家乡军的派系（包括蜥蜴同盟，民族武装力量，临时政府与保守党）敬请期待下一版本§!"
 by_kasimir_event.12.t: "从戎三十年（二）"
 by_kasimir_event.12.d: "\"1939年我们败的一塌糊涂，我母亲得知我的部队第一掷弹兵师全军覆没了，投井自杀了，唔！我亲爱的母亲，您儿子还在为波兰母亲战斗着，可您却先去了！阿门！上帝保佑你！\"\n\"可是呢？我却没死，1942年我被打掉了右耳，我还是没死，1952年班德拉来屠杀我们波兰农民，我一枪就打掉他们头目，然后乌克兰人用刺刀往我身上刺了五条口子，于是我还是没死，1956年华沙起义，我没能参与，因为我患了该死的疟疾，医生都说我没救了，可是我还没死。\"\n\n\"死亡是我们家族的宿命，可是我还是没能死去。\"\n\"您这一次也会平安无事的\"一位娃娃脸的士兵拍了拍卡西米尔的肩膀。\n\"孩子，有时候，战争可不会说一定，谁知道我们什么时候一枪打过来呢？\"\n\"诺，你拿着吧\"少年接过了厚重的羊皮书，\"你可要管好咯，这本书出来的时候，还没有波兰呐\"\n\n\"可能吧，我们波兰人就是哭命吧\"中校露出一个很难看的微笑，然后注视着即将落山的太阳，没能再说些什么。"
 by_kasimir_event.12.a: "\"我一定会替您保管好这本书的\""
 by_kasimir_event.13.t: "从戎三十年（三）"
 by_kasimir_event.13.d: "部队继续前行着，尽管卡西米尔的亲兄弟亨利克极力劝卡西米尔娜赶快逃跑，一起去墨西哥去。\n卡西米尔娜没说什么，她只是坚定的看着她丈夫出征时的方向。\n\"不，我要等他回来，我丈夫不会死的。\"\n卡西米尔娜最后没能兑现她的诺言，在面对德军的凌辱下，这位坚强的波兰母亲咬舌自尽了。\n\n\"他妈的，卧倒！\"随着中校的一声怒吼，整个小队都赶快滚倒下来。\n\"手雷，三点钟方向，那个草丛，丢！\"\n随着两声爆炸声，两名乌克兰士兵呼啦啦滚了出来。\n\n\"去你妈的，这就是战争！三十年前在这里设伏，现在还是！去你妈的！\"中校怒吼着，\"愣着干啥啊？去找掩体啊！这是他们的伺候，大部队要来了！\"\n波军们于是一个个摸爬滚打，架好了机枪，一群满脸血污的，打着红黑旗帜的乌克兰骑兵冲了出来。\n等待的是波兰人的机枪的死亡怒吼，乌克兰人一个个倒了下来。\n\n在这股动静消失后，中校拍了拍身体上的灰，挥了挥手，突然一声清脆又极速的头盔碰撞的声音，中校的眼神呆滞了。\n\"队长！\"刹那间，他倒了下去，又一批乌克兰军队嘶吼着\"乌拉\"冲了出来。\n两个小时后，愤怒的波军丢下了十五具尸体，而整个班德拉派的小队的八十名士兵全部留在了森林中，一个破碎镜片的狙击枪下，中校和一名乌克兰娃娃倒在了一起。\n\n中校死的很干脆，子弹直接穿过了他的头颅。\n少年缓缓打开了羊皮书，上面挂满了一层层图片，雅盖沃大学.....毕苏斯基的背影....还有中校和他妻子的结婚合影，两人拥抱在一起，好像什么都不能让他们分开。\n\n少年颤颤巍巍的翻到了最后一页，他的心理防线终于崩溃了。\n瓦斯迪瓦夫 波尼亚托夫斯基 （1824-1863）\n战死于克拉科夫\n亚历山大·波尼亚托夫斯基\n（1852-1905）战死于满洲里\n瓦鲁佐·波尼亚托夫斯基\n（1890-1921）战死于扎鲁里内\n卡西米尔·波尼亚托夫斯基 战死于华沙\n克拉科夫\n利沃夫\n....\n（1914-）\n\"他妈的，我还是没死，我希望我战死在我可爱的妻子温暖的怀里，我们要生三个男孩，都去给毕苏斯基元帅当兵！\"\n\"这里是他妈的哪里？乌克兰的哪里？\"少年无助的站在了地上，整个队伍失去了他们的灵魂。\n波尼亚托夫斯基熟睡着，也许在天堂之中，他已经和他可爱的妻子，在毕苏斯基元帅的微笑下，跳起玛祖卡了吧？"
 by_kasimir_event.13.a: "至此，波尼亚托夫斯基家族的故事告一段落..."
 by_kasimir_event.14.t: "电影《你逃我也逃》大受欢迎！"
 by_kasimir_event.14.d: "自从波兰独立后，波兰的艺术生活也开始活跃起来，曾经有一个哲学的人说过，给面包，看马戏，群众心中自欣喜，波兰的艺术从来不逊于别人，波兰的电影事业也开始蓬勃发展。\n\n今日，由年轻波兰电影导演罗曼·波兰斯基导演的《你逃我也逃》在波兰上映，故事讲述着1939年波兰沦陷后，一群波兰戏剧剧组人员在美国特战队员与德国人斗智斗勇，最终戏剧般乘坐飞机前往加拿大的故事，《你逃我也逃》刚上映风评就炸了，影片更是流出了意大利，每一个波兰人都在兴奋的讨论电影里的剧情，剧中主角的演讲更是广受好评，甚至德国也有了偷偷的地下排片，因为有着极其滑稽的戈林形象。"
 by_kasimir_event.14.a: "今天，我也要看《你逃我也逃》！"
 by_kasimir_event.15.t: "元帅的葬礼"
 by_kasimir_event.15.d: "没有过多的装饰，也没有过多的喧闹，爱德华·雷茨-希米格维要沉眠于波兰土地之下了。波兰抵抗军们，无论是家乡军，国家军，甚至是人民军还有蜥蜴联盟的民兵纷纷脱下了军帽，都对着这位元帅，爱国者敬礼。\n\n菲尔多夫没有说太多，他稍微低下头，把一面波兰国旗覆盖在老人身上。\n\"波兰兄弟们，他走了。他是作为一个波兰爱国者勇敢的走了。\"\n\"我不知道他为什么要做出这样的决定，但是他还是做了，他像每一个无名战士一样，战斗在我们身边。\"\n\"我们要用无数的无名的希米格维，去铸造一个真的老亚当\"\n\n等到最后一层泥土盖上平地后，菲尔多夫重新带上了军帽，向着土堆厚重的进了一个二指礼。\n老哥，一路走好。"
 by_kasimir_event.15.a: "波兰士兵 爱德华·雷茨-希米格维 长眠于此"
 by_kasimir_event.16.t: "他的凯旋而归"
 by_kasimir_event.16.d: "随着一片沉寂之中，被尘封数十年的木棺之上，在华沙城的不知名教堂之中，一面波兰白鹰旗帜一个人就在那里安静的沉睡者。\n\n于是，他突然松动了身体，他想起来走走了。\n吹着身上的尘土，打理打理胡子，老人感觉自己好像散发了青春，他漫无目的的走在大街上。\n周围的德国警察看呆了，但是他们并没有阻止（倒不如说不敢阻止）老人如同神明一般，在天空飘扬着，飘向一个不知名的地方。\n\n\"我，约瑟夫毕苏斯基，我回来了，我宣布你们立刻组织好你们的部队。\""
 by_kasimir_event.16.a: "\"遵命！\"菲尔多夫忠诚的向着老人敬了一个双指礼"
 by_kasimir_event.18.t: "第一次波兰大陆会议（一）"
 by_kasimir_event.18.d: "\"所以他妈的那个傻蛋是来不来了？\"科莫罗夫斯基在桌子旁边踱步，他看了看菲尔多夫，瞧了瞧坐在桌子旁慢慢写着什么的哥穆尔卡，然后大口叹了一口气。\"你认为这样有啥用嘛？\"科莫罗夫斯基指向了墙壁挂着的四个头像。\n\n毕苏斯基的微笑旁边，西科尔斯基严肃的肖像让列宁也严肃了许多，随后是德莫夫斯基非笑不笑似的面容，构成一层极其滑稽的面纱。\n\"没办法啊，老哥，团结更多的人吧，我对他们其实也没什么兴趣.\"菲尔多夫耸了耸肩。\n\"瞧，来了！\"\n\n萨尔斯基几乎是连滚带爬的撞开大门的，哥穆尔卡吓了一大跳，虽然早有耳闻，但是这个面前的似酒鬼的人，于是就是狂热的军国派分子？萨尔斯基？\n哥穆尔卡忍不住冷笑一下，四方都坐在了桌子旁。\n\"为了波兰，我们讨论讨论吧。\"菲尔多夫开始了会议。"
 by_kasimir_event.18.a: "实属无奈之举"
 by_kasimir_event.19.t: "第一次波兰大陆会议（二）"
 by_kasimir_event.19.d: "\"首先，我们需要讨论一下，各位有多少人手。\"菲尔多夫清了清嗓子。\n\"慢着！我说，这群王八蛋和圣人德莫夫斯基在一块是什么意思？\"萨尔斯基摘下了帽子，单指指向了墙壁的四个画像。\n\"啧啧啧，一个是给德国人下跪的混蛋，一个是给昂撒犹太低头送死的炮灰，哦，我的天啊，还有犹太鞑靼分子！\"\n\"萨尔斯基主席，我们不谈这些，我们还是好好讨论一下兵力吧.....\"菲尔多夫压着怒火微笑着说。\n\n\"我看，先把这个犹太猪俄国鬼子扔到一边.....\"\n还没等萨尔斯基说完，科莫罗夫斯基重重的把帽子摔在桌子上，朝着萨尔斯基怒吼着\"我操你妈！\"\n萨尔斯基也不甘示弱\"你个狗军棍！\""
 by_kasimir_event.19.a: "天啊，会议已经没办法控制下来了！"
 by_kasimir_event.20.t: "第一次波兰大陆会议（三）"
 by_kasimir_event.20.d: "\"同志们！我看，在德国人来之前，我们还能继续吵一会！\"哥穆尔卡开口了。\n\n科莫罗夫斯基收回了他准备砸在萨尔斯基身上的拳头，恶狠狠的盯着萨尔斯基，回到了桌子上。\n\"我们人民军，缺少弹药，但是我们打穿了一小点通往莫斯科专员辖区的秘密军备线，高尔基旅还有些俄国红军在秘密支援我们.....\n\"看吧，他们甚至和赤匪在一块....\"看着科莫罗夫斯基准备升起的拳头，萨尔斯基把剩下的话咽进了肚子里。\n\n\"我们需要中央的粮食支援，关于，武器我们大多都是黑市上流传的西俄罗斯战争留下的武器，我们大概有1万5千人，如果有着一定的支援，我们可以拉起两万多的部队。\"\n\"谢谢你，人民军的同志，我会组织些武器和粮食补充给你们的，虽然我们以前矛盾不小。\"菲尔多夫低了低头，哥穆尔卡停下了发言，继续写着他的东西"
 by_kasimir_event.20.a: "人民与家乡本应同源"
 by_kasimir_event.21.t: "第一次波兰大陆会议（四）"
 by_kasimir_event.21.d: "\"好，我代表我们国家军说几句，毕苏斯基元帅万岁，西科尔斯基总理万岁！菲尔多夫元帅万岁！\"科莫罗夫斯基狠狠的盯一下吓得不敢抬头的萨尔斯基。\n\n\"我们波兰国家军现在在丛林里各自为战，不过我可以在14天之内让他们全部集合，大概能有5万部队的力量。\"\n\"我们不需要中央的帮助，反而兄弟部队可以求助我们。\"\n\"好，我明白了\"菲尔多夫稍稍笑了一下。\n\n\"我们家乡军和国家军一起行动，科莫罗夫斯基元帅，可以吗？\""
 by_kasimir_event.21.a: "\"嗯！毕竟为了波兰！\""
 by_kasimir_event.22.t: "第一次波兰大陆会议（五）"
 by_kasimir_event.22.d: "\"请吧，萨尔斯基同志。\"科莫罗夫斯基漏出一些诡异的微笑。\n萨尔斯基缓缓站起，走向庞大的德莫夫斯基画像前。\"阿门......\"\n\n他于是开口了。\n\"我们民兵，可以大概组织2万人.....emmm，也许2万5千人？\"\n菲尔多夫稍微皱了一下眉头，\"于是你连你自己的部队都不清楚吗？\"\n\n\"扩张！我们一直在扩张！\"萨尔斯基气恼了，但是又不能发作。\n\"我们需要许多枪支弹药，我们民兵用的大多都是老爷枪！\"\n\"我可以支援你们一点点，请吧。\"\n\n科莫罗夫斯基元帅又漏出一丝看猴子的微笑。\n\n\"好的.....谢谢.....不过我们民兵已经熟悉了波兰每条脉络，我甚至知道汉斯弗朗克喜欢的妓女住在哪里....\"\n会场上传出了一阵哗笑声"
 by_kasimir_event.22.a: "民兵亦将投入战斗"
 by_kasimir_event.23.t: "第一次波兰大陆会议（六）"
 by_kasimir_event.23.d: "会议在协商中结束了，虽然一度无法进行，但是四方还是达成了些许意见统一，国家军和家乡军将在华沙城中心发动暴动，人民军则是尝试联络德共发动起义，蜥蜴联盟则是在农村进行刺杀和破坏。\n\n四人在各自的肖像台下，说着些什么，萨尔斯基于是还是嘟囔着，但是因为一些原因还是没说出来。\n计划被确认下来了，没有一方的反对，起义计划行动被正式命名为\"救国行动\""
 by_kasimir_event.23.a: "真正意义上的团结与救国"
 by_kasimir_event.24.t: "面包的革命"
 by_kasimir_event.24.d: "自由往往需要鲜血的奉献，拉断铁链亦需要强壮的双手。在1960年克拉考农民暴乱后，可观的利益使得总督府开放了波兰人买卖物品的权利，虽然收税是少不了的，但是最起码波兰人用不着为一块肥皂去偷偷摸摸地去和德国人冒险交易了。\n在华绍，面包师扎莱卡斯基往烤箱里呼着热气，将五块大小不一的面包逐个翻来翻去，吸了一口旱烟，眼神无助地望着身旁。是啊！这个时候，谁还有钱能买面包呢？\n扎莱卡斯基很显然明白这个道理，但是他还是执着于此，从黑市里买些小麦，磨粉，土豆，混成面团，烤制。仿佛做面包已经成了他最神圣的使命，于是不管如何，地下国流通的兹罗提，还是以些许日用品的交换，扎莱卡斯基仍然在和他仅存十五岁的儿子苦苦坚持着。\n不知为何，扎莱卡斯基的眼框忽然湿润了；原来是今天的面包店连一名顾客都没有，也没有人来以物易物，是他们都没东西可以交换了吗？还是他们都已经饿晕了？\n扎莱卡斯基很想去街上看看他可爱的邻居们，当他努力撑起身子的时候，两副强而有力的身躯将他驱赶回去。\n扎莱卡斯基慌了神，怎么会是他们？德国宪兵！难道又来收税来了？还是说，自己秘密给抵抗军提供情报的事情被发现了？\n\"老板，我们来买面包。\"为首的德国军官挤出一个很难看的微笑。\n\"好的，军爷们。\"扎莱卡斯基拖着自己沉重因饥饿浮肿的身躯，拿起了铁夹。\n\"选吧，军爷长官们。\""
 by_kasimir_event.24.a: "\"我们全都要\""
 by_kasimir_event.25.t: "沉默的国王"
 by_kasimir_event.25.d: "\"卡尔·阿尔布雷希特陛下。\"\n克拉考的一处无名监狱之下，宪兵长官冯·布托·施米茨拉开了生满铜锈的铁门，随着一声声门支的抗议低吼嘶哑的嘎嘎声，尘封了好几天的小屋终于被打开了。\n\"陛下。\"施米茨笑眯眯的对着眼前趴着无力的男人说道，男人已经年老气衰，上气接不上下气，身上破旧生满补丁的戎装上，一道道暗红的血迹清晰可见——这是那群纳粹的杰作。\n男人一声不吭，就好像已经习以为常了一样，他轻蔑地看着施米茨。\n\"陛下，您明明是我们伟大的大日耳曼人，有着高贵的血统，为何要屈服于那些低贱的斯拉夫人呢？斯拉夫人都被我们打败了，这不已经充分证明了他们只配当我们的奴隶吗？\"\n\n男人只是沉默，而施米茨似乎已经司空见惯了，于是他拿出了那张厚厚巴巴的纸。\n\"陛下，只要你承认你的雅利安血统，别再和这些底下民族交流，我们会为您提供上等容克的待遇。再说，这本来就是您应得的，何必自讨苦吃呢？\"\n\"签字吧！\"施米茨有些恼怒了，他试着以这份怨气去盖过阿尔布雷希特的不屑，然而，男人仍然保持着沉默。\n\"那么，我告辞了。\"施米茨再次拉上了厚重的铁门，副官急忙给他点上一根烟，\"这次招了没？还打吗？\"\n\"不打了，打了这个倔骨头也不说，死了还要我们负责。\"施米茨猛吸了一口烟。\"话说这老头在这里不招供多久了？\""
 by_kasimir_event.25.a: "\"自从1940年抓进来开始，已经二十三年了。\""
 by_kasimir_event.26.t: "仁慈的馈赠"
 by_kasimir_event.26.d: "\"嗯，好的，一...二...三...四...五...一共五个面包，希望您们能喜欢。\"扎莱卡斯基拿出一块老报纸，把面包细致地包好，同时应付着德国军官的嗬嘘问暖。\n\"最近生意还好吗？\"\n\"托您的福，都能卖干净。\"\n\"最近有游击队来骚扰你吗？\"\n\"拖您们和元首的福，我们很安全。\"\n\"你的妻子现在还好吗？还是说你还是单身？\"\n扎莱卡斯基身体顿了一下，\"算了算了，别提了...拿好吧，军爷们\"\n军官微笑着，对着他的随从招呼着，于是随从转头就走。此时，扎莱卡斯基猛的一下冲了出去，用尽全身力气抓住了军官的腿，自己无力地瘫倒在旁边，脸上划出一道可怜又失神的泪痕。\n\"行行好，军爷...我的孩子还饿着呢...\"\n这下换成德国军官感到诧异了：\"你这样做是为了什么？\"\n\"军爷，求求你赏点钱吧，日子过得已经很艰难了...\"\n\n\"看吧，这些波兰佬就是吃不了半点好脸！\"随从狠狠地踢了扎莱卡斯基一脚，扎莱卡斯基发出一声沉闷又痛心窝子的哀叹声。\n\"可这些面包都是你这个月以来的税款啊？\"军官已经丢掉了他虚伪的面具，冷淡地蔑视着挂在他身上的扎莱卡斯基。\n\"军爷...您行行好吧，有东西换也是好的...\"\n\"好，拿东西换是吧？你这该死的波兰佬，敬酒不吃吃罚酒，我请你尝尝子弹！两颗子弹换你五个面包，剩下三个是赏赐你的！\"随后随从们活生生把扎莱卡斯基拽了下来，然后一个肘击，掏出了配枪。\n\"嘭！嘭！\"扎莱卡斯基猛抽了一下，随着后续的三声枪响，扎莱卡斯基再也不动弹了。他的双目至死未能合上，死死盯着那五块面包的方向。"
 by_kasimir_event.26.a: "在一场平常不过的事情里，日耳曼帝国对波兰民族展现了他们最\"仁慈\"的馈赠。"
 by_kasimir_event.27.t: "无声之怒"
 by_kasimir_event.27.d: "在德国强盗走后，躲藏于堡垒和废墟中的波兰人们走了出来，扎莱卡斯基至死未能瞑目，死得很是难看。令人难以想象的是，在1937年雄心勃勃的扎莱卡斯基用自己的一桶金开了一家面包店，不论是牛角面包、白面、土豆面包，还是蛋糕...可谓是种类应有尽有，然而那名\"面包大亨\"扎莱卡斯基，如今却悄无声息地躺在地上。\n\n人们已经对死亡麻木了，三名心善之人把扎莱卡斯基身子清理干净，安稳地埋在土里...\n\"即使他的妻子在黑市偷窃时被征税的德国人打死了，他仍然在做着他那五块面包，恒久不变...\"桑海姆感叹道。\n\"没办法，为了活着嘛...即便是如今，我也没在他的面包里吃到过杂物...你们吃过德国佬发的那个\"救济粮\"吗？他妈的，希特勒的老婆据说就是吃这个死的！\"罗科奥斯特附和着，随后把泥土压实。\"默哀吧...\"艾尔托娃抚摸着少年的头发，突然泪眼婆娑...\n\n\"妈了个巴子，哭什么呢？我的老妈被这群畜生打死了，我老爸也被他们打死了！同胞们，你们真的打算做待宰羔羊吗？\"老扎的儿子，乌莱卡斯基说道，对地面重重挥了一拳。\n\"老爹，老妈，放心吧，迟早有一天，我会让这群匪徒们会付出代价的！\"\n\"我们走吧...\"众人纷纷逃回他们的栖息地之中，只留下在小雨中身穿单衣的乌莱卡斯基。"
 by_kasimir_event.27.a: "\"老爸，老妈，我会让你们得以瞑目的！\""
 POL_ROD.7.t: "人民军踏步向前"
 POL_ROD.7.d: "\"可爱的华沙，我们回来了！\"\n\"我们解放了！我们自由了！我们胜利了！\"\n\"波兰万岁！人民军万岁！\"......\n\n 卡林斯基上校走在街上，战士们的欢呼声在他耳边回响，他本人也露出了喜悦的笑容。是的，经过英勇的浴血奋战，人民军终于拿下了华绍——不，现在应该叫华沙——并彻底铲除了德国人的最后一点势力。汉斯.弗兰克，这个残忍却又怯懦的恶棍，甚至在战斗尚未结束时就收拾细软，和他的心腹们一起，如同一群丧家犬般狼狈地逃离了这片土地。至于被他们抛下的德国士兵？他们一开始还在负隅顽抗，但得知自己成了总督的弃儿后，彻底丧失了斗志，在最高长官的带领下投降了。\n\n \"胜利了...是啊，胜利了...\"卡林斯基喃喃自语着向前走。突然，他感觉自己踩到了什么东西，低下头一看：是一面总督府旗帜。他环顾四周，这才看到，昔日四处悬挂的万字旗和白底黑条剑旗被四处丢弃，像一块块用旧了的脏抹布。取而代之的，是一面面象征着波兰人民不屈意志的，鲜艳的白红双色星旗。\n\n 恍惚间，过去的画面如走马灯般在他面前一一闪过：那是一九三九年，德国刚向波兰宣战的时候，卡林斯基作为老共产党员，义无反顾地选择了参军，上前线保家卫国。可悲的是，仅仅一个多月，波兰就倒下了，德国人在一片废墟中训养出了\"总督府\"这头血腥的怪物。但他没有放弃，他与一群志同道合的同乡一起加入了人民军，继续在祖国大地上与侵略者作斗争。苏德战争爆发后，卡林斯基十分高兴，他相信这个列宁缔造的伟大国家一定能打倒邪恶的德国人。然而，一切的结局令他大为震惊：苏联倒下了，并最终四分五裂。\n 在那之后，卡林斯基消沉了一段时间，直到十多年后西俄战争爆发，国防军狼狈溃败时，他和战友们的兴奋难以言表。经过精心策划，他们在德国人手忙脚乱时，在华绍发动了起义——所有人都认为起义之火将燃遍祖国，却对西俄革两年后的战败解体始料未及。结果可想而知，人民军除了战友们的尸体，什么都没得到。\n\n 时间仍在飞逝，由于悲惨的处境，开小差甚至脱队的人越来越多。但卡林斯基坚持了下来，他坚信波兰不会永远灭亡。命运女神最终对他露出了微笑：内战爆发后，德国人无暇东顾，在准备更充足、力量更强大的起义启动后，人民军迎来了渴求二十余载的胜利。\n\"是时候了...\"卡林斯基扶正了军帽，\"波兰已经摆脱了黑暗的过去...\""
 by_kasimir_event.28.t: "东行漫记（一）"
 by_kasimir_event.28.d: "\"阿尔贝托！\"\n眼见没人回应，教官托莱斯又大声地朝着那群喧哗的毕业生吼着道：\"阿尔贝托·冯·贝格尔斯！\"\n\"到...我在这里...\"喧闹过后，一个畏畏缩缩的高个子缓缓站起，忧郁的蓝色瞳孔下，眼神中透露出些许慌张和恐惧。在众目睽睽之下，他走上了台子。\"希特勒万岁！\"托莱斯狠狠地瞪了阿尔贝托一眼，高抬左手，先是向台上巨大的元首相敬礼（它好像已经在这里挂了很久了），然后将一名勋章挂在了阿尔贝托的荣装上。\n\"希特勒万岁！\"托莱斯快要气疯了，但是在军校的毕业典礼上，他强忍着怒火，微笑着拍了拍阿尔贝托的肩膀，轻声又有力的说道。\n\"从今天开始，你毕业了，阿尔贝托，你是我带过最愚蠢最蠢蛋的学生！希望一个月后，总部会派你去西伯利亚看你的酒神与太阳神吧！\"\n\"那是尼采！托莱斯教官，我看的是康德、黑格尔。现在在看胡赛尔，还有步兵操练...\"这个时候，阿尔贝托又忽然较起真来了。托莱斯深呼吸着，仿佛要随时就要发作一样。\n托莱斯本来还想骂几句的，但根据惯例，阿尔贝托已经毕业，成为了一名待议士官少尉。这也就意味着阿尔贝托已经不再是他的学生，只是一名为大日耳曼国的千年之梦而战的官兵。\n托莱斯静静的回想着，五年来，阿尔贝托在一次破冰聚会上，支支吾吾半天不开口被他怒骂体罚跑十五千米的场景，又浮现出阿尔贝托重复着不知道谁的话\"位我上者，灿烂星空，道德律令，在我心中\"，导致自己的指令没听到，气的狠抽了三鞭的夏天。\n\n哎！要是去了法国，那还好，要是被调去波兰，莫斯科那该怎么办呢？他这种脾气态度，在学校挨自己的鞭子就算了，在战场上是要丧命，被老兵欺负的，他应付的来吗？\n托莱斯最终还是没有骂出口，他叹了一口气，紧握着阿尔贝托的手。\"不管到了哪里，都记得我托付给你的东西，好吗？别把命丢给斯拉夫佬，行吗？\"\n托莱斯的语气一下子温柔了起来，让阿尔贝托一下子没有反应过来。"
 by_kasimir_event.28.a: "同时，托莱斯教官已经在高声呼叫下一位毕业学生了。"
 by_kasimir_event.29.t: "东行漫记（二）"
 by_kasimir_event.29.d: "犹豫了许久，但他还是头脑一热。阿尔贝托打开了府苑的大门，横长许久的草已经疯狂地拔起，仿佛要覆盖整个花坛的小径一般，这里已然荒废了不知多长时间。阿尔贝托从中踩出来一条通道来，谁又能想得到，这居然是他阿尔贝托的家！\n\n他想起他小时候在草地上玩着铁甲锡兵，妹妹和母亲在一旁追逐蝴蝶的场景；还有那时，父亲在远处抽着旱烟，在远处偷偷笑着，随后大踏步跟随着士兵远征的场景。虽然奥匈帝国早已不在，但是莫扎特的琴声却一直在每个奥地利人的心中回响着。在欢快的圆舞曲中，他的父亲与他的母亲爱得死去活来，随后没过多久就定了婚，第三年就生下了他，第五年生下了他的妹妹。\n\n这就是阿尔贝托对他母亲与妹妹的最后回忆了，到阿尔贝托不再喜欢吃玉米的年纪时，家门旁的红白红旗已然不知不觉地染上别的颜色了，父亲的双鬓也愈发斑白。他在军营很忙。某天，母亲突然失声痛哭了起来，而父亲也只是沉默不语。随后的随后，阿尔贝托才知道什么叫做，德国、奥地利与波兰。\n\n虽然父亲并没有出现在东方战场，但母亲终究还是不再欢笑。\n\"你个疯婆娘！天天说你的波兰祖国没了，被我们德意志人拿走了，我的祖国奥地利一年前就没了！\"\n\n后来父亲去了法国，我也去了军校。待第二年时，父亲只是淡淡地说，我的母亲和妹妹死在了英国人的轰炸机下。\n我并不想反驳父亲，。显然，我知道敌人的飞机从来没出现在奥地利上空过。\n\n我母亲和妹妹的墓就立在旁边，我忍不住脱下帽子，一言不发地轻抚着那掺着泥土的石碑。\n\n随着烟斗摔落的声响传来，阿尔贝托看向远方，发现一身威严的军装笔直地架在杂草之中。\n\"回来了？\"\n\"嗯，回来了。\""
 by_kasimir_event.29.a: "\"我的童年结束了，我的父亲也不再年轻。\""
 by_kasimir_event.30.t: "东行漫记（三）"
 by_kasimir_event.30.d: "\"阿尔贝托家里的噩耗让我无不坐立难安的时候，说实在的，如果要不是老首长下了死命令∶\"一定让老阿尔贝托的儿子成为一个真男人\"，我早就放弃他了，他是真的那种榆木脑袋，你根本不知道他在想什么，他总是说胡话，相比来说，我清醒太多了。\"\n\"我们都是喝着多瑙河水长大的，遥想当年，经济危机...哎，太可怕了，我参加自由军团的时候，他才刚出生。\"\n\"两人几乎同时昏倒，别说什么家庭冲突，我记得好像因为他母亲和妹妹的事情，阿尔贝托和他父亲关系本就不好。\"\n\"所以我来了。\"\n\n\"老阿尔贝托的身体还是很硬朗，他身上打着补丁的戎装依旧不减当时在维也纳城头对抗赤党的英姿雄采。根据护士所说，他早就醒了，只是不愿意在儿子面前流泪罢了。\"\n\n\"托莱斯教官，您怎么来了？\"一道柔和又夹杂着些许惊讶的声音把我拉回了现实，不知道他何时从病床上下来的，我急忙把他扶到病床上。\n\n\"傻孩子，我来看看你爸，你怎么也干趴下了，发现康德的话没啥用？\"\n\"那您就去吧，和我说话干什么，假惺惺的。\"阿尔贝托撇了撇嘴，又回到床上。\n\"我努力过了，那孩子一直不肯加入我们。\"\n\"阿尔贝托！\"\n\"在！\"阿尔贝托从病床上弹射起来，站的比我教他五年以来直的多了。\n\"你参军是为了什么！\"\n\"为了大日尔曼帝国的荣耀！\"\n\"为了大日耳曼帝国的荣耀！\"\n\"为了大日耳曼帝国的荣耀！\"\n\n\"傻孩子，为了你家里的老小和你的小命。\"\n\"长官，我不是什么好教官，我也怕死。\"\n\"我怕的很，我的学生已经死的差不多了。\"\n阿尔贝托又哽咽了，随后再次哭了起来。假如是在军校，我早就把他赶出去了，让他在元首的肖像下做一千个深蹲，但是我早已经不是他的教官，我别无他法，我只能心酸的看着这一切，握紧\"熟睡\"的老阿尔贝托的手，让他脸上的青筋好受点。\n\n\"谁会喜欢自己的孩子哭泣呢？更何况，也许就是永别呢？即使德国获得了胜利，柏林的清下嗓子都要让巴黎、伦敦慌张一整天，但是，一个个活蹦乱跳的青年从军校出来后就再也不知道去了哪里，留下的只是一张又一张的通知书，我们的生活真的比以前更好了吗？\"\n\"总督府...\"阿尔贝托擦掉了眼眶周边的泪水。"
 by_kasimir_event.30.a: "阿尔贝托与我几乎异口同声地喊了一句：\"他妈的！\""
 by_kasimir_event.31.t: "东行漫记（四）"
 by_kasimir_event.31.d: "\"阿尔贝托，明明是军人世家出身，结果出来了一个对政治和军事都一点不感兴趣的孩子...这注定已经是半条腿踏进地狱了。\"\n\"死了十五次还在和我们作战的4859，我们现在却连他的名字都不知道！那群专门抢略弹药，在死亡赛道上疾驰的赛车手，我们他妈的到现在还只知道他可能是个俄罗斯人，还可能是被打散的白罗斯中央拉达第一方面红军的部队，而且还有在地下躲藏与我们作战二十余年的菲尔多夫...\"\n\"阿尔贝托，你听着，他们也只是普通人；更何况，我们以前战胜过他们，现在失败的依然是他们，我们完全有足够的实力，你务必要记住我教你的东西。\"\n\"阿尔贝托没有回答，只是依然无助的看着窗边的天际，我给他留下了一个厚厚的本子。\"\"你可以写点东西什么的，也好让你爸妈关心。\"\n\"嗯。\"\n\"然后离开医院两小时后，我就被你们逮捕了。\"\n托莱斯拖着被连夜拷打的残躯，充满意味地嘲讽着眼前的盖世太保。\n\"你说完了吗？\"\n\"我要说的，前人都说过了。\"\n\"所以，你他妈一个区区中校，组织了一个所谓自由奥地利联盟？诱骗我们无数大好青年去投奔你的荒唐梦想？\"\n\"是的，先生。\"\n\"将那个阿尔贝托严加看管，若有任何问题，就也逮捕过来！\"\n盖世太保海因德希密密麻麻写着若干罪名，\"反对元首罪、分裂祖国罪、教唆青年犯法罪...\"\n\"慢着，你写错了一点。\"\n\"我可没有分裂我的祖国，我的祖国是那个充满鸟语花香，人们伴着维也纳歌剧院的琴声而纷纷起舞的祖国...是你们这群恶徒，将琴弦拔断，换成毛瑟的枪响；将乐队拆散，换上火炮的轰鸣，杀戮是你们的演奏，而自相残杀才是你们的交响曲...\"\n\"犯人对罪名无一反对，根据《大日耳曼帝国1950年宪法》对反革命分子汉斯·托莱斯进行枪毙，立即执行。\"\n托莱斯拖着带血的长铁链，最后一次看向这个拂去尘埃的天空，后人会怎么去看待他这个中校的所作所为？他战死的学生们会喜欢他老师这样的结局吗？阿尔贝托，他又会如何去开始他的冒险呢？\n对于创建自由奥地利组织这件事，中校一人压根不可能做到的，但是为了更多人的安全...\n我也要离开这个世界了，我无悔于托莱斯之名...\n学生们，老师我也来了。\n托莱斯闭上双眼，静候命运到来。\n一排枪声响后，托莱斯从震惊中苏醒，然后是暴怒，他用着残躯朝大面的万字旗怒吼着，也同时死死盯着一排排颤抖着的步枪们。\n\"你们他妈的抖什么呢？害怕了吗？\"\n就像托莱斯教官一次次在军校里朝着学员们怒吼着。\n\"在战场上，丢失了可就是你的命！\"\n这句话托莱斯再也没有说出口，"
 by_kasimir_event.31.a: "枪声又猛地响了起来，一颗子弹不偏不倚，射穿了托莱斯的头颅。"
 by_kasimir_event.32.t: "东行漫记（五）"
 by_kasimir_event.32.d: "哪怕我愿意与否，太阳明天照常升起，费尔巴哈也不会再长出几根胡子来，尼采也不可能从坟墓里爬出来（如果他能真的做到）继续说些上帝已死的豪言壮语，可是我，阿尔贝托，的的确确要死了。\n\n随着一曲《战友进行曲》的演奏结束，一群不知道哪里赶过来的小女孩们跳着圆环舞，将一朵朵花束丢在我和我的同僚身上。\n\n一个小女孩蹦蹦跳跳的跑在我身前，哎，如果妹妹现在还活着，她也该有那么大了吧！\n\"你几岁啦，小妹妹？\"我弯下腰去，尝试拨开我那死板麻木的脸。\n\"十岁啦。\"看着孩子眼中的童真，我忍不住轻抚者她的长发，然后随着一声铃响，孩子们都急忙跑散了。\n一个身材高大，挺着啤酒肚（天啊，你绝对能想象他喝了多少啤酒来到这里的）的少将站在火车旁，我真的有时候很可怜他衣服上的第二颗纽扣，他是怎么在这地狱的环境下坚持下来的。\n\"此次出征.....\"\"是为了大日耳曼帝国的荣耀\"一声清脆的嘀咕声从我耳边拂过。\"不，你错了，这个时候应该是为了消除祖国最后的困难。\"我忍不住反驳道。\n\n少将怔住了，他故意换了一种新的说法，然后狠狠的瞪了我们两人一眼，我于是朝着那个声音的传出地友好的微笑了一下，等将官演讲完毕，集合准备上火车的时候，我们总算完全打量了对方的长相。\n\"约翰·闵采尔\"，一只手伸了过来。\n我知道，这是友谊的表现，我紧紧的握住了闵采尔的手。"
 by_kasimir_event.32.a: "\"阿尔贝托·冯·贝格尔斯\""
 by_kasimir_event.33.t: "东行漫记（六）"
 by_kasimir_event.33.d: "\"所以你就戴着这本破书还有你头上的钢盔就稀里糊涂来到这了？\"随着火车吱呀吱呀的摇摆，给闵采尔摔了一个踉跄。他骂道：\"开车的你是赶着去抢妓女还是喝啤酒啊？\"然后车头传来一声\"你妈也很好用\"之类的垃圾话，惹着他哈哈大笑。\n\"这可不是破书，是康德写的《纯粹理性批判》，还有这个呢，是我教官送给我的日记，我可以写着记点东西。\"我耐着性子，忍着不笑刚才因火车抖动而摔倒的闵采尔。\n\n\"康德，我可搞不懂那玩意，我就是臭种地的，没啥文化，搞不懂你们这些文人的爱好。\"费了好大股劲，闵采尔才终于从他的口袋中摸出两瓶啤酒来。\n\"不是规定了行军路上不准喝酒吗？\"这会轮到我诧异了。\n\"规定还说，禁止走私贸易，你们这些贵族不还是半夜派人来偷偷来我们这里买点啤酒。\"\n闵采尔递来一瓶啤酒，\"喝吧，自家酿的，这可是好东西！到了波兰，可就没这酒喝咯！他们那里的酒，搞得跟可以当烈性炸药一样。\"\n\"总督府...\"我无奈地接过啤酒。\n\n\"又没有秘密警察，你怕啥呢？\"他已经喝上了。\n\"话说，老弟，你去哪里服役？\"\n\"克拉考\"\n\"好好好，那我们是一路人了。\"闵采尔拍拍我的肩膀，继续喝着啤酒，他的热情让我没办法拒绝，于是我也开始灌了起来。\n\"我说嘛，这还真挺棒的！\"\n闵采尔因为有人赏识他的啤酒感到高兴，我因为有一个路上一同送死的人感到愉悦。\n\n\"我，闵采尔，在东线，一个人没干掉过，当了三年的医疗兵，后来呢，就被送去军校学习了，谁知道，学的是炮兵，我是一窍不通啊！没想到，现在还混了一个克拉考第一掷弹兵团炮兵连一班班长当当.......\"\n\n\"什么？克拉考第一掷弹兵团，炮兵连？\"我猛的大喝道：\"汉斯·闵采尔！\"\n\"啊？什么，你发什么疯？\"闵采尔被这阵势吓住了。\n\"我，克拉考第一掷弹兵团炮兵连连长...\"\n\"啊啊啊长官，长官！\"闵采尔跪在地上，头磕得是一个比一个响。\n\"然后后来怎么样了？\"我吐着胃里存残的酒。\n\"妈的，还能怎么样？你把我当马骑，还前进，前进！的，你是我长官，我最怕长官了，但我更怕一个红着眼耍酒疯的疯子！\""
 by_kasimir_event.33.a: "闵采尔没好气地推了我一下，在窗户旁静静的看着飞过的候鸟。"
 by_kasimir_event.34.t: "东行漫记（七）"
 by_kasimir_event.34.d: "\"在[Root.GetDateText]，因确认了本人为其长官身份后，班长闵采尔向我磕头数十次...\"\n\"诶呀呀，你不要再写啦！就算写，也不要读出来！\"闵采尔有些恼羞了，他试图从我手中夺过那本又厚又沉的笔记，我自然是不会给的。\n在十来分钟的嬉笑缠打后，闵采尔最终还是无力地瘫倒在一旁。\n\"你就像田野里那奔跑的野兔一样难抓...他妈的...\"闵采尔嘟骂起来。\"嘿！下属不准啵长官嘴！\"我装作恼怒，但显然，我对于装作恼怒是一窍不通的，在对视了不到半分钟后，我们都憋不住互相笑开了。\n\"你是我见过最好说话的长官。\"\n\"毕竟我是头一回当这长官。\"\n一面巨大的宝剑白黑旗从眼边闪过，随后是很高的铁牌，上面写着\"总督府\"。此时我才意识到，我已经离开祖国了。\n\n\"诶，闵采尔，到总督府了。\"我本想拉地上的闵采尔一把，却发现不留神间，他早就溜到我旁边看起一望无际的麦田了。\n\"哎，看地图还没察觉，直到登上火车后如此之久，我才意识到祖国的边境是多么狭长！\"闵采尔感叹道。\n\"嘿，农民兄弟（波兰语）！\"闵采尔脱下军帽，朝着麦田里的奴工们摆着手欢呼着，我被这一声热情的异国语言猛的一怔，波兰语？他怎么会波兰语？十五年了，自妈妈和妹妹去世后，我再也没听过波兰语了。\n\"别诧异，阿尔贝托长官，我是一个农民，我有许多的农民朋友，大战之前，我就在这边附近住着，当时波兰人还在这里竖起牌子站岗呢！\"\n\"我们和波兰人一起喝着酒，各自跳着自己的舞。直到大战，哎，大战啊！\"\n\"那这么说来，我算你第一个不是农民的朋友咯？\"我趁着兴头小心翼翼地说了一句。\n闵采尔没好气地回了一个白眼，\"是又怎么样，不是又怎么样，你感觉是就是。\"\n\n我有点恼火了，\"我说，你最好别乱打招呼，那些波兰人神出鬼没的，死了十五次还在和我们对抗挑衅的4859，专门抢劫弹药的，那死亡赛道上疾驰的赛车手，还有在地下躲藏与我们作战二十余年的菲尔多夫！\"\n\"真有那么玄乎？4895不是早死了？\"\n\"是4859...\"\n\"对，4859，他不是二十年前就在华绍五花大绑被枪毙了吗？宪兵开了六枪他才倒下。\"\n\"那么好，如班长闵采尔所见，我们对战的是有不死之身的波兰军官，要么就是我们的情报部门贪腐问题实在是太严重了！\""
 by_kasimir_event.34.a: "\"那我还是愿意相信这个，毕竟我可不想和一个死了十几次的鬼魂打仗！\""
 by_kasimir_event.35.t: "东行漫记（八）"
 by_kasimir_event.35.d: "\"你是说，那个笨蛋就这么跟着那个\"死亡赛车手\"走了？\"\n闵采尔有些不知所措了，好像三年东线战场的从军经验一扫而空了。\n\"是啊，\"死亡赛车手\"，精英中的精英，特长是伪装成德国军官独自一人抢卡车送弹药，现在估计偷了快三十五车了。你有时候不得不思考我们的先辈究竟是怎么打败他们的，还是他们的后辈比我们成长得强多了。\"\n\n阿尔贝托不禁回想起那个倒霉蛋，那个因为喝醉酒，被\"死亡赛车手\"忽悠一路跑到高尔基地区，被抓了一个全的家伙。当他被当做\"军校的耻辱\"在军校里任人嘲笑时，他的全身都在颤栗着。如果给他机会，他绝对会发誓：\"他妈的，我再也不喝酒，也不想再和斯拉夫人打仗了！\"\n\n可是身为欧洲大战的胜利者的大日耳曼国没那么仁慈，于是他又被送往战场。出于心中的一丝丝怜悯，阿尔贝托最终还是没去过死者公告栏去寻找那个倒霉蛋的名片。\n\"还有就是，躲在农民之中的波兰佬的抵抗军...\"还没等阿尔贝托说完，随着一声剧烈的爆炸声，阿尔贝托和闵采尔被震飞了半米远。他们还没反应过来，卡车声和零碎的步枪声就接连传来。\n闵采尔强忍着疼痛，从窗口悄悄看着：火车头已经着火了，一小群波兰人呈集散式靠拢了过来，时不时还要打上几枪，他们中已经有人试图踏上火车了。\n\"趴着别动！这个时候你还要侦查呢？\"没等闵采尔缓过神，阿尔贝托赶忙把闵采尔从窗户边上拉下来。\n\"准备战斗！\"闵采尔大吼着，他拿起了步枪，死命朝着铁门封瞄准着。\n\"别瞄了，里面根本没子弹，听声音，子弹库在前头早被他们抢了。\"\n\n阿尔贝托缓缓的从怀中拿起了一把手枪，这是他父亲送给他的。于是，今天，他希望这把枪能派上用场。\n\"一个小队...不对不对，最起码一个排。\"一顿机枪扫射的声音从闵采尔的头上响起。\n\"起码一个加强排！所以他们就那么吝啬，连弹药都不给我们？\"闵采尔气得已经开始有点想笑了。\n\"拜托，排长，你都在战场服了三年役了，却比我第一次上还怕。\"阿尔贝托拿起望远镜，偷偷的在缝隙中瞄着。\n\"嗯嗯嗯嗯，不错不错。\"\n\"你他妈看出来什么没有啊！\"\n\"不是\"死亡赛车手\"，好像是菲尔多夫的部队...\"\n\"因为？\"\n\"\"死亡赛车手\"只会一个人来，而很显然，现在起码五十个人在打我们。\"\n闵采尔不自主了笑了起来，尤其是阿尔贝托慢慢说\"别紧张，别紧张\"的同时，一大滩不明液体从阿尔贝托的裤缝中流淌出来。他无奈的擦拭着根本没子弹的枪，缓缓的对阿尔贝托说着。\n\"英魂殿再见。\"\n\"别慌，我还有办法。\"阿尔贝托开始深思，最后冒出来一句："
 by_kasimir_event.35.a: "\"如果可以的话，我们是可以跳车逃跑的吧？\""
 by_kasimir_event.36.t: "东行漫记（九）"
 by_kasimir_event.36.d: "\"跳下去？我亲爱的阿尔贝托连长，您莫不是在说笑？\"闵采尔摇了摇头，颤抖着掏出一盒香烟，结果被火车外的机枪声吓得一哆嗦，香烟就这么脱手飞走了。\n\"借个火。\"\n\"没事，现在没有，一会儿会有的。那些波兰佬挺喜欢丢他们自制的手榴弹，炸死你还好，炸不死搞个半残那才是最绝望的：毕竟他们根本不会造那个玩意儿。\"\n\"决定了？\"阿尔贝托缓缓拉开铁门，火车外不间断的枪声和爆炸声唬得人发抖。\n\"汉斯·闵采尔，要是你还能活下来的话，记得每年2月17日给我扫个墓。\"\n说完，阿尔贝托就呆住了，没有再出声。\n\"快走啊！\"伴随着波兰人的叫骂声伴，几颗手榴弹丢了进来。闵采尔再也来不及思考，他夹起怀中的包裹，披上一层皮毛毯，抱着阿尔贝托奋力跳了出去。\n\n在短时间的坠落中，闵采尔突然知道了为什么阿尔贝托沉默了。这里是一片陡崖，换句话说，换做波兰的任何一角，你都看不到这些山地，可是偏偏这里就是克拉考。在波兰士兵恼火的低吼和诧异的惊呼下，闵采尔和阿尔贝托就这么卷着一层毛毯猛的滚了下去。\n不知道过了多久，闵采尔才想起看看阿尔贝托。\"别怕，我在这里呢。\"他摸了摸阿尔贝托的脸，发现阿尔贝托平静的一句话都不说，原来他已经昏死过去了。\n两人的身体穿过一道道灌木丛，倒刺在皮毛间撕裂开来，然后是军衣，肌肤。闵采尔死死的抱住了阿尔贝托，就像抱着他从未拥有过的情人一样。\n随着一声\"嘶拉\"的响声，波兰人再也看不到他们了。\n\"向勇士敬礼！\"波兰人们一个个脱下军帽，朝着天空开枪，向牺牲的战友们致意。"
 by_kasimir_event.36.a: "而被俘虏的德国士兵们和被打死的喽啰们，则一个个低头不语。"
 by_kasimir_event.37.t: "东行漫记（十）"
 by_kasimir_event.37.d: "我苏醒了。\n和想象中的不同，我和我的上司阿尔贝托，的确是在波兰人的怒吼中，从这满是乱石和根树之间卷着皮毛滚了下去。那个皮毛本是给我们留的最后一个念想：被波兰人发现后，起码我们的尸首大概率是完整的。它现在挂在一旁的树枝间，皮毛上的碎军服片和泥土的陈香扑面而来，我甚至能闻到上面的一丝丝鲜血气味。虽然难以置信，但我真的...活下来了。\n在坠落之后，我们很快挂在了树上。阿尔贝托在我的怀里因为俯冲力的作用很快从我手中飞了出去；我则是滚进了小径里，然后昏迷过去。看起来是这样的。有时候，对我这个在东线混了三年都没死的人来说，有些事你永远无法解释，那么，我还是庆幸自己的这条命没丢吧。随着肚子的一声声抗议，我才意识到自从清晨被波兰人袭击后，哪怕我只昏迷了一白天，我也快二十几个小时没有进食了。我缓缓从荆棘刺中站了起来，可一道撕心裂肺的痛感促使我又倒了下去，碎石块划过了我的衣服，留下了一道道可怕的血痕。不，阿尔贝托在哪里？他不会滚了下去吧？看着小径下的深处，我有些站不住脚了，在不远处，一个大袋子就静静的呆在那里。天，什么都在。\n这真是一个上帝给予的奇迹，我掏出里面的香肠，开始拆开包装啃了起来。要是还活着，阿尔贝托一定也很饿吧？那我不管，我得先吃着；不过良心驱动下，我还是只是吃了一小点，然后便开始了寻找阿尔贝托的路。这样，如果他还活着，至少不至于没东西吃。不知算幸运还是不幸，我很快找到了。\n阿尔贝托就在山脚下，我不知道他为什么能滚的那么远的。我祈祷着，最好只是我看错了，而真不是他。随着我的脚步越来越近，我的泪水一点又一点滴在泥土里。那片撕烂的军装还有容颜，说不上多匀称的胡子下的万字勋章：错不了，就是他。不，就算阿尔贝托死了，我也得带他回家。\n我们不打仗了，我们不去和斯拉夫人打了，走吧，我们回家。我哀悼着：阿尔贝托...我的上司、我的朋友...我在小径的路上一点点走着，无论我如何打趣，阿尔贝托再也不会回应我了。\"你知道吗，我活下来了？挂在树上了，而你却......\"我走不动路了，在天色黯淡的森林下，我生起了火，烤起了最后遗存的香肠。\"呐，吃吧，可不坏。\"我终于烤出了一个上好的香肠。\"这可是你的东西，你还记得我们刚见面吗？对，就是刚见面，我们一起喝酒，一起跳舞。然后我把你的香肠顺走了，你还骂骂咧咧的说谁把我东西拿走了。\"我很想笑，却一点也笑不出来，于是做起了一些苦瓜脸。\"诶呀，原来真是你！\"\n我吓了一大跳，我以为我幻听了。我摇了摇头，发现\"死去\"的阿尔贝托正埋头啃着香肠，一脸怒气又滑稽的对着我看着。\"啊啊啊啊啊，诈尸了啊！\"我急忙收起东西逃跑。\"诶！你给我回.....\"阿尔贝托又猛的倒了下去。\n我狠狠的打了自己一巴掌：我怎么想的？居然想丢下他自己跑路？不知什么时候，我的鼻子间伸出了一丝又咸，又很温和的血液，和我的泪水一起滴落在火焰旁。\"妈的，真痛......\"阿尔贝托呜咽着，腰间缠着破布中渗出一丝丝黑色的污血出来。\"没事，我在这里，长官。\"我撕下了裤子上一块长长的破布，燃烧了一会儿后缠绕在阿尔贝托的腰间，随着一声\"嗯！\"的低吼，阿尔贝托没了声响。过了一会儿，他那一声声缓慢的鼾声开始响起来了。\n我收起了自己在阿尔贝托怀中的双手，很快的，累倒在山脚旁。"
 by_kasimir_event.37.a: "火苗慢慢熄灭了，随着最后一声鸟叫的飞去，森林开始休息。我们也是一样。"
 by_kasimir_event.38.t: "东行漫记（十一）"
 by_kasimir_event.38.d: "\"我在很早就醒来了，当时我全身轻飘飘的，我以为我早就去了天堂。\"\n\"结果呢？一阵阵腹部的阵痛和渗出的鲜血.....放我下来吗，闵采尔。\"\n\"想都别想。\"\n闵采尔奋力往山下小径摸索着，阿尔贝托则像麦子团用几块破布死死的捆在闵采尔腰间。\n\"除非能找到大部队，或者有人能治好你的伤。\"\"放我下来，闵采尔少尉，这是命令！\"\"在肩膀上好好别动，这才是命令。\"\"闵采尔......求您了，我真的可以继续自己走.....\"阿尔贝托已经是在哀求了。差那间，支撑在三点之间的烂衣布终于走完了他短暂又苦难的一生，虽然阿尔贝托很轻，但是在两小时的艰难行军下，衣服条最终在闵采尔天才般的人类运输计划工程中英勇牺牲。\n\n在两人从摔倒中缓过时，互相抱在一起大哭了起来，过了一会儿，他们忽然又傻傻的笑了。\"你哭什么？像个娘们似的。\"\"我哭是因为我想家了，还有你把我绑的好痛，那你不也是？\"\"别的长官每周领香烟和套子，我敬爱的阿尔贝托少校则是奶嘴和纸尿裤。我想哭就哭，怎么了？\"\"你妈了个巴子的。\"\"去你妈。\"两人哈哈大笑起来。\"我真的不敢相信我们活了下来。\"\"我就很单纯了，看看吧，有人烟，我们走出这无人区了。\"\n\n随着闵采尔的指向，一缕缕青烟从远处一个小乡村飞了过来。\"看来这顿饭是非蹭一顿不可了。\"\"执行命令！\"\n随着两人越走越近，一声沙哑又有力的老奶奶声从屋顶间传来。\"谁啊？\"（波兰语）\n\"他妈的，波兰人。\"阿尔贝托小声嘀咕着。\n\"如果有我们的部队驻扎在这里，那我就得考虑是不是1956年有脑子的长官都打干净了，就只剩阿尔贝托这种......\"\"去去去。\"阿尔贝托轻轻给了闵采尔一肘。\"嬷嬷！我们是第三十五步兵团的部队！我们被德国佬伏击了，队伍被打散了，我的长官伤的很严重！\"（波兰语）\n\"原来你会说波兰语？\""
 by_kasimir_event.38.a: "\"那不然我小时候怎么和波兰人比赛喝酒，你跟我来就行。\"闵采尔嘀咕着。"
 by_kasimir_event.46.t: "东行漫记（十二）"
 by_kasimir_event.46.d: "\"来吧，来自意大利的同胞，吃点吧。\"手术台下，一阵喷香的熏肉与土豆混合的蒸汽熏醒了在设法想办法逃出去的闵采尔。\n\n是熏肉炖土豆，整整一大锅，让人难以置信，美妙的炖肉味不禁让所有波兰士兵们咽起了口水，看着闵采尔狼吞虎咽的样子，众人忍不住大笑起来。\"孩子慢一点慢一点，里面还有那个病床上可怜勇士的一份......口感还好吗？\"炊事兵日梅夫斯基还是那么慈祥，轻轻抚摸着闵采尔的头。\"真是太感激不尽了，流亡意大利十几年，最惦记的就是弟兄们的这块家乡熏肉和土豆。\"\"别看他这样，我年轻得时候吃的比他还快，济斯瓦夫？\"随着又一阵笑声，一个浑身打着补丁，头顶着一摊贝雷帽的士兵骂骂咧咧的走了出来，拿出一盒香烟丢在老人身上。\n\n\"他妈的，饿急了屎都吃。\"\"我都说了，你们吃了我二十年饭，我是真的不会做饭吗？纯粹是巧妇难为无米之炊。\"在残破的军装下，一贴马儿与剑的标志勾起了闵采尔的回忆。\n\"扎扎师。没错，是扎扎师。\"闵采尔点了点头。济斯瓦夫愣住了，然后双手开始颤抖，他冲向闵采尔，紧紧握住了闵采尔的手。\"是的，老哥！扎扎师！一个被打散，又重新组建的师团！不死的师团！只有一个波兰人和战马在，扎扎师就没有投降！\"\"马儿会有的，老哥。\"闵采尔茫然间，好像看到了那个老兵的一丝丝眼泪。\"瓦斯迪斯瓦夫·济斯瓦夫，老哥！\"\"圣约翰 米采尔斯基，兄弟！\"两人抱在一起，让人们不由得感叹唏嘘起来。看着波兰士兵们众人手上一大块又干又硬的黑面包，闵采尔抬起了大锅，珍重的放在大家中间。\"今天，我坐庄！大家开吃啊！\"\n\n随着一阵欢呼和哄抢，伏特加碰杯声和土豆的清香醉倒了所有的波兰人和德国人，夜幕降临，随着几个暗哨的稍息，众人留下的是一声声清脆的鼾声，还有别出压制的微笑。\n\n\"去你妈的闵采尔，废物，叛徒，走狗！我去你娘的！你忘记我的份了！我是你长官！\"在黑暗里，崩溃的要发狂的阿尔贝托用靴子奋力踢着倒在地上的闵采尔。闵采尔不语，回复阿尔贝托的只有德国农民的疏懒和一阵阵劣质波兰伏特加的酒味。\"天啊上帝，是意大利的波兰同胞！\"随着一声声急促的脚步声，没等两人反应过来，七个大壮汉不知道从哪里跑了出来，两人还抬着担架，把呆住的阿尔贝托放了上去，然后呼哧呼哧的跑，闵采尔也呼哧呼哧的追，小屋里一点又一点东西突然在无限放大。十几个工人在打磨着步枪膛线，一个老头在细细擦拭着德国机枪，发出阵阵感叹，然后是几个护士急忙把阿尔贝托拉上手术台上，时不时周围还有几个塞军帽的波兰军人跑过，一个巨大的克拉克夫地图挂在墙上，下面的字显得格外刺眼。\n\n\"波...波兰抵抗军克拉科夫...总司令指挥部...\"闵采尔吓傻了，他一时不知道怎么说。"
 by_kasimir_event.46.a: "\"不用麻醉了，他已经昏过去了！\"随着医生的一声怒吼，闵采尔只能偷着乐。"
 by_kasimir_event.39.t: "东行漫记（十三）"
 by_kasimir_event.39.d: "\"钢铁步兵团！\"\n一大早，闵采尔又和一群波兰人鬼混在一块吹牛了，毕竟，战争时期，开心至上吧！\"没错的老哥！你有亲戚是少将吧，不，起码是个中将！\"\"我老哥，见过元帅，元帅还给他授勋呢！\"闵采尔吹牛从来不打草稿。在一声声啧啧称奇的感叹下，闵采尔又开始了他的传奇之旅。\n\"西里西亚步兵团！\"\n\"天啊，自从开战就被打散后，我们就好久没听过有人叫过这个番号了！\"闵采尔继续端详着，突然神色变得古怪了起来。他的手不停的颤抖着，同时，波兰人们的身体也在颤抖。闵采尔指向了一群穿着德国军装的人。\n\"怎么还有德国人？第33装甲掷弹兵团？\"\"干你妈！老子是希米格维元帅麾下亲自率领的第五步兵团！\"一个满脸胡子碴的壮汉怒骂起来，好像这一声称呼脏了他的心，毁了他的肺一样。在一堂堂哄笑之下，闵采尔的大脑飞速旋转着。\n\"西里西亚，利沃夫，甚至有但泽的部队.......他们聚集在克拉考干什么？难道，波兰人又重新崛起了？又要杀回来了？就像1956年那样？\"\n这不是什么好消息。\"不行，我得快速告诉长官。\"一个强有力的声音在闵采尔的大脑里回响。\n闵采尔径直走出大门，看着面带韫色的阿尔贝托，他正在一点一点搓着烟。\n\"长官，我得有点事情和你说一下，波兰人可能...\"\n\"我那一份呢？\"\n\"啥？\"闵采尔愣了一下，然后才想起来他什么意思，他的脸吓得煞白。他赶紧往四周看看：很好，没人。\n\"实在抱歉.....我到时候补偿给你，还有，说波兰语啊！你不要命了啊！\"\n\"太复杂的我不会说，而且，你和他们不玩的挺好的吗？\"\n\"啊！第一掷弹兵团！\"阿尔贝托做了一个很不好笑的鬼脸，然后又搓着香烟。\n\"得了，我告诉你，里面，全是波兰四地的精英，还有就是，甚至还有乌克兰的人！你知道怎么回事吗？\"\"来和圣约翰米采尔斯基做朋友。\"阿尔贝托自己都快绷不住了。\"波兰人要发动起义了！\"闵采尔死死的用手抵住阿尔贝托的军衣，死死的看着阿尔贝托。\"你竟然敢.....啥？\"\"波兰人要发动起义了！\"\"那我们.....和他们拼了？\"\"你是笨蛋吗？我们两个人，没枪，能杀掉几个人？\"\"跑路啊！\"\n闵采尔和阿尔贝托准备逃出房间的时候。一个嗓音洪亮的波兰人叫住了他们。\"诶，兄弟，领衣服了！\"\"顺两件波兰衣服再跑也不错。\"闵采尔点了点头。\"你妈的.....\"阿尔贝托又长条的跑了回去。两小时后，两套顶别致的军装套在他们身上，上面的斯文条纹很清楚的显示着两人的身份：\n阿尔贝托 上校\n闵采尔 中校\"怎么到波兰人我们这里升级那么快。\"阿尔贝托嘀咕着。\n还没等闵采尔思考，两杆波兰步枪被递了过来。\"看来今天得你们站岗了，没办法，该到你们了。\"递枪的壮汉耸耸肩笑着，然后走开了。\"该死，我们完全不知道这边情况啊？\"阿尔贝托恼火地抓了抓自己的头发。\n\"有暗哨。\"闵采尔长叹一声。\n太阳落山了，大地开始休息。阿尔贝托环顾四周，确认没有危险。\"跑！\"他下定决心了。\"好！在合适的时候。\"闵采尔点了点头。没过多久，他们便带着枪飞似的逃离了波兰人的营地，一步也不敢回头。\n等到第二天清晨，起床后的波兰士兵们才发现：那两个意大利来的波兰同志，已经无影无踪了。\"他说过他们不属于我们编制，只听罗马的命令。看吧，没准罗马又有命令了。\"济斯瓦夫感叹道。\"那个军官我不知道，不过那个小伙子是真不错。\"壮汉撇了撇胡子。\"可是我们不是已经给他授勋了嘛？\""
 by_kasimir_event.39.a: "在一声声哀叹声中，波兰人又开始了他们的一天。"
 by_kasimir_event.40.t: "东行漫记（十四）"
 by_kasimir_event.40.d: "\"啊呀！\"随着一声清脆的枝叶割裂的声音，阿尔贝托重重的摔倒在了地上。\n\"快跑吧，我看到大路了，往大路一直走，那就是我们司令部！\"闵采尔急忙折返，拉起摔倒在地上的阿尔贝托，发现他毫无力气了。\"我，我饿......\"\n\n闵采尔这才想起来，阿尔贝托貌似快两天没吃东西了，看着阿尔贝托可怜巴巴的眼神，闵采尔不由得感叹起来。\"走！总比被波兰人打死好!\"闵采尔全身一颤，又重新拽起了地上的阿尔贝托，缓慢的摸索着大路。\"我这一路到底是为了什么.....我已经吃了多少苦头啊？快来个波兰人把我打死，快.....\"阿尔贝托又绝望的哭了起来。\n\n\"别说丧气话！\"闵采尔吃力地前进着，直到一个伟岸的身影在大路旁出现：一个男人正在从\"哈哧哈哧\"作响的卡车上下来，卡车上面装满了弹药，还有一些武器装备，一身整洁的德国军官服告示了他的身份。\n\"德国人！还是一个军官！\"\"呜哇哇，准备战斗！\"阿尔贝托急忙从闵采尔身上滚了下来，害闵采尔摔了一个屁股蹲。\"笨蛋！啊！笨蛋阿尔贝托！我们就是德国人！笨蛋！啊啊啊！\"闵采尔又气又想笑，唯一感到庆幸的是，阿尔贝托那愚蠢但又清澈的眼神告诉他，阿尔贝托还没彻底傻掉。\"长官！\"闵采尔急忙冲向那名德国军官。他先是一怔，然后骂骂咧咧的举起手来。\n\n\"不，长官，别那么害怕嘛！\"闵采尔放下肩上的枪，哈哈大笑起来。\"德语？德国人？\"听到熟悉的声音，军官放下了手，拍了拍身上的泥土。\"是的，长官，我的长官在另一边。我们是克拉考第一炮兵连的，我们前段日子被伏击了。\"那名军官十分惊奇：\"你们不是全员殉国了吗？难道...你们是剩下的活口？\"\n他仔细端详着闵采尔，看着他脸上还有肩上的刀痕，这些都证明了这件事。\n\n\"真不可思议......走吧，带上你长官，我带你们回克拉考。\"随着军官的一身招呼，闵采尔用劲了最后一点力气，把阿尔贝托抬上了卡车。军官再一次拉动驾驶室的杆子，伴随一声\"呼\"的响声，浓烟开始从排气管冒出。\"呵，你们来了就打上火了，真是奇迹。\"\"来喝点酒吗？\"他好心地递过去一瓶威士忌。闵采尔接过来一饮而尽，然后昏昏沉沉的倒在了车上——他真的累极了。"
 by_kasimir_event.40.a: "在颠簸的卡车里，阿尔贝托和闵采尔逐渐进入了梦乡。他们全然不知道，这辆卡车将会驶向何方。"
 by_kasimir_event.41.t: "东行漫记（十五）"
 by_kasimir_event.41.d: "\"他妈的。\"阿尔贝托死死地盯着闵采尔看。\n\"他妈的。\"闵采尔无助的吭出一两声。又粗又硬的麻绳已经绑得他们两个浑身发疼了。听着时不时路过的波兰士兵发出的嬉笑声和辱骂声，他们才知道：自己不知不觉间已经成了可笑的小丑，他人传奇的全新垫脚石。\n\n\"伪装成德国军官。\"阿尔贝托咬着牙愤愤低语。\"还时不时一个人用卡车运物资.......\"闵采尔低着头 ，努力不去听波兰人的污言秽语。\"那你当时是怎么拖着我上卡车，然后又自个儿喝了那瓶威士忌的！好啊，这下你知道当初你绑我多痛了吧！\"\"这就是我们可悲的结局......\"闵采尔忍不住滴眼泪起来。是啊，阿尔贝托小事糊涂大事不糊涂，可他自己却恰恰相反！\"别哭啦，大不了就是个死，有什么可怕的！\"阿尔贝托安慰他。\n\n随着军官和波兰士兵们嘻哈问暖之后，悄悄来到了愤怒的阿尔贝托面前。在他军装下的身体里，蕴藏着一个旧奥地利军人最后的尊严。\n\n伪装失败了，阿尔贝托很愤慨，他很快就阻止了这场小游戏，弄得军官很是失望。\"死亡赛车手！死亡赛车手！\"阿尔贝托像开连环炮一样怒吼着，脸上的青筋一点点迸发出来。他奋力想挣断绳子，可毫无作用，还苦了闵采尔：他像橡皮泥一样随着阿尔贝托的挣扎被挤压着。最后，阿尔贝托还是认命了，放弃了抵抗。\n\n\"阿尔贝托·冯·贝格尔斯？是你吗？\"军官向阿尔贝托发问\"是啊，就是我，把我枪毙了吧！给你们的战友报仇雪恨吧！\"阿尔贝托像一头野狼似的朝他咆哮。\"我，尼基塔·谢尔盖耶维奇·多布罗沃利斯基，我们是第二次见面了吧？虽然你们是敌人，但也都算是真汉子。\"多布罗夫利斯基庄重的挺起了身子，给二人行了一个标准的二指礼。\n\n\"你说什么？你是第二次见到我们？\"闵采尔忍不住开口了。只是，当他看见阿尔贝托的神情变得极其难看，就没敢继续往下说。\"你们的火车是被劫了吧？\"\"是啊，的确是。问题是你不是从来都是单人行动的吗？死亡赛车手？风雨无阻？\"阿尔贝托也忍不住提出自己纳闷的问题。这次换成\"死亡赛车手\"本人意外了。\"组织需要我的地方我就得去，只是很多时候只能单人行动，又不是禁止我参与多余行动。\"\n\n\"行啦行啦，看你们两个的资料，你们还算有点良心，没参加过纳粹渣滓们组织的大屠杀。所以，你们再帮他们办些事请，就可以在下一轮交换俘虏时回去啦。\"\n\"波兰人的情报那么厉害了吗？\"随着多布洛沃列斯基的离去，两人面面相觑。但只有多布洛沃斯基自己知道：波兰人民即将再次反抗，这一次他需要横穿莫斯科韦恩，将一车弹药和药品送给哈萨克的波兰残余军队。就这样，\"死亡赛车手\"又将开启新的旅程了。\"你是想被波兰人打死，还是被学院的人当成笑话三个月后再被自己人打死？\"闵采尔看向阿尔贝托。\n\n\"我选择前者。\""
 by_kasimir_event.41.a: "阿尔贝托忍耐着腹部的剧痛，看着渐渐离去的卡车，现在他只剩下一个念头：他想要回家。"
 by_kasimir_event.42.t: "东行漫记（十六）"
 by_kasimir_event.42.d: "在杂乱无章的小院里，野花和灌木疯一般地乱长，可是\"宫殿\"的主人老阿尔贝托已经无力打扫。他依然穿着他那一身旧军装，每天在院子里的小径来回走。他总是喜欢呵斥他的妻子赶紧打扫卫生，喊他的女儿去择菜，然后规划自己儿子的未来。\n在邻居面前，那个曾经在三十年前的维也纳与\"赤色分子\"英勇作战的骑兵上校早已不见，而是变成了一个每三句话夹一句粗口的暴躁老头。\n\n当阿尔贝托的阵亡通知被邮寄到他的手上时，他先是一怔，然后身体开始剧烈地颤抖。他气愤地一咬牙，拿起军刀狠狠的劈着落在地上的灌木。直到灌木被劈成无法再劈的碎块时，老阿尔贝托才停手。过往的一幕幕在他眼前如走马灯般闪过——\"阿尔贝托，你别看你的什么尼采了，去把身子练结实一点！\"\"死婆娘，又和小安娜在哪里鬼混去了？我们男人的事情你们少管，你们就负责看好咱家的大宅子！\"\n\n自从\"盟国的轰炸\"导致他的老婆女儿失踪后，老阿尔贝托已经重复了无数次，于是他那叛逆的儿子逐渐了厌烦了一切。\"你们知道我的儿子吗？面对波兰人，他先是打死两三个波兰兵，然后不甘俘虏直接从大山跳下去了！\"就像对待一场屡次表演的滑稽戏一样，人们一开始还会有所感触，酒会上依然会偶尔讲些向\"英雄阿尔贝托\"致敬的话。不过到后来，人们渐渐对阿尔贝托的\"英雄事迹\"失去了兴趣，于是老人再也没能收获到什么，所以说，尽管令人难以置信，但他还是创建了那个\"自由奥地利组织\"。\n\n人们都说老阿尔贝托疯了——也许事实的确如此？根据盖世太保对一个\"共党叛匪\"的审查，在一场秘密针对1928年维也纳工人的暗杀惨案中，老阿尔贝托成功将1000本马克思主义的相关著作秘密运往了德国各地。只是这简直太荒唐了，谁会相信呢？\"纳粹害死了我的父母，你就是作为其中的刽子手！\"舒马赫拿着铁锤，狠狠的盯着老阿尔贝托。\"纳粹害死了我的妻子女儿，可我还是当了他们的仆从。\"阿尔贝托没有否认。我们要证据。但是这种事情，我们必须优先控制事态——在更糟糕的情况发生前！\n\n\"立刻查封老阿尔贝托的家！\"穿着党卫队制服的奥托怒吼着。\"不用了，他早死了！\"他的同事卡尔嘲弄地说。\"真是晦气。不过，那个什么狗屁\"自由奥地利组织\"...呵呵，随着那老头子的自大也毁灭了。\"卡尔往地上啐了一口。\"不过，就单纯是因为那老头子的老婆有点像波兰抵抗人士，为了宣传就把她杀了？\"奥托有些疑惑地向卡尔询问。\"我们政令下来的时候，他可是高呼着为了德意志祖国大义灭亲的！\"卡尔愤愤的说。\n\n\"算了，他的事情就不管了。\"两人就这么信步走开了。\n在儿子阿尔贝托\"殉职\"一周、朋友托莱斯被枪毙一个月后，花了一年的时间思考的老阿尔贝托，决定用收集十年的马克思著作向1929年当时被他残害的共产党人忏悔。"
 by_kasimir_event.42.a: "于是，为了德意志战斗了五百年的阿尔贝托家族，就这样伴随着那栋大宅子的轰然坍塌，还有那位老人英勇的自尽，彻底走入了历史。"
 by_kasimir_event.43.t: "东行漫记（十七）"
 by_kasimir_event.43.d: "\"你们要是真的想让我们服软，就把绳子放松点。\"\n\n阿尔贝托无奈的看着训斥他们赶快走的波兰士兵。某一次作战中，阿尔贝托和闵采尔被波兰人决议，要抽一个人当劝降炮灰。\n\"你真的认为把我们绑在那能感动我们的同胞？\"阿尔贝托有些无语。\"也是哦，但是我怕你们跑。\"一个木讷的士兵点了点头。在一座城堡里，上面的宝剑旗在没精神的飘扬。在森林之中，波兰人不断聚集着。这是一支名副其实的杂牌部队：有些人拿着黄油枪，有些人拿着铁稿，甚至不知道哪一个人吱呀吱呀的把一辆tks小坦克开来了。\n\n\"等了二十年，总算能干他一炮了。\"小坦克的主人很是高兴。\"喂，你们干什么，你们抓错人了！他是35师的同志！\"一声熟悉的声音在闵采尔耳边响起。\"去你妈的！\"随着一声沉重的枪托砸击声，以及后面有人痛苦呻吟的声音，闵采尔转过头一看：一个戴着四角帽的男人在奋力拉开绳子。\"米采尔斯基，我都说了你不要跑了，我啊，不认得我了？\"\n\n\"济斯科夫！诶呀你们他妈的，你们国家军的人是不是从来不长脑子啊？这是罗马来的波兰同志！\"闵采尔愣了一下，他看向济斯科夫：济斯科夫正愤怒地抓着看守他们的士兵的衣襟，要讨一个说法。跟着来的，还有胡子兵和老人，以及一个个熟悉的面孔。\"孩子，罗马又有命令吧？\"老人擦擦阿尔贝托身上的汗。\"吃吧，这里都是波兰人，我们波兰人做主。\"\n\n\"我看是日耳曼尼亚的命令吧！\"\"你这家伙，你还敢？\"济斯科夫狠狠的瞪了那个多嘴的波兰兵一眼。\n\"对不起......济斯科夫，我们是德国人，真的对不起......\"阿尔贝托不堪良心的折磨，主动说出了真相。济斯科夫沉默了，他松开了士兵的衣襟，转头看向闵采尔。闵采尔不敢看他。\n\"米采尔斯基。\"\n闵采尔低头不语。\n\"你赶快去死。\"\n济斯科夫头也不回，很快离开了众人的视线。\n\n\"别哭了，该去劝降咱们的同胞了？\"阿尔贝托无奈的耸了耸肩。\"你们现在就上去，德国佬！别哭哭啼啼的！\"被济斯科夫殴打的士兵缓过了神，把所有愤怒都发泄在阿尔贝托和闵采尔身上。"
 by_kasimir_event.43.a: "\"他妈的，是不是要我再打你一次？等他们哭完再去送死不行啊？\"济斯科夫的大嗓门又响起来了。"
 by_kasimir_event.44.t: "东行漫记（十八）"
 by_kasimir_event.44.d: "\"上。\"\n阿尔贝托和闵采尔向城堡走去，城堡上的德国士兵很快发现了他们。\"诶，你们哪一部分的？\"\"我们是克拉考.....克拉科夫第一炮兵营的，我是长官阿尔贝托·冯·贝格尔斯，他是我的副官汉斯•闵采尔！我们都被俘虏了，这附近有很多波兰人，你们还是投降吧！\"\n阿尔贝托看着城堡上的士兵，再回头看看后面森林里成群结队的波兰士兵们。闵采尔只是呆呆的拿着枪，和他一起强装镇定，站在城堡的前面。\n\n\"哪里有波兰人？\"\n随着一连串枪响，机关枪的声音响彻整片战场，接着却是一片死寂。城堡上的士兵缓缓的举起双手，波兰士兵们开始准备总攻。一声清脆的枪声响起，城堡上的士兵缓缓倒了下来。阿尔贝托诧异的看着波兰士兵们，波兰士兵们也诧异的看着他。\"英雄阿尔贝托早就在火车袭击里和他的战友闵采尔跳下火车了！他们是两个不折不扣的懦夫、骗子！为了德意志祖国，杀啊！\"\n城堡上顿时又响起了机枪声，阿尔贝托拽着闵采尔，连滚带爬的滚进波兰人的战壕里。波兰人也知道必须干一仗了，于是那辆辆tks率先亮相，紧接着，波兰人的步枪开火声和嘶吼声，伴随着城堡上机枪和大炮的声响一起在森林里回荡着。\"没事了，我们的使命已经结束了。\"阿尔贝托紧紧的抱着闵采尔。\"长官，你没中......中弹吧...\"\"哪里会。\"阿尔贝托咧开嘴笑了笑，\"你不也知道，我们这里的新兵蛋子能击中谁呢？别打中自己的手就好。\"\"那...那就好...\"\n\"你怎么了？\"阿尔贝托感觉有些不妙。\"别放开，保持...保持这个姿势...\"闵采尔的脸色逐渐变得苍白。阿尔贝托低头一看：一股鲜血正从他的手上缓缓流下来。\n\"医务兵！\"阿尔贝托嚎叫起来。\"别了，长官！我......我.....我不行了.....能答应我一个要求吗？\"\"你给我好好活着！别和我说什么奇怪的东西...医务兵！妈的，波兰话的\"医务兵\"到底怎么说？该死的....你别死啊!\"\"他怎么了？\"一只有力的手推开了阿尔贝托的身体，也让他看清了闵采尔的情况：闵采尔无力的捂着胸口上碗大的伤口，一挺重机枪打穿了他的身体。看到这幅惨状，济斯科夫一句话都说不出来。\n\"扎扎师......\"\"你说，我在的，米采尔斯基。\"济斯科夫知道是在说他。\"我哥哥......二十年前死在了.....扎扎师手里.....\"\n济斯科夫沉默了，他紧紧握住闵采尔的手，随后拿起步枪冲上去了。\"我原谅你们了，仅限你们，并非所有德国人。\"济斯科夫丢下了最后一句话。\"长官......\"\"你说。\"\"我有一个很可爱的妻子，她叫艾丽卡，你能在我最后的时候，扮演一下她吗？我肯定见不到她了。\"\"别说蠢话，医务兵很快就来了，我们能一起回家的，好吗？\"\"艾丽卡.....\"闵采尔轻轻摸着阿尔贝托的耳垂。\"我爱你，阿尔贝托。\"阿尔贝托无奈地屈服了。既然闵采尔时间不多了，还是满足一下他的遗愿吧。\n\"我也爱你，艾丽卡。\"\"谢谢你，阿尔贝托，但是我老婆他不会说这种话的，她很......暴躁。\"\"原来你是妻管严？\"阿尔贝托咧开嘴笑了，可他笑得比哭还难看。\"不了，你的笔记还有书，在我背后，我现在给你......\"\n闵采尔颤颤巍巍的向后面摸索着，一本带血的笔记被他推到了阿尔贝托面前。\"你是我见过最好的长官。\"\"所以我们要一起活下去啊。\"\"不了，不了。我很抱歉，让你的笔记染上血了。\"\"我不介意。\"\"哈哈，我想家了。\"\"你家在哪里？战争结束后，我们一起去玩，一起去钓鱼。\"\"在....在......\"闵采尔的嘴里渗出来一丝鲜血，然后头一歪，再也没能醒过来。"
 by_kasimir_event.44.a: "\"[Root.GetDateText]，这个丝毫不起眼的日子里，阿尔贝托在遥远的东方失去了他最后的朋友，也失去了他最后的希望。\""
 by_kasimir_event.45.t: "东行漫记（十九）"
 by_kasimir_event.45.d: "火车大劫案，死亡赛车手。\n十五年的军校生涯，五十天的战斗。\n做土豆烧肉很香的大叔，可我一口都没吃到。\n在西线三年都没死的闵采尔，有一个害怕人的老婆。\n在军校打骂我五年的托莱斯教官，他死得会很难看吧。\n\n我只感觉这一切都是恍如隔世，连尼采和康德也无法解释。\n这就是我们的战争。阿尔贝托缓缓的写着，从自己的出生开始，再到自己的军校生涯，自己的铁路惊魂，以及和波兰人战斗，共存，最后归来的故事。我们本来可以和他们是朋友的，对吧？闵采尔本来就和历史上的农民英雄一样，他本来是可以和他的波兰朋友一起喝酒吹牛的，对吧？爸爸和妈妈本来是可以一起开开心心的，与妹妹和我在一起共同跳舞的，对吧？\n\n一切都没有改变，可是一切都改变了。这一切都是为了千年帝国。千年帝国，为了千年帝国，这是谁的荣耀，这是你的荣耀吗？农民不再种田，而是拿起武器，去虐杀其他的孩子，德意志是歌唱书写哲学的民族，斯拉夫是弹琴歌唱的民族，我们本应该和平，我们早在很早以前，就一起跳舞。到底是因为什么呢？我只感觉虚假。\n\n\"决定了？\"休姆拿起了厚厚的笔记。\"通过黑市，给波兰人吧，他们会出版，这是属于他们正义的斗争，也是属于我最后的斗争，尼采说过，人们从历史学到的，就是人类从来无法从历史中学到什么。\"\"你去吧，送给波兰人。\"休姆脱下帽子，然后缓缓的离开了宫殿。随着一声沉闷的枪响，休姆黯然知道了阿尔贝托的结局。\n\n那把父亲珍藏的手枪，最终派上了用场。那是一个儿子对父亲的歉意，那是一个德国人对波兰人的悔过，那是德意志对波兰的最真诚的愧疚。尊崇阿尔贝托的遗愿，还有为了宣传波兰人民的伟大事业，《我往何处去》这部德国少校阿尔贝托冯贝格尔斯的个人传记小说在克拉科夫出版，并且在意大利流传甚广，一度登上了畅销书之宝座，甚至德国的黑市上也能流通此等书屋。\n\n德国方面很是不满，他们一边宣称阿尔贝托早已死在火车事故，其他的事情都是有人刻意另有所为，德国很快会阻止来自东方的骚乱。阿尔贝托家族的宫殿着火了，听说是几个\"爱国者\"所为。\"这样看来，那个军官和闵采尔也是好人。\"胡子老哥啃着新出锅的大肉排。\"我总说了，和闵采尔在一块的，肯定不是坏蛋！\"济斯科夫笑着，指着《我往何处去》的一页看着。\n\n\"看呢，我济斯科夫也被写进书里了。\"\"诶！为什么我只是胡子大哥啊！\"\"谁叫你没告诉他名字呢！\""
 by_kasimir_event.45.a: "济斯科夫笑着，碗里的土豆烧肉更加香甜了。"
 POL_ROD.7.a: "\"...如今，她将迎接美好的未来\""
 POL_ROD.12.t: "上校的演讲"
 POL_ROD.12.d: "年轻的芝加哥酒店大堂里比从前多了些喧闹，场下人们密密麻麻的，有抽着大麻叶吹着牛皮的老兵，也着衣容整齐的商业大亨在和人聊天，时不时还闪过一些贵妇匆忙的身影，她们在寻找因贪玩跑丢的孩子们。在大堂外也有着穿着夹衣的刚下班疲惫的工人，喝着可口可乐，玩着牌，但人们最终都落在那个好像即将充满大戏的舞台上，甚至扒手们也宣布罢偷，人们用散漫期待的那个期望的身影。\n\n大概过了煮熟三锅波兰饺子的时间，一个眼神坚定，步伐缓慢的老人走上了大台，他对着麦克风轻咳了两声，杂音的回响撕裂了空气，大堂刹那间安静了。\n“我亲爱的波兰同胞们，我，亚当科克。”老人顿了顿嗓子。\n“在上一次，我沉重的对大家说，我们失败了，我们被打败了，但是，我们也许会再次失败，但是，我们总会胜利！”\n“菲尔多夫的消息，一切顺利，汉斯·弗兰克滚蛋了！波兰自由了！”人们再也止不住内心升上胸膛的喜悦，欢呼声，对纳粹的嘲笑声，还有因快乐而痛哭的声音仿佛构成了一片海洋，淹没了整个大唐。“朋友们，波兰现在还处于最危险的时候，我，亚当科克，我现在带着波兰的黄金储备准备回国支援祖国母亲，所以，朋友们，这是各位最后一次再见到我了。”\n\n庞大的募捐活动开始了，大亨们拿出一块块金条，贵妇伸向自己的项链，争吵的要吃糖的孩子们，也坚定的向箱子里丢进自己的25美分，然后是工人们，他们一个个掏干了身上的积蓄。“谢谢，谢谢.....你们还得吃饭的.....”“我们的同胞在战场上连土豆都不一定有得吃，我们饿一点捐献一些面包算什么！”科克沉默了，他想起了三十年前在华沙对工人们的那场镇压，于是他哽咽了，他只能庄重的朝一个个工人们，行了一个标准的二指礼。\n\n“在我离开后，我想再次，为自己，对祖国和各位同胞们，表示感谢。”说完，科克径直走向了钢琴台，庄严的坐了下来。“请听，亚当·科克演奏的 肖邦《英雄波兰舞曲》！”一段激昂又短促的琴声爆发出来，让人不禁想象起半世纪前同样为波兰演奏的波兰总理帕德雷夫斯基，科克的脸上挂满了一丝丝细汗，双手也随着激动的乐曲中颤抖着。乐曲完毕，科克缓缓起身，对大众鞠了一个大躬。\n\n舞台下的鼓掌声和欢呼声轰翻了整个大堂。科克激动得抱住了副官兹列夫斯基。“天啊，我真的做到了，第一次完成了肖邦的作品！”兹列夫斯基笑着为科克抚去头汗。“好样的老头子，就是有一点小小的不足。”“什么？”科克还沉浸在骄傲和喜悦之中“就是快有七成都跑调了，要不是我知道您在弹肖邦，还以为是您自己在亲手创作新交响乐呢！”"
 POL_ROD.12.a: ""
 POL_ROD.8.t: "我们的祖辈"
 POL_ROD.8.d: "伴随着十四门礼炮的轰鸣声，与一齐奏响的《马梅利之歌》和激昂的《前进！东布罗夫斯基》的乐曲声，昂然上扬的意大利罗马雄鹰旗与骄傲展翼的波兰白红鹰旗高高飘扬，直到曲终。科克注祝着平行的黑头鹰和白头鹰时，全然不知一个新的历史篇章展开了--自从波兰灭亡之后，三十年后，波兰国歌再一次在欧洲大陆上响起。在万众瞩目下，身着一席戎装的亚当.科克上校和意大利领袖杜切.齐亚诺庄重地检阅着意大利军队。科克神情肃穆，向每一个士兵致双指礼。\n\n“贵国人民从大日耳曼国和总督府的压迫下争得自由，真不容易啊！还有您，上校，路上受苦了吧！”齐亚诺朝着意大利波兰营举起罗马礼，感叹道。\n“我们都不容易，领袖阁下。因为如今我们仍然势单力薄，所以仍需依靠罗马方面的帮助。为了捍卫我们共同的自由，波兰与意大利必须联合起来。”\n“哪里的话，罗马人愿意为所有反抗日耳曼尼亚暴政的自由民族拉起旗帜，更何况，在两百年前，我们的祖辈还曾一起反抗过德意志人暴政呢！”齐亚诺擦擦鼻子。\n“我们波兰人愿意做反抗纳粹帝国的第一旗帜！”科克激昂的抬起头来。\n两人结束了检阅，开始了会谈。\n\n“我国会对波兰提供一切帮助，包括但不限于武器，人力，还有技术！”齐亚诺微笑着说。\n“那真是感激不尽了，我们不会忘记贵国的雪中送炭，我们会为祖国的彻底解放继续斗争。”\n“波兰人很勇敢，可惜，波兰的武装力量仍然弱小....如果贵国哪一天不幸战败，请考虑来罗马，我们会帮助你们的。”\n“谢谢齐亚诺领袖，我会考虑的，不会如果真的有那么一天，我，亚当·科克，不会再次做逃兵了。”\n科克强忍着自己快要流出来的热泪。“那么，为了我们的友谊，请您好好保重吧。前进吧，波兰人，从意大利杀回波兰！”齐亚诺对科克敬了一个标准的罗马礼。\n\n“您像毕苏斯基一样勇敢。”行完礼，齐亚诺又一次感叹道。\n在几天的国家访问后，亚当·科克在意大利军队的护送下，乘坐卡车开始了新的旅程。"
 POL_ROD.8.a: ""
 POL_ROD.11.t: "新桥头堡"
 POL_ROD.11.d: "从上次离开这里算起，已是25年了。1939年德军如闪电般摧毁了波兰祖国的防线，希米格维元帅下令将所有维斯瓦河东岸的部队撤退至罗马尼亚与苏联边界的山丘上。9月17日苏联宣战后，他又命令所有部队撤退至当时还属中立的罗马尼亚和匈牙利。一同撤走的还有波兰国家银行的8.2万千克黄金。康斯坦察港水面波光粼粼，罗马尼亚黑海舰队有序地停靠在船坞内，静候日常维修。一艘最平平无奇商船挂着意大利和罗马尼亚国旗，如往日般驶向港湾。汽笛声悠长地响起，稳稳靠在岸边。\n\n“下船，出示证件，”传来海关工作人员的声音，“来自哪里？运的什么货？”水手毕恭毕敬地递上证件，“我们4天前从意大利罗马的奇维塔韦基亚港出发，按时到达罗马尼亚，运的是铜矿。”海关瞥见了证件上的公章，便没有进一步纠缠准备放行了。“慢着，先别走，”突然出现另一个口音很重的人声，带有厚重的日耳曼特色，“我怎么不记得意大利有大客户向罗马尼亚出口铜矿？”他叉着腰，一脸豪横。水手定睛一看，那人穿着德军制服，手臂上配有卐字袖章，肩上的勋章闪闪发光，身后跟着数名持枪随从，想必是大日耳曼国的官。“喂，你们船上载的是什么人？”水手一时慌了神，连忙补充道“这些货物都是水胆矾，据说是齐亚诺大人的新计划；船上的都是随行的技术人员……”\n“你们，上去查一查！”不等水手说完，德国人便下了口令，看来这段说辞没有打消他的疑虑。空气中弥漫着紧张的气息。突然，洪亮的一声打破了尴尬：“你们等等……”来者正是总理伊翁·米哈拉切，“你们大日耳曼国的人，怎么在我们罗马尼亚的地盘上，说检查就检查啊？”德国官员认出了他，立刻变得谄媚起来：“哎呀，总理大人，是什么风把您吹过来了？……啊，是来视察造船厂啊，那我们就不打扰您了……”谈笑间，官员就打着哈哈带着手下走了，心中自骂倒霉。\n\n许久后，船上一行人终于如释重负下船上岸。两只手紧紧地握在一起，两人露出化解危机的笑容。原来，船上的正是亚当·科克和他先前带走的黄金。低调起见，亚当·科克选择只带着最少数量的卫兵，从海上铤而走险来到罗马尼亚。\n“多谢了你的救场啊，不然我们还真有可能被发现”\n“哎哎，都是小事，我们罗马尼亚绝对会为波兰的事业保驾护航。还有1939年放在我们这里的一部分黄金……”\n两人耳边仿若传来悠扬的歌曲，是波兰语的“灰色步兵”，是罗马尼亚语的“罗马尼亚营队跨过喀尔巴阡山”"
 POL_ROD.11.a: "从哪里走，从哪里回"
 POL_ROD.0.t: "东方领问题"
 POL_ROD.0.d: "自德意志人的占领开始以来，他们便奴役着波罗的海地区以及白罗斯的民族，并在此地设立了一座又一座的血汗工厂；于是在长期的积压之下，东方领的各游击队也展开了自己的作战。每个民族皆有独立之心，他们也不例外；在西俄罗斯战争结束后他们潜藏于地下，等待着机会的到来...\n\n他们盼了很久很久，终于等到了大日耳曼国内战的一天，各方势力展开了自己的行动，在东方领的土地上展开了混战；如今，东方领已是一片混乱，这里有着国防军的余孽，党卫队的刽子手，甚至还有由犹太盗匪们组建起的游击队，在如此混乱的情况下，我们不得不考虑是否要寻求东方领的自由派援助。如若条件允许的话，我们将会扶持兰德鲁特推翻东方领暴君的统治，让东方领区域重获自由...\n\n反之，我们将会直接进攻东方领，不为纳粹匪徒留下一点机会；现在摆在菲尔多夫眼前的正是此难题：是寻求合作？还是说听萨尔斯基的，彻底根除这群人才是正确的？"
 POL_ROD.0.a: "\"他们不值得怜悯\""
 POL_ROD.0.b: "\"兰德鲁特还有救，我们会寻求合作\""
 POL_ROD.16.t: "破局之器"
 POL_ROD.16.d: "华沙的夜已深了，许多人都已经入睡，但马里安·雷耶夫斯基和亨利克·佐加尔斯基并不在此列。此刻，他们正在一间灯光昏暗的小房间里，鼓捣着一台珍贵（至少对眼下的波兰如此）的机器——一台从意大利入手的全新密码机。\n\n“你怎么看，马里安？我倒是觉得这东西...质量不怎么样啊。”亨利克皱起了眉头。“意大利人就靠这个来掩护他们的讯息？”\n“得了吧亨利克，你难道指望意大利人的东西，能和咱们研究过的英格尼玛机一个水平？”马里安耸了耸肩，“是，这台机器质量是一般，但执行最基本的加密任务它还是绰绰有余的。现在祖国条件这么艰难，可没有给我们挑三拣四的水平了啊。”\n“也是...”亨利克尝试着接好线路，然后敲打密码机的按键，“嘟嘟嘟”的声音即刻响了起来，其他零件也开始正常运转：这证明了这台小小的密码机足以执行人们期待它执行的任务。“好啊，虽然搞过来的过程复杂了点，但至少质量有保证。”亨利克咧开嘴笑了笑。\n\n“好了，亨利克，别忘了我们的正事。”马里安拍了拍他的肩头，“我们搞来这个可不是为了当玩具的，我们得以这台仪器为蓝本，想办法改进我们波兰人自己制造的密码机。”说完，他抬起了另一台仪器——说真的，尽管与前一台机器功能大致相同，但说这一台是“密码机”还是有些抬举了。它的结构相当简陋，尽管制造简单但却难以执行重大任务，也很难长期使用。“这可真是..很难想象，我们的战士利用这么廉价的仪器，还能和装备精良的德国佬抗衡啊。”马里安叹了口气。\n“嘿，所以我们才要特地从意大利人那里搞来好货嘛！”亨利克态度倒是乐观。“想开点马里安，咱们就是专门研究密码的，怎么改进密码机咱们能不知道？行了，你把工具箱拿过来，咱们一起把意大利人的小玩意儿拆开看看，我倒想见识现在的密码机能进步到什么境地！”\n“早准备好啦！”马里安拍了拍一个敞开的工具箱，里面装满了螺丝刀、钳子和其他各式器具。“今天刚从五金店买的...好了，你左我右，咱们一块先把外壳拆开！”\n“好说！”亨利克撸起了袖子，拿起一把螺丝刀就开始拧螺丝，马里安也从另一边开工了。当外壳被拆开那一刻，展现在他们眼前的东西让他们大吃一惊。\n\n“马里安！快看，这线路结构还真够妙的，这么绕能减少不少电力消耗！”“我看见了，亨利克！你倒不如来我这看看，瞧瞧人家意大利人用的什么材料制造元器件，这可真是多快好省！”"
 POL_ROD.16.a: "当太阳升起时，两位顶着黑眼圈的密码学家，脸上都挂着心满意足的笑容。"
 POL_ROD.17.t: "未续婚约"
 POL_ROD.17.d: "1966年，距离波兰的胜利已有一年之久。华沙万废待兴，而波兰人民共和国的各派领导人也在各自劳碌着，渴求吸引更多人为他们投下那一票。哥穆尔卡坐在办公室中，现在正值波兰人民共和国的选举季，但他早就无心去进行竞选活动了：他只是呆坐着，望着手中一枚吊坠发呆。\n\n那似乎已经是1927年的故事了，那时波兰的领导人还是毕苏斯基。他在此时认识了他的妻子——丽娃·佐肯，二人洽谈甚欢，但碍于社会原因却至战前仍未确立关系，直到1951年他们才正式确立了关系。虽说那时的物质条件说不上好，但起码他还能和妻子进行一场非正式的婚礼。简单完成了仪式后，他向丽娃承诺，日后定会为她补上一个正式而庄重的婚礼。在物资稀缺的情况下，这吊坠成了他们之间唯一的信物。\n\n然而，那场起义的失败却掀翻了一切美好的憧憬，继而将其彻底碾碎。在此次战役中，正如世人所知，波兰的游击队损失惨重，随后华沙遭到报复性打击被夷为平地，大量波兰裔平民被屠杀...而在那些平民之中的，就包括了搬到了华沙居住的丽娃。\n\n在德军暂离后，哥穆尔卡在废墟中翻找了好久。最终，他却一无所获；他只找到了一具被烧得血肉模糊的尸体，以及染上了血的吊坠。忆起这事，哥穆尔卡心中黯然伤神，那场婚礼直到最后也没能办成。最后他才发现：他胜利了，但他也输了。他和他的人民军守护了波兰，却始终未能守住心中之人，而他的爱人至最后一刻也没能看到祖国光复的一刻。此时，一名统一工人党的干部敲响了门，才将他从思绪中带回来。\n\n哥穆尔卡叹了口气，喃喃自语地说道："
 POL_ROD.17.a: "\"也许就和那场婚礼一样，她再也没办法见证祖国的胜利了。\""
 POL_ROD.18.t: "华沙之春"
 POL_ROD.18.d: "今日清晨，波兰人们仍在日耳曼尼亚那乌云下心惊胆颤地渡日，生怕德国方面突然对祖国波兰发动袭击。可即便德国人仍在华沙边境虎视眈眈，今日华沙的皇家城堡的旧址仍是人头攒动，人们异常大胆地走上街，站在那废墟之外。这里是五三宪法起草的地方，也是先前总统府所在之地，对波兰民族的意义是非比寻常的。人们时而宁静，时而吵闹，随后再归于寂静。\n\n此时，一名身高不算太高的，约70岁的老人站到台上，清了清嗓子，说道：\"各位波兰民族的斗士们，公民们，今天是个重要的日子。继1918年11月11日那个重要的日子以来，祖国的第二次新生到来了。继先总理毕苏斯基的意志，萨纳齐亚在此日再次重组。展望欧罗巴大陆，阴霾之下再无半点星光。东欧罗巴民族的团结之焰与西面德意志铁靴下那密布的乌云形成了鲜明对比。我们无从得知这火焰能否保全你我的自由与存亡。放眼当下，德国仍对我们虎视眈眈，国家正存于危急存亡之秋；兴许有人觉得这便是终焉，任凭无法改变都再无意义。我并不如此认为：我，奥古斯特·埃米尔·菲尔多夫，今日在此宣布，波兰第三共和国成立了！\"\n\n随之而来的，便是台下的呼声以及掌声。遥想当年，毕苏斯基元帅执政时波兰的光辉岁月，今日竟有了一丝昔日的影子。或许东欧民族独立的力量与精神如同黑夜中一抹难得的光亮，在欧罗巴大陆，在被秃鹫巢穴禁锢的沼泽之下，有一群不畏艰险的人们，正将肖邦的精神传递下去。"
 POL_ROD.18.a: "\"而曙光终将击碎乌云，波兰命数未尽，继续前进吧，祖国的战士们！\""

