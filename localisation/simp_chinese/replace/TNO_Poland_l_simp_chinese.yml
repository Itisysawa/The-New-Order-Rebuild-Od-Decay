 POL_ROD.19.t: "血色街道"
 POL_ROD.19.d: "\"操，他们真的敢开枪？\"雅库布看着四散而逃的人群说道。\n\n[Root.GetDateText]，本该平平无奇的下午却染上了一缕鲜艳的血色。自哥穆尔卡执政以来，久居高位的通胀率早已让人们感到厌倦。民不聊生，民意低落.....游行在这种局势早已是常见得不能再常见的事情，但事情却在今日起了一丝转机。\n\n今日的游行中，警察们收到了一条来自华沙的特殊命令——不论一切代价，镇压游行者们。当游行者们从卢布林行进至普瓦维附近时，警察中的其中一员开了枪，几乎是同一瞬间，游行队伍开始乱了阵脚：有的人四散而逃；有人被推倒后倒在地上被人踩踏；甚至有人在慌乱中被枪射中，于是才有了开始的一幕。\n\n如此的镇暴方式非但没能阻止反对派，更是给了他们一个借口去宣传，去数落统一工人党的不是，与此同时一股暗流也在涌动着，随时准备推翻波兰现存的无产者政权：那个他们称为\"团结工会\"的玩意。"
 POL_ROD.19.a: "\"这群人真是反了！\""
 
 ##镇压决议##
 POL_betrayers_affection: "§x反对派影响力正在上升......§!"
 POL_suppressing_the_potential_uprising: "镇压叛乱"
 POL_suppressing_the_potential_uprising_desc: "在经济危机引发的一系列连锁效应下，哥穆尔卡最终还是迎来了他最不想见到的事情：\n在经济危机下，本就不富裕的卢布林地区，有工人就粮食供给问题进行了一次游行；结果在此次的游行中，警察方阵中有人开枪误伤了工人，结果导致反对派们借此大作文章，声称哥穆尔卡专制政权的武装镇压群众，进而引发了更大规模的恐慌与动乱...\n\n现在反对派们对我们虎视眈眈，随时准备推翻我们的社会主义政权。我们不能允许这样的事情发生，我们不会允许这样的事情发生。现在，正是§x考验§!§V总书记哥穆尔卡§!的时刻......\n\n目前，\n叛乱力度为:§Y[?var_gomulka_res]§!\n§V哥穆尔卡§!影响力为:§V[?var_gomulka_aff]§!\n§b雅鲁泽尔斯基§!影响力为:§b[?var_jaru_aff]§!"
 POL_catch_them_with_list: "按名单逮捕叛乱者"
 POL_catch_them_with_list_desc: "如今的局势，对于波兰人民共和国已然构成了巨大的威胁；这群叛徒们的罢工让国内工业品供给开始指数级下降，而且他们的游行等活动也严重影响到了我们的稳定。为了镇压这群工贼们，我们将会根据公民的注册名单对叛徒们进行逮捕，将群众中的害虫尽数挑出。"
 POL_settle_martial_law: "颁布戒严令"
 POL_settle_martial_law_desc: "如若继续对这群共和国的叛徒视若无睹，他们势必只会得寸进尺。为了防止这次叛乱规模进一步扩大，以及削减他们的影响力，我们将会颁布戒严令与宵禁令，以此杜绝他们煽动叛乱的任何可能性。"
 POL_political_propaganda_dec: "波兰人民共和国政治宣传"
 POL_political_propaganda_dec_desc: "比起强硬的手段，软手段处理群众问题是个更好的方法。通过波兰人民共和国的政治宣传，我们将能够对这些游行者们作出指控，将其定性为叛乱者。这样的行动虽然会导致社会的稳定度稍稍降低，却能够有效地削弱他们的力量。"
 POL_talk_with_reactionarist: "与反对派领袖谈判"
 POL_talk_with_reactionarist_desc: "一味地镇压并不能有效地镇压住民愤，为了稳住局势，我们将会试着与反对派领袖进行谈判；并且让步，进而商讨一个能让双方妥协的方案，以此确保对方能够暂时延缓甚至放弃以暴力手段解决问题。"
 POL_promote_reforms_to_ppl: "承诺改革"
 POL_promote_reforms_to_ppl_desc: "若要彻底止住民众的不满，自然改革也是个不错的方案。哪怕是短期的改革方案画大饼也能为我们带来相对的和平，在镇压住这群人之前，起码先用这些大饼去把人们的嘴塞满，这样他们才不会有动机去反对。"
 POL_use_up_troops: "派遣军队"
 POL_use_up_troops_desc: "显然，软弱的手段并不能遏制住疯狂的群众。他们定是混入了德国的间谍，亦或是被煽动蛊惑而做出如此鲁莽的行为。雅鲁泽尔斯基将会派遣出军队去镇压这些叛匪头子，正所谓擒贼先擒王，棒打出头鸟能让我们更容易制止这次暴乱。"
 POL_set_up_internal_secure_corps: "设立内务安全部队"
 POL_set_up_internal_secure_corps_desc: "镇压行动中，没有什么人比秘密警察更懂如何制裁这群叛贼了。在叛徒威胁未消退之际，哥穆尔卡也需担心来自雅鲁泽尔斯基影响力下的威胁。如若军方的影响力逐步扩大的话，后果将不堪设想。为此，设立内务部队是必要的。"
 POL_form_up_military_junta: "军事政变"
 POL_form_up_military_junta_desc: "无能的哥穆尔卡并不能解决波兰的政治危机，相比起哥穆尔卡的无能，我们必须坚信雅鲁泽尔斯基将军的能力，只有他成为了波兰的首脑才能解决这次的政治危机！"
