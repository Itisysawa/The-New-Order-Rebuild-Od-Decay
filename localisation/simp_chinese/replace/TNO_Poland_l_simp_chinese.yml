 ####买枪####
 POL_ita_supp: "购置意大利军备"
 POL_ita_supp_desc: "作为欧洲反德的中坚力量，意大利对于德国人即使说不上恨之入骨，但也说得上心有芥蒂。不过即便如此，意大利的地位也不方便直接以志愿军支援我们，那无异于宣战，但我们可以试着从意大利人那边搞来更多的装备，意大利可以以不直接干涉的方式援助我们，这将会让我们的处境稍微改善..."
 italian_gun_production: "意大利枪械"
 italian_gun_production_desc: "对于枪械问题，意大利为了支持我们的事业，与我们秘密达成了协议：齐亚诺愿意以低价售于我们大量枪械，通过乌克兰的黑海航线入口一批枪械补给于我们，以便于武装起我们的部队。"
 italian_artillery_production: "重火力援助"
 italian_artillery_production_desc: "在面对德国人的坦克与重装甲下，轻武器并不能发挥最大作用。我们需要一些重火力武器来确保我们的抵抗有效，因此，我们也会从意大利人手上进口一些火炮装备，让我们能够对付德国人的坦克。"
 doing_decision: "我们已经在购买武器"
 italian_aa_production: "防空火力方案"
 italian_aa_production_desc: "单凭波兰如今的工业，再要大规模生产能够反制德国佬制空力量的武器简直是痴心妄想，比起天马行空的方案，从意大利进口是更好的选择。我们会试着从意大利购置一些防空武器给予我们的战士们。"
 italian_at_production: "反坦克作战"
 italian_at_production_desc: "在德国的闪电战学说中，坦克对于我们称得上是其中一个最大的威胁；在波德平原之上，他们的坦克作战更是如鱼得水，为此，我们必须做好万全准备：从意大利购入一批的反坦克装备，随后在游击作战中积极使用反坦克武器对德国佬的坦克进行打击，以此增加他们的损失。"

