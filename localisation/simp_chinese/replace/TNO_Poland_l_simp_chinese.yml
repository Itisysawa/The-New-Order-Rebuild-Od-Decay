 communist_red_troops_subtype: "激进社会主义"
 communist_red_troops_subtype_desc: "最初的\"红军旅\"也并非所谓过激的社会主义者，比起武装斗争更多的只是学生运动，或是贴海报宣传这种温和的形式斗争。然而，随着时间流逝，他们发现长久的斗争只是无用功。不论施佩尔或是鲍曼，他们压根没有考虑过改革的事情。温和的路线在德意志这个纳粹思潮根深蒂固的地方是走不通的，要打破当下的现状，一场快速而又激进的变革是必须的——起码红军派的成员们是这样想的。\n\n红军派将游击队思想贯彻于当下实况之中，进行着城市游击战：他们劫掠万恶的帝国银行，盗窃德国高层的机密文件，劫掠公共交通载具......他们不惜一切代价，奋不顾身地试图进行革命。为了加速追求革命成果，他们在持续进行着变革，这也就导致了激进主义萌芽。与此同时，红军派也从先前的毛泽东选集残页中吸取到了一些教训，那便是反对自由主义与他们在民族战争中的地位。本质上而言，他们的思想在一定程度上与毛泽东思想贴合，但由于远在东方的同志早早便与世长辞，这种意识形态并未完全完善，红军派的路得靠自己摸索，自己走下去...\n\n为契合现实状况，红军派对于激进主义与军政的接纳度也变得相对较高，这也就导致偶尔还会出现过激的情况。在这种意识形态下，要么紧握权柄，要么因自身的革命盲动而自我消亡......"
 paternalism_sanacja_subtype: "萨纳齐亚"
 paternalism_sanacja_subtype_desc: "萨纳齐亚源自于波兰民族英雄兼波兰总理约瑟夫·毕苏斯基；面对波兰二十时代初混乱的证局下，在1926年五月发动政变后的一种政治运动，\"sanaji\"即来自波兰语\"圣洁\"，其创始人毕苏斯基试图建立一种完全安全的政治情况，进行一段时间的过渡，让波兰再次进入美式共和。\n\n萨纳齐亚强调总统和总理权利之间的均衡，毕苏斯基借鉴了意大利的法西斯运动和美式民主，在政府内进行一定性的改革并试图跨越阶级矛盾，民族矛盾，该策略被极端右翼批评为\"对犹太的妥协\"，被左翼批评为\"波兰的法西斯运动\"。\n\n萨纳齐亚从来只是一个过渡运动阶段，毕苏斯基的与世长辞给了他的继承者们无数曲解书写他的新手段，当然，要么像毕苏斯基一样操控萨纳齐亚，要么就像希米格维一样被它彻底打倒..."
 liberal_conservatism_aristocratic_democratism_subtype: "改革贵族民主制"
 liberal_conservatism_aristocratic_democratism_subtype_desc: "正如昔日的波兰-立陶宛联邦那样，贵族民主制宣称所有拥有名望的贵族(也就是施拉赫塔)拥有相若的权力。他们掌控着国家大多数的要职，掌控部分权力并享有特权。\n\n与古老的萨尔玛提亚主义不同的是，改革贵族民主制反对“一票否决权”、“选举君主制”此类让昔日联邦治国瘫痪的传统特权，反而沿袭《五三宪法》的指引，政治上明确立法、行政、司法「三权分立」，由国王主持的参议院、众议院「两院并举」；经济上保护城镇市民与乡下农民，引导民族工业发展；思想上复兴启蒙思想，宣称贵族之间无论财产权力一律平等，承认贵族是自由和宪法的首要捍卫者，将贵族的美德契约与公民的法定义务有机结合。而宣布效忠于宪法的国王，可以领导掌握行政权力的皇家委员会内阁，并主持参议院，以确保王室权力强而有力又可控。\n\n1791年的《五三宪法》推行短短一年就被普俄两国以「第二次瓜分波兰」之名而推翻镇压了。20世纪的今天，这种调和了共和主义、激进主义、以及英格兰式的君主立宪的古典制度能否承受住现代的激进思想的冲击而平稳运行，宪法所宣称的“要求每一位享有公民身份，具有美德和荣誉的贵族尊重宪法的神圣性，维护宪法的持久性，将其作为国家和我们自由的唯一堡垒”能否实现，还要交给时间和波兰国王、施拉赫塔和平民来检验了。"
 socialist_deutsches_socialism_subtype: "红军派理论"
 socialist_deutsches_socialism_subtype_desc: "经历长久斗争后，人民胜利了。\n\n德意志的人民粉碎了那道枷锁——那道束缚着所有人的枷锁。那群法西斯匪徒们蒙蔽着群众的眼眸，行使着压榨人民之事：他们将其他民族定性为劣等人，却把自己的地位显赫得无比高贵，人们沦为了他们私饱中囊的工具...\n\n然而，他们的好日子到头了，自红军派的战士们攻下整个德意志地区起就已然宣告了他们的末日。社会主义的斗士们将这群纳粹匪徒们处死，将资本家们挂在路灯上，彻底终结了他们...\n\n一切落叶归根了，对于革命而言，军政也可以就此淡出红军派中心思想中了。在一系列的改组后，最终红军派整理出了一套新的理论：因工人阶级自身可能无法形成革命意识，因此融合了列宁主义下的革命先锋队理论；同时，整合了马克思主义下的无产阶级革命，以及那远在东方的同志于1929首次阐明的\"一切为了群众，一切依靠群众\"。\n\n红军派将马克思主义、列宁主义的先锋队理论，以及毛泽东思想中的群众路线撮合在一起，在贴合德意志现状的前提下限度修改，最终形成了这种崭新的意识形态。\n\n此意识形态尚且年轻，成效如何尚且无从得知，但红军派相信，时间将会证明这种意识形态的可行性。"
 ultranationalism_fundamentalism_subtype: "原教旨主义"
 ultranationalism_fundamentalism_subtype_desc: "典型的原教旨主义政权具备两大特质：统一的宗教组织和目标；对外部敌人狂热的憎恨和抗争。这类政权非常符合其认定的民族宗教斗争叙事，政治组织基本由宗教和神职人员构成，同时国内政策的制定，也严格遵循其组织宗教的信条和经文。\n\n内化的民族斗争认知使得这些政权往往会将其敌人异化，并对他们采取极端策略，包括军事扩张和暗中颠覆。与此类国家进行外交极为困难，对于被其认定为敌人的国家来说则根本不可能。总的来说，这些政权几乎处于永恒的斗争之中，且与不断增长的仇敌，进行或公开或暗中的对抗"
