 ###PPS短国策###
 POL_polish_commonwealth_tag: "波兰-立陶宛社会主义联邦"
 POL_polish_commonwealth_tag_DEF: "波兰-立陶宛社会主义联邦"
 POL_polish_commonwealth_tag_ADJ: "波兰-立陶宛"

 POL_the_victory_of_PPS: "社会党凯旋"
 POL_the_victory_of_PPS_desc: "从1892年成立以来,波兰社会党始终投身于波兰民族及波兰人民的解放斗争之中，无论在1905年的罗兹、1918年的卢布林、还是在如今伤痕累累的华沙，纵使阴风飒飒，纵使洪水滔天，波兰社会党一如既往的为了波兰的独立与解放战斗——无论前方是何种敌人。\n\n如今，在经历了将近30年的地狱岁月后，波兰再一次在邪恶帝国的尸骸上浴火重生，如同耶稣基督的受难最终带来对义人的嘉奖与对罪人的毁灭。\n\n但在胜利的喜悦与毁灭的硝烟中，那些为波兰争取独立的斗士之一，一开始得到人民选择的波兰统一工人党迷失了方向，他们变得专断独裁，变得腐化堕落，几乎让人想起在克拉科夫与华沙作威作福的纳粹专员。他们既然让人民失望，那么人民自然会摒弃他们，废止他们与人民签订的契约，将他们自神坛上打落。\n\n在这一场争取自由的斗争中，波兰社会党再一次站到了进军的前列，并成为了那个击倒巨人哥利亚的勇士，得到了人民的首肯并被加冕为王。\n\n我们要向人民证明，我们的胜利不只是一个政党的胜利，而是全体波兰人民的胜利。历史已然选择了我们——波兰社会党，来承担国家复兴的重任与荣耀。我们也会证明，我们不是统一工人党那种无能的独裁者，而是国家前进的大旗手，事实已经向我们证明，没有自由的社会主义便是奴役，没有社会主义的自由便是空谈，而我们为之奋斗的乃是一个人人共同享有的波兰。"
 POL_a_try_to_regen_the_great_poland: "波兰民族的再次胜利"
 POL_a_try_to_regen_the_great_poland_desc: "我们的祖国波兰尼亚自1939的毁灭狂潮以来便命运多舛，集中营与灭绝营在我们的土地上拔地而起，数不清的人在那里消失，只有一座座堆成山的衣物告知我们遇害者的人数。\n\n但上帝终于是向我们的国家伸出了他正义的右手，在付出了足以击倒纳粹魔鬼的鲜血与牺牲之后，我们再次跨过维斯瓦，跨过瓦尔塔，打回了波兹南与格涅兹诺——我们古老民族历史开始的地方，我们所取得的伟大成就足够让我们民族每一位伟大的祖先感到骄傲，是波兰的胜利，正义的胜利。\n\n但仅仅击垮纳粹侵略者还不是成功的结束，我们要重建我们的国家，埋葬死难者的尸骸、移去弹痕累累的废墟，在她肥沃的土地上种下未来的金色庄稼。外国的侵略者已经滚了，不代表波兰人民会忍受一个国内的独裁者，所以人民最终将继诩为人民之友的统一工人党狠狠打到了地上，并寄希望于我们开创一个美好未来，而那亦是我们所期待的，我们也发誓不会辜负他们的期望，这次运动——不，这次革命是我们英勇国家的再次胜利！为一个更加美好的波兰！\n\n前进，前进，波兰尼亚，我们勇敢的国家！"
 POL_the_true_democratic_poland: "真正的波兰民主"
 POL_the_true_democratic_poland_desc: "每一位社会党的党员，无论他的职位和职责是什么，都必须思考一个重要的问题：我们党的执政地位是怎么来的？是依靠政治算计和阴谋吗？不，是依靠波兰的民主制度和人民的支持！那么，捍卫这一蕴含着广大人民智慧的制度，努力促使它真正为每一位爱国的波兰同胞谋福利，不就是党当下最重要的任务么？\n\n我们绝不会像统工党的败类那样搞政治上的一言堂，相反，我们要建立的是一个公开透明的、为民服务的民主政府。新政府将会在现行框架内有序运行，一切人民的迫切需求——譬如扩大公民权利、保障劳工权益和追求社会包容——都不会被忽视。我们绝不会、也绝不能忘记：既然我们全都是“社会”党人，就应该把推动波兰社会进步作为第一位的奋斗目标！"
 POL_equality_of_all_nationalists: "平等"
 POL_equality_of_all_nationalists_desc: "人与人之间的平等，是千百年来无数仁人志士追求的崇高目标。无论是写出《社会契约论》的法国思想家卢梭，还是草拟《独立宣言》的美国开国元勋杰斐逊和富兰克林，他们都用自己的形式表达了相同的观点：“人人生而平等”。而实现这一理想，对于为曾经饱受德国殖民者压迫和剥削的波兰人民服务的我们而言，是不可忽视的任务。\n\n不过，如果我们只会喊空号、摆架势，自然是得不到同胞们的认可的。因此，党和政府的全体人员都必须动员起来，无论是在行政、立法还是司法方面，都必须给我国公民的平等权以最有力的保障。是的，我们要让每一个波兰人都明白一件事：只要社会党还在执政，那么“人上人”和“人下人”的理念在波兰就不会有生存的土壤。"
 POL_peoples_livelihood: "民生"
 POL_peoples_livelihood_desc: "波兰自由了，可她的人民还没有得到幸福。我们已经用口号和旗帜喂养我们的人民太久了，是时候填满他们的面包篮了——毕竟，如果波兰人民仍要每天忍饥挨饿，那么我们民族自由的光辉，也终将不可避免地暗淡下去。\n\n该把民生提上日程了。是的，波兰母亲依旧千疮百孔、百废待兴，但她的儿女不该再这样悲哀地活着了。在复兴的漫漫长路上，我们不能忘记我们人民的喜怒哀乐，不能再盲目为了什么宏大的东西去忽略那些具体的呻吟——同胞们，同志们，贫穷不是社会主义，无论何人，都拥有着追求幸福的权利。"
 POL_reveal_criminals_of_PZPR: "揭示统工党丑恶嘴脸"
 POL_reveal_criminals_of_PZPR_desc: " 统工党人是做宣传的好手，或者说，是说谎的高手。他们用空洞的口号与横幅欺骗着波兰质朴的人民，用谎言与空想去填满他们渴求着的双手。他们用红色掩饰着自己的虚伪，用铜像与肖像自吹自擂着所谓的“伟大”，用叛徒和内奸的名义屠戮着一切反对他们的人。同胞们，看清楚啊！这些统工党人，才是社会主义真正的叛徒，波兰母亲真正的不孝子！\n\n  如果你想买本笑话集来看的话，不必去书店了，打开统工党的党章和宣传册看看吧。他们口口声声说着人民，说着波兰，可他们做了什么呢？万千工人的利益成了他们派系斗争的筹码，新生的波兰民主也被他们无情的践踏。他们打着红旗喊着进步和正义，换来的却是比总督府时期更为严重的饥荒。我们历尽千辛万苦才推翻了异族的暴君，难道我们就要迎回一个自己民族的独裁者吗？绝不！让我们借用恩格斯的话来形容统工党的嘴脸吧：既不为了波兰，也不统一，更不是工人的党。"
