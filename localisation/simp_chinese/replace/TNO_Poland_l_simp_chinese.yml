 POL_gold_from_Koc: "波兰流亡政府的遗产"
 POL_gold_from_Koc_desc: "自波兰1939年的沦陷以来，经济在德意志的摧残下持续低迷，这也导致了我们难以寻得重整经济的机会。但现在，一切迎来了一个意料之外的转机：1939年波兰快将沦陷时，前经济部长亚当·科克带着黄金从波兰一路逃到了英国，再从英国转到了美国。此举保住了波兰的黄金储备，并且在华沙起义后他便带回了这些黄金储备。虽然这些黄金数量有限，但起码有了这些黄金储备后，我们能够试着利用它们重建起最基本的经济......"


 #波兰家乡军领袖与内阁

 POL_Friedrich_Christian: "卡尔-斯特凡·冯·阿尔滕堡"
 POL_Friedrich_Christian_desc: ""
 POL_revolutive_council_cha: "部长议会"
 POL_revolutive_council_cha_desc: "自人民军在瑟姆中大获全胜后，波兰革命之路却开始出现一些阻碍：在失去了共同的敌人后，波兰统一工人党内部出现了一些反对派的声音。随着时间流逝，这股声音愈发明显，到最后统一工人党分裂为了三大主要派系：波兰统一工人党，波兰社会党，以及波兰人民党。\n\n在此前提下，强硬的手段势必致使灾难性的结果降临；为此，这三个党派决定成立部长会议，并且在此后通过一次部长会议选举决定波兰革命的最终引导者。在部长会议中，三方各派出一定数量的代表，并且在议会中对提案进行判决，以及对决议进行折中处理...\n\n这样的共处方式并不会长久，待合适的时候到来之时，新的部长便会出现，波兰人民革命的结局也将由新的部长书写......"
 POL_Emil_Fieldorf:  "埃米尔·菲尔多夫"
 POLITICS_EMIL_FIELDORF_DESC:  "1939年，波兰长达30年的噩梦开始了。在德意志铁蹄的蹂躏下，波兰人民遭受了只有被纳粹视作劣等民族的人才明白的暴行。虽然波兰被从地图上抹去，但波兰民族仍在森林、山丘和下水道中求生。游击战从未结束，波兰抵抗组织从未放弃，埃米尔·菲尔多夫亦是如此。\n\n惨绝人寰的华沙起义结束后，菲尔多夫就任家乡军的指挥官。菲尔多夫是一位毕生的爱国者和两次世界大战的老兵，他生于波兰，一心只为波兰独立和民主理想。如果波兰政府在1939年之夜幸存下来，菲尔多夫可能会是一员名将，甚至成为共和国的总统。事实上，他现在是波兰地下国的统治者，这是一个藏于阴影之下的国家，菲尔多夫希冀、祈祷并乞求全能的上帝，也许有一天他们会走向光明。\n\n波兰的苦痛不忍卒读，菲尔多夫深切感受到手下将士的阵亡，而将士们把这位老兵视为一位父亲。菲尔多夫知道，波兰民族是一个概念，是每一个波兰人不可分割的一部分，即使他们中只有一个人活着，波兰也会与之相伴。长夜漫漫，德意志国似乎势不可挡，但菲尔多夫从未放弃希望。"
