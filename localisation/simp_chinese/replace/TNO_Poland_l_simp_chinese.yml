 core_all_land: "核心化所有地区"
 by_kasimir_event.17.t: "[Get_newspaper_header]白红旗重起，世纪大案"
 by_kasimir_event.17.d: "早在1935年去世的前波兰元帅，波兰国父约瑟夫毕苏斯基在华沙离奇宣布自己已经归来，面对长时间的离开，他已经掌握了圣雅德维加和波兰的全部能力，宣布要对德国全面复仇，并且要为心中的海间联邦战斗。\n\n德国方面完全吓傻了，世界屏住了呼吸，无数波兰军队如同雨后春笋般浮生出来，前坠机陨难的瓦斯蒂瓦夫西科尔斯基，失踪的爱德华希米格维，还有约瑟夫贝克上校，冯哈勒的合照在世界疯狂流传着。\n\n波兰的旗帜已经扑开，谁能阻止他们可怕的下一步行动？"
 by_kasimir_event.17.a: "唉我去谁把debug开了"


 #############波兰总督府应对起义国策树#############


 GGN_ggn_stand_still: "总督府屹立不倒"
 GGN_ggn_stand_still_desc: "\"统领波兰总督府将证明我的能力\"，至少过去的汉斯·弗兰克是这么想的。现在的他只想给过去的自己一巴掌，本以为会成为大日耳曼帝国东方总计划的伟大建设者，结果自己却深陷在这无穷无尽的游击队烂摊子之中，靠着欺上瞒下的方式维持自己的地位。现在希特勒行将就木，汉斯·弗兰克的弥天大谎已经包不住了，无论是为了避免被游击队吊死在绞刑架之上还是被国内的政敌在法庭上清算，他必须立刻做出行动，为自己博得一线生机。"

 
 ################波兰家乡军起义准备阶段国策树###############

 
 GGN_prepare_for_a_final_riseup: "继1956之志..."
 GGN_prepare_for_a_final_riseup_desc: "1956年惨烈的华沙起义带给了我们一次沉重的打击，训示着我们的错误。如今总督府尚未恢复过来，即使德国的铁骑再次出现在波兰的领土之上，多方抵抗实力尚未放弃。不论是国家军亦或是家乡军，再或者是蜥蜴同盟和人民军，我们都只有一个共同的目标：了结此一暴君。"
 GGN_secret_arm_ow: "蜥蜴同盟秘密武装"
 GGN_secret_arm_ow_desc: "昔日在1929年克拉科夫进军失败而变得臭名昭著的波兰极端民族主义政党波兰全青年前进同盟，因为纳粹德国的暴政和共同的波兰复国梦想，同盟在现党魁萨尔斯基的带领下组建了新的蜥蜴联盟武装。\n\n相对于被击溃的国家军来说，蜥蜴同盟的装备更加糟糕，但是他们的作战意志格外的顽强，一种复仇的火焰在他们的梦想中迸发出来。\n\n他们在战前是犯罪分子，强奸犯，反政府武装，而今日，他们为了一个共同的目标聚集在一起。"
 GGN_secret_arm_ow_tt: "§Y当第二次华沙起义爆发时，波兰将会获得更多的步兵装备§!"
 GGN_secret_arm_ak: "国家军地下经济"
 GGN_secret_arm_ak_desc: "自从波兰落入纳粹魔爪，沦为德国人掌握下的总督府后，原来的经济秩序彻底崩溃了。总督府的经济体系并非自成一体，而是大日耳曼国庞大经济机器上的一个零件。德国佬对本已一无所有的波兰人民敲骨吸髓，竭泽而渔般地榨干他们身上最后一点价值，一切只有一个目的：把波兰彻底变成大日耳曼国的输血包。\n\n身为波兰的战士，我们自然无法容忍这一切，终有一天我们要把这一套体系砸个稀巴烂。但在此之前，我们必须先建立属于自己的、全新的体系。我们的处境决定了它必须兼备两个特点：隐蔽和有序。它必须能够躲过德国佬的监视和封锁，为我们的同志提供经济支持，如同悄无声息运作的中央地暖。同时，它必须像地下水管道一样四通八达，凡是涉及经济领域的事务，在国内外都应该能灵活、高效地运转。\n\n建设这一切自然并不容易，但这是为了我们的同志们在战斗时没有后顾之忧，以及探索祖国解放后新经济体系的构建。总之，一切是值得的。"
 GGN_cooperation_that_never_thought: "未曾设想的合作"
 GGN_cooperation_that_never_thought_desc: "局势越来越明了：希特勒遭遇刺杀，即将不久于人世；大日耳曼国内乱加剧，军队纷纷被召回本土；而汉斯·弗兰克的暴虐已经将波兰人的愤怒推过了极点。\n\n是时候了。第二次华沙起义的时机将要来到，波兰民族最后的机会即将来临。为了共同的事业，家乡军的菲尔多夫将军、国家军的统帅科莫洛夫斯基、人民军主席哥穆尔卡和民兵头领萨尔斯基，将要代表各自的派别相聚一堂，一同探讨起义的最终方案。矛盾几乎无法避免，争吵与纠纷也不会缺席，但他们终将团结一致——因为千千万万的波兰儿女们都知道，历史和他们的§V生命§!一样，仅仅只有§V一次§!，循着命运的轨道前行，§<永远不再重复§!\n\n而这是他们毕生唯一一次改变历史的机会。"
 GGN_cooperate_to_satan: "与魔鬼勾肩搭背"
 GGN_cooperate_to_satan_desc:  "人民军从来在反德武装中都是独树一派的派系，但大敌当前，他们又不得不与自己所痛恨的其他派系合作。为了对付德国人，他们不得不握手言和，即使他们偶尔会有些冲突，但他们不会傻到放弃自己的国家以进行那无聊的意识形态斗争。"
 GGN_unite_and_prepare_to_fight: "联合而统一"
 GGN_unite_and_prepare_to_fight_desc: "1956年的华沙起义已经证明了，单凭任何一个派系的力量，都无法拯救波兰母亲于镣铐之中。此时此刻，不论是家乡军还是国家军，抑或是左倾的人民军和军国派的蜥蜴同盟，都需要冰释前嫌，团结一致。\n\n这将会是一个绝望的同盟、一个矛盾重重的阵线，一个前途未卜的存在。让他们联合起来绝非易事，但又断非是不可能——因为他们都知道，为了使那红与白的旗帜再度飘扬在维斯瓦河之畔，他们都愿意献出自己的生命，和全部的鲜血。\n\n而那鲜血不分信仰，都是一样的§V殷红§!"
 GGN_split_up_teamwork: "分头行事"
 GGN_split_up_teamwork_desc: "抵抗运动并非一朝一夕就能覆盖整个总督府，若想快速建立情报网就注定了我们不能将所有精力集中在一点。为了早日将情报网覆盖于整个波兰敌占区，我们的兵员将会分散。\n\n如此一来，不论是华沙，亦或是克拉科夫，甚至是卢布林，利沃夫......我们都可以确保我们的情报能覆盖这些区域。"
 GGN_POL_is_not_yet_lost_tt: "§Y当第二次华沙起义爆发时，波兰将会获得更多的反坦克装备§!"
 GGN_POL_is_not_yet_lost: "波兰没有灭亡..."
 GGN_POL_is_not_yet_lost_desc: "有什么象征性的产物最能代表波兰人那宁死不屈的精神呢？自然是1797年所作的那首《波兰没有灭亡》。\n\n莱赫之子将这首歌的歌词时刻铭记于心，在遭遇强敌时，他们在各处抵抗着：在学校、在地下某处、在克拉考......\n\n对自由的向往从未被波兰人遗忘，也绝对不会被遗忘。抵抗不会因这一些小挫折而停下，除非波兰人的最后一兵一卒亦然战死，否则波兰就还没有灭亡。"
 GGN_as_we_still_breath: "...只要我们一息尚存"
 GGN_as_we_still_breath_desc: "德意志对我们的践踏并未能将我们就此从地图上抹去，在波兰数百，乃至千万人民的抵抗下，只要尚有一个波兰人存在，我们就不会停下我们的步伐。抵抗运动正在如火如荼地进行着，反德情绪也愈发高涨，民族之焰正准备再次燃起，一切兴许正如那句歌词一般:\n\"波兰没有灭亡，只要我们一息尚存。\""
 GGN_what_invasor_took: "侵略者所夺走的..."
 GGN_what_invasor_took_desc: "德国人想建立起一个天堂，于是在波兰建立起了一座又一座的坟地——\n他们掠夺着波兰的一切，不论是波兰人的命或是他们所剩余的一切，德国佬们早已将这里变成了人间炼狱。现在，此地还剩下的，早已是一副破败不堪的躯壳，一座座血汗工厂林立于此，里面充满了几近失去灵魂的波兰人们。我们不会遗忘，我们不会容忍，终有一天我们会夺回属于波兰的一切。"
 GGN_we_will_take_it_back_by_our_sword: "...我们将以手中战刀夺回"
 GGN_we_will_take_it_back_by_our_sword_desc: "\"侵略者所夺走的，我们将以手中战刀夺回\"\n在历史上，这段歌词早已得到验证。我们从俄国侵略者手中夺回了本就属于我们的自由与独立，那时的维斯瓦河奇迹让我们得以击退俄国人，骁勇善战的波兰人不会允许外来者就此掠夺走属于我们的东西，总有一天，我们会像以前的先辈们一样，哪怕不惜战至最后一兵一卒，也要推翻德国腐朽的统治！"
 GGN_marsh_like_dabrowski: "如东布罗夫斯基一般前进"
 GGN_marsh_like_dabrowski_desc: "东布罗夫斯基在波兰是一个英雄的姓氏。1797年，亨利·东布罗夫斯基的姓氏被写进了波兰国歌，他所率领的意大利波兰军团在拿破仑的麾下，杀回了他们的故土，让自己的祖国短暂地重返人间。\n\n大半个世纪过去了，波兰早已再一次沦亡，于是另一个东布罗夫斯基又站了出来。他把半生都献给了祖国的解放事业，起义失败后又辗转流亡巴黎，最终以公社总司令的身份光荣的战死于异乡。\n\n在此之后又是将近一个世纪，波兰再一次新生，又再一次灭亡。其间，千百万个东布罗夫斯基义无反顾地降生于这片大地之上，他们的血液像开春时的维斯瓦河一样慢慢涨满了身躯，又在刹那间像他们的无数先辈一样尽数洒向了波兰的热土。\n\n而今，波兰民族又到了§V生死存亡§!的关头。东布罗夫斯基的儿女们，定将再一次为了波兰母亲踏上疆场——而千千万万的波兰人民，将会紧跟着他们的步伐，正如国歌所咏唱的那般：\n\n\"听啊，我们的战士们，\n敲响了战鼓，\n前进，前进，东布罗夫斯基！\""
 GGN_from_italy_to_poland: "从意大利杀回波兰"
 GGN_from_italy_to_poland_desc: "虽然意大利和纳粹在二战中站在了一起，不过如今，他们现在以同室操戈，再加上意大利和波兰近代以来的友谊，意大利在有意的收留波兰人，虽然说是友谊，更多是政治交换。\n\n意大利是一个强国，我们需要时刻学习他们，如同当时东布罗夫斯基将军那样:前进，前进，前进！在您的带领下，从意大利杀回波兰！"
 GGN_set_up_different_war_zone: "设立各大战区"
 GGN_set_up_different_war_zone_desc: "第二次华沙起义将不仅仅局限于华沙一地，而会是一场纵贯总督府全境的大起义。卢布林、扎莫希齐、拉多姆、凯尔采，甚至还有汉斯·弗兰克的老巢克拉科夫——凡是总督府的暴虐所及之处，波兰人民都会揭竿而起，把他们全部的怒火与义愤，都尽数洒向那在城头飘扬着的黑白宝剑旗。\n\n为了部队的协调以及指挥的妥当，有必要提前划定几大战区，让各大派别分别指挥自己势力最为强盛的地区。战区里的各支部队，不论先前的归属如何，都要听从战区长官的指挥——尽管这意味着先前的敌人可能会成为自己的长官，或是不同战区的兄弟部队难以相互驰援。不过，只要波兰民族得以解放，这又算得了什么呢？"
 GGN_unite_treatment: "多方签署统一协议"
 GGN_unite_treatment_desc: "架子已经摆好，舞台已经布置，现在就等着四人的态度了．．．．．不论是菲尔多夫、科莫罗夫斯基，亦或是哥穆尔卡和萨尔斯基，大家从未如此接近。虽然矛盾尚存，但是最基本的协议已经签好。\n\n我们必须共同握住长叉，共同对抗进犯之敌。"
 GGN_support_from_USA: "光自远方而来"
 GGN_support_from_USA_desc: "虽然世界之事未尝眷顾于我们，但是昔日自由之地还有少许灯亮，在二战结束后依然坚持着的美国依然照亮着，随着越来越多的起义军事迹被拍成照片和电影中宣传，美国人民对波兰的支持与日俱增，来自芝加哥的波兰流亡政府依然没有停止着运作，中情局的特工也尝试潜入这个秘密之地。\n\n波兰，美国，一切为自由！"
 POL_underground_state_preparing: "起义前的准备"
 POL_underground_state_preparing_desc: "就算我们已经调配了我们可以动员的力量，但是我们依然缺衣少食，我们依然在帝国的军队下不堪一击，我们依然更像一支孤军，我们可不想在让1956年华沙起义的旧往在波兰大地再次上演．．．．．．"
 GGN_run_from_romania_tt: "§Y我们将可以透过罗马尼亚走私各种军火§!"
 GGN_run_from_romania: "罗马尼亚走私路径"
 GGN_run_from_romania_desc: "如果你查看历史书便不难发现，罗马尼亚与波兰的关系并不差，这两个民族也并没有如同苏联或是德国那般结下梁子；相反，罗马尼亚甚至愿意在战时接纳流亡的波兰人，在如此的背景下罗马尼亚也自然愿意私下帮助这群可怜的波兰人。 \n\n地下国只需要支出一笔简单的过境费与装备购入费，便可以通过此缺口购入更多的装备，为起义作出更多的准备。"
 GGN_unite_war: "间谍及敌后作战"
 GGN_unite_war_desc: "要说波兰地下国的实力，可能正面作战而言兵力说不上特别强，然而波兰有着特别强的游击作战能力与间谍作战能力。通过潜入总督府进行各种的行动，都可以让我们获得更多总督府的情报，或是摧毁他们的后方；有了这些情报的加持也足以让他们在日后的作战中喝一壶了。"
 GGN_pilecki_plan: "皮莱茨基的计划"
 GGN_pilecki_plan_desc: "皮莱斯基少将——\"死亡4859\"固然已经成了波兰流亡军中的传奇，在不间断的间谍渗透中，我们不可不借鉴这位勇敢英雄的经验。\n\n皮莱斯基指出，在地下国之上，纳粹帝国已经把波兰变成了一个集中营联邦，要是我们能在他们衰弱的地方，比如扎莫希奇，塔尔奴夫等地，来一次完美的突袭，救出抵抗中的波兰人和俘获弹药武器，这些都是足够好的，我们需要慢慢的蛀蚀纳粹帝国的遗产。\n\n虽然，这些本来就是我们的。"
 GGN_blue_police_corruption: "利用贪腐"
 GGN_blue_police_corruption_desc: "在东方，纳粹帝国的腐败已经不再是秘密，德裔波兰警察一方面也随着我们游击队的破坏，也开始逐渐变成双面派，开始有条件的和我们合作，利用这些波兰警察，我们的突击计划会更加顺利的，毕竟我们只需要少量的钱．．．．．花点钱总比流血更好，不是吗？"
 
 POL_wind_rain_back: "山雨欲归..."
 POL_wind_rain_back_desc: ""
 POL_underground_state: "波兰地下国"
 POL_underground_state_DEF: "波兰地下国"
 POL_underground_state_ADJ: "波兰"
 POL_kuban_another_revo: "克里米亚的威胁"
 POL_kuban_another_revo_desc: "尽管乌克兰战役中我们战胜了专员辖区，纳粹政权的余孽却仍然盘踞在克里米亚半岛之上；乌克兰方面对此问题十分重视且希望收回克里米亚主权，而为了避免日后节外生枝，我们将会选择对纳粹的\"陶里亚地区\"伪政权宣战。"

 POL_request_from_salski: "萨尔斯基的异议"
 POL_request_from_salski_desc: "在波兰所发动的第二次华沙起义成功后，萨尔斯基逐渐对于民兵的数量感到不满，或者说是，他们并不甘于落下风于家乡军那群人们。为此，他试着与菲尔多夫进行谈判。他打算扩增蜥蜴联盟的力量。事实证明，萨尔斯基的野心是巨大的，他并不打算久居于人下，但现在大敌当前，如若有了民兵也能提供我们一定的抵抗力量，现在放在菲尔多夫面前的难题正是这个致命的选择题：是与萨尔斯基妥协？还是严禁蜥蜴联盟扩张？"
 POL_ways_to_stable: "维稳之法"
 POL_ways_to_stable_desc: "1863年革命期间，白红两党的争执导致了波兰革命的虎头蛇尾，伟人毕苏斯基和德莫夫斯基不同的国家态度也导致了里加条约的耻辱，纵观历史，我们波兰人的内斗问题貌似一直无法解决........问题在于内部，并非外部。\n\n我知道，萨尔斯基并不喜欢我们，哥穆尔卡是一位坚强的战士，他对毕苏斯基的元帅的态度和我们同样令人担忧，唯一可以支持我们的就是科莫罗夫斯基的国家军们，但是，波兰想要自由，必须需要各种人的力量。\n\n我知道，波兰必然自由，在此之前，我们必须做出让步。\n历史的重担肩负在我身上，我，菲尔多夫，必然要为了白红旗帜的飘扬，和他们谈谈......."
 POL_set_up_council: "设立议会"
 POL_set_up_council_desc: "谁都知道，议会都是骗人的东西！他们争执，刺杀，搞得波兰母亲混乱无法自拔，1926年元帅的进军就是为了挽救这一切。\n\n可是现在，波兰的失败好像成了萨纳齐亚的失败似的，我强忍着，我微笑着听着哥穆尔卡要独立出议会的要求，我简单拒绝了萨尔斯基要多数派位的无理取闹，让人意外的是，科莫夫斯基对于民主却是支持的态度。\n\n好吧！让我们组建瑟姆吧，让我们坐下来一起讨论吧！就和七百年前的先辈一样，我们波兰可是最喜欢开会和民主的国家。\n我低头愁思，望向飘扬的祖国波兰母亲的旗帜，看着三人和无数的旁从，让我来宣布瑟姆开会吧。\n萨纳齐亚之梦，还得继续努力......."
 POL_ways_to_german: "军事指挥部"
 POL_ways_to_german_desc: "即使各方各派都怀着对德国的不满，但在大敌当前却没有一个统一的计谋与对策；各方势力对于抗德的计划各有不同，却又各自为伍，这样的处境只会让我们日后的计划变得混乱，也将让我们的处境雪上加霜。\n\n为此，我们将会试着利用新生的议会，讨论不同的抗德方案并且最终试着留下一个折中的方案，以此避免在面对即将到来的战争时出现决裂...\n\n§x我们不能让1939的灾厄再次降临于祖国母亲的圣土之上...§!"
 POL_armed_AL: "武装人民军"
 POL_armed_AL_desc: "对于抵抗德国人的入侵，人民军方面认为人力资源自然是不可或缺的一环：人民军有着极其高的动员能力，并且擅于人海作战方面的战术。基于此前提之下，我们可以试着通过武装起人民军的方式加强我国的武装力量，通过大规模的动员与武装迅速组织起一支规模巨大的军队。在面对德国人的入侵下，波兰人民将越战越勇..."
 POL_armed_AK: "强化家乡军"
 POL_armed_AK_desc: "比起信任那群不稳定的派系，菲尔多夫更愿意相信那群与自己一同作战的战友。在德国人占领维斯瓦河流域的23年以来，家乡军面对着的却不只是德国人的威胁；那群蛀虫甚至曾与德国人为伍，对付波兰的自己人。他们宁可为了自身利益而放弃整个民族，菲尔多夫又怎能放心把力量分散于他们？\n\n但坐以待毙也并非长久之计，新生的萨纳齐亚将会试着采取中庸之道，对各方进行折中的方案合作..."
 POL_armed_OWOZ: "蜥蜴联盟与敌后作战"
 POL_armed_OWOZ_desc: "变革，变革，还是变革。\n这群该死的家乡军和人民军除了所谓的革命就是合作，甚至还崇拜曾经与德国人言和的走狗，把波兰交到他们手上又怎能振兴民族？即使他们也曾经抵抗过德国人，但他们终归还是一群不入流的家伙，只有德莫夫斯基的继承者与反动武装的中坚才有足够的作战经验。为了波兰民族的命运，蜥蜴同盟会大肆宣扬民族主义，让波兰民族之焰重燃！"
 POL_AK_strong: "外强中干"
 POL_AK_strong_desc: "\"身经百战数十年\"\"歼灭敌人万余\"\"配合坦克作战\"，实际上，家乡军的同胞们在一度为了饥饿和生命搏斗，并非为了波兰母亲，这些令人亢奋的英雄故事更多是为了煽动人心罢了，没有人愿意提起1957年惨不忍睹的扎莫希奇起义（德军最终以不到一个旅的力量镇压了整个起义军，将扎莫希奇灭为了平地）。\n\n现已经，波兰已经独立，再次打肿脸装胖子的行为无疑是自讨灭亡，虽然国内外同情我们的国家都强调我们的勇敢，但是目前我们的部队缺弹少粮，我们更多时候，是为了自己的口粮而战，而不是为波兰而战，军队训练，新人召集，武器配发，这些都是未竟之事。\n\n我们必须打出好的战绩让同情我们的国家给予我们更多的支持，不然，等到纳粹的铁蹄碾碎我们被神化的胸膛之下，只留下国际上越来越少的援助和唏嘘......."
 POL_limited_adapting_socialism: "限度接纳社会主义"
 POL_limited_adapting_socialism_desc: "遥望东方的动土，曾经的欧洲宪兵现今早已支离破碎，任由秃鹰蚕食他的躯壳。四十多年前的世界大战让波兰重见天日，然而贼心不死的红色政权却任然对祖国的土地垂涎三尺。在先总理毕苏斯基的领导下，全波兰万众一心，成功的在最后一刻抵御了俄国人的红色魔爪，捍卫了波兰共和国的存在......\n\n时过境迁，现在东方的红色巨熊已经倒下，但赤化的风暴却从未停息。十几年间，早已销声匿迹的赤色分子又一次活跃于祖国的土地之上。不可否认，他们也在为了祖国战斗着，考虑到他们在联合阵线中的重要地位和对新国家的贡献，我们不得不认真考虑如何与这些......盟友？和平共处。"
 POL_no_radicalism: "杜绝激进主义"
 POL_no_radicalism_desc: "历史的车轮协同邻国的战车一次次将祖国碾得粉碎，波兰的儿女们早已受尽了世间的一切苦痛，但一代代的波兰人总能在巨大的屈辱下重兴屹立于世。今天，浴火重生的母国又一次挣脱了外族人的枷锁，她再不能承受再历史的重演，法西斯的钢鞭近在眼前......\n\n旧日的伤痛还未愈合，就有人意图将尚未愈合的伤疤撕裂——国内的小部分极端分子妄想吸干人民的鲜血，用复仇的烈焰裹挟迷失的群众为他们虚幻的末日狂想献出一切。无论如何，我们都不能坐视涅槃重生的祖国滑向深渊而不管，威胁近在眼前，我们不能把自己的伤口暴露给敌人，必须将这些极端分子铲除......"
 POL_new_pilsuski: "毕苏斯基再世"
 POL_new_pilsuski_desc: "我的健康状况因为过度的操劳日益恶化，更令我忧心的是，政府内部的党派斗争也愈发严重。萨尔斯基的小动作还有哥穆尔卡的眼神，搞得好像我不知道他们的阴谋一样。是啊，他们知道，他们很重要，没有他们，波兰就会崩溃，萨纳齐亚就无法实现。最坏的可能是，在德国人入侵之前，波兰就已经从内部瓦解了。\n\n然而，只要我，波兰总统菲尔多夫还在，就没有人能摧毁波兰的民主，因为没有人能让我失声。萨纳齐亚的统治必然继续，毕苏斯基的梦想必然实现。\n\n\"我会确保这一点，这是我的责任。\""
 POL_settle_up_Commissaire_Politique: "设立政委"
 POL_settle_up_Commissaire_Politique_desc: "一支部队要想变得强而有力，除了物理意义上的武器，思想上的武器也必须熟练掌握。在后一块，我们的部队还有很大的进步空间。\n\n我们的战士们要如何掌握进步的思想呢？毫无疑问，他们需要领路人，而政委——对我们的社会主义理想理解得最透彻的同志们，就是他们最佳的领路人。我们将在每支基层部队设立政委职务，让政委们向全体战士们作广泛的、持久的政治宣传，让他们自觉团结在红旗之下，大踏步地前进！"
 POL_organizing_people: "团结人民"
 POL_organizing_people_desc: "我们需要时刻深思一个问题：我们的起义为什么能成功？为什么我们能打败\"不可战胜\"的德国人，让波兰的旗帜再次高高飘扬？答案很简单：人民，因为我们得到了广大波兰人民的支持，团结一心的他们最终砸碎了大日耳曼国强加给波兰民族的枷锁。\n\n而现在呢？波兰母亲虽然重获自由，但她的死敌仍然在磨刀霍霍，时刻准备给她致命一击，让她的孩子们重新沦为奴隶。值此危急关头，我们更应该延续优良传统，利用可以利用的一切手段，向人民宣扬我们的信仰和意志，以求再次激发蕴藏在他们中的伟力。\n\n只要波兰人民再次携手共进，大日耳曼国的侵略者，注定要在我们用血肉铸成的铜墙铁壁前撞个头破血流！"
 POL_lesson_from_the_failure_union: "联盟失败的教训"
 POL_lesson_from_the_failure_union_desc: "苏联——这个列宁和他的同志们缔造的伟大国家、令全世界社会主义者景仰的红色巨人，却在与德国法西斯的殊死对决中倒下，并最终四分五裂。面对这种悲剧，我们不禁要问：这是为什么？\n\n政府高层的不睦、工业发展的迟滞、军事战略的失误...联盟的失败给我们留下了太多的经验教训。为了让新生的波兰不再走相同的弯路，我们必须对此加以研究，结合我们的国情制定应对之策。否则祖国的结局，可能会和已故的联盟一样——不，应该会更加凄惨。" 
 POL_strict_army_rule: "整肃军规"
 POL_strict_army_rule_desc: "一支没有严格军纪的军队，就算势力再庞大，充其量也只是一群乌合之众。不幸的是，这种情况在我们的部队里尤为明显：由于我们征召士兵时过于注重数量，忽略了质量，导致他们的素质良莠不齐。\n\n这种情况必须被遏制！我们将制定一套完整的部队军规，首先向高级指战员们普及，再让他们逐级传达，直到每个士兵都牢记于心！所有人都必须明白：军规不是为了束缚部队的拳脚，而是为了让部队更好施展拳脚存在的！"
 POL_polish_nationalism: "波兰民族主义"
 POL_polish_nationalism_desc: "波兰民族，从公元五世纪开始崛起，那杆皮亚斯特的白头鹰奠定了我们的肉体，伟大的梅什科大王举起的那基督的意志，锻造出了我们民族的灵魂。基督捍卫了波兰民族，这也是为何，波兰民族也誓死为他而战，1683年维也纳的翼骑兵的旗帜下，我们在山上呼啸的死亡之声撕碎了异教徒的声音，在祖国母亲遍布鳞伤的时，无数波兰人勇敢地为其战斗。\n\n波兰立陶宛联邦是一段愚蠢的历史，波兰崛起，波兰必然要征服东欧，傲然面对他的日耳曼敌人。就像1410年那样，砍下他们的头颅，为新生的波兰祭祀。\n\n我们是波兰人，我们是波兰人，我们是波兰人！我们将永远为了波兰而战！"
 POL_Sturmabteilung: "波兰的冲锋队"
 POL_Sturmabteilung_desc: ""
 POL_more_radicalism: "设立冲锋队"
 POL_more_radicalism_desc: "有些人说，青年冲锋队是德国佬创立的，放他们的屁！当我们的先辈高举那面绿色与白色剑交织的旗帜，在克拉科夫进军的时候，他们在哪里呢？那个时候那个少一颗蛋的元首还在低头试探呢！\n\n恢复我们的传统刻不容缓，快快设立冲锋队！这个时代，需要更多自信的是波兰人，拿起我们的武器，同胞们，是谁在伤害波兰？那些自讨灭亡的萨纳齐亚人？还是那些高喊的所谓\"工人万岁\"的社会主义者，在这些，我们都不需要，我们一切平等，为了一个健全纯净的波兰而战！绞死那些肮脏的德国人，还有犹太猪！\n\n你是波兰人，我要你，现在为了纯净的波兰母亲拿起武器，为此奋斗！"
 POL_things_from_ONR: "民族激进阵营的遗产"
 POL_things_from_ONR_desc: "德莫夫斯基的逝去，皮亚斯基的背叛，萨纳齐亚的铁拳碾碎了1930年克拉科夫伟大的进军...但是民族激进阵营依然不倒，我们顽强的为了波兰民族战斗，不论是在华沙，亦或是克拉科夫、再或是利沃夫。\n\n利沃夫是我们的，可是乌克兰人却宣称是他们的，格但斯克是我们的，却被德国佬刻上了耻辱的但泽一标签，每个波兰人该不该为此愤怒？看看吧，波兰民族已经到了最危险的地步，你在前线战斗，可是后面的乌克兰人抢走了你的妻子，你负伤回家后，犹太人拿走了你最后一点遗产，你留下的只是一点点面包。\n波兰人，你该不该愤怒？\n我们依然愤怒。"
 POL_Dmowski_thought: "德莫夫斯基之志"
 POL_Dmowski_thought_desc: "德莫夫斯基总理，一位伟大的思考者，在1905年出版了《一个现代波兰人的思考》。他寄托在这本书的思想，如同一道明亮的光线，照亮了我们波兰人黑暗的前途。是啊，我们波兰人就是波兰人，不是立陶宛人，白罗斯人，乌克兰人，更不是所谓的联邦人！\n\n旧的波兰立陶宛联邦已经死去，我们根本不愿意它回来。每个合格的波兰人都应该明白\"我是波兰人，所以我有为她付出一切的责任\"。新的波兰民族必将光荣的崛起，而最后，在必将载入史册的20世纪，波兰将会成为令她的孩子们骄傲的强国！"
 POL_pause_conflict: "暂缓恩怨..."
 POL_pause_conflict_desc: "留给瑟姆调整战术的时间已经不多了，而现在最终的方案已经出炉。为了永恒的胜利，波兰人们不同派系之间的恩怨也应当暂时抛诸脑后。\n\n话虽如此，即使各方将暂时放下恩怨，但不等同于我们会就此忘掉其他派系所作所为，他们的罪行，他们的诡计可能仍潜藏于心中；为此，我们仍然需要对他们留个心眼子。\n\n§x兴许等维斯瓦河的奇迹再现之时，便是我们对他们算账的时机。§!"
 POL_time_to_eliminate: "...秋后算账"
 POL_time_to_eliminate_desc: "那群该死的德国佬已经被通通赶回了维斯瓦河对岸，而红与白的旗帜亦飘荡于华沙上空，现在最危险的外部因素随着德国的解体也已然消散。此时波兰要面对的最大问题是：在失去了外敌后，各派系也自然失去了\"联合抗德\"的限制，左派、原有的萨纳齐亚政府与蜥蜴同盟就此再次展开了内斗。波兰之秋已然度过，这正是秋后算账的好时机；我们也将谋求机会击溃我们的敌人...\n\n究竟鹿死谁手，谜底也即将揭幕..."
 POL_economic_recovery_road: "经济复苏长路"
 POL_economic_recovery_road_desc: "经历了汉斯·弗兰克毫无人性的暴政，以及战争的摧残，波兰的经济已经是奄奄一息。工厂倒闭，商店关门，农田抛荒...人民的生活条件惨不忍睹，他们在绝境中挣扎，艰难地度过一天又一天。\n长此以往，新生的祖国必然再次崩溃。所以说，是时候了，让我们把精力投入到振兴经济上。我们至少要让人民吃饱穿暖，因为这是我们的职责。\n\n现在，出发吧，哪怕路还很长..."
 POL_war_economy: "延续战时经济"
 POL_war_economy_desc: "在枪炮轰鸣、硝烟弥漫的战争时期，为了集中力量供应前线，我们采取了一系列特别措施：物资限量配给、余粮征集、义务劳动...我们原以为，这些只是特别时期的权宜之计，在战火停息后便可终止。但现实告诉我们，我们的想法过于天真了。\n\n尽管可能招致民众的不满甚至反对，但是为了持续给经济发展注入动力，我们不得不做出了艰难的决定：将战时的一系列措施延续下去，直到波兰的经济状况得到彻底好转，能够正常运转为止。\n\n我们都知道，这会给祖国带来难以抑制的阵痛；不过我们十分清楚我们的目标：今天后退一步，是为了明天前进两步。"
 POL_food_from_ukr: "面包篮中的粮食"
 POL_food_from_ukr_desc: "奉上天垂怜，波兰一直是欧罗巴大陆最适合种植粮食的地方，加上乌克兰肥沃的黑土，我们本不应该因为粮食发愁，自从纳粹来后...\n\n好吧，我们不想再回忆那些强盗，战争废墟过后，鸟儿会重新歌唱，大地会重新复苏，大地是人类的摇篮，让我们满怀期待的种下粮食种子，这些将是我们为之奋战的血液。\n\n愿来年，又是一片金灿灿丰收的大地！"
 POL_osten_mines: "东境矿物"
 POL_osten_mines_desc: "波兰从来不缺少土地，可是波兰稀缺矿石资源，先辈的奋斗让我们获得了一小部分西里西亚，现在我们却完全丢失了它。\n\n粮食是人类的血液，矿石是机器的血液，为了波兰，我们可以稍微不择手段一些，毕竟矿石可不会说话，对吧？\n\n派遣点秘密的部队，加上纳粹帝国的贪腐...\n要是明天的香肠都没办法填补自己的肚子，干嘛为了千年帝国的一些破石头卖命？"
 POL_turn_to_ground_production: "转至地面生产"
 POL_turn_to_ground_production_desc: "当我们的战士们还只能进行地下抵抗时，一切物资的生产，都只能在见不得光的地方进行。如此进行生产，效率十分低下，对我们的需求也只是勉强能够应付。\n\n然而现在，祖国已经光复了，我们重新成为了波兰的主人。既然如此，过去那套落伍的生产方式也是时候淘汰了。从现在起，所有的生产线都将转移至地面，生产全流程都将在专业人士的指导下进行。我们将向所有人，包括万恶的德国佬证明：波兰从废墟中崛起的速度，将超乎想象！"
 POL_cooperate_romania: "罗马尼亚经贸合作"
 POL_cooperate_romania_desc: "在奠定了如今世界格局的残酷大战中，罗马尼亚选择了追随轴心国，希望能在阿道夫.希特勒和他的国家赢得胜利后，作为胜利者谋得利益。然而，他们显然高估了德国人的人格。在大日耳曼国成为欧陆霸主后，他们仅仅\"赏赐\"给了这位盟友一点微不足道的残羹剩饭；不仅如此，他们还试图全方面掌控这个\"小弟\"。如此一来，罗马尼亚人对日耳曼尼亚当局的不满，可想而知。\n\n虽然我们并不关心这两个国家恩怨的根源，但他们之间暗藏的敌意却给了我们天赐良机。作为邻国，我们要与罗马尼亚进行交流，简直轻而易举。我们将秘密派出代表团赶赴布加勒斯特，与他们就经贸方面的合作进行商议，并争取达成一份长期的协议。\n\n或许在以前这十分困难，但既然我们多了德国佬这个共同的对头，那么，与敌人的敌人成为朋友也不是什么难事...不是吗？"
 POL_away_from_cloud: "走出阴霾"
 POL_away_from_cloud_desc: "经过艰苦的努力，新生的波兰终于在经济上有了起色。一直以来，我们都在摸着石头过河，因为面对最初祖国百废待兴的困境，没有人有现成的经验。稍有不慎，我们就可能被敌人，甚至是我们自己打倒--幸运的是，现实证明我们的一系列举措都是正确的。\n\n但这还不是终点，如果我们希望波兰母亲能坚定地立于这个变幻莫测的世界，就需要继续自力更生，脚踏实地的务实前进。当然，我们是乐观的，毕竟我们既然能走出最困难的境地，又为何不可能更进一步呢？"
 POL_road_to_rebirth: "长路复甦"
 POL_road_to_rebirth_desc: "1920年，波兰民族的英雄约瑟夫·毕苏斯基面对看似不可战胜的苏俄军队，采用了非凡的战争策略，最终创造了令人惊叹的\"维斯瓦河奇迹\"。而现在，我们可以自豪地宣告：作为英雄的后继者，我们冲破了重重阻碍，在经济领域复刻了这样的奇迹！\n\n最初，不仅是我们的敌人，甚至连一部分我们的同志都认为：波兰光是\"站起来\"都十分困难，更不要提\"富起来\"了。然而我们还是做到了：在全体波兰人民的共同奋斗下，经济的萧条已成过眼云烟，各行各业都开始可持续地发展，曾经虚弱的祖国母亲如今依然身强力壮！\n\n是的，我们曾经走过了很长的路，今后也有很长的路要走。不过现在，让我们先为波兰的复兴欢呼吧！全世界都将对我们刮目相看！"
 POL_ways_to_prisoners: "处理战俘"
 POL_ways_to_prisoners_desc: "令人感到讽刺的是，关于善待俘虏的日内瓦条约德国人并没有签署，在战争期间，他们残害我们放下武器的同胞，有些立定为奴，有些直接屠杀殆尽，现在，我们打退了德国人，所谓的日耳曼战士已经在他们的腐败和陶醉中堕落了，我们打击的德国佬不少都是连枪都拿不稳的新兵蛋子。\n\n是的，我们真的很想以牙还牙，新生的波兰需要劳动力，不过，波兰可是日内瓦条约的签署国，更何况，我们需要国际的支持。\n\n哥穆尔卡提出意见，给那些战俘们一些良好的待遇，放下武器，带上面包，离开波兰，进行宣传，让那些新兵蛋子看看他们建立的血肉工厂，再也不要回来了。\n精神攻击总要比血肉的折磨更加可怕有力，他们会热爱我们的，我们也最终战胜了德国人，直到他们进到坟墓里"
 POL_reassign_shumskyi: "重新任命舒姆斯基"
 POL_reassign_shumskyi_desc: "舒姆斯基...好吧，我们都承认，尽管他与我们立场不同，某种程度上甚至是完全对立，但他仍然值得我们钦佩。为了他的信仰、他的祖国，他鞠躬尽瘁，贡献了自己的一切。\n\n尽管昔日他曾是我们的对手，但我们绝不会因此否定他的才华，更不会因此剥夺他施展才华的机会。经过与人民军商议后，我们决定将他留下，并把他安排到合理的岗位上，让他继续发光发热。"
 POL_retire_shumskyi: "革除职位"
 POL_retire_shumskyi_desc: "相较于留下舒姆斯基，一向倾向于保守路线的家乡军认为：将一名共产主义政委留下始终是一种冒险；既然他们当初有推翻当局的勇气，日后也有可能会大搞动乱。他们可以不被处死，但他们绝对不能再次回到岗位。激进主义不能够再次降临于东欧，不论是极左或是极右，联盟与纳粹德国的陨落已经给予了我们足够的教训，极端主义的灾厄不能够再次降临于东欧的净土之上..."
 POL_forest_brothers: "整顿森林兄弟"
 POL_forest_brothers_desc: "自二战以来，就有遍布波罗的海的民兵藏身于白雪皑皑的深山老林中，向着侵犯家乡的敌人发起了一次又一次的袭击。在德国人的残酷绞杀下，他们被迫化整为零、遁入山林。如今波罗的地区前奥斯特兰总督府割据势力被悉数清剿，我们必须与这些自由斗士达成协议，收编整合森林兄弟的民防抵抗势力，并竭尽所能支援他们重建波罗的海国家的努力。"
 POL_all_united: "各民族团结而统一"
 POL_all_united_desc: "虽说其他民族昔日对我们并不友好，甚至民族主义者们还胆敢侵犯我们的土地，但现在波兰收回了属于自己的合法领土。相较起这个，波兰人还扶持了不少其他地方的政权，这也使得各民族再一次统一在了波兰的旗帜之下；甚至现在我们的势力范围比昔日的联邦都要大，东欧民族再一次统一了起来。\n\n但比起欣赏我们的地图，眼下当务之急便是，用这把剑狠狠刺入德国佬的腹部！"
 POL_diplomatic_and_support: "地缘与援助"
 POL_diplomatic_and_support_desc: "波兰本土的地形说不上好；波德平原致使我们在平原上失去了掩护，再加上我们的火力本就不占优的前提，这使得我们不能只依靠自己的力量抵抗德国人的入侵。比起本土条件，倒不如利用下自己的地理位置。我们将会寻求周边国家的支援，让我们能够有个坚实的后盾。说不定运气好的话，我们能够将别人也拉下水，毕竟德国如今如同苍蝇一般在哪里都不讨好，兴许我们能够找到志同道合之士..."
 POL_supporting_junta: "援助军区"
 POL_supporting_junta_desc: "波兰东边的军区处境说不上太平，在亚当·科克的带领下，军区也有着相对稳定的政局和处境，可即便如此也还是会面临军事物资短缺，以及其他层面的问题：比如东方领的民族主义者，乌克兰抵抗军的疯狗们...\n他们试着阻止这片土地回归波兰祖国的怀抱，但他们似乎忘了什么：亚当·科克从不是在孤军奋斗，为了稳住东波兰军区的处境，我们将会提供军事援助给予东波兰军区以镇压这群疯子。"
 POL_to_mediterranean: "至地中海"
 POL_to_mediterranean_desc: "现在波兰的地缘说不上太好，东边无法触及共荣圈，西边无法接触到自由国家组织，这使得他们的援助十分无力...\n\n但德国人似乎忘了什么：他们昔日背弃的盟友—意大利，他们所为了利益而抛弃的盟友，即使比不上德国，但好歹也说得上世界第四强的势力圈，如若我们能够将我们求助之手伸向地中海，说不定我们能够获得和德国人扳手腕的力量..."
 POL_italian_supply: "来自意大利的输血"
 POL_italian_supply_desc: "即使是波兰人民大团结，空有抵抗之心是不足够的。虽然德国刚刚经历完一次大战，但德国终归也是世界头一等的强国。比起一味追求殊死搏斗，倒不如另辟蹊径；我们将会试着与意大利的领袖[POL_ROD.GetLeader]进行一次相关的谈判，如果他们能够提供给我们武器与支援的话，这场战争便不会让无数波兰人就此轻易牺牲；每支枪，每门炮，都能让更多波兰人能活着回去见自己的家人..."
 POL_long_road_to_reborn: "长路复兴..."
 POL_long_road_to_reborn_desc: "经过长久的斗争后，波兰人终于战胜了命中注定的宿敌：那群日耳曼人被赶回了他们的日耳曼尼亚。经此一战后，德军已然失去了欧罗巴第一陆军之称，德国内部的动乱也随之蔓延。波兰迎来了属于它的和平，波兰祖国的子民也证明了一件事：他们的力量已然足够保护他们的祖国母亲，即使是付出生命的代价也在所不惜，他们证明了他们都是波兰母亲的好孩子，而那群烈士们呢？也许在那祖国母亲的怀抱中长眠着吧..."
 POL_starts_from_the_start: "始于足下"
 POL_starts_from_the_start_desc: "随着三色堇再次绽放于波兰的国土之上，波兰短期内再无外忧问题。但比起这个，由于失去了一个统一的敌人，波兰的内政问题却又一次困扰着所有人，那个问题终究在这么久后再次被提出：接下来怎么办呢？波兰的前途依旧渺茫，也许我们只能静待命运到来吧...\n\n波兰或许能够趁此迎来转机，长路以来也能迎来自己的复兴，但一切现在始于足下..."
 POL_relight_of_national_flame: "重燃民族之焰"
 POL_relight_of_national_flame_desc: "自1939的耻辱后，波兰红与白的旗帜终于不再需要潜藏于地下。波兰人民所付出的血汗终得回报，民族的火苗从地底下再次燃起、烈焰再一次升腾。\n那群德国人低估了波兰人的团结，待这团烈焰再次燃起之时，这团火焰将会吞没那群肮脏的，自称高等民族的日耳曼人们。他们将以他们的血洗清罪孽，他们将留在这片炼狱之中洗涤他们的罪行..."
