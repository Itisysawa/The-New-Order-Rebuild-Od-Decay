 POL_Road_to_Mediterranean_tt: "§Y我们将会寻求对地中海国家的军备贸易§!"
 POL_TUR_guns_TT: "§Y我们将会获得土耳其的枪械准入权§!"
 POL_ita_trucks_tt: "§Y我们将会获得意大利的摩托化装备准入权§!"
 POL_iberian_friends_tt: "§Y我们将会获得伊比利亚的重火力装备准入权§!"
