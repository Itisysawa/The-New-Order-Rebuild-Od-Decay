 POL_lwow_Rzeszow_industrial_area: "设立利沃夫-热舒夫工业区"
 POL_lwow_Rzeszow_industrial_area_desc: "利沃夫至热舒夫一带有着天然的地理优势：这里是连接捷克斯洛伐克、乌克兰和白俄罗斯等国的交通要冲。这意味着必要时，我们可以借助友邦的力量加快当地的工业化进程。此外，该地段在工业发展领域的多元化程度，在整个波兰都是首屈一指的。而对工业化发展至关重要的天然气，在这里也有着充足的供给。于是理所当然的，这里上了第一批工业区的选址榜单，我们不会浪费这块工业领域的风水宝地带来的机遇的。"
 POL_polish_heavy_industry: "波兰重工业"
 POL_polish_heavy_industry_desc: "近来，呈递给党中央的工业报表上显示：波兰工业的发展趋势稳中向好，总体上在朝着进步的方向前进。但是，问题也是存在的：我们的轻工业能够很好的满足人民基本的生活需求，但事关国家重大安全利益的重工业，发展速度却相对迟缓。要打个比方的话，如今我们的祖国就像一个跛脚老人，始终是在一瘸一拐地蹒跚迈步。\n\n毫无疑问，这样的现状会给我们建设社会主义带来巨大的阻力，但我们不会畏惧任何困难！在国家局势稳定之后，许多流落在国外的波兰裔工业专家和学者——其中有许多机械、化学和矿业方面的翘楚——都选择了回归故乡建设祖国。而现在，正是他们大显身手的时候了！我们会把他们派到他们擅长领域的工作现场，去指导我们活跃的工人们。有了他们，波兰重工业的全面起飞，指日可待！"
 POL_million_times_of_temper: "千锤百炼..."
 POL_million_times_of_temper_desc: "要发展重工业，有什么东西是必不可少的？答案很简单：钢铁！作为重工业的“基石”，需要用到钢铁的重工领域可谓数不胜数：机械制造、交通建设、矿产开采...可惜，看着现在报表上的数据，我国的钢铁产量远远跟不上工业化的需求！但这难不倒我们的同志们，在党和政府的指导下，钢铁厂开始在全波兰遍地开花。一场轰轰烈烈的大炼钢运动，就要开始了！愿工人兄弟们的斗志也能如钢铁般坚不可摧！"
