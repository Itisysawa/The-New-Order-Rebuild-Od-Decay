 #####OWZJ决议组#####
 POL_salski_massacre_on_AK_and_AL: "清洗叛国者"
 POL_salski_massacre_on_AK_and_AL_desc: "为了铲除波兰的叛徒与国家的稳定，我们不得不在波兰全境展开一场规模偌大的军事行动，以此追猎阻碍蜥蜴同盟前进的每一个家乡军叛徒。如若我们未能在他们作出行动前彻底将他们清理干净，那么§x民族复兴的理念永不可能实现§!。而目前：\n§W家乡军§!在§Y波兰西部§!的叛乱力度为§x[?western_poland_AK]§!；\n§W家乡军§!在§Y利沃夫§!的叛乱力度为§x[?eastern_poland_AK]§!；\n§W家乡军§!在§Y卢茨克边区§!的叛乱力度为§x[?western_ukraine_AK]§!；\n§W家乡军§!在§Y波兰东北部§!的叛乱力度为§x[?belarus_AK]§!；"
 AK_movement_decision_tt: "§x家乡军的反叛力度将在随机地区增强§!"
 AK_movement_decision: "家乡军正在行动..."
 AK_movement_decision_desc: "面对蜥蜴同盟的清算时，家乡军那群顽劣的叛乱分子并没有束手就擒，他们仍然在我们的国境线内进行着游击战，在周边那些低劣民族所组建起的国家的帮助下他们还在试着推翻我们，如果我们不能处理掉他们，那么后果很严重..."
 decision_strike_AK_tt: "§Y这将在随机一个地区降低家乡军的影响力§!"
 decision_strike_AK: "公开谴责家乡军"
 decision_strike_AK_desc: "自叛乱开始以来，家乡军再一次潜藏于地下。他们宣称为波兰的正统传承，却以游击战破坏着波兰民族国的稳定，他们的居心叵测。我们将会谴责家乡军的罪行，以此削弱他们的正统性..."
 AK_overthrow_Salski_decision: "家乡军将发动军事行动"
 AK_overthrow_Salski_decision_desc: "据我们特工所收集到的情报，家乡军准备在不久后对我们伟大的领导者，萨尔斯基阁下发动一次的斩首行动，如若我们不能及时解决掉这群叛徒后果将不堪设想..."
 AK_overthrow_Salski_decision_tt: "§x你我都知道后果将会如何§!"
 the_victory_of_Polish_national_state_decision: "民族的胜利"
 the_victory_of_Polish_national_state_decision_desc: "在家乡军的主流抵抗力量都被消灭后，他们再也没了跟我们抗衡的机会。波兰民族国胜利了，属于它的和平归来了！而我们也该开始我们的应行之事了...."
 the_victory_of_Polish_national_state_decision_tt: "§Y我们胜利了。§!"
 decision_strike_their_fortress: "突击藏身点"
 decision_strike_their_fortress_desc: "据我们特工所带来的可靠情报显示，家乡军的一支分队正藏身于城市一个不起眼的角落之中，我们在掌握了他们的所在地后，将能够派出部队铲除他们，大幅度削弱他们的抵抗力量。"
 the_victory_of_Polish_national_state_decision_req_tt: "§x各地镇压力度不大于10§!"
