 #波兰家乡军解放后国策树
 POL_the_great_victory_tt: "§Y红与白之旗飘扬于全境，但我们都知道，这离我们的独立之路尚远...§!"
 POL_diplomatic_problem_tt: "§Y准备好寻求联合吧...哪怕是要靠我们自己的双手打出来。§!"

 POL_core_land_war: "本土战役"
 POL_core_land_war_desc: "波兰家乡军刚从内战中恢复，兵力在常年的游击战中备受打击；如若黑鹰再度来犯，我们不能确保本土外地区的防御工事能派上用场。贸然进攻或许将会成为高风险的军事冒险，更可能将我们带向绝境，留守本土似乎是最佳选择。"
 
 POL_sword_down:  "§V解放§!"
 POL_sword_down_desc:  "波兰终究还是成功击碎了捆着其自由之心的锁链，再一次获得了自由。红与白的旗帜再度飘扬于华沙，而人们也成功回到了其家园... \n\n但未竟之事尚多，我们不能就此松懈。不论是德国人的虎视眈眈还是乌克兰人对我们的领土要求，对我们的生存空间都是一个威胁，波兰的路任重而道远..."
 POLAND_won:  "§W波§!§V兰§!尚有§Y未完成的任务§!..."
 POL_the_great_victory:  "华沙的红白之旗"
 POL_the_great_victory_desc:  "又一个漫长的夜晚过去了，先前居于总督府的人们从黎明中醒来，却发现天空中飘扬着的不再是那黑与白，象征着恐惧的旗帜，而是红与白交织的旗帜。 \n象征着自由与正义的旗帜又一次插在了波兰全境，解放的喜讯在全国范围内散播着，而现在，波兰人应当团结起来抵御外敌了..."
 POL_unstable_new_government:  "临时政府路线争端"
 POL_confusing_route:  "第三共和国的成立"
 POL_confusing_route_desc:  "即使菲尔多夫于不久之前宣告了第三共和国的成立，但现在摆在我们面前的却是另一个让人头疼的问题：国内的军队仍有着不同的派系，政治架构上也显得有些许的畸形，如果不能够解决多方的冲突，最终灭亡将再次降临于我们身上，因此为了你我的自由...\n\n§Y我们必须解决眼下的危机！§!"
 POL_unstable_new_government_desc:  "多方面派系的矛盾依旧深深地困扰着我们，倘若我们不能尽早解决这个问题的话后果将会不堪设想，说不定我们会再次步入分裂，然后再次分崩离析..."
 POL_resistance_is_still_going_on:  "抗争仍在继续"
 POL_resistance_is_still_going_on_desc:  "即使德国目前因为分裂而暂时未能对我们采取行动，但侵略战争也只会是迟早的事情，我们必须在此之前武装起波兰，让波兰在面对侵略者时尚有一战之力，这样才能避免灾厄再一次降临于华沙..."
 POL_diplomatic_problem:  "风暴未尽"
 POL_diplomatic_problem_desc:  "即使我们军事实力已然远远高出以前，但面对团结协定的军队终归还是双拳难敌四手，唯有寻求其他势力圈的庇护我们才能够抵御德国人的入侵，但问题是，我们应该找谁呢?又或者说，我们的地理位置又能找谁呢?"
 POL_thermoelectric_plant:  "兴建热电厂"
 POL_thermoelectric_plant_desc:  "波兰刚刚才经历完内战，而这场战争导致了境内发电设施几乎尽数被摧毁。对于工业而言，电力为不可或缺的要素。为此，我们将会拨款重建起一些发电厂，让我们能够生产更多的装备用于抵御德国人的入侵。"
 POL_remember_history:  "铭记历史"
 POL_remember_history_desc:  "昔日在德军几乎无解的制空之下，波兰第二共和国只用了很短的时间便落入敌手，成为了终日只能低着头的傀儡...但现在，我们将会重点着重于防空设施，确保当德国人再次来犯时，我们能够将他们的飞机打个稀烂!"
 POL_integrate_army:  "整合波兰国家军"
 POL_integrate_army_desc:  "随着仇恨逐渐不攻自破，波兰家乡军与波兰国家军最终还是打破了隔阂，正式整并到一起，准备为对付宿敌做出准备。目前，这个联盟是否经得起考验尚待考证，但相信有了国家军的加入，波兰的势力必将扩大。"
 POL_poverty_prob:  "...并迎来新生"
 POL_poverty_prob_desc:  "我们的经济尚未恢复过来，由于先前的多次战争，贫困率问题愈发严重。 \n为此，我们将会进行法例修订，将最低工资稍稍提高，如此一来，贫困率问题将会放缓，并且后续经济也将变得更可控。"

 POL_war_time_economy:  "华沙战时经济"
 POL_war_time_economy_desc:  "如若我们维持现今的经济模式，开战的时候德国空军的袭击势必摧毁我们的经济，到时候就算是打赢了我们也只会剩下一片废墟，因此我们应当开始进行动员，为日后的行动做好准备。"
 POL_reconcile_parties_relation:  "走向未知..."
 POL_reconcile_parties_relation_desc:  "随着情况逐渐稳定，萨纳齐亚也是时候宣告它的重生与统治了；对于维持新生波兰共和国的秩序与稳定，却出现了一个令人头疼的问题：我们该怎么执行不同的政策？我们这样做会不会惹毛不同的派系？现在，新生的萨纳齐亚将面临他们的首次考验。\n\n§Y时间也将证明菲尔多夫能否成为仅次于毕苏斯基的伟人...§!"
 POL_combine_troops:  "整顿民兵团"
 POL_combine_troops_desc:  "如今，山雨欲归，普通的民兵团已然难以守护我们的安全，趁着时日尚早，我们将会对民兵团进行整顿，提高军队素质的同时确保我们军队的战斗力足以应付邻国的威胁。"
 POL_combined_army:  "波兰国防军"
 POL_combined_army_desc:  "如果说政府的各部门是一个国家的脑子，那么军队便是其爪子。只有足够锋利的爪子才能将来敌消灭殆尽，而经过整顿后，波兰国防军的实力也将比以前高出一截，时间将会证明这是否有效..."
 POL_strengthen_nationalist:  "强调民族观念"
 POL_strengthen_nationalist_desc:  "自德国人将波兰占领以来，他们便试着抹去波兰民族的观念。不论是迁移我们还是对我们进行一次又一次的屠杀，但波兰的故事铭记人心，其民族也从未逝去。如今，我们将会强化我们的民族观念，以免我们再次在这世上迷失..."
 POL_thewarofpeople_thewarofjustice:  "流血的战争,神圣而正义"
 POL_thewarofpeople_thewarofjustice_desc:  "现在，应急措施已然完成，我们已经有了基本的战争应对能力，如有朋友来相见，自有面包与酒相迎；如若敌人胆敢来犯，迎接他们的自有枪管子！ \n我们将走上波兰伟大复兴的道路！"
 POL_invasion_to_slovakia_when_german_weak:  "乘虚攻入斯洛伐克"
 POL_invasion_to_slovakia_when_german_weak_desc:  "如今，德国已然陷入内战，由于他们的分裂与虚弱，斯洛伐克目前处于一个缺乏军力守备的处境，所剩的本土军队根本不足以抵抗我们的力量，现在我们将会先发制人！"
 POL_war_time_warsaw:  "华沙战时经济"
 POL_war_time_warsaw_desc:  "单靠这饱受摧残的经济，资本市场根本不足以让我们快速恢复起经济，更别说抵抗德国。现在，我们需要对经济体系进行改组，让更多人投入工业生产当中。"
 POL_control_western_ukraine:  "结盟乌克兰"
 POL_control_western_ukraine_desc:  "不论是对于利沃夫的安全还是对外的求援，西乌克兰这堵墙对我们而言都是一个很大的威胁和阻碍。如若我们不能击碎这堵墙，那我们也别指望能够取得外交进展；菲尔多夫认为贸然地进攻乌克兰并非一个明智之举，于是他会前往乌克兰人民共和国与戈尔利斯进行谈判，试着寻求合作..."
 POL_war_to_ukr: "断绝合作"
 POL_war_to_ukr_desc: "乌克兰趁乱占据了利沃夫一带的领土，照这样下去，波兰的土地只会被乌克兰蚕食殆尽；比起如此的结局，萨尔斯基坚信趁乱出击，趁着乌克兰尚在内战进攻并平定乌克兰才是明智之举，与这群叛徒的合作简直是白日做梦，菲尔多夫简直是大错特错...\n\n§x我们将如同1919年的波兰人们一般，狠狠击溃祖国的敌人！§!"
 POL_hold_ostland:   "控制东方领"
 POL_hold_ostland_desc:  "仅凭斯洛伐克与乌克兰西部根本不足以让我们对付德国，东方领治下尚有白罗斯与波罗的海三国的民族等待着我们解放，这是欧洲人民的解放战争，为了永远的胜利与自由，我们将会砥砺前行！"
 POL_polish_partisan:  "游击作战"
 POL_polish_partisan_desc:  "究竟是因为什么才导致了总督府陷入如此绝境？究竟是家乡军太过于强大还是另有原因？汉斯·弗兰克的心中应当最清楚。 \n\n长期以来未能解决这群波兰的游击队，让汉斯的地位愈发动摇，但他为保住自己的位置却未曾通知过德国此一情况，这也为镇压抵抗运动的失败埋下伏笔 \n\n§x复仇的怒火无法埋没，终有一天他会尝到恶果§!"
 Pol_disturbing_germany_civil:  "§Y我们将会获得决议以干涉§!§R德国内战§!"
 POL_disturb_german_civil_war:  "干涉德国内战"
 POL_disturb_german_civil_war_desc:  "倘若德国如此快便能从内战中恢复过来，那么我们便没有足够的时间去扩展我们的影响力。现在，我们将派出游击队之中的精锐，对德国进行干扰，并且试着袭击他们的部队，以此拖缓他们的脚步。"
 fuk_ukr:  "干涉乌克兰内战"
 Polish_form_occu_zone:  "成立乌克兰占领区" 
 Polish_form_occu_zone_desc:  "在我们攻下乌克兰之后，我们将会实行一系列的占领措施，而成立卫星国与宣称地区的军事占领也是必不可少的，我们将会实行分区统治，以确保乌克兰人不会对此有异议"
 east_poland_junta:  "成立东波兰军区"
 east_poland_junta_desc:  "东波兰自波兰-立陶宛时期便已并入了波兰的版图，却在一次又一次的战争中遭割离波兰，而如今也是我们夺回东波兰的时候。"
 UKR_new_one:  "新生的乌克兰共和国"
 UKR_new_one_desc:  "随着一系列的战争后，波兰最终还是战胜了乌克兰的所有派系。为了团结起乌克兰的人民，菲尔多夫与戈尔利斯展开了一次又一次的谈判，最终迫于局势乌克兰不得不再次向波兰低头，而波兰将会设立起一个乌克兰的合法政府..."
 Belarus_republic:  "成立白罗斯共和国"
 Belarus_republic_desc:  "自德国人侵占了东欧的土地后，他们将波罗的海三个不同的民族与白罗斯人粘合在一起，组成一个所谓的\"东方专员辖区\"，而在这种环境下内战也不是什么稀罕的事情。如今白罗斯已入我手，是时候让人们获得解放了。"
 Polish_form_occu_zone_ost:  "东方领占领区"
 Polish_form_occu_zone_ost_desc:  "为了更牢固地控制东方领与团结起东方领的各民族，我们将会确保他们的独立并且分别组建不同的共和国体制，让东欧民族得以从日耳曼化的魔爪中解放..."
 Lithuan_republic:  "重组波罗的海三国"
 Lithuan_republic_desc:  "波罗的海三国在德国的占领下，民族观念也在渐渐逝去，而我们要做的便是唤醒他们，只有这样才能让他们真正地远离德国梦魇..."
 finish_ukr_prob:  "乌克兰问题得到解决"
 POL_invast_crimea:  "解放克里米亚"
 POL_invast_crimea_desc:  "现在乌克兰局势已被平定，但克里米亚地区却仍被德国人占领着，对我们而言随时都是一个安全隐患，如同定时炸弹一般。我们应当趁早拆除这颗炸弹以绝后患..."
 
 TNO_PEACE_POPUP_FLAVOR_POL_GER:  "红与白的旗帜再次飘扬于华沙，而波兰并未灭亡，而是再次屹立于欧洲的大地上 \n§Y而德国在欧洲锁上的的枷锁也由波兰打破了...§!"
 be_friend_to_poland:  "与波兰交好"
 POL_eastern_wall:  "西斯拉夫团结一心"
 POL_eastern_wall_desc:  "如今的东欧政权充斥着腐朽，每个国家的人们因为意识形态的争端而进行着抗战，有的是为了反抗专员辖区的暴政、有的是单纯的为了利益与存在、还有的就是为了独揽大权... \n\n而作为首个起义成功的国家，波兰将会进军东欧以解放这些纯洁的土地...永不受德国人侵占！"
 POL_remember_past:  "铭记昔日灾厄..."
 POL_remember_past_desc:  "1939年，德国对波兰展开了全面的入侵。他们对波兰的土地进行着摧残、屠杀着这里的人民、摧毁着波兰文化的一切...妄想着让这里成为日耳曼人的天堂... \n\n但愚蠢的德国人们猜错了。他们低估了波兰人的意志，波兰人将会团结一心，铭记祖国所受的苦难，缅怀昔日的灾厄，绝不让灾厄重现..."
 POL_supporting_rom:  "联络罗马尼亚政府"
 POL_supporting_rom_desc: "罗马尼亚王国人民在历经十余载的时间后终得推翻法西斯政府，而民主政府的上任也就意味着我们现在有机会能够接触他们 \n\n我们能够牺牲自身的一些利益以换取对方远离团结协定，这虽然会牺牲我们的短期利益，但却让我们与罗马尼亚不需要兵戎相见。"
 POL_supporting_hun:  "请求匈牙利援助"
 POL_supporting_hun_desc: "匈牙利因德国的经济陷入停滞，导致当地经济受德企重创；再加上德国人一直在干涉他们的内政，于是反德情绪也在逐渐抬头。 \n\n如若此时我们趁着德国元气大伤施加一点外力，我们可以试着将匈牙利撬出团结协定的势力"
 wont_make_past_again:  "绝不让昔日再现"
 
 POL_experienced_army:  "老兵"
 POL_experienced_army_desc:  "对于家乡军的成员而言，连年的游击作战让他们早已积累了不少作战经验，他们也有着很强的计划能力，而整合后对于我们而言更是如鱼得水..."
 POL_fuk_kuban: "库班的归属?"
 POL_fuk_kuban_desc: "自一战结束以来，乌克兰对库班的宣称便得不到应许。\n\n不论是布尔什维克的阻挠还是战乱中的独立，一切都将乌克兰与库班分割开来。如今，德国的走狗进驻了高加索地区，而我们必须从他们手上解放库班地区的人们，让这片土地得以安宁..."
 POL_army_amount: "重于量，而非质"
 POL_army_amount_desc: "面对德国人对我们深处的魔爪，我们与德国的战争迟早也将到来。在此之前，如此少的军队压根不足以保护好我们的山河。\n\n而为此，我们将会广泛武装民兵，以民兵群领导正常战争的走势，虽然这将会导致军队素质欠佳，但数量大于质量总是个不错的选择。"
 POL_army_quality: "军队素质至上"
 POL_army_quality_desc: "只有更专业的军队能够保护好我们，即使再庞大的军队，如若没有经验面对敌人也只是一盘散沙。我们将会进行更严苛、更高强度的选人与军事训练，以进一步提升我们的兵员素质。"
 POL_amount_better_than_quality: "人民战争"
 POL_quality_better_than_amount: "质大于量"
 POL_the_duty_of_us: "重现1918荣光"
 POL_the_duty_of_us_desc: "现在，西斯拉夫民族，亦或是东欧人民们，已然再次团结一心。对于我们的朋友，我们将会有面包与酒相迎，如若来的是财狼，我们将会以枪炮相迎。 \n\n§x当德国人再次侵入我们的领土时，我们将会让他们知道，这会让他们附上血的代价§!"
 POL_the_duty_of_us_tt: "§Y我们将会获得新的国策以准备迎接下一场战争§!"




 #####派系斗争GUI文本####


 POL_reconcile_relations: "派系平衡"
 POL_reconcile_relations_desc: "纵然华沙的此次§W起§!§V义§!成功了，但内部派系之间的矛盾却使得新生的共和国再次濒临灭亡。在此绝境之下，能否保持派系之间的关系与力量平衡便是我们当下的一大考验，而我们能否顺利解决这个问题也将决定我们的未来会走上的道路。 \n\n目前，波兰共和国内的派系如下:\n战时组建起来的极端军事组织§q蜥蜴同盟§!\n由人民意志建立起的§C波兰人民党§!、§V波兰社会党§!以及§e波兰统一工人党§!\n因起义而暂时团结起来的§d民族临时委员会§!及§s祖国公务§!\n还有民主派系的§M工党§!以及§i民族党§!"
 keep_limited_democracy: "家乡军之治"
 keep_limited_democracy_desc: "自转进地下后，波兰地下国便由家乡军打理，而现在家乡军却对于自己的实权感到不满。为此，我们将会尝试将一部分权力从人民军划分给家乡军，§e牺牲§!部分§V人民军§!的忠诚度来换取§d家乡军§!的支持"
 reconcile_relations_between_parties: "我们开始了派系之间关系的调和"
 PSPR_supports_rise_tt: "§V人民军§!§Y的影响力将会§!§K上升！§!"
 PSPR_supports_dec_tt: "§d家乡军§!§Y的影响力将会§!§K上升！§!"
 request_labour_freedom: "为劳工，争自由"
 autonomous_commonwealth: "君合国"
 autonomous_commonwealth_desc: "君合国是共主联邦中的一部分，共主联邦由这些微小的碎片缝合在一起而组成。在这样的结构中，它们每个国家仍然是独立的，但多个国家之间由同一位君主统治，从而达成\"共主\"的目的。"
 BLR_duchy_of_blr: "波洛茨克大公国"
 BLR_duchy_of_blr_DEF: "波洛茨克大公国"
 BLR_duchy_of_blr_ADJ: "波洛茨克"
 LIT_duchy_of_lit: "立陶宛大公国"
 LIT_duchy_of_lit_DEF: "立陶宛大公国"
 LIT_duchy_of_lit_ADJ: "立陶宛"
 MST_duchy_of_courland: "库尔兰大公国"
 MST_duchy_of_courland_DEF: "库尔兰大公国"
 MST_duchy_of_courland_ADJ: "库尔兰"
 MST_feder_of_courland: "库尔兰联邦"
 MST_feder_of_courland_DEF: "库尔兰联邦"
 MST_feder_of_courland_ADJ: "库尔兰"
 MST_paternalism_party: "拉脱维亚自治区"
 FUK_duchy_of_ukr: "乌克兰-鲁塞尼亚大公国"
 FUK_duchy_of_ukr_DEF: "乌克兰-鲁塞尼亚大公国"
