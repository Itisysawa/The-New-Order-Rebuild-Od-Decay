 POL_let_the_prussian_stay: "遣返德意志人"
 POL_let_the_prussian_stay_desc: "在波兰不幸落入纳粹德国的掌握之后，伴随着万恶的“斯坦尼斯瓦夫国王”汉斯●弗兰克和他的爪牙们一起到来的，还有不计其数的德国移民。他们的成分相当复杂：除了在国内郁郁不得志的落魄官僚、希望在帝国殖民地开拓市场的资本家，还有不少因为听信浮夸的宣传，而期待在异乡过上人上人好日子的普通人。但不管情况如何，现在的波兰都不会再有这群寄生虫的容身之地了——因为我们只要波兰人自己的波兰！\n\n的确，并非所有波兰土地上的德国佬都是纳粹的忠实拥护者；但在他们中间也确实有不少敌对甚至破坏分子，这点同样不容置疑。更何况，如果我们用波兰的资源来供养这群不请自来的“客人”，那在这里土生土长的波兰人会怎么看待我们？所以说很抱歉，自大日耳曼国而来的女士们、先生们，还请你们收拾东西后从哪来就滚回哪去吧！想想你们的元首、你们的国家对我们造过的孽，你们就该知道我们已经很仁慈了！"
 POL_nationalist_equality_law: "民族平等法案"
 POL_nationalist_equality_law_desc: "在联邦重生之后，波兰的境内的民族多元化趋势已经愈发明显了。在我们新扩展的领土上，乌克兰族、白罗斯族与立陶宛族等少数族裔居民已经开始和波兰人共同生活了。从总体情况上看，他们彼此间的相处还是比较和谐的。不过，因为各民族间文化、信仰和生活习惯等方面的差异而产生的冲突，说实话也时有发生。\n\n对此，我们已经有了应对之策：我们不能让刚刚加入全新大家庭的兄弟们觉得，波兰联邦的政府只会满足波兰人的需求。为了在国家治理的各领域彻底杜绝大波兰主义，一份党政干部听取各族人民意见后拟定的民族平等法案，已经正式递交议会表决了。只要它顺利表决通过，联邦各族人民的平等就拥有了坚实的法律保障！而我们这些言出必行的社会党人，一定能够做到！"
 POL_ukrainian_polish_conference: "乌克兰谈判"
 POL_ukrainian_polish_conference_desc: "虽然波兰现在和乌克兰成为了命运与共的友邦，但有一件事我们还是不得不承认：我们和乌克兰人在某些方面，还是存在争议的——例如领土问题。在苏波战争后，当时的波兰第二共和国正式获得了西乌克兰。对此，无论是乌克兰官方还是民间，都是怨声载道。毫无疑问，这阻碍了波乌两国进一步的友好合作。\n\n既然如此，为什么我们不能和基辅当局好好谈一谈呢？资源丰富的库班地区想必对乌克兰朋友们会有很大的吸引力；相对的，拥有更大的西乌克兰也能更好的满足我们的安全需求。那么，一场公平的领土互换，或许能让我们双方都得到满意的结果。当然，各方面的协调或许会花费很长时间，但这相对于两国的长远发展而言，只是一点微不足道的代价罢了。"
 POL_courland_baltic_sea_diplo: "白罗斯-立陶宛外交"
 POL_courland_baltic_sea_diplo_desc: "在经历了艰苦卓绝的斗争后，我们总算是建立起了由波兰人自己当家做主的、全新的波兰国家。不过，若我们想让祖国行稳致远，那不妨打开格局思考一下：要建立一个自立的、强盛的波兰，难道一定只能靠波兰人自己的努力吗？如果能拉拢到那些历史上曾经与我们同属一家——没错，就是光荣的波立联邦——的兄弟民族，比如白罗斯人和立陶宛人，那我们的未来是否会更光明呢？\n\n幸运的是，在抗击德国法西斯的战斗中，我们便与他们结下了深刻的战斗情谊。再加上相似的历史境遇和共同的安全需求，让他们多少也拥有建构大一统国度的愿望。那么，让我们向明斯克和维尔纽斯抛去橄榄枝吧。相信有朝一日，我们将与他们站在同一面国旗下，建设我们共同的波兰祖国。"
 POL_let_latvia_join: "旧友拉脱维亚"
 POL_let_latvia_join_desc: "在和白罗斯和立陶宛重新建立起团结的纽带之后，我们又找到了潜在的新朋友：拉脱维亚。这个小国的处境和我们之前两个友邦颇为相似：在德国佬的东方领崩溃后，拉脱维亚人总算能在祖国升起自己的旗帜了。然而，他们还是要时刻提防着昔日欺凌他们的殖民者养好伤后卷土重来，让昔日的悲剧重演。\n\n嗯，说实在话，这不也是我们一直在防范的事情吗？既然我们有着共同的目标，那为什么不能走到一起呢？我们的祖先早在16世纪时，便在联邦的红白红三色旗下结下了深厚的情谊。那么现在，也到了我们再续前缘的时候了——里加的远亲们，你们的波兰兄弟们，已经准备好欢迎你们回来了！"
 POL_final_conference: "最终会议"
 POL_final_conference_desc: "好极了！现在，我们不仅解决了和乌克兰遗留的领土问题，还和白罗斯、立陶宛和拉脱维亚的朋友们都拉好了关系。那么，我们一直期盼的事情终于可以提上议程了：和几个兄弟国家的代表一起开会，商讨一件振奋人心的大事——四国合并，建立起统一而强大的波兰联邦！\n\n1795年旧联邦的灭亡，让曾经同住一家的各民族朋友分离了太久太久。现在，我们终于可以拾起曾经被侵略者扯下遗弃的旗帜，引导归乡的各族兄弟与我们一同前进！等到新国家真正屹立于欧陆之上，那就再也没有人敢小瞧我们，更没人敢欺凌我们！毕竟，一根筷子容易折，可一把筷子难折断！"
